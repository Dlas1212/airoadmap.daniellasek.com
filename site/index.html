<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">

<meta property="og:description" content="What to learn in AI, in what order, and how deep to go for your goal. 78 topics, 8 role paths, ~1,100 curated resources.">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BUILD:BODY -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="5" r="3.2"/><circle cx="7" cy="16" r="3.2"/><circle cx="25" cy="16" r="3.2"/><circle cx="12" cy="27" r="3.2"/><circle cx="22" cy="27" r="3.2"/>
        <path d="M16 8 7 13M16 8l9 5M7 19l5 5M25 19l-3 5M7 19l15 5" fill="none" stroke-width="1.6"/>
      </svg>
      <div>
        <div class="brand-name">AI Learning Atlas</div>
        <div class="brand-sub">Every AI skill, in the order you need it</div>
      </div>
    </div>

    <div class="search-wrap">
      <label class="sr-only" for="search">Search topics</label>
      <input id="search" type="search" placeholder="Search topics, e.g. RAG, LoRA, evals" autocomplete="off">
      <kbd class="search-kbd">/</kbd>
      <ul class="search-results" id="searchResults" hidden></ul>
    </div>

    <div class="top-actions">
      <div class="seg" role="tablist" aria-label="View">
        <button id="viewMap" role="tab" aria-selected="true">Map</button>
        <button id="viewPath" role="tab" aria-selected="false">Path</button>
      </div>
      <div class="creator" id="creator">
        <span class="creator-by">by <b>Daniel Lasek</b></span>
        <a class="soc" href="https://www.linkedin.com/in/daniel-lasek" target="_blank" rel="noopener me" aria-label="Daniel Lasek on LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg></a>
        <a class="soc" href="https://x.com/itsdevdaniel" target="_blank" rel="noopener me" aria-label="@itsdevdaniel on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.65l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/></svg></a>
        <a class="soc" href="https://www.youtube.com/@daniellasekai" target="_blank" rel="noopener me" aria-label="daniellasekai on YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.12-2.13C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.52A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.12 2.13c1.88.52 9.38.52 9.38.52s7.5 0 9.38-.52a3 3 0 0 0 2.12-2.13A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.57V8.43L15.82 12 9.6 15.57Z"/></svg></a>
      </div>
      <button class="btn ghost" id="skillCheckBtn">What I already know</button>
      <button class="btn share-btn" id="shareBtn" aria-label="Share this site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Share</span></button>
      <button class="btn icon" id="helpBtn" aria-label="How to use this site">?</button>
    </div>
  </header>

  <nav class="roles" aria-label="Choose a learning path">
    <span class="roles-label">Path</span>
    <div class="role-chips" id="roleChips"></div>
    <div class="progress" id="progress"></div>
  </nav>

  <main class="stage">
    <section class="map-view" id="mapView">
      <div class="viewport" id="viewport">
        <div class="world" id="world">
          <svg class="edges" id="edges"></svg>
          <div class="nodes" id="nodes"></div>
        </div>
      </div>
      <div class="map-controls">
        <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="btn icon" id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button class="btn icon wide" id="zoomFit" aria-label="Fit to screen">Fit</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="role-banner" id="roleBanner" hidden></div>
    </section>

    <section class="path-view" id="pathView" hidden></section>

    <aside class="drawer" id="drawer" aria-label="Topic details" hidden>
      <div class="drawer-inner" id="drawerInner"></div>
    </aside>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<!-- BUILD:END -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
