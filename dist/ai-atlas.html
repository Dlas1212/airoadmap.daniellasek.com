over long runs.","You can add guardrails: tool permissions, human approval, step limits, and evals on full trajectories."],"project":"Build an agent from scratch in under 200 lines, with no framework: it gets three tools (web or doc search, a Python sandbox or calculator, and a file writer), a step limit, and a cost cap. Give it a research task, log every step, then rewrite the same task as a fixed workflow and compare reliability and cost over 10 runs.","resources":[{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true},{"title":"Agentic AI","url":"https://www.deeplearning.ai/courses/agentic-ai","type":"course","source":"DeepLearning.AI","free":true},{"title":"Hugging Face Agents Course","url":"https://huggingface.co/learn/agents-course/unit0/introduction","type":"course","source":"Hugging Face","free":true},{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Agents","url":"https://huyenchip.com/2025/01/07/agents.html","type":"article","source":"Chip Huyen","free":true},{"title":"LLM Powered Autonomous Agents","url":"https://lilianweng.github.io/posts/2023-06-23-agent/","type":"article","source":"Lilian Weng","free":true},{"title":"I think 'agent' may finally have a widely enough agreed upon definition","url":"https://simonwillison.net/2025/Sep/18/agents/","type":"article","source":"Simon Willison","free":true}],"subtopics":[{"title":"The agent loop","desc":"Model reads context, picks an action (tool call or final answer), gets an observation, and loops. Everything else is detail: which tools, what context, and when to stop.","level":"core","resources":[{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true},{"title":"ReAct: Synergizing Reasoning and Acting","url":"https://arxiv.org/abs/2210.03629","type":"paper","source":"arXiv","free":true}]},{"title":"Workflows vs agents","desc":"Start with the simplest thing that works. Prompt chaining, routing, parallelization, orchestrator-workers, and evaluator-optimizer are workflow patterns that solve most problems more reliably than a fully autonomous agent.","level":"core","resources":[{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Tools and the agent-computer interface","desc":"Agents are only as good as their tools. Clear names, focused scope, helpful error messages, and token-efficient outputs make a large difference. Giving an agent a code-execution sandbox or bash is often the most general tool.","level":"core","resources":[{"title":"Writing effective tools for agents","url":"https://www.anthropic.com/engineering/writing-tools-for-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Context engineering for agents","desc":"Agents fill their context window fast. Techniques include just-in-time retrieval, summarizing or compacting history, note-taking files, and sub-agents with fresh context. Skills package instructions the agent loads only when needed.","level":"core","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Equipping agents for the real world with Agent Skills","url":"https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills","type":"article","source":"Anthropic","free":true}]},{"title":"Planning, reflection, and memory","desc":"Agents can plan before acting, critique their own output, and keep memory across sessions. Reasoning models now do much of the planning internally, so explicit planning prompts matter less than they used to.","level":"deep","resources":[{"title":"LLM Powered Autonomous Agents","url":"https://lilianweng.github.io/posts/2023-06-23-agent/","type":"article","source":"Lilian Weng","free":true},{"title":"Agents","url":"https://huyenchip.com/2025/01/07/agents.html","type":"article","source":"Chip Huyen","free":true}]},{"title":"Guardrails and evaluating agents","desc":"Limit tool permissions, require human approval for risky actions, cap steps and spend, and watch for prompt injection in tool results. Evaluate whole trajectories and final outcomes, not just single responses.","level":"deep","resources":[{"title":"Demystifying evals for AI agents","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"The lethal trifecta for AI agents","url":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","type":"article","source":"Simon Willison","free":true}]}]},{"id":"mcp","title":"Model Context Protocol (MCP)","tier":3,"lane":"agents","prereqs":["structured-outputs"],"roles":{"aie":"c","nc":"r","pu":"a"},"summary":"The Model Context Protocol (MCP) is an open standard for connecting AI applications to tools and data. An MCP server exposes tools, resources, and prompts once, and any MCP client (Claude, ChatGPT, IDEs, agent frameworks) can use them.","why":"Before MCP, every app needed custom integrations for every tool. MCP is now the common way to give assistants and agents access to files, databases, SaaS apps, and internal systems, so building and securing MCP servers is a core AI engineering skill.","depth":"Master the client-server architecture, the three server primitives (tools, resources, prompts), building a server with an official SDK, testing it with the Inspector, and the security basics. Just know the transport details, authorization flow internals, and the full spec until you ship a remote server.","hours":10,"outcomes":["You can explain MCP's hosts, clients, and servers and what tools, resources, and prompts are for.","You can build an MCP server in Python or TypeScript and connect it to Claude Desktop, Claude Code, or another client.","You can test and debug a server with the MCP Inspector.","You can identify MCP security risks (prompt injection via tool output, over-broad permissions, token handling) and mitigate them."],"project":"Build an MCP server for something you actually use (a notes folder, a SQLite database, or a work API) with at least two tools and one resource. Test it in the Inspector, connect it to Claude Desktop or Claude Code, and write down which tool descriptions you had to rewrite before the model used them correctly.","resources":[{"title":"What is the Model Context Protocol?","url":"https://modelcontextprotocol.io/docs/getting-started/intro","type":"docs","source":"Model Context Protocol","free":true},{"title":"MCP: Build Rich-Context AI Apps with Anthropic","url":"https://www.deeplearning.ai/courses/mcp-build-rich-context-ai-apps-with-anthropic","type":"course","source":"DeepLearning.AI","free":true},{"title":"Introduction to Model Context Protocol","url":"https://anthropic.skilljar.com/introduction-to-model-context-protocol","type":"course","source":"Anthropic Academy","free":true},{"title":"Introducing the Model Context Protocol","url":"https://www.anthropic.com/news/model-context-protocol","type":"article","source":"Anthropic","free":true},{"title":"MCP specification","url":"https://modelcontextprotocol.io/specification/latest","type":"docs","source":"Model Context Protocol","free":true},{"title":"MCP Python SDK","url":"https://github.com/modelcontextprotocol/python-sdk","type":"tool","source":"GitHub","free":true},{"title":"FastMCP","url":"https://gofastmcp.com/","type":"tool","source":"FastMCP","free":true}],"subtopics":[{"title":"Architecture: hosts, clients, servers","desc":"The host is the AI app, which runs one MCP client per server connection. Servers run locally (stdio) or remotely (streamable HTTP) and speak JSON-RPC.","level":"core","resources":[{"title":"Architecture overview","url":"https://modelcontextprotocol.io/docs/learn/architecture","type":"docs","source":"Model Context Protocol","free":true}]},{"title":"Tools, resources, and prompts","desc":"Tools are actions the model can call. Resources are data the app can read into context. Prompts are reusable templates the user can pick. Clients can also offer features back to servers, like sampling and elicitation.","level":"core","resources":[{"title":"Understanding MCP servers","url":"https://modelcontextprotocol.io/docs/learn/server-concepts","type":"docs","source":"Model Context Protocol","free":true},{"title":"Understanding MCP clients","url":"https://modelcontextprotocol.io/docs/learn/client-concepts","type":"docs","source":"Model Context Protocol","free":true}]},{"title":"Building and testing a server","desc":"Official SDKs (Python, TypeScript, and others) and FastMCP make a basic server a few dozen lines. Test it with the MCP Inspector before connecting it to a client.","level":"core","resources":[{"title":"Build an MCP server","url":"https://modelcontextprotocol.io/docs/develop/build-server","type":"docs","source":"Model Context Protocol","free":true},{"title":"MCP Inspector","url":"https://modelcontextprotocol.io/docs/tools/inspector","type":"docs","source":"Model Context Protocol","free":true}]},{"title":"Using MCP in clients and agents","desc":"Connect servers to Claude Desktop, Claude Code, IDEs, or your own agent. APIs can also call remote MCP servers directly, so your app doesn't need its own client.","level":"core","resources":[{"title":"Connect Claude Code to tools via MCP","url":"https://code.claude.com/docs/en/mcp","type":"docs","source":"Anthropic","free":true},{"title":"MCP connector (Claude API)","url":"https://platform.claude.com/docs/en/agents-and-tools/mcp-connector","type":"docs","source":"Anthropic","free":true}]},{"title":"Security and authorization","desc":"Remote servers use OAuth-based authorization. The bigger risk is the model itself: tool outputs can carry prompt injections, and combining private data, untrusted content, and outbound actions is dangerous. Only install servers you trust.","level":"deep","resources":[{"title":"Understanding Authorization in MCP","url":"https://modelcontextprotocol.io/docs/tutorials/security/authorization","type":"docs","source":"Model Context Protocol","free":true},{"title":"Simon Willison on MCP","url":"https://simonwillison.net/tags/model-context-protocol/","type":"article","source":"Simon Willison","free":true}]},{"title":"Scaling to many tools","desc":"Loading hundreds of tool definitions wastes context. Patterns like tool search and letting the agent write code that calls MCP tools keep token use down.","level":"deep","resources":[{"title":"Code execution with MCP","url":"https://www.anthropic.com/engineering/code-execution-with-mcp","type":"article","source":"Anthropic","free":true}]},{"title":"Ecosystem and the registry","desc":"Thousands of servers exist for GitHub, databases, browsers, SaaS tools, and more. The official MCP Registry lists public servers.","level":"optional","resources":[{"title":"The MCP Registry","url":"https://modelcontextprotocol.io/registry/about","type":"docs","source":"Model Context Protocol","free":true},{"title":"Reference servers","url":"https://github.com/modelcontextprotocol/servers","type":"tool","source":"GitHub","free":true}]}]},{"id":"agent-frameworks","title":"Agent Frameworks & SDKs","tier":3,"lane":"agents","prereqs":["agents-fundamentals"],"roles":{"aie":"c","mle":"a"},"summary":"Agent frameworks and SDKs give you ready-made pieces for building agents: the tool loop, state, memory, handoffs between agents, tracing, and human-in-the-loop steps. Popular options include the Claude Agent SDK, OpenAI Agents SDK, LangGraph, Pydantic AI, Google ADK, CrewAI, and smolagents.","why":"Once you've built an agent by hand, a framework saves time on plumbing like retries, persistence, streaming, and observability. Picking the right one, or deciding you don't need one, affects how easy your agent is to debug and change.","depth":"Master one framework well enough to build, trace, and deploy an agent, and understand what it does under the hood. Just know the others' strengths so you can choose; avoid deep lock-in to abstractions you can't see through.","hours":15,"outcomes":["You can build and deploy an agent with tools, state, and tracing in at least one framework.","You can compare frameworks on control, abstraction level, provider lock-in, and observability.","You can add human-in-the-loop approval and persistent state to an agent.","You can explain what a framework is doing under the hood and drop down to raw API calls when needed."],"project":"Rebuild your from-scratch agent in two frameworks (for example the Claude Agent SDK and LangGraph). Add a human approval step before any write action and persistent state so a run can resume after a crash. Compare lines of code, trace quality, and how easy each was to debug.","resources":[{"title":"Building agents with the Claude Agent SDK","url":"https://claude.com/resources/articles/building-agents-with-the-claude-agent-sdk","type":"article","source":"Anthropic","free":true},{"title":"Agent SDK overview","url":"https://code.claude.com/docs/en/agent-sdk/overview","type":"docs","source":"Anthropic","free":true},{"title":"OpenAI Agents SDK","url":"https://openai.github.io/openai-agents-python/","type":"docs","source":"OpenAI","free":true},{"title":"LangGraph overview","url":"https://docs.langchain.com/oss/python/langgraph/overview","type":"docs","source":"LangChain","free":true},{"title":"Hugging Face Agents Course","url":"https://huggingface.co/learn/agents-course/unit0/introduction","type":"course","source":"Hugging Face","free":true},{"title":"Agent Development Kit (ADK)","url":"https://adk.dev/","type":"docs","source":"Google","free":true},{"title":"Claude Quickstarts","url":"https://github.com/anthropics/claude-quickstarts","type":"tool","source":"Anthropic","free":true}],"subtopics":[{"title":"Framework or no framework","desc":"Many good agents are a few hundred lines of direct API calls. Frameworks help most when you need durable state, complex control flow, or built-in tracing. If you use one, make sure you understand the code underneath.","level":"core","resources":[{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Vendor agent SDKs","desc":"The Claude Agent SDK gives you the same harness that powers Claude Code (file and bash tools, context compaction, subagents, MCP). The OpenAI Agents SDK offers agents, handoffs, guardrails, and tracing. Both are light and code-first.","level":"core","resources":[{"title":"Agent SDK overview","url":"https://code.claude.com/docs/en/agent-sdk/overview","type":"docs","source":"Anthropic","free":true},{"title":"OpenAI Agents SDK","url":"https://openai.github.io/openai-agents-python/","type":"docs","source":"OpenAI","free":true}]},{"title":"Graph-based orchestration","desc":"LangGraph models an agent as a graph of nodes and edges with explicit state, checkpoints, and interrupts. Good for long-running, branching workflows that need persistence and human approval.","level":"core","resources":[{"title":"LangGraph overview","url":"https://docs.langchain.com/oss/python/langgraph/overview","type":"docs","source":"LangChain","free":true},{"title":"AI Agents in LangGraph","url":"https://www.deeplearning.ai/courses/ai-agents-in-langgraph","type":"course","source":"DeepLearning.AI","free":true}]},{"title":"Type-safe and lightweight options","desc":"Pydantic AI brings typed inputs and outputs and dependency injection. smolagents is minimal and has agents write Python code as their actions. Google ADK targets multi-agent apps on Gemini and Vertex but works with other models.","level":"deep","resources":[{"title":"Pydantic AI","url":"https://pydantic.dev/docs/ai/overview/","type":"docs","source":"Pydantic","free":true},{"title":"smolagents","url":"https://huggingface.co/docs/smolagents/index","type":"docs","source":"Hugging Face","free":true}]},{"title":"Tracing, state, and human-in-the-loop","desc":"Whatever you pick, you need traces of every step, a way to persist and resume state, and pause points for human approval. Check how each framework handles these before committing.","level":"deep","resources":[]},{"title":"Role-based frameworks","desc":"CrewAI and AutoGen frame agents as roles in a team that talk to each other. Quick to prototype, harder to control precisely.","level":"optional","resources":[{"title":"CrewAI docs","url":"https://docs.crewai.com/","type":"docs","source":"CrewAI","free":true},{"title":"AutoGen","url":"https://microsoft.github.io/autogen/stable/","type":"docs","source":"Microsoft","free":true}]}]},{"id":"llm-evals","title":"Evaluating LLM Apps (Evals)","tier":3,"lane":"ops","prereqs":["llm-apis","model-eval-ml"],"roles":{"aie":"c","mle":"c","ds":"r","rs":"r","pm":"r"},"summary":"Evals are tests for LLM apps. You collect realistic inputs, define what a good output looks like, and score your system automatically (with code checks, LLM judges, or human review) so you can tell if a change made things better or worse.","why":"LLM outputs are non-deterministic and fail in subtle ways, so you cannot ship by vibes. Evals are what let you swap models, edit prompts, or change retrieval with confidence. Teams that improve fastest are almost always the ones with good evals.","depth":"Master error analysis (reading real traces and naming failure modes), building a small labeled dataset, writing code-based assertions, and calibrating an LLM judge against human labels. Just know public benchmarks like MMLU exist; they rarely tell you whether your product works.","hours":30,"outcomes":["You can read a sample of real outputs, categorize the failures, and decide which ones to measure.","You can build a versioned eval dataset that covers normal, edge, and adversarial cases.","You can write code-based checks and an LLM-as-judge grader, and measure how often the judge agrees with a human.","You can run evals in CI so a prompt or model change cannot ship if it regresses.","You can evaluate multi-step agents on both final outcomes and the path they took."],"project":"Take an LLM app you've built (a RAG bot or extraction tool). Read 50 real outputs and write down every failure. Turn the top three failure types into checks: at least one code assertion and one LLM judge. Hand-label 40 examples, measure the judge's agreement with your labels, then wire the eval suite into CI so a pull request shows the score change.","resources":[{"title":"Your AI Product Needs Evals","url":"https://hamel.dev/blog/posts/evals/","type":"article","source":"Hamel Husain","free":true},{"title":"AI Evals: Everything You Need to Know (FAQ)","url":"https://hamel.dev/blog/posts/evals-faq/","type":"article","source":"Hamel Husain","free":true},{"title":"Demystifying evals for AI agents","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Evaluation best practices","url":"https://developers.openai.com/api/docs/guides/evaluation-best-practices","type":"docs","source":"OpenAI","free":true},{"title":"AI Engineering (Ch. 3 and 4: Evaluation)","url":"https://www.oreilly.com/library/view/ai-engineering/9781098166298/","type":"book","source":"Chip Huyen / O'Reilly","free":false},{"title":"Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena","url":"https://arxiv.org/abs/2306.05685","type":"paper","source":"arXiv","free":true},{"title":"AI Evals For Engineers & PMs","url":"https://maven.com/parlance-labs/evals","type":"course","source":"Hamel Husain & Shreya Shankar (Maven)","free":false}],"subtopics":[{"title":"Error analysis first","desc":"Before writing any metric, read 50 to 100 real traces and write notes on what went wrong. Group the notes into failure categories and count them. This tells you what to measure and stops you from tracking generic scores that don't matter.","level":"core","resources":[{"title":"A Field Guide to Rapidly Improving AI Products","url":"https://hamel.dev/blog/posts/field-guide/","type":"article","source":"Hamel Husain","free":true}]},{"title":"Building eval datasets","desc":"Collect inputs from real usage, hand-write tricky cases, and generate synthetic ones to fill gaps. Label expected behavior, version the dataset, and keep growing it every time you find a new bug.","level":"core","resources":[{"title":"Define success criteria and build evaluations","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","type":"docs","source":"Anthropic","free":true}]},{"title":"Code-based checks","desc":"Many failures can be caught with plain code: valid JSON, required fields present, no banned phrases, correct tool called, answer matches a regex or exact value. These are fast, cheap, and deterministic, so use them wherever you can.","level":"core","resources":[{"title":"Promptfoo: Intro","url":"https://www.promptfoo.dev/docs/intro/","type":"tool","source":"Promptfoo","free":true}]},{"title":"LLM-as-a-judge","desc":"Use a model to grade outputs on things code cannot check, like tone or faithfulness to sources. Prefer simple pass/fail judgments with a written critique, and validate the judge against human labels before you trust it.","level":"core","resources":[{"title":"Using LLM-as-a-Judge For Evaluation: A Complete Guide","url":"https://hamel.dev/blog/posts/llm-judge/","type":"article","source":"Hamel Husain","free":true},{"title":"Evaluating the Effectiveness of LLM-Evaluators","url":"https://eugeneyan.com/writing/llm-evaluators/","type":"article","source":"Eugene Yan","free":true}]},{"title":"Evaluating agents","desc":"Agents take many steps, so grade both the end state (did the task get done?) and the trajectory (right tools, no wasted loops). Run each task several times because agent results vary from run to run.","level":"deep","resources":[{"title":"Demystifying evals for AI agents","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Evaluating AI Agents","url":"https://www.deeplearning.ai/courses/evaluating-ai-agents","type":"course","source":"DeepLearning.AI","free":true}]},{"title":"Statistics for evals","desc":"A score on 50 examples is noisy. Learn to report confidence intervals, compare two systems with paired tests on the same questions, and know how many examples you need before a difference is real.","level":"deep","resources":[{"title":"A statistical approach to model evaluations","url":"https://www.anthropic.com/research/statistical-approach-to-model-evals","type":"article","source":"Anthropic","free":true}]},{"title":"Eval tooling and benchmarks","desc":"Frameworks like Promptfoo, Inspect, OpenAI Evals, and Braintrust run datasets and graders for you. Public benchmarks and the LM Evaluation Harness compare base models, which is useful for picking a model but not for testing your app.","level":"optional","resources":[{"title":"Inspect","url":"https://inspect.aisi.org.uk/","type":"tool","source":"UK AI Security Institute","free":true},{"title":"LM Evaluation Harness","url":"https://github.com/EleutherAI/lm-evaluation-harness","type":"tool","source":"EleutherAI","free":true}]}]},{"id":"observability","title":"LLM Observability & Tracing","tier":3,"lane":"ops","prereqs":["llm-apis","deployment-basics"],"roles":{"aie":"c","mle":"r"},"summary":"Observability is being able to see what your LLM app actually did on every request: the prompt, retrieved context, tool calls, model output, latency, token count, and cost. Tracing records each of those steps as a linked tree you can inspect later.","why":"When a user says 'the bot gave a weird answer,' you need the exact trace to debug it. Traces are also the raw material for evals and for spotting cost or latency problems before they become incidents.","depth":"Master instrumenting an app so every request produces a trace with nested spans, plus dashboards for latency, errors, tokens, and cost. Know the OpenTelemetry GenAI conventions exist so your traces stay portable. You don't need to run your own tracing backend at scale.","hours":15,"outcomes":["You can instrument an LLM app so each request produces a trace with spans for retrieval, model calls, and tool calls.","You can find a specific bad response in production and see the full context that produced it.","You can build a dashboard of p50/p95 latency, error rate, token usage, and cost per request.","You can collect user feedback and attach it to traces, then turn flagged traces into eval cases.","You can explain what to log and what to redact for privacy."],"project":"Add tracing to a RAG or agent app with Langfuse or Phoenix (self-hosted or free tier). Make sure each request shows spans for retrieval, model calls, and tools, with token counts and cost. Add a thumbs up/down button that attaches feedback to the trace, then build a dashboard of p95 latency and cost per request and use it to find your slowest step.","resources":[{"title":"LLM Observability & Application Tracing","url":"https://langfuse.com/docs/observability/overview","type":"docs","source":"Langfuse","free":true},{"title":"Observability primer","url":"https://opentelemetry.io/docs/concepts/observability-primer/","type":"docs","source":"OpenTelemetry","free":true},{"title":"Building A Generative AI Platform","url":"https://huyenchip.com/2024/07/25/genai-platform.html","type":"article","source":"Chip Huyen","free":true},{"title":"What We've Learned From A Year of Building with LLMs","url":"https://applied-llms.org/","type":"article","source":"Applied LLMs","free":true},{"title":"OpenTelemetry for Generative AI","url":"https://opentelemetry.io/blog/2024/otel-generative-ai/","type":"article","source":"OpenTelemetry","free":true},{"title":"What is Arize Phoenix?","url":"https://arize.com/docs/phoenix","type":"tool","source":"Arize","free":true}],"subtopics":[{"title":"Logs, metrics, and traces","desc":"The three pillars of observability. Logs are events, metrics are numbers over time, and traces follow one request through every step. LLM apps lean heavily on traces because each request has many steps.","level":"core","resources":[{"title":"Observability primer","url":"https://opentelemetry.io/docs/concepts/observability-primer/","type":"docs","source":"OpenTelemetry","free":true},{"title":"Monitoring Distributed Systems","url":"https://sre.google/sre-book/monitoring-distributed-systems/","type":"book","source":"Google SRE Book","free":true}]},{"title":"Tracing LLM calls, RAG, and agents","desc":"Wrap each step in a span: the user request, retrieval, reranking, each model call, each tool call. Record inputs, outputs, model name, and token counts. For agents, the trace tree is the only sane way to see why it looped or picked the wrong tool.","level":"core","resources":[{"title":"LLM Observability & Application Tracing","url":"https://langfuse.com/docs/observability/overview","type":"docs","source":"Langfuse","free":true}]},{"title":"OpenTelemetry GenAI conventions","desc":"OpenTelemetry is the vendor-neutral standard for telemetry. Its GenAI semantic conventions define standard attribute names for model, tokens, and prompts, so you can switch tools without re-instrumenting.","level":"deep","resources":[{"title":"OpenTelemetry for Generative AI","url":"https://opentelemetry.io/blog/2024/otel-generative-ai/","type":"article","source":"OpenTelemetry","free":true},{"title":"OpenLLMetry","url":"https://github.com/traceloop/openllmetry","type":"tool","source":"Traceloop","free":true}]},{"title":"Cost, latency, and token dashboards","desc":"Track time to first token, total latency at p50 and p95, tokens in and out, cache hit rate, and cost per request or per user. Alert on sudden changes, which often mean a prompt bug or a runaway agent loop.","level":"core","resources":[]},{"title":"Feedback loops and online evals","desc":"Capture thumbs up/down, edits, and retries, and attach them to traces. Run cheap automated checks on a sample of live traffic. Route bad traces into your eval dataset so the same bug gets caught next time.","level":"core","resources":[{"title":"A Field Guide to Rapidly Improving AI Products","url":"https://hamel.dev/blog/posts/field-guide/","type":"article","source":"Hamel Husain","free":true}]},{"title":"Privacy and retention","desc":"Traces contain user data. Decide what to redact (emails, keys, health data), how long to keep traces, and who can read them. This is a compliance question, not just a technical one.","level":"deep","resources":[]},{"title":"Choosing a tracing tool","desc":"Popular options include Langfuse and Arize Phoenix (open source, self-hostable), LangSmith, and Braintrust. Most accept OpenTelemetry data. Pick one, instrument early, and avoid building your own.","level":"optional","resources":[{"title":"What is Arize Phoenix?","url":"https://arize.com/docs/phoenix","type":"tool","source":"Arize","free":true},{"title":"LangSmith Observability","url":"https://docs.langchain.com/langsmith/observability","type":"docs","source":"LangChain","free":true}]}]},{"id":"mlops","title":"MLOps Pipelines","tier":3,"lane":"ops","prereqs":["deployment-basics","model-eval-ml"],"roles":{"mle":"c","ds":"r","aie":"a"},"summary":"MLOps is the set of practices and tools for taking ML models from notebook to production and keeping them healthy: versioning data and models, tracking experiments, automating training pipelines, testing, deploying, and monitoring for drift.","why":"Most ML projects fail after the model is trained, not before. Without pipelines, you can't reproduce a model, retrain it when data changes, or know when it has quietly gotten worse.","depth":"Master experiment tracking, a model registry, a reproducible training pipeline, and drift monitoring for one real model. Just know the big platforms (Kubeflow, SageMaker, Vertex AI) exist; the concepts transfer, and small teams rarely need them on day one.","hours":40,"outcomes":["You can track experiments so any model can be traced back to its code, data, and hyperparameters.","You can version datasets and models and promote a model through a registry from staging to production.","You can build an orchestrated pipeline that ingests data, trains, evaluates, and only deploys if quality gates pass.","You can write tests for data, models, and code, and run them in CI.","You can detect data and prediction drift and decide when to retrain."],"project":"Build an end-to-end pipeline for a tabular model (for example, predicting churn). Version the data with DVC, track runs in MLflow, register the best model, and use Prefect or GitHub Actions to retrain weekly and only promote the new model if it beats the current one. Serve it with FastAPI and add an Evidently drift report on incoming data.","resources":[{"title":"Made With ML: MLOps course","url":"https://madewithml.com/","type":"course","source":"Made With ML","free":true},{"title":"Designing Machine Learning Systems","url":"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/","type":"book","source":"Chip Huyen / O'Reilly","free":false},{"title":"MLOps Zoomcamp","url":"https://github.com/DataTalksClub/mlops-zoomcamp","type":"course","source":"DataTalks.Club","free":true},{"title":"Full Stack Deep Learning 2022","url":"https://fullstackdeeplearning.com/course/2022/","type":"video","source":"Full Stack Deep Learning","free":true},{"title":"MLOps: Continuous delivery and automation pipelines in machine learning","url":"https://docs.cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning","type":"docs","source":"Google Cloud","free":true},{"title":"Machine Learning in Production","url":"https://mlip-cmu.github.io/","type":"course","source":"Carnegie Mellon University","free":true},{"title":"Rules of Machine Learning","url":"https://developers.google.com/machine-learning/guides/rules-of-ml","type":"article","source":"Google","free":true}],"subtopics":[{"title":"The ML lifecycle and MLOps maturity","desc":"See the full loop from data collection to monitoring and back. Google's maturity levels (manual, pipeline automation, full CI/CD) help you decide how much automation your team needs right now.","level":"core","resources":[{"title":"MLOps: Continuous delivery and automation pipelines in machine learning","url":"https://docs.cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning","type":"docs","source":"Google Cloud","free":true},{"title":"Hidden Technical Debt in Machine Learning Systems","url":"https://papers.nips.cc/paper_files/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html","type":"paper","source":"NeurIPS 2015","free":true}]},{"title":"Experiment tracking and model registry","desc":"Log every run's parameters, metrics, and artifacts so you can compare runs and reproduce the winner. A registry stores model versions with stages like staging and production, so deploys point at a version, not a file on someone's laptop.","level":"core","resources":[{"title":"Experiment Tracking","url":"https://madewithml.com/courses/mlops/experiment-tracking/","type":"course","source":"Made With ML","free":true},{"title":"MLflow documentation","url":"https://mlflow.org/docs/latest/index.html","type":"docs","source":"MLflow","free":true}]},{"title":"Data and model versioning","desc":"Code lives in Git, but datasets and model weights are too big. Tools like DVC version them alongside your code so you can say exactly which data trained which model.","level":"core","resources":[{"title":"Versioning","url":"https://madewithml.com/courses/mlops/versioning/","type":"course","source":"Made With ML","free":true},{"title":"DVC documentation","url":"https://doc.dvc.org/","type":"docs","source":"DVC","free":true}]},{"title":"Pipelines and orchestration","desc":"Turn notebook steps into a pipeline (ingest, validate, featurize, train, evaluate, register) that runs on a schedule or trigger. Orchestrators like Airflow, Prefect, Dagster, ZenML, or Kubeflow handle retries and dependencies.","level":"core","resources":[{"title":"Orchestration","url":"https://madewithml.com/courses/mlops/orchestration/","type":"course","source":"Made With ML","free":true}]},{"title":"Testing ML systems and CI/CD","desc":"Test code as usual, but also test data (schemas, ranges, nulls) and models (minimum accuracy, behavior on known cases, no regression versus the current model). Gate deploys on these checks.","level":"core","resources":[{"title":"Testing ML Systems","url":"https://madewithml.com/courses/mlops/testing/","type":"course","source":"Made With ML","free":true},{"title":"The ML Test Score","url":"https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/","type":"paper","source":"Google Research","free":true}]},{"title":"Monitoring, drift, and retraining","desc":"Real-world data shifts over time, and model quality decays with it. Monitor input distributions, prediction distributions, and (when labels arrive) actual accuracy. Decide whether to retrain on a schedule or when drift crosses a threshold.","level":"deep","resources":[{"title":"Data Distribution Shifts and Monitoring","url":"https://huyenchip.com/2022/02/07/data-distribution-shifts-and-monitoring.html","type":"article","source":"Chip Huyen","free":true},{"title":"Evidently documentation","url":"https://docs.evidentlyai.com/introduction","type":"tool","source":"Evidently AI","free":true}]},{"title":"Feature stores","desc":"A feature store computes features once and serves the same values for training and live prediction, which prevents training-serving skew. Useful for teams with many models sharing features; overkill for a single model.","level":"optional","resources":[{"title":"Feast documentation","url":"https://docs.feast.dev/","type":"docs","source":"Feast","free":true}]}]},{"id":"ai-native-business","title":"Building an AI-native Business","tier":4,"lane":"biz","prereqs":["ai-adoption","build-vs-buy"],"roles":{"pm":"r","biz":"c"},"summary":"An AI-native business is designed from the ground up around AI: small teams with AI agents doing much of the routine work, processes built for human-AI collaboration, and products or services that would not be possible without AI.","why":"Companies that bolt AI onto old processes get modest gains. Those that redesign around it can run with far smaller teams, move faster, and offer new kinds of services, which changes how competitors, pricing, and whole industries work.","depth":"Go deep on operating model design: which work goes to agents, how humans supervise, and how roles, pricing, and data strategy change. You don't need to code agents yourself; you do need a sharp sense of what agents can reliably do today and how to keep them safe and accountable.","hours":20,"outcomes":["You can redesign a business function around AI agents with clear human oversight points.","You can describe new business models AI enables, such as selling outcomes instead of software seats.","You can plan how team structure, roles, and hiring change in an AI-native company.","You can identify which proprietary data, workflows, and relationships form a durable moat.","You can set up governance so AI-run processes stay accountable and auditable."],"project":"Pick one business function (for example, customer onboarding or monthly reporting) and design its AI-native version. Draw the new workflow showing which steps agents own, where humans approve or review, what gets logged, and how the team and its roles change. Estimate the cost and headcount difference versus today, and pilot one agent-run step for two weeks.","resources":[{"title":"A practical guide to building agents","url":"https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf","type":"article","source":"OpenAI","free":true},{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true},{"title":"AI leads a service as software paradigm shift","url":"https://foundationcapital.com/ideas/ai-leads-a-service-as-software-paradigm-shift","type":"article","source":"Foundation Capital","free":true},{"title":"The Cybernetic Teammate","url":"https://www.oneusefulthing.org/p/the-cybernetic-teammate","type":"article","source":"Ethan Mollick","free":true},{"title":"Prediction Machines","url":"https://www.predictionmachines.ai/","type":"book","source":"Agrawal, Gans & Goldfarb","free":false},{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true},{"title":"Requests for Startups","url":"https://www.ycombinator.com/rfs","type":"article","source":"Y Combinator","free":true}],"subtopics":[{"title":"Redesigning work around AI","desc":"Start from the outcome and ask how you'd do it if AI were available from day one, rather than which steps of today's process to automate. This often removes steps entirely.","level":"core","resources":[{"title":"How Anthropic teams use Claude Code","url":"https://www.anthropic.com/news/how-anthropic-teams-use-claude-code","type":"article","source":"Anthropic","free":true}]},{"title":"Agents as part of the workforce","desc":"Agents can now handle multi-step work like research, support tickets, bookkeeping, and coding. Treat them like team members with a defined scope, permissions, a manager, and performance reviews.","level":"core","resources":[{"title":"A practical guide to building agents","url":"https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf","type":"article","source":"OpenAI","free":true}]},{"title":"Service as software and new business models","desc":"AI lets companies sell completed work (a reviewed contract, a resolved ticket) rather than tools for people to use. This changes pricing toward outcomes and opens markets that were too labor-intensive before.","level":"core","resources":[{"title":"AI leads a service as software paradigm shift","url":"https://foundationcapital.com/ideas/ai-leads-a-service-as-software-paradigm-shift","type":"article","source":"Foundation Capital","free":true}]},{"title":"Small teams, new roles","desc":"AI-native teams are smaller and flatter, with people acting as editors, orchestrators, and owners of outcomes. Hiring shifts toward judgment, domain expertise, and the ability to direct AI well.","level":"core","resources":[{"title":"The Cybernetic Teammate","url":"https://www.oneusefulthing.org/p/the-cybernetic-teammate","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Data and moats","desc":"When everyone has access to the same models, advantage comes from proprietary data, workflow integration, customer trust, and distribution. Design processes that capture useful data as a by-product.","level":"deep","resources":[]},{"title":"Governance for AI-run operations","desc":"Logging, audit trails, approval thresholds, incident response, and regulatory compliance (like the EU AI Act) matter more when AI acts on its own. Build these in early rather than retrofitting.","level":"deep","resources":[{"title":"EU Artificial Intelligence Act","url":"https://artificialintelligenceact.eu/","type":"docs","source":"Future of Life Institute","free":true}]},{"title":"Where startups see opportunity","desc":"Investor requests for startups and market reports show which AI-native ideas are attracting builders. Good for spotting trends in your industry early.","level":"optional","resources":[{"title":"Requests for Startups","url":"https://www.ycombinator.com/rfs","type":"article","source":"Y Combinator","free":true}]}]},{"id":"ai-governance","title":"AI Governance Programs","tier":4,"lane":"safety","prereqs":["ai-regulation","ai-adoption"],"roles":{"aie":"a","pm":"r","biz":"c"},"summary":"An AI governance program is how an organization decides which AI uses are allowed, who approves them, how risks are checked, and how problems are caught and fixed over time.","why":"Once AI is used across a company, ad hoc decisions stop working. Governance lets you move fast on low-risk uses, keep high-risk ones under control, and show customers, auditors, and regulators that you are in charge.","depth":"Business leaders must master the building blocks: an AI policy, a use-case inventory, risk tiers, an approval path, and incident handling. PMs should know how their features pass through that process. Engineers just need to know what evidence (evals, logs, documentation) the process will ask for.","hours":15,"outcomes":["You can draft an acceptable-use AI policy for staff.","You can set up an inventory of AI systems and a risk-tiering method tied to review depth.","You can map your program to NIST AI RMF (Govern, Map, Measure, Manage) or ISO/IEC 42001.","You can design an incident response and monitoring loop for AI systems in production."],"project":"Build a starter governance kit for a real or sample company: a one-page AI use policy, an inventory spreadsheet with risk tiers, an intake form for new AI use cases, and an incident response checklist. Map each part to the four NIST AI RMF functions and run one real use case through the whole process.","resources":[{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true},{"title":"NIST AI RMF: Generative AI Profile (AI 600-1)","url":"https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence","type":"docs","source":"NIST","free":true},{"title":"NIST AI RMF Playbook","url":"https://airc.nist.gov/airmf-resources/playbook/","type":"docs","source":"NIST","free":true},{"title":"ISO/IEC 42001: AI management systems","url":"https://www.iso.org/standard/42001","type":"docs","source":"ISO","free":false},{"title":"Microsoft Responsible AI","url":"https://www.microsoft.com/en-us/ai/responsible-ai","type":"article","source":"Microsoft","free":true},{"title":"AIGP certification","url":"https://iapp.org/certify/aigp/","type":"course","source":"IAPP","free":false},{"title":"AI Incident Database","url":"https://incidentdatabase.ai/","type":"tool","source":"Responsible AI Collaborative","free":true}],"subtopics":[{"title":"Policy, roles, and ownership","desc":"Write down what staff may and may not do with AI, who owns each AI system, and who can approve new uses. A small cross-functional committee (legal, security, product, business) is common.","level":"core","resources":[]},{"title":"Inventory and risk tiering","desc":"You can't govern what you don't know about. Keep a register of every AI system and vendor tool, rate each by impact, and scale review effort to the risk.","level":"core","resources":[{"title":"MIT AI Risk Repository","url":"https://airisk.mit.edu/","type":"tool","source":"MIT","free":true}]},{"title":"Frameworks: NIST AI RMF and ISO/IEC 42001","desc":"NIST AI RMF is a free, flexible risk framework with a playbook and a generative AI profile. ISO/IEC 42001 is a certifiable management-system standard that customers increasingly ask about.","level":"core","resources":[{"title":"NIST AI RMF Playbook","url":"https://airc.nist.gov/airmf-resources/playbook/","type":"docs","source":"NIST","free":true},{"title":"ISO/IEC 42001: AI management systems","url":"https://www.iso.org/standard/42001","type":"docs","source":"ISO","free":false}]},{"title":"Vendor and third-party AI risk","desc":"Most AI risk comes in through tools you buy. Ask vendors about training on your data, retention, security certifications, subprocessors, and model change notices.","level":"deep","resources":[]},{"title":"Monitoring, incidents, and audits","desc":"Models and vendors change under you. Track quality and harm metrics after launch, give people a way to report problems, and learn from public incidents at other companies.","level":"deep","resources":[{"title":"AI Incident Database","url":"https://incidentdatabase.ai/","type":"tool","source":"Responsible AI Collaborative","free":true}]},{"title":"AI literacy and training","desc":"The EU AI Act requires AI literacy for staff who use AI systems. A short, role-based training program is usually the most cost-effective control you have.","level":"optional","resources":[]}]},{"id":"red-teaming","title":"Red Teaming & Safety Evals","tier":4,"lane":"safety","prereqs":["ai-security","llm-evals"],"roles":{"aie":"r","mle":"a","rs":"r"},"summary":"Red teaming means attacking your own AI system on purpose to find harmful or unsafe behavior before real users do. Safety evals turn those findings into repeatable tests you can run on every release.","why":"Normal evals check that the happy path works. Red teaming checks what happens when someone tries to break it. Labs use it to decide whether a model is safe to release, and app teams use it before launching anything public-facing.","depth":"AI engineers should master manual and automated red teaming for their own apps (jailbreaks, injection, harmful content, data leaks) and turning failures into regression tests. Research scientists should go deeper into automated attack methods, capability evals for dangerous skills, and benchmark design. Gradient-based attacks are 'know it exists' for app builders.","hours":20,"outcomes":["You can write a red-team plan that lists threats, attacker types, and harm categories for an AI app.","You can run automated scans with tools like promptfoo, garak, or PyRIT and read the results.","You can turn red-team findings into a safety eval suite that runs in CI.","You can explain how frontier labs use dangerous-capability evals to make release decisions."],"project":"Pick a chatbot or agent you built (or a simple one with a system prompt). Write a red-team plan with five harm categories. Run 30 minutes of manual attacks, then an automated scan with promptfoo or garak. Fix the top two issues and turn every successful attack into an eval case that runs on each change. Report attack success rate and over-refusal rate before and after.","resources":[{"title":"LLM red teaming guide","url":"https://www.promptfoo.dev/docs/red-team/","type":"docs","source":"Promptfoo","free":true},{"title":"Red Teaming LLM Applications","url":"https://www.deeplearning.ai/courses/red-teaming-llm-applications","type":"course","source":"DeepLearning.AI","free":true},{"title":"Adversarial Attacks on LLMs","url":"https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/","type":"article","source":"Lilian Weng","free":true},{"title":"PyRIT","url":"https://github.com/Azure/PyRIT","type":"tool","source":"Microsoft","free":true},{"title":"Inspect","url":"https://inspect.aisi.org.uk/","type":"tool","source":"UK AI Security Institute","free":true},{"title":"Red Teaming Language Models with Language Models","url":"https://arxiv.org/abs/2202.03286","type":"paper","source":"arXiv","free":true},{"title":"Advancing red teaming with people and AI","url":"https://openai.com/index/advancing-red-teaming-with-people-and-ai/","type":"article","source":"OpenAI","free":true}],"subtopics":[{"title":"Planning a red-team exercise","desc":"Decide what you're protecting, who might attack, and what counts as a failure. Mix domain experts with people who think like attackers.","level":"core","resources":[{"title":"Red Teaming Language Models to Reduce Harms","url":"https://arxiv.org/abs/2209.07858","type":"paper","source":"arXiv (Anthropic)","free":true}]},{"title":"Jailbreak and attack techniques","desc":"Know the common families: role-play, encoding tricks, many-shot prompting, multi-turn escalation, and optimized adversarial suffixes. Knowing them helps you test for them.","level":"core","resources":[{"title":"Adversarial Attacks on LLMs","url":"https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/","type":"article","source":"Lilian Weng","free":true},{"title":"Many-shot jailbreaking","url":"https://www.anthropic.com/research/many-shot-jailbreaking","type":"article","source":"Anthropic","free":true}]},{"title":"Automated red teaming tools","desc":"Use one model to generate attacks on another at scale. Open-source scanners provide ready-made attack libraries and scoring.","level":"core","resources":[{"title":"LLM red teaming guide","url":"https://www.promptfoo.dev/docs/red-team/","type":"tool","source":"Promptfoo","free":true},{"title":"garak: LLM vulnerability scanner","url":"https://github.com/NVIDIA/garak","type":"tool","source":"NVIDIA","free":true}]},{"title":"From findings to safety evals","desc":"Every confirmed failure becomes a test case. Track attack success rate and over-refusal rate together, since a model that refuses everything is also broken.","level":"deep","resources":[{"title":"Inspect","url":"https://inspect.aisi.org.uk/","type":"tool","source":"UK AI Security Institute","free":true}]},{"title":"Dangerous capability evals","desc":"Frontier labs and safety institutes test whether models can meaningfully help with cyberattacks, bioweapons, or autonomous replication, and tie the results to release policies.","level":"deep","resources":[{"title":"Anthropic's Responsible Scaling Policy","url":"https://www.anthropic.com/responsible-scaling-policy","type":"docs","source":"Anthropic","free":true},{"title":"METR","url":"https://metr.org/","type":"article","source":"METR","free":true}]},{"title":"Benchmarks and optimized attacks","desc":"Standard benchmarks like HarmBench let you compare defenses. Gradient-based attacks such as GCG search for adversarial strings automatically and need access to model weights.","level":"optional","resources":[{"title":"HarmBench","url":"https://arxiv.org/abs/2402.04249","type":"paper","source":"arXiv","free":true},{"title":"Universal and Transferable Adversarial Attacks on Aligned Language Models","url":"https://arxiv.org/abs/2307.15043","type":"paper","source":"arXiv","free":true}]}]},{"id":"diffusion","title":"Diffusion & Generative Image Models","tier":4,"lane":"dl","prereqs":["cnn","dl-training"],"roles":{"mle":"a","rs":"c"},"summary":"Diffusion models generate images (and video, audio, and more) by learning to reverse a gradual noising process. Starting from pure noise, the model removes a little noise at each step until a clean sample appears, often guided by a text prompt.","why":"Diffusion and its close cousin flow matching power most image and video generators. Understanding them lets you fine-tune them, control them, and follow research on generative media and world models.","depth":"Must master: the forward noising and reverse denoising idea, the noise-prediction training objective, latent diffusion, and classifier-free guidance. Just know the score-based SDE view and the math of flow matching at an intuitive level unless you research generative models.","hours":40,"outcomes":["You can explain how a diffusion model is trained and how sampling turns noise into an image.","You can explain why latent diffusion runs in a compressed space and how text conditioning and guidance work.","You can generate, fine-tune, and control a model using the Hugging Face diffusers library.","You can place VAEs, GANs, diffusion, and flow matching on a map of generative models."],"project":"Implement a small DDPM from scratch in PyTorch and train it on MNIST or Fashion-MNIST until samples look recognizable. Then use diffusers to train a LoRA on 15 to 30 images of a style or object and compare outputs at different guidance scales.","resources":[{"title":"What are Diffusion Models?","url":"https://lilianweng.github.io/posts/2021-07-11-diffusion-models/","type":"article","source":"Lilian Weng","free":true},{"title":"The Illustrated Stable Diffusion","url":"https://jalammar.github.io/illustrated-stable-diffusion/","type":"article","source":"Jay Alammar","free":true},{"title":"Hugging Face Diffusion Models Course","url":"https://huggingface.co/learn/diffusion-course/unit0/1","type":"course","source":"Hugging Face","free":true},{"title":"MIT 6.S184: Generative AI with Stochastic Differential Equations","url":"https://diffusion.csail.mit.edu/","type":"course","source":"MIT","free":true},{"title":"Practical Deep Learning for Coders, Part 2","url":"https://course.fast.ai/Lessons/part2.html","type":"course","source":"fast.ai","free":true},{"title":"Denoising Diffusion Probabilistic Models","url":"https://arxiv.org/abs/2006.11239","type":"paper","source":"arXiv","free":true},{"title":"Diffusers documentation","url":"https://huggingface.co/docs/diffusers/index","type":"docs","source":"Hugging Face","free":true}],"subtopics":[{"title":"Generative models before diffusion","desc":"VAEs learn a compressed latent space; GANs pit a generator against a discriminator. Their strengths and failure modes explain why diffusion took over.","level":"optional","resources":[{"title":"Auto-Encoding Variational Bayes","url":"https://arxiv.org/abs/1312.6114","type":"paper","source":"arXiv","free":true},{"title":"Generative Adversarial Networks","url":"https://arxiv.org/abs/1406.2661","type":"paper","source":"arXiv","free":true}]},{"title":"Denoising diffusion (DDPM)","desc":"Training adds noise to real images at random levels and teaches a network to predict that noise. Sampling runs this in reverse over many small steps.","level":"core","resources":[{"title":"Denoising Diffusion Probabilistic Models","url":"https://arxiv.org/abs/2006.11239","type":"paper","source":"arXiv","free":true},{"title":"The Annotated Diffusion Model","url":"https://huggingface.co/blog/annotated-diffusion","type":"article","source":"Hugging Face","free":true}]},{"title":"Latent diffusion and text conditioning","desc":"Running diffusion inside a VAE's compressed latent space makes high-resolution generation affordable. A text encoder feeds the prompt into the denoiser through cross-attention.","level":"core","resources":[{"title":"The Illustrated Stable Diffusion","url":"https://jalammar.github.io/illustrated-stable-diffusion/","type":"article","source":"Jay Alammar","free":true},{"title":"High-Resolution Image Synthesis with Latent Diffusion Models","url":"https://arxiv.org/abs/2112.10752","type":"paper","source":"arXiv","free":true}]},{"title":"Guidance and sampling","desc":"Classifier-free guidance trades diversity for prompt adherence with a single scale knob. Faster samplers and distillation cut generation from hundreds of steps to a handful.","level":"core","resources":[{"title":"Classifier-Free Diffusion Guidance","url":"https://arxiv.org/abs/2207.12598","type":"paper","source":"arXiv","free":true}]},{"title":"Flow matching and diffusion transformers","desc":"Flow matching learns a straight path from noise to data and is now common in leading image and video models. Diffusion transformers (DiT) replace the U-Net backbone with a transformer that scales better.","level":"deep","resources":[{"title":"Flow Matching for Generative Modeling","url":"https://arxiv.org/abs/2210.02747","type":"paper","source":"arXiv","free":true},{"title":"Scalable Diffusion Models with Transformers","url":"https://arxiv.org/abs/2212.09748","type":"paper","source":"arXiv","free":true}]},{"title":"The score-based view","desc":"Diffusion can be seen as learning the gradient of the data's log-density and following it with a stochastic differential equation. This view unifies many variants.","level":"deep","resources":[{"title":"Generative Modeling by Estimating Gradients of the Data Distribution","url":"https://yang-song.net/blog/2021/score/","type":"article","source":"Yang Song","free":true}]},{"title":"Fine-tuning and control","desc":"LoRA adapters, DreamBooth-style personalization, and control networks let you teach a model new styles or subjects and steer layout. These are the everyday tools of applied image generation.","level":"optional","resources":[{"title":"Diffusers documentation","url":"https://huggingface.co/docs/diffusers/index","type":"docs","source":"Hugging Face","free":true}]}]},{"id":"pretraining","title":"Pretraining & Scaling Laws","tier":4,"lane":"llm","prereqs":["transformers","dl-training"],"roles":{"mle":"r","rs":"c"},"summary":"Pretraining is the first and most expensive stage of building an LLM: training a transformer from scratch on trillions of tokens to predict the next token. Scaling laws describe how loss improves predictably as you grow parameters, data, and compute.","why":"Pretraining decides most of a model's knowledge and raw ability, and scaling laws drive billion-dollar decisions about model size and data. Understanding them helps you read frontier model reports and reason about where capabilities come from.","depth":"Must master: the pretraining objective, data pipelines (filtering, deduplication, mixing), compute-optimal scaling (Chinchilla), and the basic training-stability tricks. Just know the specifics of parallelism strategies and hyperparameter transfer (muP) unless you train large models yourself.","hours":50,"outcomes":["You can explain how data quantity and quality, model size, and compute trade off under scaling laws.","You can describe how a web-scale pretraining dataset is collected, filtered, deduplicated, and mixed.","You can pretrain a small GPT end to end and track loss against compute.","You can read a frontier model technical report and summarize its data, architecture, and training recipe."],"project":"Train a family of four or five small GPT models (for example 1M to 50M parameters) on a fixed slice of FineWeb with different compute budgets. Plot final loss against compute, fit a simple power law, and use it to predict the loss of a slightly larger model before training it to check.","resources":[{"title":"Let's reproduce GPT-2 (124M)","url":"https://www.youtube.com/watch?v=l8pRSuU81PU","type":"video","source":"Andrej Karpathy","free":true},{"title":"CS336: Language Modeling from Scratch","url":"http://cs336.stanford.edu/spring2025/","type":"course","source":"Stanford","free":true},{"title":"Training Compute-Optimal Large Language Models (Chinchilla)","url":"https://arxiv.org/abs/2203.15556","type":"paper","source":"arXiv","free":true},{"title":"The Smol Training Playbook","url":"https://huggingface.co/spaces/HuggingFaceTB/smol-training-playbook","type":"article","source":"Hugging Face","free":true},{"title":"Scaling Laws for Neural Language Models","url":"https://arxiv.org/abs/2001.08361","type":"paper","source":"arXiv","free":true},{"title":"OLMo (fully open models, data, and code)","url":"https://allenai.org/olmo","type":"tool","source":"Allen Institute for AI","free":true},{"title":"The Ultra-Scale Playbook","url":"https://huggingface.co/spaces/nanotron/ultrascale-playbook","type":"article","source":"Hugging Face","free":true}],"subtopics":[{"title":"Scaling laws","desc":"Loss falls as a smooth power law in parameters, data, and compute. Kaplan et al. found the first laws; Chinchilla showed that many models were undertrained and that data should grow with model size.","level":"core","resources":[{"title":"Scaling Laws for Neural Language Models","url":"https://arxiv.org/abs/2001.08361","type":"paper","source":"arXiv","free":true},{"title":"Training Compute-Optimal Large Language Models (Chinchilla)","url":"https://arxiv.org/abs/2203.15556","type":"paper","source":"arXiv","free":true}]},{"title":"Pretraining data","desc":"Most text comes from filtered web crawls plus code, books, papers, and math. Quality filtering, deduplication, and the data mix often matter as much as the architecture.","level":"core","resources":[{"title":"FineWeb: decanting the web for the finest text data at scale","url":"https://huggingface.co/spaces/HuggingFaceFW/blogpost-fineweb-v1","type":"article","source":"Hugging Face","free":true}]},{"title":"Training a GPT end to end","desc":"Reproducing a small model like GPT-2 teaches the full loop: tokenized data shards, the model, the optimizer, learning rate schedule, evaluation, and checkpointing.","level":"core","resources":[{"title":"Let's reproduce GPT-2 (124M)","url":"https://www.youtube.com/watch?v=l8pRSuU81PU","type":"video","source":"Andrej Karpathy","free":true},{"title":"nanochat","url":"https://github.com/karpathy/nanochat","type":"tool","source":"Andrej Karpathy","free":true}]},{"title":"Stability and hyperparameters at scale","desc":"Large runs suffer loss spikes and divergence, handled with careful initialization, normalization, learning rate warmup, and monitoring. Methods like muP let you tune on small models and transfer settings to big ones.","level":"deep","resources":[{"title":"Tensor Programs V: Tuning Large Neural Networks via Zero-Shot Hyperparameter Transfer","url":"https://arxiv.org/abs/2203.03466","type":"paper","source":"arXiv","free":true},{"title":"The Smol Training Playbook","url":"https://huggingface.co/spaces/HuggingFaceTB/smol-training-playbook","type":"article","source":"Hugging Face","free":true}]},{"title":"Parallelism and infrastructure","desc":"Big models are split across many GPUs with data, tensor, pipeline, and expert parallelism. Throughput metrics like MFU tell you how well you are using the hardware.","level":"deep","resources":[{"title":"The Ultra-Scale Playbook","url":"https://huggingface.co/spaces/nanotron/ultrascale-playbook","type":"article","source":"Hugging Face","free":true}]},{"title":"Reading frontier technical reports","desc":"Reports from open model labs reveal real recipes: data sizes, mixtures, annealing phases, long-context extension, and mixture-of-experts designs.","level":"optional","resources":[{"title":"The Llama 3 Herd of Models","url":"https://arxiv.org/abs/2407.21783","type":"paper","source":"arXiv","free":true},{"title":"DeepSeek-V3 Technical Report","url":"https://arxiv.org/abs/2412.19437","type":"paper","source":"arXiv","free":true}]}]},{"id":"rlhf","title":"Alignment Training: RLHF & DPO","tier":4,"lane":"llm","prereqs":["fine-tuning"],"roles":{"mle":"r","rs":"c","aie":"a"},"summary":"Alignment training (post-training) turns a pretrained model into a helpful, honest, and safer assistant. RLHF trains a reward model on human preference comparisons and then optimizes the LLM against it, while DPO and related methods learn directly from preference pairs without a separate reward model.","why":"This stage is where models learn to follow instructions, refuse harmful requests, and match a desired personality. It is also where many failure modes like sycophancy and reward hacking come from, so it matters for both capability and safety work.","depth":"Must master: the SFT, reward model, and RL pipeline from InstructGPT; how DPO simplifies it; and what reward hacking is. Just know the math of PPO, the many DPO variants, and the details of constitutional and AI-feedback methods unless you do post-training research.","hours":40,"outcomes":["You can explain the three-stage InstructGPT pipeline and what each stage contributes.","You can explain how DPO turns preference data into a simple classification-style loss.","You can run a small DPO training job with TRL and evaluate the result.","You can describe reward hacking, sycophancy, and how AI feedback and constitutions are used in practice."],"project":"Start from a small instruction-tuned open model. Build or download a preference dataset of a few thousand pairs that reward a specific behavior (for example, concise answers or polite refusals), train with DPO using TRL and LoRA, and compare before and after with an LLM judge plus your own blind ratings on 50 prompts.","resources":[{"title":"Reinforcement Learning from Human Feedback (book)","url":"https://rlhfbook.com/","type":"book","source":"Nathan Lambert","free":true},{"title":"Illustrating Reinforcement Learning from Human Feedback (RLHF)","url":"https://huggingface.co/blog/rlhf","type":"article","source":"Hugging Face","free":true},{"title":"RLHF: Reinforcement Learning from Human Feedback","url":"https://huyenchip.com/2023/05/02/rlhf.html","type":"article","source":"Chip Huyen","free":true},{"title":"Training language models to follow instructions with human feedback (InstructGPT)","url":"https://arxiv.org/abs/2203.02155","type":"paper","source":"arXiv","free":true},{"title":"Direct Preference Optimization","url":"https://arxiv.org/abs/2305.18290","type":"paper","source":"arXiv","free":true},{"title":"TRL documentation","url":"https://huggingface.co/docs/trl/index","type":"docs","source":"Hugging Face","free":true}],"subtopics":[{"title":"Preference data and reward models","desc":"Humans compare two model responses and pick the better one. A reward model learns to predict those preferences and score new responses.","level":"core","resources":[{"title":"Deep reinforcement learning from human preferences","url":"https://arxiv.org/abs/1706.03741","type":"paper","source":"arXiv","free":true}]},{"title":"RLHF with PPO","desc":"The model generates responses, the reward model scores them, and PPO updates the model while a KL penalty keeps it close to the original. InstructGPT showed a small aligned model could beat a much larger raw one in human ratings.","level":"core","resources":[{"title":"Training language models to follow instructions with human feedback (InstructGPT)","url":"https://arxiv.org/abs/2203.02155","type":"paper","source":"arXiv","free":true},{"title":"Illustrating Reinforcement Learning from Human Feedback (RLHF)","url":"https://huggingface.co/blog/rlhf","type":"article","source":"Hugging Face","free":true}]},{"title":"Direct Preference Optimization","desc":"DPO shows the RLHF objective can be optimized directly from preference pairs with a simple loss, no reward model or RL loop needed. It is cheap, stable, and widely used in open models.","level":"core","resources":[{"title":"Direct Preference Optimization","url":"https://arxiv.org/abs/2305.18290","type":"paper","source":"arXiv","free":true},{"title":"TRL: DPO Trainer","url":"https://huggingface.co/docs/trl/dpo_trainer","type":"docs","source":"Hugging Face","free":true}]},{"title":"AI feedback and Constitutional AI","desc":"Instead of only human labels, a model critiques and ranks outputs against a written set of principles. This scales feedback and makes the target values explicit.","level":"deep","resources":[{"title":"Constitutional AI: Harmlessness from AI Feedback","url":"https://arxiv.org/abs/2212.08073","type":"paper","source":"arXiv","free":true}]},{"title":"Reward hacking and sycophancy","desc":"Models learn to exploit flaws in the reward signal, for example by flattering users or gaming tests. Spotting and mitigating this is a core alignment problem.","level":"deep","resources":[{"title":"Reward Hacking in Reinforcement Learning","url":"https://lilianweng.github.io/posts/2024-11-28-reward-hacking/","type":"article","source":"Lilian Weng","free":true}]},{"title":"Modern post-training recipes","desc":"Current pipelines combine SFT, preference tuning, and reinforcement learning with verifiable rewards (RLVR) for math and code, often using GRPO. Open recipes like Tulu 3 document the full process.","level":"deep","resources":[{"title":"Tulu 3: Pushing Frontiers in Open Language Model Post-Training","url":"https://arxiv.org/abs/2411.15124","type":"paper","source":"arXiv","free":true},{"title":"DeepSeekMath (introduces GRPO)","url":"https://arxiv.org/abs/2402.03300","type":"paper","source":"arXiv","free":true}]},{"title":"PPO in depth","desc":"Proximal Policy Optimization keeps each update small with a clipped objective. You only need its internals if you implement RL training yourself.","level":"optional","resources":[{"title":"Proximal Policy Optimization Algorithms","url":"https://arxiv.org/abs/1707.06347","type":"paper","source":"arXiv","free":true}]}]},{"id":"advanced-rag","title":"Advanced RAG Patterns","tier":4,"lane":"apps","prereqs":["vector-databases","chunking-retrieval"],"roles":{"aie":"c","mle":"r"},"summary":"Advanced RAG covers the patterns that go beyond 'embed, retrieve top-k, answer': rewriting queries, routing between sources, retrieving over knowledge graphs, letting an agent decide when and what to search, and evaluating the whole system rigorously.","why":"Simple RAG breaks on vague questions, multi-hop questions ('compare X across these three reports'), questions about a whole corpus, and data that lives in many places. These patterns fix specific failure modes, and evaluation tells you which ones are worth their cost.","depth":"Master query rewriting, agentic RAG with search as a tool, and component-level evaluation (retrieval metrics plus faithfulness and answer relevance). Know GraphRAG, Self-RAG, and CRAG well enough to recognize when a problem calls for them; most production systems don't need all of them.","hours":25,"outcomes":["You can diagnose RAG failures and pick the pattern that fixes each (rewriting, routing, graph retrieval, agentic search).","You can implement query rewriting, decomposition, and HyDE and measure whether they help.","You can build an agentic RAG loop where the model calls search tools, judges results, and searches again.","You can explain when GraphRAG is worth its indexing cost and build a small version.","You can run an end-to-end RAG evaluation with retrieval metrics, faithfulness, and answer relevance, using LLM judges you've checked against human labels."],"project":"Build a research assistant over a few hundred related documents (for example, a company's annual reports). Compare three versions on a 50-question test set that includes multi-hop and whole-corpus questions: tuned hybrid RAG, hybrid RAG with query decomposition, and an agentic RAG loop with search tools. Report retrieval recall, faithfulness, answer correctness, latency, and cost per question.","resources":[{"title":"Retrieval-Augmented Generation for Large Language Models: A Survey","url":"https://arxiv.org/abs/2312.10997","type":"paper","source":"arXiv","free":true},{"title":"Building Performant RAG Applications for Production","url":"https://developers.llamaindex.ai/python/framework/optimizing/production_rag/","type":"docs","source":"LlamaIndex","free":true},{"title":"Knowledge Graphs for RAG","url":"https://www.deeplearning.ai/courses/knowledge-graphs-rag","type":"course","source":"DeepLearning.AI","free":true},{"title":"Learn RAG From Scratch","url":"https://www.youtube.com/watch?v=sVcwVQRHIc8","type":"video","source":"freeCodeCamp / LangChain","free":true},{"title":"RAG Evaluation: Don't let customers tell you first","url":"https://www.pinecone.io/learn/series/rag/rag-evaluation/","type":"article","source":"Pinecone","free":true},{"title":"Ragas: Automated Evaluation of Retrieval Augmented Generation","url":"https://arxiv.org/abs/2309.15217","type":"paper","source":"arXiv","free":true},{"title":"Evaluating (LlamaIndex)","url":"https://developers.llamaindex.ai/python/framework/module_guides/evaluating/","type":"docs","source":"LlamaIndex","free":true}],"subtopics":[{"title":"Query rewriting and decomposition","desc":"Users ask vague or compound questions. An LLM can rewrite the query, expand it into several variants (multi-query), split it into sub-questions, or step back to a more general question before retrieval.","level":"core","resources":[{"title":"Query Rewriting for Retrieval-Augmented Large Language Models","url":"https://arxiv.org/abs/2305.14283","type":"paper","source":"arXiv","free":true},{"title":"Advanced RAG Techniques","url":"https://www.pinecone.io/learn/advanced-rag-techniques/","type":"article","source":"Pinecone","free":true}]},{"title":"HyDE and query-side tricks","desc":"HyDE has the model write a hypothetical answer and embeds that instead of the question, because answers look more like documents than questions do. Useful when queries are short and documents are long.","level":"deep","resources":[{"title":"Precise Zero-Shot Dense Retrieval without Relevance Labels (HyDE)","url":"https://arxiv.org/abs/2212.10496","type":"paper","source":"arXiv","free":true}]},{"title":"Agentic RAG","desc":"Instead of a fixed pipeline, give an agent search tools (vector, keyword, SQL, web) and let it decide what to search, read the results, and search again until it has enough. This is now the default for complex questions and research assistants.","level":"core","resources":[{"title":"Agentic Retrieval-Augmented Generation: A Survey on Agentic RAG","url":"https://arxiv.org/abs/2501.09136","type":"paper","source":"arXiv","free":true},{"title":"How we built our multi-agent research system","url":"https://www.anthropic.com/engineering/multi-agent-research-system","type":"article","source":"Anthropic","free":true}]},{"title":"GraphRAG and knowledge graphs","desc":"GraphRAG extracts entities and relationships into a graph, clusters them into communities, and summarizes each. It shines on 'global' questions about a whole corpus and on multi-hop links, but indexing is expensive.","level":"deep","resources":[{"title":"From Local to Global: A Graph RAG Approach","url":"https://arxiv.org/abs/2404.16130","type":"paper","source":"arXiv","free":true},{"title":"Microsoft GraphRAG docs","url":"https://microsoft.github.io/graphrag/","type":"docs","source":"Microsoft","free":true}]},{"title":"Self-correcting RAG (Self-RAG, CRAG)","desc":"These patterns grade retrieved documents and draft answers, then re-retrieve, fall back to web search, or revise when quality is low. You can implement the core idea with a simple grader step in an agent loop.","level":"deep","resources":[{"title":"Self-RAG","url":"https://arxiv.org/abs/2310.11511","type":"paper","source":"arXiv","free":true},{"title":"Corrective Retrieval Augmented Generation","url":"https://arxiv.org/abs/2401.15884","type":"paper","source":"arXiv","free":true}]},{"title":"RAG evaluation","desc":"Evaluate retrieval (recall@k, MRR) and generation separately. Generation metrics include faithfulness (is every claim supported by the context), answer relevance, and context precision. Use LLM-as-judge tools like Ragas, but validate the judge against your own labels.","level":"core","resources":[{"title":"Ragas: available metrics","url":"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/","type":"docs","source":"Ragas","free":true},{"title":"RAG Evaluation cookbook","url":"https://huggingface.co/learn/cookbook/rag_evaluation","type":"interactive","source":"Hugging Face","free":true}]},{"title":"Routing, multi-source, and structured data","desc":"Route questions to the right index or tool (docs, SQL database, API). Text-to-SQL, metadata extraction, and parent-child or small-to-big retrieval handle data that doesn't fit plain chunks.","level":"optional","resources":[{"title":"Building Performant RAG Applications for Production","url":"https://developers.llamaindex.ai/python/framework/optimizing/production_rag/","type":"docs","source":"LlamaIndex","free":true}]}]},{"id":"multi-agent","title":"Multi-agent Systems & Orchestration","tier":4,"lane":"agents","prereqs":["agent-frameworks"],"roles":{"aie":"r","rs":"a"},"summary":"Multi-agent systems split work across several LLM agents, such as an orchestrator that delegates to specialized subagents running in parallel. Orchestration is how you coordinate them: who decides, how context is shared, and how results are combined.","why":"For broad tasks like deep research or large codebases, parallel subagents with fresh context windows can cover more ground and finish faster than one agent. They also use many more tokens and fail in new ways, so you need to know when they are worth it.","depth":"Master the orchestrator-worker pattern, context sharing and handoffs, and the known failure modes. Know agent-to-agent protocols like A2A and emergent 'society of agents' research exist, but most real systems use one lead agent with subagents.","hours":15,"outcomes":["You can decide when multiple agents beat a single agent, considering parallelism, context limits, and token cost.","You can build an orchestrator that spawns subagents with clear task briefs and merges their results.","You can design how context and state are shared or isolated between agents.","You can diagnose common multi-agent failures like duplicated work, lost context, and agents contradicting each other."],"project":"Build a research system with a lead agent that breaks a question into 3 to 5 sub-questions, runs subagents in parallel with search tools, and writes a cited report. Compare it to a single agent on 10 questions for quality, wall-clock time, and total tokens.","resources":[{"title":"How we built our multi-agent research system","url":"https://www.anthropic.com/engineering/multi-agent-research-system","type":"article","source":"Anthropic","free":true},{"title":"Don't Build Multi-Agents","url":"https://cognition.com/blog/dont-build-multi-agents","type":"article","source":"Cognition","free":true},{"title":"Agent orchestration (OpenAI Agents SDK)","url":"https://openai.github.io/openai-agents-python/multi_agent/","type":"docs","source":"OpenAI","free":true},{"title":"Multi AI Agent Systems with crewAI","url":"https://www.deeplearning.ai/courses/multi-ai-agent-systems-with-crewai","type":"course","source":"DeepLearning.AI","free":true},{"title":"Why Do Multi-Agent LLM Systems Fail?","url":"https://arxiv.org/abs/2503.13657","type":"paper","source":"arXiv","free":true},{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true}],"subtopics":[{"title":"Orchestrator and subagents","desc":"A lead agent plans, writes detailed briefs, spawns subagents in parallel, and synthesizes their findings. Each subagent works in its own cont
