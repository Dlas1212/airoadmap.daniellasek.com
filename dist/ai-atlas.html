ext window, which acts as compression.","level":"core","resources":[{"title":"How we built our multi-agent research system","url":"https://www.anthropic.com/engineering/multi-agent-research-system","type":"article","source":"Anthropic","free":true}]},{"title":"When not to go multi-agent","desc":"Multi-agent setups can use several times more tokens and lose shared context. Tasks with tightly linked decisions, like most coding, often work better with a single agent that has full context.","level":"core","resources":[{"title":"Don't Build Multi-Agents","url":"https://cognition.com/blog/dont-build-multi-agents","type":"article","source":"Cognition","free":true}]},{"title":"Handoffs and routing","desc":"In a handoff, one agent passes the conversation to a specialist (for example from triage to billing). Routing and handoffs are common in customer support systems.","level":"core","resources":[{"title":"Handoffs","url":"https://openai.github.io/openai-agents-python/handoffs/","type":"docs","source":"OpenAI","free":true},{"title":"Multi-agent (LangChain)","url":"https://docs.langchain.com/oss/python/langchain/multi-agent","type":"docs","source":"LangChain","free":true}]},{"title":"Failure modes","desc":"Research catalogs failures such as poor task specs, agents ignoring each other, premature stopping, and weak verification. Most are design problems, fixable with better briefs and checks.","level":"deep","resources":[{"title":"Why Do Multi-Agent LLM Systems Fail?","url":"https://arxiv.org/abs/2503.13657","type":"paper","source":"arXiv","free":true}]},{"title":"Agent-to-agent protocols","desc":"A2A is an open protocol for agents built by different vendors to discover each other and exchange tasks. MCP connects agents to tools; A2A connects agents to agents.","level":"optional","resources":[{"title":"A2A Protocol","url":"https://a2a-protocol.org/latest/","type":"docs","source":"Linux Foundation","free":true}]},{"title":"Conversation-based multi-agent research","desc":"Frameworks like AutoGen explored agents that solve tasks by conversing. Good background for understanding the design space.","level":"optional","resources":[{"title":"AutoGen paper","url":"https://arxiv.org/abs/2308.08155","type":"paper","source":"arXiv","free":true}]}]},{"id":"computer-use","title":"Browser & Computer-Use Agents","tier":4,"lane":"agents","prereqs":["agents-fundamentals","mcp"],"roles":{"aie":"r","nc":"a"},"summary":"Computer-use and browser agents operate software the way people do: they look at screenshots or page structure, then click, type, and scroll. Browser agents focus on websites; computer-use agents can drive a whole desktop.","why":"Lots of work lives in apps with no API, like legacy systems, web portals, and internal tools. These agents can automate those tasks, and they're the basis of products like Claude in Chrome and ChatGPT agent. They are also slower, costlier, and riskier than API-based tools.","depth":"Master how the screenshot-action loop works, when to prefer an API, MCP, or DOM-based browser automation instead, and how to sandbox these agents safely. Just know the benchmarks (OSWorld, WebArena) and how vision-based actions are trained.","hours":12,"outcomes":["You can explain the screenshot, reason, act loop and the trade-off between vision-based and DOM-based control.","You can run a computer-use agent safely in a sandboxed VM or container.","You can build a browser automation that combines an LLM with Playwright or a browser-agent library.","You can identify and reduce risks like prompt injection from web pages and unintended actions."],"project":"In a Docker container or VM, build an agent that logs into a test web app, fills a multi-page form from data in a spreadsheet, and takes a screenshot of the confirmation. Implement it twice, once with pixel-based computer use and once with Playwright plus an LLM, and compare success rate, speed, and cost over 10 runs.","resources":[{"title":"Computer use tool","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool","type":"docs","source":"Anthropic","free":true},{"title":"Claude Quickstarts (computer use demo)","url":"https://github.com/anthropics/claude-quickstarts","type":"tool","source":"Anthropic","free":true},{"title":"Computer use (OpenAI)","url":"https://developers.openai.com/api/docs/guides/tools-computer-use","type":"docs","source":"OpenAI","free":true},{"title":"Developing a computer use model","url":"https://www.anthropic.com/news/developing-computer-use","type":"article","source":"Anthropic","free":true},{"title":"Playwright","url":"https://playwright.dev/","type":"tool","source":"Microsoft","free":true},{"title":"OSWorld: Benchmarking Multimodal Agents","url":"https://arxiv.org/abs/2404.07972","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"How computer use works","desc":"The model gets a screenshot, decides on an action (move mouse, click at x,y, type), the harness performs it, and a new screenshot comes back. Counting pixels and reading screens accurately were the hard parts to train.","level":"core","resources":[{"title":"Developing a computer use model","url":"https://www.anthropic.com/news/developing-computer-use","type":"article","source":"Anthropic","free":true},{"title":"Computer use tool","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool","type":"docs","source":"Anthropic","free":true}]},{"title":"Browser agents and DOM-based control","desc":"In a browser you can use the page's accessibility tree or DOM instead of pixels, which is faster and more reliable. Playwright, Playwright MCP, and browser-use are common building blocks.","level":"core","resources":[{"title":"Playwright MCP","url":"https://github.com/microsoft/playwright-mcp","type":"tool","source":"Microsoft","free":true},{"title":"browser-use","url":"https://github.com/browser-use/browser-use","type":"tool","source":"GitHub","free":true}]},{"title":"Choosing the right interface","desc":"Prefer an API or MCP server if one exists, then DOM-based browser control, then pixel-level computer use. Each step down is more general but slower and more fragile.","level":"core","resources":[]},{"title":"Safety and sandboxing","desc":"Run agents in an isolated VM or container with limited accounts. Web pages can contain prompt injections, so require confirmation before purchases, sending messages, or changing settings.","level":"core","resources":[{"title":"Piloting Claude in Chrome","url":"https://claude.com/resources/articles/claude-for-chrome","type":"article","source":"Anthropic","free":true}]},{"title":"Benchmarks","desc":"OSWorld tests real desktop tasks across apps; WebArena tests realistic websites. Scores rose fast through 2025 and 2026, but long, multi-app tasks are still error-prone.","level":"deep","resources":[{"title":"OSWorld","url":"https://arxiv.org/abs/2404.07972","type":"paper","source":"arXiv","free":true},{"title":"WebArena","url":"https://webarena.dev/","type":"tool","source":"WebArena","free":true}]},{"title":"Hosted browser infrastructure","desc":"Services run headless browsers at scale with sessions, proxies, and recordings, so you don't have to manage browser fleets yourself.","level":"optional","resources":[{"title":"Browserbase","url":"https://www.browserbase.com/","type":"tool","source":"Browserbase","free":false}]}]},{"id":"llm-inference","title":"Inference Optimization","tier":4,"lane":"ops","prereqs":["open-models","transformers"],"roles":{"aie":"r","mle":"c","rs":"r"},"summary":"Inference optimization is making a model generate tokens faster, cheaper, and for more users at once on the same hardware. It covers how serving engines manage GPU memory, batch requests, compress weights, and cut wasted work.","why":"Inference is where most of the money goes once a model is in use. If you self-host open models, the right engine and settings can mean several times more throughput per GPU, or a model that fits on hardware you can afford.","depth":"Master the mental model: prefill vs decode, why decoding is memory-bandwidth bound, the KV cache, and the latency vs throughput trade-off. Be able to run and tune vLLM or SGLang. Writing custom CUDA kernels is specialist work; know that FlashAttention and similar kernels exist and what they fix.","hours":35,"outcomes":["You can explain prefill vs decode and why token generation is limited by memory bandwidth, not compute.","You can estimate KV cache memory for a model and context length, and how many users a GPU can hold.","You can serve an open model with vLLM or SGLang and benchmark time to first token, tokens per second, and throughput.","You can choose a quantization format and measure its effect on quality and speed.","You can decide when to use tensor parallelism, prefix caching, or speculative decoding."],"project":"Rent a single GPU and serve an 8B open model with vLLM. Write a load-test script that measures TTFT, tokens per second, and throughput at 1, 8, and 32 concurrent users. Then compare FP16 vs an AWQ or FP8 quantized version and turn prefix caching on and off with a long shared system prompt. Write up the numbers and a quick quality check on 20 eval questions.","resources":[{"title":"vLLM documentation","url":"https://docs.vllm.ai/en/latest/","type":"docs","source":"vLLM","free":true},{"title":"Mastering LLM Techniques: Inference Optimization","url":"https://developer.nvidia.com/blog/mastering-llm-techniques-inference-optimization/","type":"article","source":"NVIDIA","free":true},{"title":"Large Transformer Model Inference Optimization","url":"https://lilianweng.github.io/posts/2023-01-10-inference-optimization/","type":"article","source":"Lilian Weng","free":true},{"title":"Efficiently Serving LLMs","url":"https://www.deeplearning.ai/courses/efficiently-serving-llms","type":"course","source":"DeepLearning.AI","free":true},{"title":"How To Scale Your Model (Inference chapters)","url":"https://jax-ml.github.io/scaling-book/","type":"book","source":"Google DeepMind","free":true},{"title":"AI Engineering (Ch. 9: Inference Optimization)","url":"https://www.oreilly.com/library/view/ai-engineering/9781098166298/","type":"book","source":"Chip Huyen / O'Reilly","free":false}],"subtopics":[{"title":"The inference mental model","desc":"Prefill processes the whole prompt in parallel and is compute heavy. Decode generates one token at a time and is limited by how fast weights move from GPU memory. Key metrics are time to first token (TTFT), time per output token (TPOT), and total throughput.","level":"core","resources":[{"title":"Transformer Inference Arithmetic","url":"https://kipp.ly/p/transformer-inference-arithmetic","type":"article","source":"kipply","free":true},{"title":"LLM Inference Performance Engineering: Best Practices","url":"https://www.databricks.com/blog/llm-inference-performance-engineering-best-practices","type":"article","source":"Databricks","free":true}]},{"title":"KV cache and PagedAttention","desc":"The KV cache stores attention keys and values for past tokens so they aren't recomputed. It grows with context length and batch size and often limits how many users fit on a GPU. PagedAttention (vLLM) manages it in fixed-size blocks to cut waste.","level":"core","resources":[{"title":"Efficient Memory Management for LLM Serving with PagedAttention","url":"https://arxiv.org/abs/2309.06180","type":"paper","source":"arXiv","free":true}]},{"title":"Continuous batching","desc":"Instead of waiting for a whole batch to finish, the server adds and removes requests every decoding step. This keeps the GPU busy and is the single biggest throughput win in modern serving engines.","level":"core","resources":[{"title":"Achieve 23x LLM Inference Throughput & Reduce p50 Latency","url":"https://www.anyscale.com/blog/continuous-batching-llm-inference","type":"article","source":"Anyscale","free":true}]},{"title":"Quantization","desc":"Store weights (and sometimes activations or the KV cache) in fewer bits, such as FP8, INT8, or 4-bit formats like AWQ and GPTQ. Less memory means bigger batches and cheaper GPUs. Always measure quality on your own evals after quantizing.","level":"core","resources":[{"title":"Quantization (vLLM docs)","url":"https://docs.vllm.ai/en/latest/features/quantization/index.html","type":"docs","source":"vLLM","free":true},{"title":"AWQ: Activation-aware Weight Quantization","url":"https://arxiv.org/abs/2306.00978","type":"paper","source":"arXiv","free":true}]},{"title":"Prefix caching and speculative decoding","desc":"Prefix caching reuses the KV cache when many requests share the same system prompt or documents. Speculative decoding has a small draft model guess several tokens that the big model verifies in one pass, cutting latency without changing outputs.","level":"deep","resources":[{"title":"Automatic Prefix Caching","url":"https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/","type":"docs","source":"vLLM","free":true},{"title":"Fast Inference from Transformers via Speculative Decoding","url":"https://arxiv.org/abs/2211.17192","type":"paper","source":"arXiv","free":true}]},{"title":"Attention kernels and multi-GPU serving","desc":"FlashAttention reorders the attention computation to avoid slow memory reads. Models too big for one GPU are split with tensor or pipeline parallelism. Some systems also split prefill and decode onto different GPUs (disaggregated serving).","level":"deep","resources":[{"title":"FlashAttention","url":"https://arxiv.org/abs/2205.14135","type":"paper","source":"arXiv","free":true},{"title":"Parallelism and Scaling","url":"https://docs.vllm.ai/en/latest/serving/parallelism_scaling/","type":"docs","source":"vLLM","free":true}]},{"title":"Choosing a serving engine","desc":"vLLM and SGLang are the main open-source engines for GPU serving, with TensorRT-LLM for NVIDIA-tuned setups and llama.cpp for CPUs and laptops. Hugging Face TGI is now in maintenance mode, and Hugging Face points users to vLLM and SGLang for new deployments.","level":"optional","resources":[{"title":"SGLang documentation","url":"https://docs.sglang.io/","type":"docs","source":"SGLang","free":true},{"title":"text-generation-inference (GitHub)","url":"https://github.com/huggingface/text-generation-inference","type":"tool","source":"Hugging Face","free":true}]}]},{"id":"llmops","title":"LLMOps at Scale: Cost, Latency, Routing","tier":4,"lane":"ops","prereqs":["observability","llm-evals"],"roles":{"aie":"c","mle":"r"},"summary":"LLMOps at scale is running LLM features in production for many users without blowing the budget or the latency target. It covers model routing, caching, rate limits, fallbacks, guardrails, prompt versioning, and the gateway layer that ties it together.","why":"Once usage grows, LLM bills and tail latency become real business problems, and provider outages become your outages. Teams that route easy requests to small models, cache aggressively, and fail over gracefully often cut costs by half or more.","depth":"Master cost and latency levers (model choice, prompt caching, batching, output length), routing with fallbacks, and treating prompts as versioned, eval-gated artifacts. Learned routers and semantic caches are worth knowing about; apply them only after the basics are in place and measured.","hours":25,"outcomes":["You can break down cost per request and per user, and name the top three levers to reduce it.","You can put an LLM gateway in front of several providers with retries, fallbacks, and rate limiting.","You can route requests between a small and a large model and prove with evals that quality held.","You can use provider prompt caching and batch APIs to cut cost on suitable workloads.","You can version prompts and roll out a change behind an eval gate and a canary."],"project":"Take an existing LLM app with tracing and evals. Put LiteLLM in front of it with a fallback provider. Add a simple router that sends short or simple requests to a small model, enable prompt caching on your system prompt, and move one offline job to a batch API. Report cost per request, p95 latency, and eval score before and after.","resources":[{"title":"Building A Generative AI Platform","url":"https://huyenchip.com/2024/07/25/genai-platform.html","type":"article","source":"Chip Huyen","free":true},{"title":"What We've Learned From A Year of Building with LLMs","url":"https://applied-llms.org/","type":"article","source":"Applied LLMs","free":true},{"title":"AI Engineering (Ch. 9 and 10)","url":"https://www.oreilly.com/library/view/ai-engineering/9781098166298/","type":"book","source":"Chip Huyen / O'Reilly","free":false},{"title":"Prompt caching","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching","type":"docs","source":"Anthropic","free":true},{"title":"Latency optimization","url":"https://developers.openai.com/api/docs/guides/latency-optimization","type":"docs","source":"OpenAI","free":true},{"title":"LLMOps (LLM Bootcamp)","url":"https://fullstackdeeplearning.com/llm-bootcamp/spring-2023/llmops/","type":"video","source":"Full Stack Deep Learning","free":true},{"title":"RouteLLM: Learning to Route LLMs with Preference Data","url":"https://arxiv.org/abs/2406.18665","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"Cost anatomy and budgeting","desc":"Cost is roughly input tokens times input price plus output tokens times output price, multiplied by calls per task. Agents and long contexts multiply this fast. Track cost per feature and per user, and set budgets and alerts.","level":"core","resources":[{"title":"Building A Generative AI Platform","url":"https://huyenchip.com/2024/07/25/genai-platform.html","type":"article","source":"Chip Huyen","free":true}]},{"title":"Latency engineering","desc":"Stream tokens, shorten outputs, run independent calls in parallel, pick smaller models for simple steps, and keep prompts stable so they cache. Measure p95, not just averages, since slow tails are what users notice.","level":"core","resources":[{"title":"Latency optimization","url":"https://developers.openai.com/api/docs/guides/latency-optimization","type":"docs","source":"OpenAI","free":true},{"title":"Reducing latency","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency","type":"docs","source":"Anthropic","free":true}]},{"title":"Caching and batch APIs","desc":"Provider prompt caching makes repeated prefixes (system prompts, documents, tool definitions) much cheaper and faster. Batch APIs process non-urgent jobs at a discount. Response caching helps when identical requests repeat.","level":"core","resources":[{"title":"Prompt caching","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching","type":"docs","source":"Anthropic","free":true},{"title":"Batch API","url":"https://developers.openai.com/api/docs/guides/batch","type":"docs","source":"OpenAI","free":true}]},{"title":"Model routing and cascades","desc":"Send easy requests to a cheap model and hard ones to a strong model. A router can be rules, a classifier, or a cascade that escalates when the cheap model is unsure. Always validate routing with evals, not intuition.","level":"deep","resources":[{"title":"RouteLLM: Learning to Route LLMs with Preference Data","url":"https://arxiv.org/abs/2406.18665","type":"paper","source":"arXiv","free":true},{"title":"FrugalGPT","url":"https://arxiv.org/abs/2305.05176","type":"paper","source":"arXiv","free":true}]},{"title":"Gateways, rate limits, and fallbacks","desc":"An LLM gateway gives you one API over many providers, plus retries with backoff, fallbacks when a provider is down or rate-limited, per-team keys, and spend tracking. Know your provider's rate limit tiers before launch day.","level":"core","resources":[{"title":"LiteLLM: Getting Started","url":"https://docs.litellm.ai/docs/","type":"tool","source":"LiteLLM","free":true},{"title":"Rate limits","url":"https://platform.claude.com/docs/en/api/rate-limits","type":"docs","source":"Anthropic","free":true}]},{"title":"Prompt and model versioning","desc":"Treat prompts, model IDs, and tool definitions as versioned config. Every change runs through your eval suite, ships behind a flag or canary, and can be rolled back. Pin model versions so a provider update doesn't surprise you.","level":"core","resources":[{"title":"Automated Testing for LLMOps","url":"https://www.deeplearning.ai/courses/automated-testing-llmops","type":"course","source":"DeepLearning.AI","free":true}]},{"title":"Self-host vs API economics","desc":"APIs win at low or spiky volume. Self-hosting open models can win at high, steady volume or when data must stay in-house, but you pay for GPUs, engineers, and idle time. Run the numbers with real traffic before switching.","level":"optional","resources":[{"title":"LLMOps (LLM Bootcamp)","url":"https://fullstackdeeplearning.com/llm-bootcamp/spring-2023/llmops/","type":"video","source":"Full Stack Deep Learning","free":true}]}]},{"id":"distributed-training","title":"Distributed Training & GPUs","tier":4,"lane":"ops","prereqs":["dl-training"],"roles":{"mle":"r","rs":"r"},"summary":"Distributed training spreads one training job across many GPUs, and often many machines, so you can train bigger models or train faster. It combines GPU performance basics with parallelism strategies like data, tensor, and pipeline parallelism, and sharded optimizers like ZeRO and FSDP.","why":"Any model beyond a few billion parameters cannot be trained or even fine-tuned fully on one GPU. Knowing how parallelism works lets you pick the right setup, avoid out-of-memory errors, and stop wasting expensive GPU hours.","depth":"Master why training runs out of memory (weights, gradients, optimizer state, activations), mixed precision, gradient accumulation and checkpointing, and running DDP and FSDP in PyTorch. Know how tensor, pipeline, and context parallelism work conceptually; implementing them from scratch is for people building training frameworks.","hours":45,"outcomes":["You can estimate how much GPU memory a training run needs and explain where it goes.","You can use mixed precision, gradient accumulation, and activation checkpointing to fit a larger model or batch.","You can launch a multi-GPU job with PyTorch DDP and FSDP (or Accelerate/DeepSpeed) and verify it scales.","You can explain data, tensor, pipeline, and sequence parallelism and when each one is used.","You can profile a training step and tell whether it is compute, memory, or communication bound."],"project":"Take a small GPT-style training script (such as nanoGPT) and run it on one GPU, then on 2 to 4 GPUs with DDP, then with FSDP. Add BF16 mixed precision and activation checkpointing. For each setup, record peak memory, tokens per second, and scaling efficiency, and use the PyTorch profiler to find where time goes in one training step.","resources":[{"title":"The Ultra-Scale Playbook: Training LLMs on GPU Clusters","url":"https://huggingface.co/spaces/nanotron/ultrascale-playbook","type":"book","source":"Hugging Face","free":true},{"title":"How To Scale Your Model","url":"https://jax-ml.github.io/scaling-book/","type":"book","source":"Google DeepMind","free":true},{"title":"PyTorch Distributed Overview","url":"https://docs.pytorch.org/tutorials/beginner/dist_overview.html","type":"docs","source":"PyTorch","free":true},{"title":"Making Deep Learning Go Brrrr From First Principles","url":"https://horace.io/brrr_intro.html","type":"article","source":"Horace He","free":true},{"title":"Machine Learning Engineering Open Book","url":"https://github.com/stas00/ml-engineering","type":"book","source":"Stas Bekman","free":true},{"title":"GPU MODE lectures","url":"https://www.youtube.com/@GPUMODE","type":"video","source":"GPU MODE","free":true},{"title":"Zero Redundancy Optimizer (ZeRO) tutorial","url":"https://www.deepspeed.ai/tutorials/zero/","type":"docs","source":"DeepSpeed","free":true}],"subtopics":[{"title":"GPU fundamentals and performance","desc":"Learn what a GPU is good at, the difference between compute-bound and memory-bound work, why tensor cores need the right shapes and dtypes, and how to read a profiler trace.","level":"core","resources":[{"title":"Making Deep Learning Go Brrrr From First Principles","url":"https://horace.io/brrr_intro.html","type":"article","source":"Horace He","free":true},{"title":"GPU Glossary","url":"https://modal.com/gpu-glossary","type":"docs","source":"Modal","free":true}]},{"title":"Memory budget and single-GPU tricks","desc":"Training memory is weights plus gradients plus optimizer state plus activations. Mixed precision (BF16), gradient accumulation, and activation checkpointing are the first tools to reach for before adding GPUs.","level":"core","resources":[{"title":"Automatic Mixed Precision (torch.amp)","url":"https://docs.pytorch.org/docs/stable/amp.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Data parallelism with DDP","desc":"Every GPU holds a full copy of the model and processes a different slice of the batch, then gradients are averaged with an all-reduce. This is the simplest and most common way to scale.","level":"core","resources":[{"title":"Getting Started with Distributed Data Parallel","url":"https://docs.pytorch.org/tutorials/intermediate/ddp_tutorial.html","type":"docs","source":"PyTorch","free":true},{"title":"PyTorch Distributed Overview","url":"https://docs.pytorch.org/tutorials/beginner/dist_overview.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Sharding: ZeRO and FSDP","desc":"Instead of each GPU keeping a full copy of optimizer state, gradients, and weights, shard them across GPUs and gather pieces only when needed. This is how most teams fine-tune and train models that don't fit on one GPU.","level":"core","resources":[{"title":"Getting Started with Fully Sharded Data Parallel (FSDP2)","url":"https://docs.pytorch.org/tutorials/intermediate/FSDP_tutorial.html","type":"docs","source":"PyTorch","free":true},{"title":"ZeRO: Memory Optimizations Toward Training Trillion Parameter Models","url":"https://arxiv.org/abs/1910.02054","type":"paper","source":"arXiv","free":true}]},{"title":"Tensor, pipeline, and context parallelism","desc":"Tensor parallelism splits individual matrix multiplies across GPUs. Pipeline parallelism puts different layers on different GPUs. Context (sequence) parallelism splits long sequences. Large runs combine them all, which is called 3D or 4D parallelism.","level":"deep","resources":[{"title":"Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism","url":"https://arxiv.org/abs/1909.08053","type":"paper","source":"arXiv","free":true},{"title":"How to Train Really Large Models on Many GPUs?","url":"https://lilianweng.github.io/posts/2021-09-25-train-large/","type":"article","source":"Lilian Weng","free":true}]},{"title":"Communication and networking","desc":"Collectives like all-reduce, all-gather, and reduce-scatter move tensors between GPUs over NVLink inside a node and InfiniBand or Ethernet between nodes. At scale, communication overlap often decides whether adding GPUs helps.","level":"deep","resources":[{"title":"NCCL overview","url":"https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html","type":"docs","source":"NVIDIA","free":true}]},{"title":"Running real clusters","desc":"Large jobs need checkpointing so a crashed node doesn't lose days of work, schedulers like Slurm or Kubernetes, and monitoring for hardware failures and loss spikes. This is mostly operational know-how.","level":"optional","resources":[{"title":"Machine Learning Engineering Open Book","url":"https://github.com/stas00/ml-engineering","type":"book","source":"Stas Bekman","free":true},{"title":"torchtitan","url":"https://github.com/pytorch/torchtitan","type":"tool","source":"PyTorch","free":true}]}]},{"id":"interpretability","title":"Mechanistic Interpretability","tier":5,"lane":"safety","prereqs":["transformers","reading-papers"],"roles":{"rs":"r"},"summary":"Mechanistic interpretability tries to reverse-engineer neural networks: find the features a model represents and the circuits that connect them, so we can understand how it actually computes an answer.","why":"If we can read what a model is doing inside, we can catch deception, debug failures, and verify safety in ways that testing outputs alone can't. It is one of the most active research areas in AI safety.","depth":"This is research-level work. Research scientists in the field must master transformer internals, the residual stream view, superposition, sparse autoencoders, and attribution methods, and be able to run experiments in TransformerLens or nnsight. Everyone else only needs the big idea: models store many concepts as directions in activation space, and we can now find and steer some of them.","hours":80,"outcomes":["You can explain the residual stream, attention heads as information movers, and why superposition makes neurons hard to read.","You can train or load a sparse autoencoder and inspect the features it finds.","You can run activation patching to find which components cause a behavior.","You can reproduce a known circuit (such as induction heads) in a small model.","You can read current circuit-tracing papers and name their limitations."],"project":"Using TransformerLens on GPT-2 small, find the induction heads: show their attention pattern on repeated random tokens, then ablate them and measure the loss jump on the repeated half. Next, explore features for a concept of your choice on Neuronpedia and write a short post on what you found and what you couldn't explain.","resources":[{"title":"ARENA (Chapter 1: Transformer Interpretability)","url":"https://www.arena.education/","type":"course","source":"ARENA","free":true},{"title":"How To Become A Mechanistic Interpretability Researcher","url":"https://www.alignmentforum.org/posts/jP9KDyMkchuv6tHwm/how-to-become-a-mechanistic-interpretability-researcher","type":"article","source":"Neel Nanda","free":true},{"title":"Transformer Circuits Thread","url":"https://transformer-circuits.pub/","type":"paper","source":"Anthropic","free":true},{"title":"On the Biology of a Large Language Model","url":"https://transformer-circuits.pub/2025/attribution-graphs/biology.html","type":"paper","source":"Anthropic","free":true},{"title":"TransformerLens","url":"https://github.com/TransformerLensOrg/TransformerLens","type":"tool","source":"GitHub","free":true},{"title":"Neuronpedia","url":"https://www.neuronpedia.org/","type":"interactive","source":"Neuronpedia","free":true},{"title":"Tracing the thoughts of a large language model","url":"https://www.anthropic.com/research/tracing-thoughts-language-model","type":"article","source":"Anthropic","free":true}],"subtopics":[{"title":"The transformer circuits view","desc":"Think of a transformer as a residual stream that attention heads and MLPs read from and write to. This framing makes it possible to trace how information flows.","level":"core","resources":[{"title":"A Mathematical Framework for Transformer Circuits","url":"https://transformer-circuits.pub/2021/framework/index.html","type":"paper","source":"Anthropic","free":true}]},{"title":"Features and superposition","desc":"Models represent more concepts than they have neurons by packing them into overlapping directions. This is why single neurons often look like a mix of unrelated things.","level":"core","resources":[{"title":"Toy Models of Superposition","url":"https://transformer-circuits.pub/2022/toy_model/index.html","type":"paper","source":"Anthropic","free":true}]},{"title":"Sparse autoencoders and dictionary learning","desc":"A sparse autoencoder learns to rewrite activations as a sparse mix of features, many of which match human-readable concepts. This has been scaled to production models.","level":"core","resources":[{"title":"Towards Monosemanticity","url":"https://transformer-circuits.pub/2023/monosemantic-features","type":"paper","source":"Anthropic","free":true},{"title":"Scaling Monosemanticity","url":"https://transformer-circuits.pub/2024/scaling-monosemanticity/","type":"paper","source":"Anthropic","free":true}]},{"title":"Causal methods: patching and circuit tracing","desc":"Activation patching swaps internal activations between runs to see what changes the output. Attribution graphs trace step-by-step how features combine to produce an answer.","level":"deep","resources":[{"title":"Circuit Tracing: Revealing Computational Graphs in Language Models","url":"https://transformer-circuits.pub/2025/attribution-graphs/methods.html","type":"paper","source":"Anthropic","free":true},{"title":"circuit-tracer","url":"https://github.com/decoderesearch/circuit-tracer","type":"tool","source":"GitHub","free":true}]},{"title":"Probing and steering","desc":"Linear probes test whether a concept is readable from activations. Steering adds a direction to the activations to push behavior, for example toward honesty or a topic.","level":"deep","resources":[{"title":"Representation Engineering","url":"https://arxiv.org/abs/2310.01405","type":"paper","source":"arXiv","free":true},{"title":"Steering Language Models With Activation Engineering","url":"https://arxiv.org/abs/2308.10248","type":"paper","source":"arXiv","free":true}]},{"title":"Open problems and critiques","desc":"Features found by SAEs are incomplete, explanations may not be faithful, and it is unclear how well current methods scale to safety guarantees. Know the debate before you pick a project.","level":"optional","resources":[{"title":"Open Problems in Mechanistic Interpretability","url":"https://arxiv.org/abs/2501.16496","type":"paper","source":"arXiv","free":true}]}]},{"id":"alignment-research","title":"AI Alignment Research","tier":5,"lane":"safety","prereqs":["rlhf","interpretability"],"roles":{"rs":"r"},"summary":"Alignment research asks how to make AI systems reliably pursue what their developers and users actually intend, even as systems become more capable than the people overseeing them.","why":"Current training methods produce models that mostly behave well, but studies already show reward hacking, sycophancy, and models that act differently when they think they're being watched. These problems get harder as models become more autonomous.","depth":"This is research-level work for research scientists. Master the core problems (specification gaming, reward hacking, deceptive alignment, scalable oversight) and the main empirical methods (model organisms, control evaluations, CoT monitoring). You don't need to master every agenda. Pick one area and go deep after reading broadly.","hours":100,"outcomes":["You can explain outer vs inner alignment, specification gaming, and reward hacking with real examples.","You can describe the main research agendas: scalable oversight, interpretability, AI control, model organisms, and evaluation.","You can read and critique a recent alignment paper, including its threat model and what the result does and doesn't show.","You can design a small empirical experiment that tests an alignment hypothesis on an open model."],"project":"Replicate a small model-organism result on an open-weight model. For example, fine-tune a small model on a narrow bad behavior and measure whether it generalizes to unrelated prompts, or build a simple reward-hacking environment and show the model exploiting it. Write it up with your threat model, method, results, and what would change your conclusion.","resources":[{"title":"BlueDot Impact AI safety courses","url":"https://bluedot.org/courses","type":"course","source":"BlueDot Impact","free":true},{"title":"Concrete Problems in AI Safety","url":"https://arxiv.org/abs/1606.06565","type":"paper","source":"arXiv","free":true},{"title":"Alignment Science Blog","url":"https://alignment.anthropic.com/","type":"article","source":"Anthropic","free":true},{"title":"AI Safety, Ethics, and Society","url":"https://www.aisafetybook.com/","type":"book","source":"Center for AI Safety","free":true},{"title":"ARENA","url":"https://www.arena.education/","type":"course","source":"ARENA","free":true},{"title":"AI Alignment Forum","url":"https://www.alignmentforum.org/","type":"article","source":"Alignment Forum","free":true},{"title":"MATS research program","url":"https://www.matsprogram.org/","type":"course","source":"MATS","free":true}],"subtopics":[{"title":"Core problems: specification gaming and reward hacking","desc":"Models optimize the objective you wrote, not the one you meant. This shows up as agents exploiting bugs in environments and LLMs gaming tests or graders.","level":"core","resources":[{"title":"Specification gaming: the flip side of AI ingenuity","url":"https://deepmind.google/blog/specification-gaming-the-flip-side-of-ai-ingenuity/","type":"article","source":"Google DeepMind","free":true},{"title":"Reward Hacking in Reinforcement Learning","url":"https://lilianweng.github.io/posts/2024-11-28-reward-hacking/","type":"article","source":"Lilian Weng","free":true}]},{"title":"Scalable oversight","desc":"How do humans supervise a model that knows more than they do? Ideas include debate, AI-assisted feedback, constitutional methods, and weak-to-strong generalization.","level":"core","resources":[{"title":"Weak-to-Strong Generalization","url":"https://arxiv.org/abs/2312.09390","type":"paper","source":"arXiv (OpenAI)","free":true},{"title":"Constitutional AI","url":"https://arxiv.org/abs/2212.08073","type":"paper","source":"arXiv (Anthropic)","free":true}]},{"title":"Deception and model organisms","desc":"Researchers build models with known bad behaviors to study whether safety training removes them. Results show some behaviors persist and models can fake alignment during training.","level":"core","resources":[{"title":"Alignment faking in large language models","url":"https://www.anthropic.com/research/alignment-faking","type":"article","source":"Anthropic","free":true},{"title":"Sleeper Agents","url":"https://arxiv.org/abs/2401.05566","type":"paper","source":"arXiv (Anthropic)","free":true}]},{"title":"AI control","desc":"Assume the model might be misaligned and design protocols (monitoring, trusted editing, limited permissions) that stay safe anyway. This is measured with red-team vs blue-team evaluations.","level":"deep","resources":[{"title":"AI Control: Improving Safety Despite Intentional Subversion","url":"https://arxiv.org/abs/2312.06942","type":"paper","source":"arXiv","free":true}]},{"title":"Chain-of-thought monitoring","desc":"Reasoning models think in readable text, which gives a chance to spot bad intent. That chance is fragile, because training pressure can make reasoning less faithful or less readable.","level":"deep","resources":[{"title":"Chain of Thought Monitorability","url":"https://arxiv.org/abs/2507.11473","type":"paper","source":"arXiv","free":true}]},{"title":"Generalization surprises","desc":"Narrow training can have broad effects. Fine-tuning on insecure code, for example, has made models misaligned in unrelated chats. Understanding why is an open question.","level":"optional","resources":[{"title":"Emergent Misalignment","url":"https://arxiv.org/abs/2502.17424","type":"paper","source":"arXiv","free":true}]}]},{"id":"multimodal-models","title":"Multimodal Model Architectures","tier":5,"lane":"dl","prereqs":["transformers","diffusion"],"roles":{"rs":"r","mle":"a"},"summary":"Multimodal models take in and produce more than one kind of data, such as text, images, audio, and video. Architectures range from gluing a vision encoder onto an LLM to natively multimodal models trained on mixed token streams from the start.","why":"Frontier assistants now see screenshots, read documents, hear speech, and generate images. Knowing how the pieces connect explains their strengths and blind spots, and it is where much current research and product work happens.","depth":"Must master: contrastive image-text training (CLIP), the encoder-plus-projector-plus-LLM recipe, and the difference between late fusion and early fusion. Just know the details of audio tokenizers, real-time speech models, and unified generation models unless you research them.","hours":35,"outcomes":["You can explain how CLIP aligns images and text in a shared embedding space.","You can sketch how a vision-language model turns image patches into tokens an LLM can attend to.","You can compare adapter-style, early-fusion, and unified understanding-plus-generation architectures.","You can read a recent multimodal model report and identify its encoders, connector, data mix, and training stages."],"project":"Build a tiny vision-language model: freeze a pretrained SigLIP or CLIP image encoder and a small open LLM, train only a projection layer (then optionally LoRA) on an image-caption dataset, and evaluate how well it captions and answers simple questions about held-out images.","resources":[{"title":"Multimodality and Large Multimodal Models (LMMs)","url":"https://huyenchip.com/2023/10/10/multimodal.html","type":"article","source":"Chip Huyen","free":true},{"title":"Understanding Multimodal LLMs","url":"https://magazine.sebastianraschka.com/p/understanding-multimodal-llms","type":"article","source":"Sebastian Raschka","free":true},{"title":"Generalized Visual Language Models","url":"https://lilianweng.github.io/posts/2022-06-09-vlm/","type":"article","source":"Lilian Weng","free":true},{"title":"Vision Language Models Explained","url":"https://huggingface.co/blog/vlms","type":"article","source":"Hugging Face","free":true},{"title":"Learning Transferable Visual Models From Natural Language Supervision (CLIP)","url":"https://arxiv.org/abs/2103.00020","type":"paper","source":"arXiv","free":true},{"title":"Visual Instruction Tuning (LLaVA)","url":"https://arxiv.org/abs/2304.08485","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"Contrastive pretraining (CLIP, SigLIP)","desc":"Train an image encoder and a text encoder so matching pairs land close together in embedding space. These encoders power zero-shot classification, search, and the vision side of many VLMs.","level":"core","resources":[{"title":"Learning Transferable Visual Models From Natural Language Supervision","url":"https://arxiv.org/abs/2103.00020","type":"paper","source":"arXiv","free":true},{"title":"Sigmoid Loss for Language Image Pre-Training","url":"https://arxiv.org/abs/2303.15343","type":"paper","source":"arXiv","free":true}]},{"title":"Vision-language models with adapters","desc":"Take a pretrained vision encoder, project its outputs into the LLM's embedding space, and train on image-text instruction data. LLaVA made this recipe simple and popular.","level":"core","resources":[{"title":"Visual Instruction Tuning (LLaVA)","url":"https://arxiv.org/abs/2304.08485","type":"paper","source":"arXiv","free":true},{"title":"Understanding Multimodal LLMs","url":"https://magazine.sebastianraschka.com/p/understanding-multimodal-llms","type":"article","source":"Sebastian Raschka","free":true}]},{"title":"Cross-attention and resampler designs","desc":"Instead of feeding image tokens straight in, some models let the LLM attend to visual features through extra cross-attention layers. Flamingo and BLIP-2 are the reference designs.","level":"deep","resources":[{"title":"Flamingo: a Visual Language Model for Few-Shot Learning","url":"https://arxiv.org/abs/2204.14198","type":"paper","source":"arXiv","free":true},{"title":"BLIP-2","url":"https://arxiv.org/abs/2301.12597","type":"paper","source":"arXiv","free":true}]},{"title":"Early fusion and unified generation","desc":"Natively multimodal models train on interleaved text and image tokens from the start, and some can generate images as well as read them. Chameleon and Transfusion show two approaches: discrete image tokens versus mixing next-token prediction with diffusion.","level":"deep","resources":[{"title":"Chameleon: Mixed-Modal Early-Fusion Foundation Models","url":"https://arxiv.org/abs/2405.09818","type":"paper","source":"arXiv","free":true},{"title":"Transfusion","url":"https://arxiv.org/abs/2408.11039","type":"paper","source":"arXiv","free":true}]},{"title":"Speech and audio","desc":"Whisper showed that large-scale weakly supervised training makes robust speech recognition. Newer speech-to-speech models handle listening and talking in real time with audio tokens.","level":"optional","resources":[{"title":"Robust Speech Recognition via Large-Scale Weak Supervision (Whisper)","url":"https://arxiv.org/abs/2212.04356","type":"paper","source":"arXiv","free":true},{"title":"Moshi: a speech-text foundation model for real-time dialogue","url":"https://arxiv.org/abs/2410.00037","type":"paper","source":"arXiv","free":true}]},{"title":"Multimodal data and evaluation","desc":"Data quality (captions, interleaved documents, OCR-heavy images) often matters more than architecture. Benchmarks for charts, documents, and video reasoning reveal where models still fail.","level":"optional","resources":[{"title":"Vision Language Models (Better, Faster, Stronger)","url":"https://huggingface.co/blog/vlms-2025","type":"article","source":"Hugging Face","free":true}]}]},{"id":"world-models","title":"World Models & Embodied AI","tier":5,"lane":"dl","prereqs":["multimodal-models"],"roles":{"rs":"a"},"summary":"A world model is a learned simulator: given the current state and an action, it predicts what happens next. Embodied AI puts such models, plus vision-language-action policies, into robots and agents that act in physical or virtual worlds.","why":"Many researchers see world models as a path past text-only intelligence, toward agents that plan, imagine consequences, and handle the physical world. Interactive video generators and robot foundation models made this an active frontier in 2025 and 2026.","depth":"This is frontier research. Must understand: the core idea of learning dynamics and planning inside a model, the difference between generative (pixel-predicting) and latent (JEPA-style) world models, and how vision-language-action models work. Just follow the rest through papers and lab blogs.","hours":50,"outcomes":["You can explain what a world model is and how an agent can learn or plan inside one.","You can compare pixel-level generative world models with latent predictive approaches like JEPA.","You can describe how vision-language-action models turn camera input and instructions into robot actions.","You can read a current world-model or robotics paper and identify its data, model, and evaluation setup."],"project":"Reproduce a mini world model: collect rollouts from a simple Gymnasium environment (like CarRacing or a grid world), train a VAE plus a recurrent dynamics model on them, and train a small controller entirely inside the learned model. Then test it in the real environment and note where the dream and reality diverge.","resources":[{"title":"World Models (interactive paper)","url":"https://worldmodels.github.io/","type":"interactive","source":"Ha & Schmidhuber","free":true},{"title":"Genie 3: A new frontier for world models","url":"https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/","type":"article","source":"Google DeepMind","free":true},{"title":"Mastering Diverse Domains through World Models (DreamerV3)","url":"https://arxiv.org/abs/2301.04104","type":"paper","source":"arXiv","free":true},{"title":"V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning","url":"https://arxiv.org/abs/2506.09985","type":"paper","source":"arXiv","free":true},{"title":"pi-zero: A Vision-Language-Action Flow Model for General Robot Control","url":"https://arxiv.org/abs/2410.24164","type":"paper","source":"arXiv","free":true},{"title":"LeRobot","url":"https://github.com/huggingface/lerobot","type":"tool","source":"Hugging Face","free":true}],"subtopics":[{"title":"Model-based reinforcement learning basics","desc":"Model-free RL learns what to do by trial and error; model-based RL first learns how the world responds, then plans or trains inside that model. You need the RL vocabulary of states, actions, rewards, and policies.","level":"core","resources":[{"title":"Reinforcement Learning: An Introduction","url":"http://incompleteideas.net/book/the-book-2nd.html","type":"book","source":"Sutton & Barto","free":true},{"title":"Spinning Up in Deep RL","url":"https://spinningup.openai.com/en/latest/","type":"course","source":"OpenAI","free":true}]},{"title":"Learning to dream: World Models, Dreamer, MuZero","desc":"Agents learn a compact model of their environment and practice inside it. Dreamer and MuZero showed that planning in a learned latent space can master games and control tasks.","level":"core","resources":[{"title":"World Models (interactive paper)","url":"https://worldmodels.github.io/","type":"interactive","source":"Ha & Schmidhuber","free":true},{"title":"Mastering Diverse Domains through World Models (DreamerV3)","url":"https://arxiv.org/abs/2301.04104","type":"paper","source":"arXiv","free":true}]},{"title":"Interactive video world models","desc":"Large video models trained on huge amounts of footage can generate explorable, controllable worlds frame by frame. Genie and similar systems hint at simulators for training agents.","level":"deep","resources":[{"title":"Genie: Generative Interactive Environments","url":"https://arxiv.org/abs/2402.15391","type":"paper","source":"arXiv","free":true},{"title":"Genie 3: A new frontier for world models","url":"https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/","type":"article","source":"Google DeepMind","free":true}]},{"title":"Latent predictive models (JEPA)","desc":"Instead of predicting every pixel, JEPA-style models predict abstract representations of what comes next. Proponents argue this is more efficient and better for planning.","level":"deep","resources":[{"title":"Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture","url":"https://arxiv.org/abs/2301.08243","type":"paper","source":"arXiv","free":true},{"title":"V-JEPA 2","url":"https://arxiv.org/abs/2506.09985","type":"paper","source":"arXiv","free":true}]},{"title":"Vision-language-action models for robots","desc":"VLAs start from a vision-language model and learn to output robot actions, so web knowledge transfers to physical tasks. RT-2, OpenVLA, and pi-zero are key examples.","level":"core","resources":[{"title":"RT-2: Vision-Language-Action Models","url":"https://arxiv.org/abs/2307.15818","type":"paper","source":"arXiv","free":true},{"title":"OpenVLA: An Open-Source Vision-Language-Action Model","url":"https://arxiv.org/abs/2406.09246","type":"paper","source":"arXiv","free":true}]},{"title":"Simulation, sim-to-real, and robot data","desc":"Robot data is scarce, so teams combine simulation, teleoperation, and synthetic video from world foundation models. Open toolkits make it possible to experiment with low-cost arms.","level":"optional","resources":[{"title":"LeRobot","url":"https://huggingface.co/docs/lerobot/index","type":"tool","source":"Hugging Face","free":true},{"title":"Cosmos World Foundation Model Platform for Physical AI","url":"https://arxiv.org/abs/2501.03575","type":"paper","source":"arXiv","free":true}]}]},{"id":"reasoning-models","title":"Reasoning Models & Test-time Compute","tier":5,"lane":"llm","prereqs":["rlhf","pretraining"],"roles":{"rs":"c","mle":"r","aie":"a"},"summary":"Reasoning models are LLMs trained to think through a problem in a long chain of thought before answering. They improve by spending more compute at inference time (test-time compute), and are mostly trained with reinforcement learning on tasks with checkable answers.","why":"Reasoning models made large jumps on math, coding, science, and agentic tasks, and 'thinking' modes are now standard in frontier assistants. Understanding how they are trained and where they fail is central to current research and to using them well.","depth":"This is frontier research. Must understand: chain-of-thought, the test-time compute trade-off, RL with verifiable rewards, and process versus outcome rewards. Just follow the fast-moving details (search methods, length control, faithfulness of reasoning traces) through papers and lab blogs.","hours":40,"outcomes":["You can explain how chain-of-thought and test-time compute improve accuracy, and when they don't.","You can describe how RL with verifiable rewards (as in DeepSeek-R1) produces long reasoning behavior.","You can compare parallel sampling, self-consistency, search, and sequential thinking as ways to spend inference compute.","You can reason about open problems such as faithfulness of reasoning traces, overthinking, and reward hacking."],"project":"Take a small open model (0.5B to 3B) and a math dataset with checkable answers such as GSM8K. Measure accuracy with direct answers, chain-of-thought, and majority voting over 8 samples. Then run a short GRPO training job with TRL using a correctness reward, and plot accuracy and average response length over training.","resources":[{"title":"Why We Think","url":"https://lilianweng.github.io/posts/2025-05-01-thinking/","type":"article","source":"Lilian Weng","free":true},{"title":"Understanding Reasoning LLMs","url":"https://magazine.sebastianraschka.com/p/understanding-reasoning-llms","type":"article","source":"Sebastian Raschka","free":true},{"title":"DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning","url":"https://arxiv.org/abs/2501.12948","type":"paper","source":"arXiv","free":true},{"title":"Learning to reason with LLMs","url":"https://openai.com/index/learning-to-reason-with-llms/","type":"article","source":"OpenAI","free":true},{"title":"Scaling LLM Test-Time Compute Optimally","url":"https://arxiv.org/abs/2408.03314","type":"paper","source":"arXiv","free":true},{"title":"Building with extended thinking","url":"https://platform.claude.com/docs/en/build-with-claude/extended-thinking","type":"docs","source":"Anthropic","free":true},{"title":"Open R1","url":"https://github.com/huggingface/open-r1","type":"tool","source":"Hugging Face","free":true}],"subtopics":[{"title":"Chain-of-thought and self-consistency","desc":"Asking a model to show its steps improves multi-step reasoning. Sampling several reasoning paths and taking a majority vote improves it further.","level":"core","resources":[{"title":"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models","url":"https://arxiv.org/abs/2201.11903","type":"paper","source":"arXiv","free":true},{"title":"Self-Consistency Improves Chain of Thought Reasoning","url":"https://arxiv.org/abs/2203.11171","type":"paper","source":"arXiv","free":true}]},{"title":"Scaling test-time compute","desc":"Spending more compute at inference, through longer thinking or more samples, can beat using a bigger model. The best strategy depends on problem difficulty.","level":"core","resources":[{"title":"Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters","url":"https://arxiv.org/abs/2408.03314","type":"paper","source":"arXiv","free":true},{"title":"Learning to reason with LLMs","url":"https://openai.com/index/learning-to-reason-with-llms/","type":"article","source":"OpenAI","free":true}]},{"title":"RL with verifiable rewards","desc":"Train on problems whose answers can be checked automatically, like math and unit-tested code, and reward correct final answers. DeepSeek-R1 showed long reasoning, self-checking, and backtracking emerge from this.","level":"core","resources":[{"title":"DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning","url":"https://arxiv.org/abs/2501.12948","type":"paper","source":"arXiv","free":true},{"title":"Understanding Reasoning LLMs","url":"https://magazine.sebastianraschka.com/p/understanding-reasoning-llms","type":"article","source":"Sebastian Raschka","free":true}]},{"title":"Process versus outcome rewards","desc":"Outcome rewards check only the final answer; process reward models score each step. Step-level feedback helps search and verification but is costly to label.","level":"deep","resources":[{"title":"Let's Verify Step by Step","url":"https://arxiv.org/abs/2305.20050","type":"paper","source":"arXiv","free":true}]},{"title":"Distilling and bootstrapping reasoning","desc":"Small models can learn reasoning by fine-tuning on traces from stronger models, sometimes with only about a thousand examples. Self-training methods like STaR bootstrap from the model's own correct traces.","level":"deep","resources":[{"title":"s1: Simple test-time scaling","url":"https://arxiv.org/abs/2501.19393","type":"paper","source":"arXiv","free":true},{"title":"STaR: Bootstrapping Reasoning With Reasoning","url":"https://arxiv.org/abs/2203.14465","type":"paper","source":"arXiv","free":true}]},{"title":"Faithfulness and open problems","desc":"A model's written reasoning does not always reflect what actually drove its answer, which matters for monitoring and safety. Overthinking easy problems and wasting tokens is another active issue.","level":"deep","resources":[{"title":"Reasoning models don't always say what they think","url":"https://www.anthropic.com/research/reasoning-models-dont-say-think","type":"article","source":"Anthropic","free":true}]},{"title":"Search over thoughts","desc":"Tree-of-thoughts and similar methods explore several branches of reasoning and back up when stuck. Explicit search has partly given way to learned long chains of thought, but the ideas recur.","level":"optional","resources":[{"title":"Tree of Thoughts: Deliberate Problem Solving with Large Language Models","url":"https://arxiv.org/abs/2305.10601","type":"paper","source":"arXiv","free":true}]}]},{"id":"autonomous-agents","title":"Long-horizon Autonomous Agents","tier":5,"lane":"agents","prereqs":["multi-agent","llm-evals"],"roles":{"aie":"a","rs":"r"},"summary":"Long-horizon autonomous agents work on tasks that take hours or days with little human input, like building a feature end to end or running a small business process. The open problems are staying on track, managing memory across many context windows, recovering from errors, and knowing when to ask for help.","why":"The length of tasks agents can complete reliably has been doubling roughly every several months, which makes this one of the fastest-moving areas in AI. Understanding the limits, and how to measure them, matters for anyone building or betting on agents.","depth":"This is frontier territory. Read the key engineering posts, benchmarks, and papers, and run your own long experiments. Know the research directions (memory, self-improvement, verification, safety of autonomy); nobody has mastered them yet.","hours":30,"outcomes":["You can explain how long-horizon ability is measured (for example METR's task-length metric, SWE-bench) and the limits of those measures.","You can design a harness for multi-session work: progress files, checkpoints, tests, and context resets.","You can analyze why long runs fail (drift, compounding errors, reward hacking, giving up) from real transcripts.","You can discuss safety concerns of autonomy, such as oversight, permissions, and monitoring."],"project":"Give a coding agent a multi-day project (for example, a small web app with 30 listed features) using a harness with a feature list, progress file, and tests. Let it run across many sessions with minimal intervention, then analyze the transcripts: where it drifted, what it broke, and which harness changes helped most.","resources":[{"title":"Effective harnesses for long-running agents","url":"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents","type":"article","source":"Anthropic","free":true},{"title":"Measuring AI Ability to Complete Long Software Tasks","url":"https://arxiv.org/abs/2503.14499","type":"paper","source":"arXiv","free":true},{"title":"SWE-bench: Can Language Models Resolve Real-World GitHub Issues?","url":"https://arxiv.org/abs/2310.06770","type":"paper","source":"arXiv","free":true},{"title":"Demystifying evals for AI agents","url":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Project Vend: Can Claude run a small shop?","url":"https://www.anthropic.com/research/project-vend-1","type":"article","source":"Anthropic","free":true},{"title":"LLM Powered Autonomous Agents","url":"https://lilianweng.github.io/posts/2023-06-23-agent/","type":"article","source":"Lilian Weng","free":true}],"subtopics":[{"title":"Measuring task horizon","desc":"METR measures the length of tasks (in human-expert time) an agent can complete with 50% reliability; this has grown exponentially. SWE-bench and its successors test real software tasks.","level":"core","resources":[{"title":"Measuring AI Ability to Complete Long Tasks","url":"https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/","type":"article","source":"METR","free":true},{"title":"SWE-bench","url":"https://www.swebench.com/","type":"tool","source":"SWE-bench","free":true}]},{"title":"Harnesses for multi-session work","desc":"Agents that span many context windows need structure: an initializer that sets up the environment, a feature list, progress notes, git commits, and tests so each new session can pick up cleanly.","level":"core","resources":[{"title":"Effective harnesses for long-running agents","url":"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Memory and context over long runs","desc":"Compaction, external memory files, and retrieval over past actions let agents keep going past one context window. Deciding what to remember and forget is still an open problem.","level":"core","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Self-improvement and skill libraries","desc":"Research agents like Voyager build a growing library of reusable skills; Reflexion learns from verbal feedback on failures. Modern agent skills and memory systems build on these ideas.","level":"deep","resources":[{"title":"Voyager: An Open-Ended Embodied Agent","url":"https://arxiv.org/abs/2305.16291","type":"paper","source":"arXiv","free":true},{"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","url":"https://arxiv.org/abs/2303.11366","type":"paper","source":"arXiv","free":true}]},{"title":"Real-world autonomy experiments","desc":"Experiments like Anthropic's Project Vend, where Claude ran a small shop, show how agents behave over weeks: creative, but prone to odd mistakes and being talked into bad deals.","level":"deep","resources":[{"title":"Project Vend: Can Claude run a small shop?","url":"https://www.anthropic.com/research/project-vend-1","type":"article","source":"Anthropic","free":true}]},{"title":"Oversight and safety of autonomy","desc":"More autonomy means less human checking. Open questions include scalable oversight, monitoring agent behavior, sandboxing, and preventing reward hacking or harmful side effects.","level":"deep","resources":[{"title":"The lethal trifecta for AI agents","url":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","type":"article","source":"Simon Willison","free":true}]}]}]};
</script>
<script>
(() => {
  'use strict';

  const D = window.ROADMAP;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- data indexes ----------
  const byId = {};
  D.nodes.forEach((n, i) => { n.idx = i; n.unlocks = []; byId[n.id] = n; });
  D.nodes.forEach((n) => n.prereqs.forEach((p) => byId[p].unlocks.push(n.id)));
  const laneById = Object.fromEntries(D.lanes.map((l, i) => [l.id, { ...l, i }]));
  const roleById = Object.fromEntries(D.roles.map((r) => [r.id, r]));
  const REL = { c: 'Must learn', r: 'Should know', a: 'Be aware' };
  const REL_SHORT = { c: 'Must', r: 'Should', a: 'Aware' };
  const REL_RANK = { c: 0, r: 1, a: 2 };
  const STATUS = { todo: 'Not started', learning: 'Learning', done: 'Done', skip: 'Skip' };

  // depth of a node among same-tier prerequisites, so prereqs stack above dependents
  const localDepth = {};
  const depthOf = (n) => {
    if (localDepth[n.id] != null) return localDepth[n.id];
    let d = 0;
    n.prereqs.forEach((p) => { if (byId[p].tier === n.tier) d = Math.max(d, depthOf(byId[p]) + 1); });
    return (localDepth[n.id] = d);
  };
  D.nodes.forEach(depthOf);

  // ---------- state ----------
  const KEY = 'ai-atlas:v1';
  const S = { role: 'all', view: null, status: {}, sel: null, pace: 6, showAll: false, legend: true };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage unavailable */ }
  S.sel = null;
  if (!S.view) S.view = window.innerWidth < 700 ? 'path' : 'map';
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify({ role: S.role, view: S.view, status: S.status, pace: S.pace, showAll: S.showAll, legend: S.legend })); } catch (e) { /* ignore */ }
  };

  const rel = (n, role = S.role) => (role === 'all' ? null : n.roles[role] || null);
  const onPath = (n, role = S.role) => role === 'all' || !!n.roles[role];
  const st = (id) => S.status[id] || 'todo';
  const isClear = (id) => { const s = st(id); return s === 'done' || s === 'skip'; };
  const satisfied = (id) => isClear(id) || !onPath(byId[id]);
  const isLocked = (n) => !n.prereqs.every(satisfied);
  const isNext = (n) => onPath(n) && st(n.id) === 'todo' && !isLocked(n);

  function ancestors(id, acc = new Set()) {
    byId[id].prereqs.forEach((p) => { if (!acc.has(p)) { acc.add(p); ancestors(p, acc); } });
    return acc;
  }
  const sortNodes = (list) => list.slice().sort((a, b) =>
    a.tier - b.tier || localDepth[a.id] - localDepth[b.id] ||
    (REL_RANK[rel(a)] ?? 0) - (REL_RANK[rel(b)] ?? 0) ||
    laneById[a.lane].i - laneById[b.lane].i || a.idx - b.idx);
  const pathNodes = () => sortNodes(D.nodes.filter((n) => onPath(n)));
  // "Be aware" topics only fill the list once nothing more important is unlocked
  const nextUp = (limit = 4) => {
    const all = pathNodes().filter(isNext);
    const main = all.filter((n) => rel(n) !== 'a');
    return (main.length ? main : all).slice(0, limit);
  };
  const hoursOf = (n) => n.hours || 0;

  // ---------- layout ----------
  const NODE_W = 184, NODE_H = 66, COL_W = 210, LEFT = 156, TOP = 64, GAP = 12, PAD = 30;
  const W = LEFT + D.lanes.length * COL_W + 24;
  const tierTop = [], tierH = [];
  const pos = {};
  (() => {
    let y = TOP;
    D.tiers.forEach((t) => {
      const cells = {};
      D.nodes.filter((n) => n.tier === t.id).forEach((n) => (cells[n.lane] ||= []).push(n));
      const maxStack = Math.max(1, ...Object.values(cells).map((c) => c.length));
      const inner = maxStack * (NODE_H + GAP) - GAP;
      const h = Math.max(150, inner + PAD * 2);
      tierTop[t.id] = y; tierH[t.id] = h;
      Object.entries(cells).forEach(([lane, list]) => {
        list.sort((a, b) => localDepth[a.id] - localDepth[b.id] || a.idx - b.idx);
        const stackH = list.length * (NODE_H + GAP) - GAP;
        const y0 = y + (h - stackH) / 2;
        list.forEach((n, i) => {
          pos[n.id] = { x: LEFT + laneById[lane].i * COL_W + (COL_W - NODE_W) / 2, y: y0 + i * (NODE_H + GAP) };
        });
      });
      y += h;
    });
  })();
  const H = tierTop[D.tiers.length - 1] + tierH[D.tiers.length - 1] + 20;

  // ---------- elements ----------
  const el = {
    viewport: $('#viewport'), world: $('#world'), nodes: $('#nodes'), edges: $('#edges'),
    drawer: $('#drawer'), drawerInner: $('#drawerInner'), mapView: $('#mapView'), pathView: $('#pathView'),
    roleChips: $('#roleChips'), progress: $('#progress'), legend: $('#legend'), banner: $('#roleBanner'),
    search: $('#search'), results: $('#searchResults'), modal: $('#modal'), modalBody: $('#modalBody'), toast: $('#toast'),
  };

  // ---------- map rendering ----------
  const nodeEls = {}, edgeEls = [];
  function buildMap() {
    el.world.style.width = W + 'px'; el.world.style.height = H + 'px';
    el.edges.setAttribute('width', W); el.edges.setAttribute('height', H);
    el.edges.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let html = '';
    D.tiers.forEach((t) => {
      html += `<div class="band" style="top:${tierTop[t.id]}px;height:${tierH[t.id]}px;width:${W}px">
        <div class="band-label"><div class="t-num">Tier ${t.id}</div><div class="t-name">${esc(t.name)}</div><div class="t-blurb">${esc(t.blurb)}</div></div></div>`;
    });
    D.lanes.forEach((l, i) => {
      html += `<div class="lane-col" style="left:${LEFT + i * COL_W}px;height:${H - 60}px"></div>`;
      html += `<div class="lane-head" style="left:${LEFT + i * COL_W}px;width:${COL_W}px;--h:${l.hue}">${esc(l.name)}</div>`;
    });
    el.nodes.innerHTML = html;
    D.nodes.forEach((n) => {
      const b = document.createElement('button');
      b.className = 'node';
      b.dataset.id = n.id;
      b.style.cssText = `left:${pos[n.id].x}px;top:${pos[n.id].y}px;width:${NODE_W}px;height:${NODE_H}px;--h:${laneById[n.lane].hue}`;
      b.innerHTML = `<span class="n-title">${esc(n.title)}</span><span class="n-meta"><span class="n-dot"></span><span class="n-rel"></span><span class="n-info"></span><span class="n-status"></span></span>`;
      b.addEventListener('click', () => { if (!drag.moved) select(n.id, { center: false }); });
      el.nodes.appendChild(b);
      nodeEls[n.id] = b;
    });
    const ns = 'http://www.w3.org/2000/svg';
    D.nodes.forEach((n) => n.prereqs.forEach((p) => {
      const a = pos[p], b = pos[n.id];
      let d;
      if (b.y >= a.y + NODE_H - 1) {
        const x1 = a.x + NODE_W / 2, y1 = a.y + NODE_H, x2 = b.x + NODE_W / 2, y2 = b.y, c = Math.max(30, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
      } else {
        const right = b.x > a.x;
        const x1 = right ? a.x + NODE_W : a.x, y1 = a.y + NODE_H / 2, x2 = right ? b.x : b.x + NODE_W, y2 = b.y + NODE_H / 2, c = Math.abs(x2 - x1) / 2;
        d = `M${x1},${y1} C${x1 + (right ? c : -c)},${y1} ${x2 - (right ? c : -c)},${y2} ${x2},${y2}`;
      }
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'edge');
      el.edges.appendChild(path);
      edgeEls.push({ from: p, to: n.id, path });
    }));
  }

  function refreshMap() {
    const chain = S.sel ? ancestors(S.sel) : null;
    const sel = S.sel ? byId[S.sel] : null;
    const q = el.search.value.trim().toLowerCase();
    D.nodes.forEach((n) => {
      const b = nodeEls[n.id];
      const r = rel(n), s = st(n.id), on = onPath(n), next = isNext(n), locked = isLocked(n);
      b.className = 'node' + (r ? ' rel-' + r : '') + (on ? '' : ' off') + ' st-' + s +
        (next ? ' next' : '') + (locked ? ' locked' : '') + (S.sel === n.id ? ' sel' : '') +
        (chain && (chain.has(n.id) || sel.unlocks.includes(n.id)) ? ' chain' : '') +
        (q.length > 1 && matches(n, q) ? ' match' : '');
      b.querySelector('.n-rel').textContent = r ? REL_SHORT[r] : '';
      const info = [];
      if (n.hours) info.push(n.hours + 'h');
      if (n.subtopics?.length) info.push(n.subtopics.length + ' sub');
      b.querySelector('.n-info').textContent = info.join(' · ');
      b.querySelector('.n-status').textContent = s === 'done' ? '✓ Done' : s === 'learning' ? 'Learning' : s === 'skip' ? 'Skipped' : next ? 'Next up' : '';
      b.setAttribute('aria-label', `${n.title}, tier ${n.tier}${r ? ', ' + REL[r] : ''}, ${STATUS[s]}`);
    });
    el.nodes.classList.toggle('focus', !!S.sel);
    el.edges.classList.toggle('focus', !!S.sel);
    edgeEls.forEach((e) => {
      const off = !onPath(byId[e.from]) || !onPath(byId[e.to]);
      let cls = 'edge' + (off ? ' off' : '');
      if (chain) {
        if ((chain.has(e.to) || e.to === S.sel) && chain.has(e.from)) cls += ' anc';
        else if (e.from === S.sel) cls += ' desc';
      }
      e.path.setAttribute('class', cls);
    });
  }

  // ---------- pan & zoom ----------
  const T = { x: 0, y: 0, k: 1 };
  const apply = () => { el.world.style.transform = `translate(${T.x}px,${T.y}px) scale(${T.k})`; };
  const clampK = (k) => Math.min(1.6, Math.max(0.22, k));
  function zoomAt(f, cx, cy) {
    const k2 = clampK(T.k * f);
    T.x = cx - (cx - T.x) * (k2 / T.k); T.y = cy - (cy - T.y) * (k2 / T.k); T.k = k2; apply();
  }
  function animate(fn) {
    el.world.style.transition = 'transform .4s cubic-bezier(.2,.7,.2,1)';
    fn(); apply();
    setTimeout(() => { el.world.style.transition = ''; }, 420);
  }
  const drawerW = () => (el.drawer.hidden || window.innerWidth <= 640 ? 0 : el.drawer.offsetWidth);
  function fit() {
    const top = el.banner.hidden ? 0 : el.banner.offsetHeight + 20;
    const vw = el.viewport.clientWidth - drawerW(), vh = el.viewport.clientHeight - top;
    const list = D.nodes.filter((n) => onPath(n));
    let x0 = 0, y0 = 0, x1 = W, y1 = H;
    if (S.role !== 'all') {
      x0 = Math.min(...list.map((n) => pos[n.id].x)) - 40; x1 = Math.max(...list.map((n) => pos[n.id].x + NODE_W)) + 40;
      y0 = Math.min(...list.map((n) => pos[n.id].y)) - 70; y1 = Math.max(...list.map((n) => pos[n.id].y + NODE_H)) + 40;
      x0 = Math.min(x0, 0);
    }
    const bw = x1 - x0, bh = y1 - y0;
    let k = Math.min(vw / bw, vh / bh);
    if (k < 0.5) k = Math.min(vw / bw, 1);
    k = Math.min(1, Math.max(window.innerWidth < 700 ? 0.42 : 0.5, k));
    animate(() => {
      T.k = k;
      T.x = bw * k < vw ? (vw - bw * k) / 2 - x0 * k : -x0 * k + 8;
      T.y = top + (bh * k < vh ? (vh - bh * k) / 2 - y0 * k : -y0 * k + 8);
    });
  }
  function centerOn(id) {
    const p = pos[id];
    const vw = el.viewport.clientWidth - drawerW();
    const vh = window.innerWidth <= 640 && !el.drawer.hidden ? el.viewport.clientHeight * 0.12 + 60 : el.viewport.clientHeight / 2;
    animate(() => {
      T.k = Math.max(T.k, 0.75);
      T.x = vw / 2 - (p.x + NODE_W / 2) * T.k;
      T.y = vh - (p.y + NODE_H / 2) * T.k;
    });
  }

  const drag = { on: false, moved: false, sx: 0, sy: 0, ox: 0, oy: 0 };
  const pointers = new Map();
  let pinch = null;
  el.viewport.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: T.k };
      drag.on = false;
      return;
    }
    Object.assign(drag, { on: true, moved: false, sx: e.clientX, sy: e.clientY, ox: T.x, oy: T.y });
  });
  window.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const r = el.viewport.getBoundingClientRect();
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((pinch.k * d / pinch.d) / T.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      drag.moved = true;
      return;
    }
    if (!drag.on) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    el.viewport.classList.add('dragging');
    T.x = drag.ox + dx; T.y = drag.oy + dy; apply();
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      drag.on = false;
      el.viewport.classList.remove('dragging');
      setTimeout(() => { drag.moved = false; }, 0);
    }
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  el.viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = el.viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { T.x -= e.deltaX; T.y -= e.deltaY; apply(); }
  }, { passive: false });
  el.viewport.addEventListener('click', (e) => {
    if (!drag.moved && !e.target.closest('.node') && S.sel) closeDrawer();
  });
  const zoomCenter = (f) => zoomAt(f, (el.viewport.clientWidth - drawerW()) / 2, el.viewport.clientHeight / 2);
  $('#zoomIn').onclick = () => zoomCenter(1.25);
  $('#zoomOut').onclick = () => zoomCenter(0.8);
  $('#zoomFit').onclick = fit;

  // ---------- legend, roles, progress ----------
  function renderLegend() {
    if (!S.legend) { el.legend.hidden = true; return; }

  function setRole(role, opts = {}) {
    S.role = role; save();

    if (S.view === 'map' && !opts.noFit) fit();

  // ---------- path view ----------
  function renderPath() {
    const role = roleById[S.role];
    const list = sortNodes(D.nodes);
    const onList = list.filter((n) => onPath(n));
    const left = onList.filter((n) => !isClear(n.id) && rel(n) !== 'a');
    const hoursLeft = left.reduce((s, n) => s + hoursOf(n), 0);
    const done = onList.filter((n) => isClear(n.id)).length;
    const weeks = Math.ceil(hoursLeft / Math.max(1, S.pace));
    const ups = nextUp(4);
    let html = `<div class="path-inner${S.showAll ? ' show-all' : ''}">
      <div class="path-hero">
        <div>
          <div class="eyebrow">Learning path</div>
          <h1>${role ? esc(role.name) : 'Everything in AI'}</h1>

          <div class="pace"><label for="pace">At</label><input id="pace" type="number" min="1" max="60" value="${S.pace}"><span>hours a week, the rest of this path takes about <b>${weeks} weeks</b>${weeks > 8 ? ` (≈ ${Math.round(weeks / 4.3)} months)` : ''}.</span></div>
        </div>
        <div class="stats">
          <div class="stat"><b>${onList.length}</b><span>topics</span></div>
          <div class="stat"><b>${done}</b><span>done</span></div>

    }
    D.tiers.forEach((t) => {
      const items = list.filter((n) => n.tier === t.id);

      if (!visible.length && !S.showAll) return;
      const hrs = visible.reduce((s, n) => s + hoursOf(n), 0);
      html += `<section class="tier-sec"><div class="tier-sec-head"><h2>${esc(t.name)}</h2><span class="eyebrow">Tier ${t.id} · ${visible.length} topics${hrs ? ' · ' + hrs + 'h' : ''}</span></div><ul class="step-list">`;
      items.forEach((n) => {
        const r = rel(n), s = st(n.id), next = isNext(n);
        html += `<li class="step st-${s}${onPath(n) ? '' : ' off'}" id="step-${n.id}">
          <button class="check" data-toggle="${n.id}" aria-label="Mark ${esc(n.title)} as ${s === 'done' ? 'not started' : 'done'}">${s === 'done' ? '✓' : s === 'learning' ? '•' : s === 'skip' ? '–' : ''}</button>
          <button class="s-main" data-open="${n.id}">
            <span class="s-title">${esc(n.title)}${next ? '<span class="tag next">Next up</span>' : ''}</span>

        </li>`;
      });
      html += '</ul></section>';
    });
    if (role) html += `<label class="path-toggle"><input type="checkbox" id="showAll" ${S.showAll ? 'checked' : ''}> Show topics outside this path</label>`;
    html += '</div>';
    const scroll = el.pathView.scrollTop;

    pace.onchange = () => { S.pace = Math.min(60, Math.max(1, +pace.value || 6)); save(); renderPath(); };
    const sa = $('#showAll', el.pathView);
    if (sa) sa.onchange = () => { S.showAll = sa.checked; save(); renderPath(); };

  // ---------- drawer ----------
  const ICONS = {

  function renderDrawer() {

    const ancLeft = anc.filter((a) => !isClear(a.id) && onPath(a));

    const roleRels = D.roles.filter((ro) => n.roles[ro.id]).map((ro) => `<span>${esc(ro.short)}: <b>${REL_SHORT[n.roles[ro.id]]}</b></span>`).join('');
