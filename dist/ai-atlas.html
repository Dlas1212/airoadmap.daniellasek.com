<title>AI Learning Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-height app. Top bar + path chips, then a pannable map (tiers = rows, branches = columns)
   or an ordered path list, with a detail drawer on the right (bottom sheet on phones). */
:root {
  --paper: #edf1f2;
  --paper-2: #e3e9eb;
  --panel: #ffffff;
  --ink: #13202a;
  --ink-2: #44545f;
  --ink-3: #7d8d97;
  --line: #d3dce0;
  --line-2: #bfcbd1;
  --next: #d97a00;
  --next-soft: #fff1dc;
  --done: #1f8a5b;
  --done-soft: #def3e8;
  --learning: #2d6cdf;
  --skip: #8a96a0;
  --lane-s: 58%;
  --lane-l: 42%;
  --lane-bg-l: 95%;
  --shadow: 0 1px 2px rgba(19, 32, 42, .08), 0 6px 24px rgba(19, 32, 42, .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1419; --paper-2: #121b21; --panel: #162129; --ink: #e5edf1; --ink-2: #a6b5be; --ink-3: #6b7c87;
    --line: #24323b; --line-2: #33434e; --next: #ffad33; --next-soft: #3a2a10; --done: #4cc58c; --done-soft: #12301f;
    --learning: #6ea0ff; --skip: #6b7882; --lane-s: 62%; --lane-l: 66%; --lane-bg-l: 16%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1419; --paper-2: #121b21; --panel: #162129; --ink: #e5edf1; --ink-2: #a6b5be; --ink-3: #6b7c87;
  --line: #24323b; --line-2: #33434e; --next: #ffad33; --next-soft: #3a2a10; --done: #4cc58c; --done-soft: #12301f;
  --learning: #6ea0ff; --skip: #6b7882; --lane-s: 62%; --lane-l: 66%; --lane-bg-l: 16%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--learning); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; fill: var(--ink); stroke: var(--ink); }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

.search-wrap { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search-wrap input {
  width: 100%; height: 36px; padding: 0 34px 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--paper);
}
.search-wrap input:focus { outline: none; border-color: var(--learning); background: var(--panel); }
.search-kbd { position: absolute; right: 9px; top: 8px; font: 11px var(--f-mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.search-results {
  position: absolute; top: 42px; left: 0; right: 0; z-index: 40; list-style: none; margin: 0; padding: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  max-height: 60vh; overflow: auto;
}
.search-results li button {
  width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center;
}
.search-results li button:hover, .search-results li button.active { background: var(--paper); }
.search-results .r-sub { grid-column: 2 / 4; font-size: 12px; color: var(--ink-3); margin-top: -4px; }
.search-results .r-tier { font: 11px var(--f-mono); color: var(--ink-3); }
.search-results .empty { padding: 10px; color: var(--ink-3); font-size: 13px; }

.top-actions { display: flex; align-items: center; gap: 8px; }
.btn {
  height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel);
  cursor: pointer; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.ghost { background: transparent; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 700; }
.btn.icon { width: 34px; padding: 0; font-weight: 700; font-size: 16px; }
.btn.icon.wide { width: auto; padding: 0 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ---------- role chips ---------- */
.roles {
  display: flex; align-items: center; gap: 12px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.roles-label { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.role-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.role-chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line-2);
  background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2);
}
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 700; }
.progress { display: flex; align-items: center; gap: 10px; flex: none; font-size: 13px; color: var(--ink-2); }
.progress .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--done); border-radius: 3px; transition: width .3s; }
.progress b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; display: flex; }
.map-view { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.viewport.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.nodes { position: absolute; left: 0; top: 0; }

/* tier bands and lane headers live inside .nodes */
.band { position: absolute; left: 0; border-top: 1px dashed var(--line-2); }
.band:nth-child(even) { background: color-mix(in srgb, var(--paper-2) 55%, transparent); }
.band-label { position: absolute; left: 18px; top: 18px; width: 118px; }
.band-label .t-num { font: 600 11px var(--f-mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.band-label .t-name { font: 800 21px/1.1 var(--f-display); letter-spacing: -.02em; margin-top: 2px; }
.band-label .t-blurb { font-size: 11.5px; line-height: 1.35; color: var(--ink-3); margin-top: 6px; }
.lane-head { position: absolute; top: 22px; text-align: center; font: 700 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--h) var(--lane-s) var(--lane-l)); }
.lane-head::after { content: ""; display: block; margin: 8px auto 0; width: 28px; height: 3px; border-radius: 2px; background: currentColor; }
.lane-col { position: absolute; top: 60px; width: 1px; background: var(--line); opacity: .6; }

/* nodes */
.node {
  position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 3px;
  padding: 8px 10px 8px 12px; border-radius: 10px; cursor: pointer; text-align: left;
  background: var(--panel); border: 1.5px solid var(--line-2);
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
  transition: opacity .2s, filter .2s, box-shadow .15s, transform .15s, border-color .15s;
}
.node:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.node .n-title { flex: none; font-weight: 700; font-size: 13.5px; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .n-meta { flex: none; display: flex; align-items: center; gap: 6px; font: 11px var(--f-mono); color: var(--ink-3); }
.node .n-dot { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) var(--lane-s) var(--lane-l)); flex: none; }
.node .n-meta { white-space: nowrap; min-width: 0; }
.node .n-info { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.node .n-status { margin-left: auto; font-weight: 600; flex: none; }
.node.rel-c { border-color: hsl(var(--h) var(--lane-s) var(--lane-l)); border-width: 2px; }
.node.rel-c .n-meta .n-rel { color: hsl(var(--h) var(--lane-s) var(--lane-l)); font-weight: 600; }
.node.rel-a { border-style: dashed; }
.node.off { opacity: .22; filter: grayscale(1); }
.node.off:hover { opacity: .6; }
.node.locked:not(.off) .n-title { color: var(--ink-2); }
.node.st-done { background: var(--done-soft); border-color: var(--done); }
.node.st-done .n-status { color: var(--done); }
.node.st-learning { box-shadow: 0 0 0 3px color-mix(in srgb, var(--learning) 30%, transparent); }
.node.st-learning .n-status { color: var(--learning); }
.node.st-skip { opacity: .5; }
.node.st-skip .n-title { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.node.next { box-shadow: 0 0 0 3px var(--next-soft), 0 0 0 4.5px var(--next); }
.node.next .n-status { color: var(--next); }
.node.sel { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--ink); z-index: 2; }
.node.match { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--learning); }
.nodes.focus .node:not(.chain):not(.sel) { opacity: .2; }

.edge { fill: none; stroke: var(--line-2); stroke-width: 1.4; transition: opacity .2s, stroke .2s; }
.edge.off { opacity: .25; }
.edges.focus .edge { opacity: .12; }
.edges.focus .edge.anc { opacity: 1; stroke: var(--ink-2); stroke-width: 2; }
.edges.focus .edge.desc { opacity: 1; stroke: var(--next); stroke-width: 2; stroke-dasharray: 5 4; }

.map-controls { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; z-index: 5; }
.map-controls .btn { box-shadow: var(--shadow); }
.legend {
  position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 12px; color: var(--ink-2); display: grid; grid-template-columns: auto auto; gap: 6px 16px;
}
.legend .lg { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend .sw { width: 22px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line-2); background: var(--panel); flex: none; }
.legend .sw.c { border: 2px solid var(--ink-2); }
.legend .sw.a { border-style: dashed; }
.legend .sw.off { opacity: .3; }
.legend .sw.next { box-shadow: 0 0 0 2px var(--next-soft), 0 0 0 3px var(--next); border-color: var(--line-2); }
.legend .sw.done { background: var(--done-soft); border-color: var(--done); }
.legend-close { grid-column: 1 / -1; justify-self: start; border: 0; background: none; padding: 0; color: var(--ink-3); font-size: 11.5px; cursor: pointer; text-decoration: underline; }

.role-banner {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: min(680px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 13.5px;
}
.role-banner .rb-text { min-width: 0; }
.role-banner b { font-family: var(--f-display); font-size: 15px; }
.role-banner .rb-next { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.mini {
  border: 1px solid var(--next); color: var(--ink); background: var(--next-soft); border-radius: 12px; padding: 1px 9px;
  font-size: 12.5px; cursor: pointer;
}

/* ---------- path view ---------- */
.path-view { flex: 1; min-width: 0; overflow-y: auto; }
.path-inner {
  max-width: 920px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.path-hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.path-hero h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.path-hero p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
.eyebrow { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; text-align: right; }
.stat b { display: block; font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); }
.pace { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 14px; flex-wrap: wrap; }
.pace input { width: 56px; height: 28px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 6px; font-variant-numeric: tabular-nums; }
.up-next { margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: var(--next-soft); border: 1px solid color-mix(in srgb, var(--next) 40%, transparent); }
.up-next h3 { font-size: 15px; }
.up-next .un-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.up-next .un-list button { border: 1px solid var(--next); background: var(--panel); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13.5px; text-align: left; }
.up-next .un-list button small { display: block; color: var(--ink-3); font-size: 11.5px; }

.tier-sec { margin-top: 30px; }
.tier-sec-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; }
.tier-sec-head h2 { font-size: 22px; font-weight: 800; }
.tier-sec-head .eyebrow { margin-left: auto; }
.step-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.step {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px;
  border-bottom: 1px solid var(--line);
}
.step.off { display: none; }
.show-all .step.off { display: grid; opacity: .45; }
.step .check {
  width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--panel); cursor: pointer;
  display: grid; place-items: center; padding: 0; color: var(--panel); font-size: 13px; font-weight: 700;
}
.step.st-done .check { background: var(--done); border-color: var(--done); }
.step.st-learning .check { border-color: var(--learning); color: var(--learning); }
.step.st-skip .check { border-style: dashed; color: var(--ink-3); }
.step .s-main { min-width: 0; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
.step .s-title { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step.st-done .s-title { color: var(--ink-2); }
.step.st-skip .s-title { text-decoration: line-through; color: var(--ink-3); }
.step .s-sum { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.step .s-side { display: flex; align-items: center; gap: 8px; font: 12px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px;
  font: 600 10.5px var(--f-mono); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
  border: 1px solid var(--line-2); color: var(--ink-2);
}
.tag.lane { color: hsl(var(--h) var(--lane-s) var(--lane-l)); border-color: currentColor; }
.tag.rel-c { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tag.rel-r { color: var(--ink); }
.tag.rel-a { border-style: dashed; color: var(--ink-3); }
.tag.next { background: var(--next-soft); color: var(--next); border-color: var(--next); }
.path-toggle { margin-top: 26px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }

/* ---------- drawer ---------- */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 20;
  background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.08);
  overflow-y: auto; overscroll-behavior: contain;
  animation: slideIn .22s ease-out;
}
@keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-inner { padding: 18px 22px calc(40px + env(safe-area-inset-bottom, 0px)); }
.d-top { display: flex; align-items: center; gap: 8px; }
.d-top .close { margin-left: auto; }
.d-title { font-size: 27px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; margin-top: 14px; }
.d-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.d-rel {
  margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--paper); font-size: 13.5px;
}
.d-rel .rel-roles { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.d-rel .rel-roles span b { color: var(--ink-2); font-weight: 600; }
.status-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; padding: 3px; border-radius: 10px; background: var(--paper); }
.status-row button { border: 0; background: none; border-radius: 7px; padding: 6px 4px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.status-row button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.status-row button[data-s="done"][aria-pressed="true"] { color: var(--done); }
.status-row button[data-s="learning"][aria-pressed="true"] { color: var(--learning); }
.d-sec { margin-top: 24px; }
.d-sec h3 { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.d-sec p { margin: 0; }
.d-sum { font-size: 16.5px; line-height: 1.5; margin-top: 16px; }
.d-callout { padding: 10px 12px; border-left: 3px solid var(--next); background: var(--next-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.outcomes { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button {
  border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 4px 9px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.links button .n-dot { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) var(--lane-s) var(--lane-l)); }
.links button.done { border-color: var(--done); }
.links button.done::after { content: "✓"; color: var(--done); font-weight: 700; }
.links .none { font-size: 13px; color: var(--ink-3); }

/* subtopic tree */
.subtree { list-style: none; margin: 0; padding: 0 0 0 14px; position: relative; }
.subtree::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 18px; width: 1.5px; background: var(--line-2); }
.sub { position: relative; }
.sub::before { content: ""; position: absolute; left: -10px; top: 19px; width: 10px; height: 1.5px; background: var(--line-2); }
.sub > button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--panel);
  border-radius: 8px; padding: 7px 10px; margin-top: 6px; cursor: pointer; font-size: 14px; font-weight: 700;
}
.sub > button:hover { border-color: var(--line-2); }
.sub > button .chev { margin-left: auto; color: var(--ink-3); transition: transform .15s; font-size: 12px; }
.sub.open > button .chev { transform: rotate(90deg); }
.sub .lvl { font: 600 10px var(--f-mono); text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 8px; flex: none; }
.lvl.core { background: var(--ink); color: var(--panel); }
.lvl.deep { border: 1px solid var(--ink-2); color: var(--ink-2); }
.lvl.optional { border: 1px dashed var(--ink-3); color: var(--ink-3); }
.sub-body { padding: 8px 10px 4px; font-size: 14px; color: var(--ink-2); }
.sub-body .res-list { margin-top: 8px; }

/* resources */
.res-list { display: grid; gap: 6px; }
.res {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 9px;
  border: 1px solid var(--line); text-decoration: none; background: var(--panel);
}
.res:hover { border-color: var(--line-2); background: var(--paper); }
.res .ico { width: 30px; height: 30px; border-radius: 8px; background: var(--paper-2); display: grid; place-items: center; color: var(--ink-2); }
.res .ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.res .r-title { font-weight: 700; font-size: 14px; line-height: 1.3; }
.res .r-meta { display: flex; gap: 8px; flex-wrap: wrap; font: 11px var(--f-mono); color: var(--ink-3); margin-top: 2px; text-transform: uppercase; letter-spacing: .03em; }
.res .r-meta .free { color: var(--done); }
.res .r-meta .start { color: var(--next); font-weight: 600; }
.res.first { border-color: color-mix(in srgb, var(--next) 55%, transparent); }
.d-project { padding: 12px 14px; border-radius: 10px; border: 1.5px dashed var(--line-2); font-size: 14.5px; }
.d-empty { color: var(--ink-3); font-size: 14px; padding: 12px; border: 1px dashed var(--line-2); border-radius: 10px; }
.d-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 28px; }
.d-nav .btn { max-width: 48%; overflow: hidden; text-overflow: ellipsis; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(8, 14, 18, .45); display: grid; place-items: center; padding: 16px; }
.modal-card {
  width: min(760px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border-radius: 16px;
  box-shadow: var(--shadow); padding: 24px;
}
.modal-card h2 { font-size: 26px; font-weight: 800; letter-spacing: -.025em; }
.modal-card .lead { color: var(--ink-2); margin: 8px 0 0; max-width: 60ch; }
.kc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px 20px; margin-top: 20px; }
.kc-group h4 { font: 700 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--h) var(--lane-s) var(--lane-l)); margin-bottom: 6px; }
.kc-item { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 3px 0; cursor: pointer; }

.kc-item small { color: var(--ink-3); font: 10.5px var(--f-mono); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.modal-actions .spacer { flex: 1; }
.help-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin-top: 18px; font-size: 14.5px; }
.help-grid h4 { font-size: 16px; margin-bottom: 4px; }
.help-grid p { margin: 0; color: var(--ink-2); }
.io-area { width: 100%; min-height: 120px; margin-top: 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--paper); padding: 10px; font: 12px var(--f-mono); color: var(--ink); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80;
  background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow);
}

<script>
window.ROADMAP = {"tiers":[{"id":0,"name":"Fundamentals","blurb":"Everyone starts here. What AI is, how to talk to it, and where it breaks."},{"id":1,"name":"Foundational","blurb":"The base skills each track builds on: prompting well, coding, math, and basic concepts."},{"id":2,"name":"Intermediate","blurb":"You start building: APIs, classic ML, neural nets, RAG, automations, strategy."},{"id":3,"name":"Advanced","blurb":"Production-grade work: agents, evals, transformers, fine-tuning, security."},{"id":4,"name":"Expert","blurb":"Specialist depth: inference optimization, alignment, multi-agent systems, AI-native orgs."},{"id":5,"name":"Frontier","blurb":"Open research questions. Read papers, follow labs, contribute."}],"lanes":[{"id":"tools","name":"Using AI","hue":200},{"id":"biz","name":"Business & Product","hue":35},{"id":"safety","name":"Safety & Ethics","hue":350},{"id":"foundations","name":"Math & Theory","hue":265},{"id":"code","name":"Code & Data","hue":150},{"id":"ml","name":"Machine Learning","hue":95},{"id":"dl","name":"Deep Learning","hue":315},{"id":"llm","name":"LLMs","hue":230},{"id":"apps","name":"LLM Apps & RAG","hue":180},{"id":"agents","name":"Agents & Automation","hue":15},{"id":"ops","name":"Production & Ops","hue":55}],"roles":[{"id":"aie","name":"AI Engineer","short":"AI Eng","blurb":"Builds products on top of LLMs: RAG, agents, tool use, evals, shipping to users."},{"id":"mle","name":"ML Engineer","short":"ML Eng","blurb":"Trains, tunes, and serves models. Lives between data, GPUs, and production."},{"id":"ds","name":"Data Scientist","short":"Data Sci","blurb":"Turns data into decisions with statistics, classic ML, and clear communication."},{"id":"rs","name":"Research Scientist","short":"Research","blurb":"Pushes the frontier: new architectures, training methods, alignment, interpretability."},{"id":"pm","name":"AI Product Manager","short":"PM","blurb":"Decides what AI should build, how it feels to users, and how to measure it."},{"id":"biz","name":"Business Owner / Leader","short":"Business","blurb":"Finds where AI makes or saves money, picks vendors, and leads adoption safely."},{"id":"nc","name":"No-code Automator","short":"No-code","blurb":"Wires AI into workflows with Zapier, Make, n8n, and custom assistants. No heavy coding."},{"id":"pu","name":"Everyday Power User","short":"Power user","blurb":"Uses AI daily to write, research, analyse, and create faster and better."}],"nodes":[{"id":"what-is-ai","title":"What AI Is (and Isn't)","tier":0,"lane":"tools","prereqs":[],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"AI is software that learns patterns from data instead of following rules a programmer wrote by hand. Today's chat assistants are large language models (LLMs): systems trained on huge amounts of text to predict what comes next, which turns out to let them write, summarize, reason through problems, and use tools.","why":"Everything else on this map builds on a clear picture of what these systems are. If you know what is really happening under the hood, you can tell when to trust AI, when to double-check it, and when not to use it at all.","depth":"Aim for a solid mental model, not technical detail. You don't need to know how neural networks are trained; you do need to know that AI predicts likely answers rather than looking up true ones, and that it can be confidently wrong.","hours":4,"outcomes":["You can explain in plain words the difference between AI, machine learning, deep learning, and generative AI.","You can describe what an LLM does when it answers a question, and why that means it can make things up.","You can name tasks AI is reliably good at today and tasks where it still struggles.","You can spot hype in an AI claim and ask the right follow-up question."],"project":"Write a one-page explainer called 'What AI is, in our house (or company)' for a friend or coworker who has never used it. Include three things it does well, three it gets wrong, and one real example you tested yourself where it confidently made a mistake.","resources":[{"title":"Elements of AI","url":"https://www.elementsofai.com/","type":"course","source":"University of Helsinki","free":true},{"title":"AI For Everyone","url":"https://www.deeplearning.ai/courses/ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true},{"title":"Large Language Models explained briefly","url":"https://www.youtube.com/watch?v=LPZh9BOjkQs","type":"video","source":"3Blue1Brown","free":true},{"title":"AI Fluency: Framework & Foundations","url":"https://anthropic.skilljar.com/ai-fluency-framework-foundations","type":"course","source":"Anthropic","free":true},{"title":"Intro to Large Language Models","url":"https://www.youtube.com/watch?v=zjkBMFhNj_g","type":"video","source":"Andrej Karpathy","free":true},{"title":"What Is Artificial Intelligence (AI)?","url":"https://www.ibm.com/think/topics/artificial-intelligence","type":"article","source":"IBM","free":true}],"subtopics":[{"title":"AI, machine learning, deep learning, generative AI","desc":"These terms nest inside each other. AI is the broad goal, machine learning is learning from data, deep learning uses large neural networks, and generative AI creates new text, images, or audio.","level":"core","resources":[{"title":"Elements of AI","url":"https://www.elementsofai.com/","type":"course","source":"University of Helsinki","free":true}]},{"title":"How a language model produces an answer","desc":"An LLM breaks text into tokens and repeatedly predicts the next one. Training on vast text gives it broad knowledge and skills, but it has no built-in fact checker.","level":"core","resources":[{"title":"Large Language Models explained briefly","url":"https://www.youtube.com/watch?v=LPZh9BOjkQs","type":"video","source":"3Blue1Brown","free":true}]},{"title":"What AI is good and bad at","desc":"AI ability is 'jagged': it can ace a hard exam question and then fail a simple counting task. Learn the rough shape of that frontier so you pick the right jobs for it.","level":"core","resources":[{"title":"Centaurs and Cyborgs on the Jagged Frontier","url":"https://www.oneusefulthing.org/p/centaurs-and-cyborgs-on-the-jagged","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Assistants, reasoning models, and agents","desc":"A chat assistant answers a message. A reasoning model 'thinks' step by step before answering, which helps on hard problems. An agent can take actions on its own, like searching, running code, or editing files, over many steps.","level":"core","resources":[]},{"title":"Training vs. using a model","desc":"Building a model costs huge amounts of data and compute and happens once. Using it (called inference) is what you do every time you send a prompt. Most people and businesses only ever use models.","level":"deep","resources":[{"title":"Intro to Large Language Models","url":"https://www.youtube.com/watch?v=zjkBMFhNj_g","type":"video","source":"Andrej Karpathy","free":true}]},{"title":"Separating hype from reality","desc":"Claims like 'AI will replace all jobs' or 'it's just autocomplete' both miss the mark. Learn to ask what was measured, on which task, and compared to what.","level":"optional","resources":[{"title":"AI as Normal Technology (newsletter)","url":"https://www.normaltech.ai/","type":"article","source":"Arvind Narayanan & Sayash Kapoor","free":true}]}]},{"id":"ai-landscape","title":"The AI Tool Landscape","tier":0,"lane":"tools","prereqs":["what-is-ai"],"roles":{"aie":"r","mle":"a","ds":"a","rs":"a","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"The AI tool landscape is the map of products you can actually use: general assistants like ChatGPT, Claude, Gemini, and Copilot, plus specialist tools for search, writing, coding, meetings, images, audio, video, and automation.","why":"New tools appear every week, and most are thin wrappers around a few underlying models. Knowing the categories lets you pick the right tool quickly, avoid paying twice for the same thing, and ignore most of the noise.","depth":"Know the main assistant families and the categories of specialist tools well enough to choose. You don't need to track every launch or benchmark; you do need a simple way to compare tools on your own tasks.","hours":5,"outcomes":["You can name the major general-purpose assistants and what each is known for.","You can sort a new AI product into a category and tell whether it adds real value over a general assistant.","You can compare two tools on a task you care about with a fair side-by-side test.","You can explain the difference between free, paid, and business/enterprise plans, including what happens to your data."],"project":"Pick three real tasks from your week (for example: drafting an email, summarizing a PDF, planning a trip). Run each through two different assistants with the identical prompt. Score the outputs in a simple table and write two sentences on which tool you'll default to and why.","resources":[{"title":"A Guide to Which AI to Use in the Agentic Era","url":"https://www.oneusefulthing.org/p/a-guide-to-which-ai-to-use-in-the","type":"article","source":"Ethan Mollick","free":true},{"title":"How I use LLMs","url":"https://www.youtube.com/watch?v=EWvNQjAaOHw","type":"video","source":"Andrej Karpathy","free":true},{"title":"The best AI productivity tools","url":"https://zapier.com/blog/best-ai-productivity-tools/","type":"article","source":"Zapier","free":true},{"title":"Artificial Analysis: model comparisons","url":"https://artificialanalysis.ai/","type":"tool","source":"Artificial Analysis","free":true},{"title":"AI Index Report","url":"https://hai.stanford.edu/ai-index","type":"article","source":"Stanford HAI","free":true},{"title":"Simon Willison's Weblog","url":"https://simonwillison.net/","type":"article","source":"Simon Willison","free":true}],"subtopics":[{"title":"General-purpose assistants","desc":"ChatGPT (OpenAI), Claude (Anthropic), Gemini (Google), and Microsoft Copilot are the big four. They overlap a lot, but differ in writing style, tool integrations, file handling, and which apps they live inside.","level":"core","resources":[{"title":"A Guide to Which AI to Use in the Agentic Era","url":"https://www.oneusefulthing.org/p/a-guide-to-which-ai-to-use-in-the","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Models vs. products","desc":"A model (like a specific GPT, Claude, or Gemini version) is the engine. A product (the chat app, a writing tool, a meeting recorder) wraps a model with an interface and features. Many products let you pick which model runs underneath.","level":"core","resources":[]},{"title":"Specialist tool categories","desc":"AI search and research (Perplexity, deep research modes), meeting notes, writing aids, coding assistants, image/audio/video generators, and automation platforms. Each solves a narrower job, usually with better workflow fit.","level":"core","resources":[{"title":"The best AI productivity tools","url":"https://zapier.com/blog/best-ai-productivity-tools/","type":"article","source":"Zapier","free":true}]},{"title":"Plans, pricing, and data handling","desc":"Free tiers have usage limits and may use your chats for training unless you opt out. Business and enterprise plans usually exclude your data from training and add admin controls. Check the settings before pasting anything sensitive.","level":"core","resources":[]},{"title":"Reading leaderboards and benchmarks","desc":"Sites like Artificial Analysis compare models on quality, speed, and price. They are useful for a shortlist, but your own tasks are the real test.","level":"deep","resources":[{"title":"Artificial Analysis","url":"https://artificialanalysis.ai/","type":"tool","source":"Artificial Analysis","free":true}]},{"title":"Open-weight and local models","desc":"Some models (like Llama, Mistral, Qwen, Gemma) can be downloaded and run on your own computer or servers. That trades some convenience and capability for privacy and control.","level":"optional","resources":[]}]},{"id":"prompting-basics","title":"Prompting Basics","tier":0,"lane":"tools","prereqs":["what-is-ai"],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"Prompting is how you ask AI for what you want. Good basic prompts give context, a clear task, and a description of what a good answer looks like, then you refine through conversation.","why":"The same model gives weak or excellent results depending on how you ask. A few simple habits get most people from 'AI is underwhelming' to 'AI saves me hours a week'.","depth":"Master the everyday habits: context, clear asks, examples, and iterating. You don't need special 'magic words' or long templates; modern models respond best to plain, specific instructions, like briefing a smart new colleague.","hours":5,"outcomes":["You can write a prompt that includes the context, the task, and the format you want.","You can improve a weak answer by giving feedback in the same chat instead of starting over.","You can use examples and documents in a prompt to steer the result.","You can recognize when to start a fresh chat because the conversation has gone off track."],"project":"Take one task you do every week. Write a one-line prompt for it and save the result. Then rewrite the prompt with context, audience, format, and an example, and compare. Keep the improved version in a notes file as the start of your personal prompt library.","resources":[{"title":"Prompt engineering overview","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview","type":"docs","source":"Anthropic","free":true},{"title":"Google Workspace with Gemini Prompt Guide","url":"https://workspace.google.com/learning/content/gemini-prompt-guide","type":"docs","source":"Google","free":true},{"title":"AI prompt guide: How to write effective AI prompts","url":"https://zapier.com/blog/ai-prompt/","type":"article","source":"Zapier","free":true},{"title":"How I use LLMs","url":"https://www.youtube.com/watch?v=EWvNQjAaOHw","type":"video","source":"Andrej Karpathy","free":true},{"title":"Learn Prompting","url":"https://learnprompting.org/","type":"course","source":"Learn Prompting","free":true},{"title":"Google AI Essentials","url":"https://grow.google/ai-essentials/","type":"course","source":"Google","free":false}],"subtopics":[{"title":"Give context like you're briefing a colleague","desc":"Say who you are, who the output is for, and why you need it. The model can't read your mind, and missing context is the most common cause of generic answers.","level":"core","resources":[{"title":"Prompting best practices: be clear and direct","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#be-clear-and-direct","type":"docs","source":"Anthropic","free":true}]},{"title":"Be specific about the output","desc":"State length, tone, structure, and audience. 'Three bullet points for a busy CFO' beats 'summarize this'.","level":"core","resources":[]},{"title":"Show examples","desc":"Pasting one or two examples of what good looks like (a past email, a sample format) is often the fastest way to get the style you want.","level":"core","resources":[]},{"title":"Iterate in conversation","desc":"Treat the first answer as a draft. Tell the model what to change, ask it to try three alternatives, or ask what information it needs from you.","level":"core","resources":[{"title":"Working with AI: Two paths to prompting","url":"https://www.oneusefulthing.org/p/working-with-ai-two-paths-to-prompting","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Attach files and sources","desc":"Upload the document, spreadsheet, or screenshot instead of describing it. Answers grounded in your material are far more accurate than answers from the model's memory.","level":"core","resources":[]},{"title":"Know when to start fresh","desc":"Long chats fill up with old instructions and mistakes that keep influencing answers. A clean chat with a better first prompt often beats ten corrections.","level":"deep","resources":[]}]},{"id":"ai-for-business-101","title":"AI for Business: Where It Fits","tier":0,"lane":"biz","prereqs":["what-is-ai"],"roles":{"aie":"a","pm":"c","biz":"c","nc":"r","pu":"r"},"summary":"This is the business owner's overview of where AI fits: which kinds of work it helps with, what it costs, what risks it brings, and how other companies are using it today.","why":"Leaders face constant pressure to 'do something with AI'. A clear picture of where AI actually creates value helps you avoid both wasted pilots and missed opportunities.","depth":"Understand the main categories of business value and the main risks well enough to lead a conversation. You don't need technical knowledge of models; you do need to know that AI works best on specific tasks inside processes, not as a vague 'transformation'.","hours":6,"outcomes":["You can describe the main ways AI creates business value: saving time, improving quality, growing revenue, and enabling new offerings.","You can explain the difference between tasks AI can fully automate and tasks where it assists a person.","You can name the key risks (accuracy, data privacy, legal, reputational) and basic mitigations.","You can point to real examples of AI use in your industry."],"project":"Write a one-page 'AI in our business' brief: list your five biggest areas of work, mark which tasks in each AI could assist or automate, note one competitor or peer example, and list the top three risks with a one-line guardrail for each.","resources":[{"title":"Generative AI for Everyone","url":"https://www.deeplearning.ai/courses/generative-ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true},{"title":"AI For Everyone","url":"https://www.deeplearning.ai/courses/ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true},{"title":"AI in the Enterprise","url":"https://cdn.openai.com/business-guides-and-resources/ai-in-the-enterprise.pdf","type":"article","source":"OpenAI","free":true},{"title":"Real-world gen AI use cases from leading organizations","url":"https://cloud.google.com/transform/101-real-world-generative-ai-use-cases-from-industry-leaders","type":"article","source":"Google Cloud","free":true},{"title":"Co-Intelligence: Living and Working with AI","url":"https://www.penguinrandomhouse.com/books/741805/co-intelligence-by-ethan-mollick/","type":"book","source":"Ethan Mollick","free":false},{"title":"Work Trend Index","url":"https://www.microsoft.com/en-us/worklab/work-trend-index","type":"article","source":"Microsoft","free":true}],"subtopics":[{"title":"Tasks, not jobs","desc":"AI rarely replaces a whole role. It takes on specific tasks: drafting, summarizing, classifying, answering routine questions, extracting data. Think about work as a list of tasks to find the fit.","level":"core","resources":[{"title":"The Anthropic Economic Index","url":"https://www.anthropic.com/economic-index","type":"article","source":"Anthropic","free":true}]},{"title":"Where the value shows up","desc":"Common wins are customer support, sales and marketing content, internal knowledge search, document processing, coding, and analysis. Look at what peers in your industry have already shipped.","level":"core","resources":[{"title":"Real-world gen AI use cases from leading organizations","url":"https://cloud.google.com/transform/101-real-world-generative-ai-use-cases-from-industry-leaders","type":"article","source":"Google Cloud","free":true}]},{"title":"Augment vs. automate","desc":"Augmentation helps a person do the job faster or better and keeps them in charge. Automation lets AI do it end to end. Most companies should start with augmentation, then automate what proves reliable.","level":"core","resources":[]},{"title":"Costs","desc":"Costs include subscriptions or usage fees, setup and integration work, training staff, and the time spent checking output. Seat-based tools are predictable; usage-based APIs scale with volume.","level":"core","resources":[]},{"title":"Risks and guardrails","desc":"AI can be wrong, leak sensitive data if used carelessly, and create legal exposure. A simple acceptable-use policy and business-grade plans address most early risks.","level":"core","resources":[{"title":"How to Implement AI Responsibly","url":"https://hbr.org/2024/05/how-to-implement-ai-responsibly","type":"article","source":"Harvard Business Review","free":false}]},{"title":"Agents in business","desc":"AI agents can run multi-step work like processing an order or researching leads. They are powerful but need clear limits, logging, and human sign-off on important actions.","level":"deep","resources":[]}]},{"id":"ai-limitations","title":"Hallucinations & Limits","tier":0,"lane":"safety","prereqs":["what-is-ai"],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"AI models can sound confident and still be wrong. A hallucination is when a model produces something plausible but false, like a fake citation, a wrong number, or an API function that does not exist.","why":"Every AI user hits this on day one. Knowing where models fail tells you when to trust an answer, when to check it, and when not to use AI at all.","depth":"Everyone must master the practical habits: spot risky tasks, check facts that matter, and give the model sources to work from. You only need to know that the technical causes exist (next-token prediction, training that rewards guessing); you don't need to study them.","hours":4,"outcomes":["You can explain in plain words why a language model can invent facts while sounding sure of itself.","You can tell which tasks are high-risk for hallucination (citations, niche facts, exact numbers, recent events) and which are low-risk.","You can use grounding, \"say I don't know\" instructions, and source checks to cut errors.","You can describe other common failure modes: sycophancy, stale knowledge, weak arithmetic, and losing track of long inputs."],"project":"Pick a topic you know well. Ask an AI assistant 15 questions about it: 5 common facts, 5 obscure facts, and 5 requests for sources. Check every answer and log which kinds of questions failed. Then repeat the obscure ones with a pasted source document and \"say I don't know if unsure,\" and compare the error rate.","resources":[{"title":"Deep Dive into LLMs like ChatGPT (hallucination section)","url":"https://www.youtube.com/watch?v=7xTGNNLPyMI","type":"video","source":"Andrej Karpathy","free":true},{"title":"Why language models hallucinate","url":"https://openai.com/index/why-language-models-hallucinate/","type":"article","source":"OpenAI","free":true},{"title":"Reduce hallucinations","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","type":"docs","source":"Anthropic","free":true},{"title":"Centaurs and Cyborgs on the Jagged Frontier","url":"https://www.oneusefulthing.org/p/centaurs-and-cyborgs-on-the-jagged","type":"article","source":"Ethan Mollick","free":true},{"title":"Simon Willison on hallucinations","url":"https://simonwillison.net/tags/hallucinations/","type":"article","source":"Simon Willison","free":true},{"title":"Extrinsic Hallucinations in LLMs","url":"https://lilianweng.github.io/posts/2024-07-07-hallucination/","type":"article","source":"Lilian Weng","free":true}],"subtopics":[{"title":"Why models hallucinate","desc":"A model predicts likely text. It has no built-in fact database, and training and benchmarks have often rewarded a confident guess over admitting uncertainty.","level":"core","resources":[{"title":"Why language models hallucinate","url":"https://openai.com/index/why-language-models-hallucinate/","type":"article","source":"OpenAI","free":true}]},{"title":"The jagged frontier","desc":"AI can be excellent at a hard task and fail at an easy-looking one right next to it. You can't guess its skill from how hard a task feels to a human, so you learn it by testing.","level":"core","resources":[{"title":"Centaurs and Cyborgs on the Jagged Frontier","url":"https://www.oneusefulthing.org/p/centaurs-and-cyborgs-on-the-jagged","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Practical ways to reduce hallucinations","desc":"Give the model the source documents, ask it to quote them, let it say \"I don't know,\" turn on web search for current facts, and verify anything you will act on.","level":"core","resources":[{"title":"Reduce hallucinations","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","type":"docs","source":"Anthropic","free":true}]},{"title":"Sycophancy","desc":"Models tend to agree with you, praise your idea, or change a correct answer when you push back. Ask neutral questions and invite criticism to get honest output.","level":"core","resources":[{"title":"Towards Understanding Sycophancy in Language Models","url":"https://arxiv.org/abs/2310.13548","type":"paper","source":"arXiv (Anthropic)","free":true}]},{"title":"Knowledge cutoffs, long context, and counting","desc":"Models know little after their training cutoff unless they search. They can miss details buried in the middle of long inputs. Exact counting and arithmetic are unreliable without a tool like code execution.","level":"deep","resources":[{"title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://arxiv.org/abs/2307.03172","type":"paper","source":"arXiv","free":true}]},{"title":"Reasoning failures and odd blind spots","desc":"Reasoning models are much better at multi-step problems but still make logic slips. Some gaps are strange. For example, a model trained on \"A is B\" may not know \"B is A.\"","level":"optional","resources":[{"title":"The Reversal Curse","url":"https://arxiv.org/abs/2309.12288","type":"paper","source":"arXiv","free":true}]}]},{"id":"math-intuition","title":"Math Intuition for AI","tier":0,"lane":"foundations","prereqs":[],"roles":{"aie":"r","mle":"c","ds":"c","rs":"c","pm":"a"},"summary":"Math intuition for AI means understanding the few big ideas that make machine learning work (vectors, functions, slopes, probability, and averages) without needing to do the calculations by hand.","why":"Almost every AI concept, from embeddings to training loss to temperature, is a math idea in disguise. A little intuition turns jargon into something you can reason about.","depth":"How much math you need depends on your role. AI engineers building apps need only this intuition level: what a vector and similarity are, what training minimizes, and what a probability distribution is. PMs need even less. ML engineers, data scientists, and researchers should treat this as a warm-up before the deeper math nodes.","hours":8,"outcomes":["You can explain an embedding as a list of numbers where similar things end up close together.","You can explain training as \"adjusting numbers to make the error smaller, one small step at a time.\"","You can explain an LLM's output as a probability distribution over next tokens, and what temperature does to it.","You can read a simple formula with a sum or a dot product and say what it computes."],"project":"Get embeddings for 20 short sentences from any embedding API (or a spreadsheet of made-up 3-number vectors). Compute cosine similarity between every pair and confirm that sentences with similar meaning score higher. Then, in the TensorFlow Playground, train a tiny network and write three sentences explaining what the loss curve and learning rate are doing.","resources":[{"title":"Neural networks series","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi","type":"video","source":"3Blue1Brown","free":true},{"title":"Machine Learning Crash Course","url":"https://developers.google.com/machine-learning/crash-course","type":"course","source":"Google","free":true},{"title":"A Neural Network Playground","url":"https://playground.tensorflow.org/","type":"interactive","source":"Google","free":true},{"title":"Seeing Theory","url":"https://seeing-theory.brown.edu/","type":"interactive","source":"Brown University","free":true},{"title":"Mathematics for Machine Learning and Data Science","url":"https://www.deeplearning.ai/specializations/mathematics-for-machine-learning-and-data-science","type":"course","source":"DeepLearning.AI","free":false},{"title":"BetterExplained","url":"https://betterexplained.com/","type":"article","source":"Kalid Azad","free":true}],"subtopics":[{"title":"Vectors and similarity","desc":"A vector is a list of numbers that can represent a word, image, or user. Cosine similarity measures how closely two vectors point in the same direction, which is how semantic search works.","level":"core","resources":[{"title":"Essence of linear algebra (chapter 1)","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Functions and models","desc":"A model is a function that turns inputs into outputs, controlled by adjustable numbers called parameters. An LLM is the same idea with billions of parameters.","level":"core","resources":[]},{"title":"Slopes, loss, and gradient descent","desc":"Loss measures how wrong a model is. The gradient tells you which way to nudge each parameter to reduce it. Training repeats that nudge millions of times.","level":"core","resources":[{"title":"Neural networks series","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi","type":"video","source":"3Blue1Brown","free":true},{"title":"A Neural Network Playground","url":"https://playground.tensorflow.org/","type":"interactive","source":"Google","free":true}]},{"title":"Probability and sampling","desc":"Models output probabilities, not certainties. Sampling picks from those probabilities, and temperature makes the choice more or less random.","level":"core","resources":[{"title":"Seeing Theory","url":"https://seeing-theory.brown.edu/","type":"interactive","source":"Brown University","free":true}]},{"title":"Averages, spread, and noise","desc":"Means, variance, and sample size explain why one test run proves little and why eval results need enough examples to be trusted.","level":"deep","resources":[]},{"title":"Reading math notation","desc":"Learn to read Σ (sum), subscripts, vectors in bold, and function notation. That small step lets you follow docs and blog posts that use formulas.","level":"optional","resources":[]}]},{"id":"python-basics","title":"Python Basics","tier":0,"lane":"code","prereqs":[],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"a","nc":"a"},"summary":"Python is the main programming language of AI. This node covers the core language: variables, types, control flow, functions, data structures, files, and running code in a proper environment.","why":"Nearly every AI library, SDK, notebook, and tutorial assumes Python. Even if an AI assistant writes most of your code, you need to read it, run it, and fix it when it breaks.","depth":"Master the basics until you can write a 100-line script without looking things up: lists, dicts, loops, functions, imports, reading files, and handling errors. Classes, type hints, and packaging only need a working understanding at this stage. Decorators, generators, and async are things to recognize, not master yet.","hours":40,"outcomes":["You can write and run a Python script that reads a file, processes it, and writes results.","You can choose the right built-in data structure (list, dict, set, tuple) for a job.","You can create a virtual environment and install packages without breaking your system Python.","You can read a traceback and find the line and cause of an error.","You can read code an AI assistant wrote and explain what each part does."],"project":"Write a command-line script that reads a folder of text files, counts word frequencies, ignores a list of stopwords, and saves the top 20 words per file to a JSON file. Run it inside a virtual environment.","resources":[{"title":"CS50's Introduction to Programming with Python","url":"https://cs50.harvard.edu/python/","type":"course","source":"Harvard","free":true},{"title":"The Python Tutorial","url":"https://docs.python.org/3/tutorial/","type":"docs","source":"Python.org","free":true},{"title":"Automate the Boring Stuff with Python","url":"https://automatetheboringstuff.com/","type":"book","source":"Al Sweigart","free":true},{"title":"Kaggle Learn: Python","url":"https://www.kaggle.com/learn/python","type":"interactive","source":"Kaggle","free":true},{"title":"Python Tutor (visualize code execution)","url":"https://pythontutor.com/","type":"interactive","source":"Python Tutor","free":true},{"title":"Learn Python - Full Course for Beginners","url":"https://www.youtube.com/watch?v=rfscVS0vtbw","type":"video","source":"freeCodeCamp","free":true},{"title":"Exercism Python track","url":"https://exercism.org/tracks/python","type":"interactive","source":"Exercism","free":true}],"subtopics":[{"title":"Values, types, and control flow","desc":"Numbers, strings, booleans, None, if/elif/else, for and while loops. This is the grammar every other topic builds on.","level":"core","resources":[{"title":"The Python Tutorial: More Control Flow Tools","url":"https://docs.python.org/3/tutorial/controlflow.html","type":"docs","source":"Python.org","free":true}]},{"title":"Built-in data structures","desc":"Lists, dicts, sets, and tuples, plus comprehensions. Dicts in particular show up everywhere in AI work because JSON maps directly onto them.","level":"core","resources":[{"title":"The Python Tutorial: Data Structures","url":"https://docs.python.org/3/tutorial/datastructures.html","type":"docs","source":"Python.org","free":true}]},{"title":"Functions, modules, and imports","desc":"Writing functions with arguments and return values, splitting code into files, and importing from libraries. This is how you keep scripts readable as they grow.","level":"core","resources":[]},{"title":"Files, errors, and exceptions","desc":"Reading and writing text, CSV, and JSON files, and using try/except so a script fails clearly instead of mysteriously.","level":"core","resources":[{"title":"The Python Tutorial: Errors and Exceptions","url":"https://docs.python.org/3/tutorial/errors.html","type":"docs","source":"Python.org","free":true}]},{"title":"Environments and packages (venv, pip, uv)","desc":"A virtual environment is an isolated folder of packages for one project. Learn to create one, install dependencies, and pin them in a requirements or pyproject file. uv is the fast modern tool most new projects use.","level":"core","resources":[{"title":"Virtual Environments and Packages","url":"https://docs.python.org/3/tutorial/venv.html","type":"docs","source":"Python.org","free":true},{"title":"uv documentation","url":"https://docs.astral.sh/uv/","type":"tool","source":"Astral","free":true}]},{"title":"Classes and type hints","desc":"Classes bundle data with behavior. Type hints (like def f(x: int) -> str) document what a function expects and power tools like Pydantic, which LLM SDKs use heavily.","level":"deep","resources":[{"title":"The Python Tutorial: Classes","url":"https://docs.python.org/3/tutorial/classes.html","type":"docs","source":"Python.org","free":true},{"title":"typing: Support for type hints","url":"https://docs.python.org/3/library/typing.html","type":"docs","source":"Python.org","free":true}]},{"title":"Generators, decorators, and async","desc":"Generators produce values lazily, decorators wrap functions, and async lets one program wait on many network calls at once. You will see all three in LLM SDKs and agent code. Recognize them now, learn them properly when you need them.","level":"optional","resources":[]}]},{"id":"prompt-engineering","title":"Prompt Engineering","tier":1,"lane":"tools","prereqs":["prompting-basics"],"roles":{"aie":"c","mle":"r","ds":"r","rs":"a","pm":"c","biz":"r","nc":"c","pu":"c"},"summary":"Prompt engineering is the more systematic version of prompting: structuring instructions, using examples and delimiters, asking for step-by-step reasoning, controlling output format, and testing prompts so they work reliably, not just once.","why":"Once a prompt is reused by a team, a custom assistant, or an automation, 'it worked once' isn't enough. Structured, tested prompts give consistent results and are the foundation for assistants, agents, and LLM apps.","depth":"Master clear structure, examples, output formats, and testing against a handful of real cases. Know that tricks like 'you are a world-class expert' or bribes matter much less with current models; reasoning models also need less step-by-step coaching than older ones.","hours":12,"outcomes":["You can write a reusable prompt template with sections for role, context, instructions, examples, and output format.","You can get reliable structured output (tables, JSON, fixed headings) from a model.","You can break a complex task into a chain of smaller prompts.","You can test a prompt against several real inputs and fix the failures you find.","You can explain how prompting differs for reasoning models."],"project":"Build a reusable prompt for a recurring job, such as turning messy meeting notes into a standard action-item summary. Collect 10 real inputs, run the prompt on all of them, log every failure, and revise until at least 9 of 10 come out right. Save the final prompt with a short note on what you changed and why.","resources":[{"title":"Claude prompting best practices","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","type":"docs","source":"Anthropic","free":true},{"title":"Interactive prompt engineering tutorial","url":"https://github.com/anthropics/prompt-eng-interactive-tutorial","type":"interactive","source":"Anthropic","free":true},{"title":"Prompt engineering guide","url":"https://developers.openai.com/api/docs/guides/prompt-engineering","type":"docs","source":"OpenAI","free":true},{"title":"Prompt design strategies","url":"https://ai.google.dev/gemini-api/docs/prompting-strategies","type":"docs","source":"Google","free":true},{"title":"AI prompt engineering: A deep dive","url":"https://www.youtube.com/watch?v=T9aRN5JkmL8","type":"video","source":"Anthropic","free":true},{"title":"Prompt Engineering whitepaper","url":"https://www.kaggle.com/whitepaper-prompt-engineering","type":"paper","source":"Google / Kaggle","free":true},{"title":"Prompt Engineering Guide","url":"https://www.promptingguide.ai/","type":"article","source":"DAIR.AI","free":true}],"subtopics":[{"title":"Structure: roles, sections, and delimiters","desc":"Separate instructions from data with clear headings or XML-style tags like <document>. This stops the model from confusing your material with your instructions.","level":"core","resources":[{"title":"Structure prompts with XML tags","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#structure-prompts-with-xml-tags","type":"docs","source":"Anthropic","free":true}]},{"title":"Few-shot examples","desc":"Include a few input/output pairs that show exactly what you want. Vary them so the model learns the pattern rather than copying one example.","level":"core","resources":[{"title":"Use examples effectively","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#use-examples-effectively","type":"docs","source":"Anthropic","free":true}]},{"title":"Reasoning and thinking","desc":"Asking the model to think before answering improves hard tasks. Reasoning models do this automatically, so with them you focus on the goal and constraints rather than spelling out every step.","level":"core","resources":[{"title":"Reasoning models guide","url":"https://developers.openai.com/api/docs/guides/reasoning","type":"docs","source":"OpenAI","free":true}]},{"title":"Output formatting","desc":"Specify the exact shape you want: a table, a JSON object, a fixed set of headings. Consistent formats make results easy to paste into documents, spreadsheets, or automations.","level":"core","resources":[]},{"title":"Prompt chaining","desc":"Split big jobs into steps (extract, then analyze, then write) where each prompt's output feeds the next. Each step is easier to check and fix.","level":"deep","resources":[]},{"title":"Testing prompts","desc":"Collect 5 to 20 real inputs, including tricky ones, and run your prompt on all of them whenever you change it. This is the small-scale version of the evals that AI engineers use.","level":"deep","resources":[{"title":"Define success criteria and build evaluations","url":"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests","type":"docs","source":"Anthropic","free":true}]},{"title":"From prompts to context engineering","desc":"In agents and apps, the prompt is only part of what the model sees. Context engineering is deciding which documents, tool results, and history go into the model's limited context window.","level":"optional","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true}]}]},{"id":"ai-productivity","title":"AI in Daily Workflows","tier":1,"lane":"tools","prereqs":["prompting-basics","ai-landscape"],"roles":{"aie":"a","mle":"a","ds":"r","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"This is about weaving AI into the work you already do: email, documents, research, meetings, spreadsheets, planning, and learning. The goal is steady time savings and better quality, not occasional novelty.","why":"Most of AI's value for individuals and small teams comes from many small daily uses that add up. People who build these habits get hours back each week; people who don't often conclude AI 'isn't that useful'.","depth":"Master a handful of repeatable workflows in the tools you already use, plus the habit of checking outputs. You don't need to adopt every new app; you do need to know which tasks to hand off, which to do together with AI, and which to keep for yourself.","hours":10,"outcomes":["You can map your weekly tasks and pick the ones where AI saves the most time.","You can use AI for writing, summarizing, research, and data analysis with a reliable checking step.","You can use built-in AI features in your email, docs, and spreadsheet tools.","You can use deep research and file analysis features to get sourced answers.","You can measure how much time a new AI habit actually saves."],"project":"Track your work for one week and list every recurring task. Pick the three best AI candidates, design a workflow for each (prompt, tool, and how you'll check the output), and use them for two weeks. Record minutes saved per task and decide which to keep.","resources":[{"title":"How I use LLMs","url":"https://www.youtube.com/watch?v=EWvNQjAaOHw","type":"video","source":"Andrej Karpathy","free":true},{"title":"15 Times to use AI, and 5 Not to","url":"https://www.oneusefulthing.org/p/15-times-to-use-ai-and-5-not-to","type":"article","source":"Ethan Mollick","free":true},{"title":"OpenAI Academy","url":"https://academy.openai.com/","type":"course","source":"OpenAI","free":true},{"title":"Anthropic Courses (AI Fluency and more)","url":"https://anthropic.skilljar.com/","type":"course","source":"Anthropic","free":true},{"title":"Google Workspace with Gemini Prompt Guide","url":"https://workspace.google.com/learning/content/gemini-prompt-guide","type":"docs","source":"Google","free":true},{"title":"Co-Intelligence: Living and Working with AI","url":"https://www.penguinrandomhouse.com/books/741805/co-intelligence-by-ethan-mollick/","type":"book","source":"Ethan Mollick","free":false}],"subtopics":[{"title":"Auditing your work for AI fit","desc":"List your recurring tasks and rate each one: how often, how long, how risky if wrong. Frequent, time-consuming, low-risk tasks with easy checking are the best starting points.","level":"core","resources":[{"title":"15 Times to use AI, and 5 Not to","url":"https://www.oneusefulthing.org/p/15-times-to-use-ai-and-5-not-to","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Writing and editing","desc":"Use AI for first drafts, rewrites for different audiences, tightening long text, and getting critical feedback. Keep your own judgment and voice in the final version.","level":"core","resources":[]},{"title":"Research and deep research","desc":"Search-connected assistants and deep research modes read many web pages and return a sourced report. Always open the key sources yourself before relying on a claim.","level":"core","resources":[]},{"title":"Working with your own files and data","desc":"Upload PDFs, spreadsheets, and slides to get summaries, comparisons, charts, and analysis. Tools like Gemini Notebook (formerly NotebookLM) and Claude or ChatGPT Projects keep a set of sources handy.","level":"core","resources":[]},{"title":"AI inside the tools you already use","desc":"Microsoft 365 Copilot, Gemini in Google Workspace, and assistants connected to your email, calendar, and drives can act on your real work. Connectors (often built on MCP) let one assistant reach many apps.","level":"deep","resources":[{"title":"Microsoft 365 Copilot","url":"https://www.microsoft.com/en-us/microsoft-365/copilot","type":"tool","source":"Microsoft","free":false}]},{"title":"Verification habits","desc":"Decide in advance how you'll check each type of output: open the cited source, re-run the numbers, or ask a second model. The check should take much less time than doing the task yourself.","level":"core","resources":[]},{"title":"Handing off to agents","desc":"Agent features can now browse, fill forms, and run multi-step tasks for you. Start with low-stakes tasks and review what they did before trusting them with more.","level":"optional","resources":[]}]},{"id":"multimodal-tools","title":"Image, Audio & Video Generation","tier":1,"lane":"tools","prereqs":["ai-landscape"],"roles":{"aie":"a","pm":"a","biz":"a","nc":"r","pu":"r"},"summary":"Multimodal tools create or understand images, audio, and video, not just text. They cover image generation and editing, voice and speech, music, and short video clips.","why":"Visuals, voice, and video used to need specialists and budgets. Now a small business or individual can make product images, voiceovers, explainer clips, and transcripts in minutes, if they understand the quality limits and the legal risks.","depth":"Get hands-on with at least one image, one voice, and one video tool, and learn the rules on rights and disclosure. You don't need to understand diffusion models; you do need to know about likeness, copyright, and labeling AI-made media.","hours":8,"outcomes":["You can generate and edit images with text prompts and reference images to match a specific look.","You can produce a voiceover or transcription and fix common errors.","You can create a short AI video clip and know its current length and consistency limits.","You can explain the copyright, likeness, and disclosure rules that apply to AI-generated media."],"project":"Make a 30-second promo for a real or imaginary product: three AI-generated images or clips, an AI voiceover reading a script you wrote with AI help, and simple editing to combine them. Add a note listing every tool used, its commercial-use terms, and how you labeled the result as AI-made.","resources":[{"title":"Image generation guide","url":"https://ai.google.dev/gemini-api/docs/image-generation","type":"docs","source":"Google","free":true},{"title":"Image generation guide","url":"https://developers.openai.com/api/docs/guides/image-generation","type":"docs","source":"OpenAI","free":true},{"title":"Runway Academy","url":"https://academy.runwayml.com/","type":"course","source":"Runway","free":true},{"title":"Veo","url":"https://deepmind.google/models/veo/","type":"tool","source":"Google DeepMind","free":true},{"title":"ElevenLabs documentation","url":"https://elevenlabs.io/docs/overview/intro","type":"docs","source":"ElevenLabs","free":true},{"title":"Copyright and Artificial Intelligence","url":"https://www.copyright.gov/ai/","type":"docs","source":"U.S. Copyright Office","free":true},{"title":"Content Authenticity Initiative","url":"https://contentauthenticity.org/","type":"article","source":"Content Authenticity Initiative","free":true}],"subtopics":[{"title":"Image generation and editing","desc":"Tools built into ChatGPT, Gemini, Midjourney, Adobe Firefly, and Canva can create images from text or edit existing ones by instruction. Describe subject, style, composition, and lighting, and use reference images for consistency.","level":"core","resources":[{"title":"Image generation guide","url":"https://ai.google.dev/gemini-api/docs/image-generation","type":"docs","source":"Google","free":true}]},{"title":"Voice, speech, and transcription","desc":"Text-to-speech can produce natural voiceovers in many languages; speech-to-text turns meetings and calls into searchable transcripts. Voice cloning exists but requires the speaker's clear consent.","level":"core","resources":[{"title":"ElevenLabs documentation","url":"https://elevenlabs.io/docs/overview/intro","type":"docs","source":"ElevenLabs","free":true}]},{"title":"Video generation","desc":"Models like Veo, Sora, and Runway create short clips from text or images. They are great for b-roll, concepts, and social content, but long scenes with consistent characters still take work.","level":"core","resources":[{"title":"Runway Academy","url":"https://academy.runwayml.com/","type":"course","source":"Runway","free":true}]},{"title":"Understanding images and documents","desc":"Assistants can read screenshots, charts, receipts, handwriting, and photos. This 'vision' input is often more useful day to day than generating new images.","level":"core","resources":[]},{"title":"Copyright, likeness, and commercial use","desc":"Purely AI-generated work may not be protected by copyright, tool terms differ on commercial rights, and using someone's face or voice without permission is risky or illegal. Check before you publish.","level":"deep","resources":[{"title":"Copyright and Artificial Intelligence","url":"https://www.copyright.gov/ai/","type":"docs","source":"U.S. Copyright Office","free":true}]},{"title":"Provenance and labeling","desc":"Content Credentials (the C2PA standard) and watermarks like SynthID mark media as AI-made. Some platforms and laws now require you to label synthetic media.","level":"optional","resources":[{"title":"C2PA: Verifying Media Content Sources","url":"https://c2pa.org/","type":"docs","source":"C2PA","free":true}]},{"title":"Music generation","desc":"Tools like Suno generate full songs from a prompt. Useful for background tracks and drafts; check licensing terms before commercial use.","level":"optional","resources":[]}]},{"id":"ai-use-cases","title":"Finding AI Use Cases","tier":1,"lane":"biz","prereqs":["ai-for-business-101"],"roles":{"aie":"a","ds":"a","pm":"c","biz":"c","nc":"r","pu":"a"},"summary":"Finding AI use cases means systematically spotting the tasks in your business where AI would save time, cut cost, or improve quality, and ranking them so you start with the ones most likely to pay off.","why":"Most failed AI projects picked the wrong problem: too vague, too risky, or not valuable enough. A simple discovery and scoring process gets you to quick wins and builds the confidence to tackle bigger ones.","depth":"Master a repeatable method: interview people, map tasks, score by value and feasibility, and run a small test. You don't need to estimate ROI to the dollar at this stage; a rough high/medium/low is enough to rank ideas.","hours":8,"outcomes":["You can run a discovery session with a team to surface AI opportunities.","You can break a process into tasks and spot the ones that suit AI.","You can score and rank use cases by value, feasibility, and risk.","You can design a small, time-boxed test to validate a top use case."],"project":"Interview three people in your business (or three roles you play yourself) about their weekly tasks. Build a list of at least 10 AI use cases, score each on value, feasibility, and risk in a spreadsheet, pick the top one, and write a one-page plan for a two-week test with a clear success measure.","resources":[{"title":"Identifying and Scaling AI Use Cases","url":"https://cdn.openai.com/business-guides-and-resources/identifying-and-scaling-ai-use-cases.pdf","type":"article","source":"OpenAI","free":true},{"title":"Real-world gen AI use cases from leading organizations","url":"https://cloud.google.com/transform/101-real-world-generative-ai-use-cases-from-industry-leaders","type":"article","source":"Google Cloud","free":true},{"title":"Making AI Work: Leadership, Lab, and Crowd","url":"https://www.oneusefulthing.org/p/making-ai-work-leadership-lab-and","type":"article","source":"Ethan Mollick","free":true},{"title":"Economic Index: Uneven AI adoption","url":"https://www.anthropic.com/research/anthropic-economic-index-september-2025-report","type":"article","source":"Anthropic","free":true},{"title":"Generative AI for Everyone","url":"https://www.deeplearning.ai/courses/generative-ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true},{"title":"How to Capitalize on Generative AI","url":"https://hbr.org/2023/11/how-to-capitalize-on-generative-ai","type":"article","source":"Harvard Business Review","free":false}],"subtopics":[{"title":"Discovery: ask the people doing the work","desc":"Frontline staff know which tasks are repetitive, slow, or frustrating. Ask what eats their time, what they copy and paste, and what they'd hand to an assistant.","level":"core","resources":[{"title":"Identifying and
