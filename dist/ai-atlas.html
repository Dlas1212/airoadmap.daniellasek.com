 what you can build and what paperwork you need. Fines and forced shutdowns are real risks.","depth":"Business owners and PMs must master the risk-based logic of the EU AI Act, which of their uses might be high-risk, and the existing laws (privacy, consumer protection, anti-discrimination) that already apply. Engineers only need to know the obligations that land on them: logging, transparency notices, and documentation. Leave the legal detail to counsel.","hours":8,"outcomes":["You can explain the EU AI Act's risk tiers and place a given use case in one.","You can list the main AI Act dates, including the delayed high-risk deadlines.","You can name which existing laws (GDPR, consumer protection, anti-discrimination) already apply to an AI feature.","You can use NIST AI RMF or ISO/IEC 42001 as a checklist even where no AI law applies."],"project":"List every AI feature or tool your company uses or plans (or invent five for a sample company). For each, classify its EU AI Act risk tier, note the applicable deadline, list other laws that apply, and write the top three compliance actions. Check your classifications against the AI Act Explorer's text.","resources":[{"title":"High-level summary of the AI Act","url":"https://artificialintelligenceact.eu/high-level-summary/","type":"article","source":"Future of Life Institute","free":true},{"title":"AI Act (official policy page)","url":"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai","type":"docs","source":"European Commission","free":true},{"title":"Regulation (EU) 2024/1689 (full text)","url":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj","type":"docs","source":"EUR-Lex","free":true},{"title":"Global AI Law and Policy Tracker","url":"https://iapp.org/resources/article/global-ai-legislation-tracker/","type":"article","source":"IAPP","free":true},{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true},{"title":"OECD AI Policy Observatory","url":"https://oecd.ai/","type":"docs","source":"OECD","free":true}],"subtopics":[{"title":"EU AI Act: the risk tiers","desc":"The Act bans some uses outright (like social scoring), sets heavy rules for high-risk uses (hiring, credit, education, critical infrastructure), adds transparency duties for chatbots and deepfakes, and leaves most other uses alone.","level":"core","resources":[{"title":"High-level summary of the AI Act","url":"https://artificialintelligenceact.eu/high-level-summary/","type":"article","source":"Future of Life Institute","free":true}]},{"title":"EU AI Act: the timeline","desc":"Bans and AI literacy duties applied from February 2025, general-purpose model rules from August 2025, and most other rules from August 2026. The 2026 AI Omnibus moved high-risk deadlines to December 2027 (Annex III uses) and August 2028 (AI inside regulated products).","level":"core","resources":[{"title":"AI Act (official policy page)","url":"https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai","type":"docs","source":"European Commission","free":true}]},{"title":"General-purpose AI model rules","desc":"Providers of foundation models must publish training-data summaries and technical documentation. The most capable models carry extra safety duties. The voluntary Code of Practice shows how to comply.","level":"deep","resources":[{"title":"The General-Purpose AI Code of Practice","url":"https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai","type":"docs","source":"European Commission","free":true}]},{"title":"Laws that already apply","desc":"GDPR covers personal data and automated decisions with legal effects. Consumer protection, anti-discrimination, and sector rules apply to AI just as they do to any other product.","level":"core","resources":[{"title":"GDPR Art. 22: Automated individual decision-making","url":"https://gdpr-info.eu/art-22-gdpr/","type":"docs","source":"gdpr-info.eu","free":true},{"title":"EDPB Opinion 28/2024 on AI models and personal data","url":"https://www.edpb.europa.eu/documents/opinion-of-the-board-art-64/opinion-282024-on-certain-data-protection-aspects-related-to_en","type":"docs","source":"EDPB","free":true}]},{"title":"US and global landscape","desc":"The US has no single federal AI law. Rules come from agencies, state laws, and executive orders that change often. Use a tracker rather than memorizing a list.","level":"deep","resources":[{"title":"Global AI Law and Policy Tracker","url":"https://iapp.org/resources/article/global-ai-legislation-tracker/","type":"article","source":"IAPP","free":true}]},{"title":"Voluntary standards","desc":"NIST AI RMF and ISO/IEC 42001 give a structure for managing AI risk. They are often what customers and auditors ask for, even when no law requires them.","level":"optional","resources":[{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true}]}]},{"id":"info-theory-optim","title":"Optimization & Information Theory","tier":2,"lane":"foundations","prereqs":["calculus","probability-stats"],"roles":{"mle":"r","ds":"a","rs":"c"},"summary":"Optimization is the science of how models find good parameters: gradient descent and optimizers like Adam. Information theory measures information and surprise, and gives us entropy, cross-entropy, and KL divergence, the losses most models are trained on.","why":"When training is unstable, slow, or stuck, the answer is usually in the optimizer settings or the loss. Cross-entropy, perplexity, and KL penalties in RLHF all come straight from information theory.","depth":"ML engineers must master SGD, momentum, Adam/AdamW, learning-rate schedules, and what cross-entropy, perplexity, and KL divergence mean. Researchers should go deeper into loss-landscape geometry, convergence, and newer optimizers. Data scientists need only cross-entropy and the basic idea of gradient descent. Convex optimization proofs and coding theory are 'know it exists' unless you do theory research.","hours":25,"outcomes":["You can explain entropy, cross-entropy, KL divergence, and perplexity, and how they relate.","You can explain why next-token cross-entropy loss is the training objective for LLMs.","You can compare SGD, momentum, and AdamW and choose sensible learning rates, warmup, and decay.","You can diagnose training curves that show too-high learning rate, plateaus, or divergence."],"project":"Train the same small network (for example, an MLP on MNIST or a tiny character-level language model) with SGD, SGD with momentum, and AdamW, each at three learning rates. Plot all loss curves on one chart and report final perplexity or accuracy. Write a paragraph explaining the differences using what you learned about momentum, adaptive steps, and cross-entropy.","resources":[{"title":"Visual Information Theory","url":"https://colah.github.io/posts/2015-09-Visual-Information/","type":"article","source":"Chris Olah","free":true},{"title":"An overview of gradient descent optimization algorithms","url":"https://www.ruder.io/optimizing-gradient-descent/","type":"article","source":"Sebastian Ruder","free":true},{"title":"Optimization Algorithms (Dive into Deep Learning ch. 12)","url":"https://d2l.ai/chapter_optimization/index.html","type":"book","source":"d2l.ai","free":true},{"title":"Why Momentum Really Works","url":"https://distill.pub/2017/momentum/","type":"interactive","source":"Distill","free":true},{"title":"Deep Learning (ch. 3 and 8)","url":"https://www.deeplearningbook.org/","type":"book","source":"Goodfellow, Bengio, Courville","free":true},{"title":"Information Theory, Inference, and Learning Algorithms","url":"https://www.inference.org.uk/itprnn/book.html","type":"book","source":"David MacKay","free":true},{"title":"Solving Wordle using information theory","url":"https://www.3blue1brown.com/lessons/wordle","type":"video","source":"3Blue1Brown","free":true}],"subtopics":[{"title":"Entropy, cross-entropy, and KL divergence","desc":"Entropy measures average surprise. Cross-entropy measures the cost of using the wrong distribution. KL divergence is the gap between them, and RLHF uses it to keep a model close to its starting point.","level":"core","resources":[{"title":"Visual Information Theory","url":"https://colah.github.io/posts/2015-09-Visual-Information/","type":"article","source":"Chris Olah","free":true}]},{"title":"Perplexity and compression","desc":"Perplexity is the exponent of cross-entropy, a measure of how surprised a language model is by real text. Better prediction means better compression.","level":"core","resources":[{"title":"Information Theory (Dive into Deep Learning 22.11)","url":"https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Gradient descent and SGD","desc":"Take small steps against the gradient, using a random mini-batch each time. Batch size and learning rate trade off speed, noise, and stability.","level":"core","resources":[{"title":"Optimization Algorithms (Dive into Deep Learning ch. 12)","url":"https://d2l.ai/chapter_optimization/index.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Momentum, Adam, and AdamW","desc":"Momentum smooths updates. Adam adapts the step size per parameter. AdamW fixes how weight decay interacts with Adam and is the default for training transformers.","level":"core","resources":[{"title":"An overview of gradient descent optimization algorithms","url":"https://www.ruder.io/optimizing-gradient-descent/","type":"article","source":"Sebastian Ruder","free":true},{"title":"Why Momentum Really Works","url":"https://distill.pub/2017/momentum/","type":"interactive","source":"Distill","free":true}]},{"title":"Learning-rate schedules and newer optimizers","desc":"Warmup then decay (cosine or linear) is standard. Newer optimizers like Muon, which orthogonalize updates for weight matrices, are being adopted in large-scale training.","level":"deep","resources":[{"title":"Muon: An optimizer for hidden layers in neural networks","url":"https://kellerjordan.github.io/posts/muon/","type":"article","source":"Keller Jordan","free":true},{"title":"Decoupled Weight Decay Regularization (AdamW)","url":"https://arxiv.org/abs/1711.05101","type":"paper","source":"arXiv","free":true}]},{"title":"Convex optimization and theory","desc":"Convex problems have one best answer and strong guarantees. Deep learning is not convex, but the ideas (duality, conditioning, convergence rates) still guide intuition.","level":"optional","resources":[{"title":"Convex Optimization","url":"https://web.stanford.edu/~boyd/cvxbook/","type":"book","source":"Boyd & Vandenberghe","free":true}]}]},{"id":"data-viz-eda","title":"EDA & Data Visualization","tier":2,"lane":"code","prereqs":["python-data"],"roles":{"mle":"r","ds":"c","rs":"a"},"summary":"Exploratory data analysis (EDA) is getting to know a dataset before modeling it: distributions, missing values, outliers, and relationships. Data visualization is how you see those patterns and show them to others.","why":"Most modeling mistakes, like leakage, broken labels, and skewed samples, are visible in a few plots before you train anything. Clear charts are also how data work turns into decisions people actually act on.","depth":"Master a repeatable EDA checklist and the core chart types (histogram, box plot, scatter, line, bar, heatmap) in one library, plus the judgment to pick the right one. Interactive dashboards and design theory are worth exploring later. Auto-profiling tools are helpful shortcuts but don't replace looking yourself.","hours":25,"outcomes":["You can run a structured first pass on a new dataset and list its quality problems.","You can choose a chart type that fits the question and the data type.","You can make clean, labeled plots with matplotlib or seaborn.","You can spot outliers, skew, and suspicious correlations that would mislead a model.","You can turn an analysis into a short visual story for a non-technical reader."],"project":"Pick a messy public dataset and write a notebook that follows your EDA checklist, finds at least three data quality issues, and ends with a one-page summary of five charts, each with a one-sentence takeaway a manager could act on.","resources":[{"title":"Kaggle Learn: Data Visualization","url":"https://www.kaggle.com/learn/data-visualization","type":"interactive","source":"Kaggle","free":true},{"title":"Fundamentals of Data Visualization","url":"https://clauswilke.com/dataviz/","type":"book","source":"Claus O. Wilke","free":true},{"title":"Python Data Science Handbook (Visualization with Matplotlib chapter)","url":"https://jakevdp.github.io/PythonDataScienceHandbook/","type":"book","source":"Jake VanderPlas","free":true},{"title":"seaborn user guide and tutorial","url":"https://seaborn.pydata.org/tutorial.html","type":"docs","source":"seaborn","free":true},{"title":"From Data to Viz","url":"https://www.data-to-viz.com/","type":"interactive","source":"data-to-viz.com","free":true},{"title":"Storytelling with Data (books)","url":"https://www.storytellingwithdata.com/books","type":"book","source":"Cole Nussbaumer Knaflic","free":false}],"subtopics":[{"title":"The EDA checklist","desc":"Shape, types, missing values, duplicates, summary statistics, distributions of each column, then relationships between columns and the target. Do it in the same order every time.","level":"core","resources":[{"title":"R for Data Science: Exploratory data analysis (concepts carry over to Python)","url":"https://r4ds.hadley.nz/","type":"book","source":"Hadley Wickham","free":true}]},{"title":"Plotting with matplotlib and seaborn","desc":"matplotlib is the base plotting library; seaborn sits on top and makes statistical plots in one line. Learn figures, axes, and how to label everything.","level":"core","resources":[{"title":"Matplotlib Quick start guide","url":"https://matplotlib.org/stable/users/explain/quick_start.html","type":"docs","source":"Matplotlib","free":true},{"title":"seaborn user guide and tutorial","url":"https://seaborn.pydata.org/tutorial.html","type":"docs","source":"seaborn","free":true}]},{"title":"Choosing the right chart","desc":"Distributions call for histograms or box plots, trends for lines, comparisons for bars, relationships for scatter plots. A decision tree of chart types saves a lot of guessing.","level":"core","resources":[{"title":"From Data to Viz","url":"https://www.data-to-viz.com/","type":"interactive","source":"data-to-viz.com","free":true}]},{"title":"Outliers, skew, and data quality","desc":"Find impossible values, long tails that need a log scale, and leakage hints like a feature that predicts the target suspiciously well.","level":"core","resources":[]},{"title":"Design principles for clear charts","desc":"Remove clutter, label directly, use color with purpose, and start from the message you want the reader to take away.","level":"deep","resources":[{"title":"Fundamentals of Data Visualization","url":"https://clauswilke.com/dataviz/","type":"book","source":"Claus O. Wilke","free":true}]},{"title":"Interactive charts and profiling tools","desc":"Plotly and Altair make interactive charts; ydata-profiling generates an automatic report of a DataFrame. LLM-powered data analysis in chat tools can speed up a first look, but always check its claims.","level":"optional","resources":[{"title":"Plotly Python","url":"https://plotly.com/python/","type":"docs","source":"Plotly","free":true},{"title":"ydata-profiling","url":"https://docs.profiling.ydata.ai/latest/","type":"tool","source":"YData","free":true}]}]},{"id":"ai-coding-tools","title":"AI Coding Assistants","tier":2,"lane":"code","prereqs":["git-cli","prompt-engineering"],"roles":{"aie":"c","mle":"c","ds":"r","rs":"r","pm":"a","nc":"a"},"summary":"AI coding assistants write, edit, explain, and debug code for you. They range from autocomplete in your editor to agents like Claude Code, Codex, and Cursor's agent that read your repo, run commands, and make multi-file changes.","why":"In 2026 most professional code is written with AI help, and agentic tools can take on whole tasks. The skill is no longer typing code fast; it is giving clear instructions, managing context, and reviewing output so you ship working code instead of plausible-looking bugs.","depth":"Master one agentic tool deeply: how to scope a task, give it context (project instruction files, docs, tests), review diffs, and use git to stay safe. Know the main tool categories and their trade-offs. Advanced setups like custom MCP servers, subagents, and parallel agents are worth learning once the basics are habit.","hours":15,"outcomes":["You can use an agentic coding tool to implement a feature across several files and verify it with tests.","You can write a project instruction file (like CLAUDE.md or AGENTS.md) that makes the agent follow your conventions.","You can review AI-written code critically and catch wrong assumptions, security issues, and invented APIs.","You can use git checkpoints so any agent change is easy to inspect or roll back.","You can choose between autocomplete, chat, and autonomous agents for a given task."],"project":"Use an agentic coding tool to add a real feature to one of your own repos. Write a project instruction file first, ask for a plan, have it write tests, and review every diff. Then write a short log of what it got wrong and how you caught it.","resources":[{"title":"Best practices for Claude Code","url":"https://code.claude.com/docs/en/best-practices","type":"docs","source":"Anthropic","free":true},{"title":"Simon Willison on AI-assisted programming","url":"https://simonwillison.net/tags/ai-assisted-programming/","type":"article","source":"Simon Willison","free":true},{"title":"Vibe engineering","url":"https://simonwillison.net/2025/Oct/7/vibe-engineering/","type":"article","source":"Simon Willison","free":true},{"title":"Andrej Karpathy: Software Is Changing (Again)","url":"https://www.youtube.com/watch?v=LCEmiRjPEtQ","type":"video","source":"Y Combinator","free":true},{"title":"Cursor Docs","url":"https://cursor.com/docs","type":"docs","source":"Cursor","free":true},{"title":"OpenAI Codex (open-source CLI)","url":"https://github.com/openai/codex","type":"tool","source":"OpenAI","free":true},{"title":"Aider: AI pair programming in your terminal","url":"https://aider.chat/","type":"tool","source":"Aider","free":true}],"subtopics":[{"title":"The tool landscape","desc":"Inline completion (Copilot), AI-first editors (Cursor and similar), terminal and cloud agents (Claude Code, OpenAI Codex, Aider), and app builders. They differ in autonomy, context access, and how much you review.","level":"core","resources":[{"title":"Claude Code overview","url":"https://code.claude.com/docs/en/overview","type":"docs","source":"Anthropic","free":true},{"title":"GitHub Copilot documentation","url":"https://docs.github.com/en/copilot","type":"docs","source":"GitHub","free":true}]},{"title":"Scoping tasks and giving context","desc":"Agents do best with a clear goal, constraints, and a way to check their work. Ask for a plan first on bigger tasks, point to relevant files, and break work into reviewable steps.","level":"core","resources":[{"title":"Best practices for Claude Code","url":"https://code.claude.com/docs/en/best-practices","type":"docs","source":"Anthropic","free":true}]},{"title":"Project instructions and memory files","desc":"Files like CLAUDE.md, AGENTS.md, or Cursor rules tell the agent how your project works: commands, style, and do's and don'ts. Short and specific beats long and vague.","level":"core","resources":[{"title":"AGENTS.md","url":"https://agents.md/","type":"docs","source":"agents.md","free":true}]},{"title":"Reviewing and verifying AI code","desc":"Read every diff. Have the agent write and run tests. Watch for invented library functions, silent error swallowing, deleted tests, and leaked secrets. You own the code it writes.","level":"core","resources":[{"title":"Here's how I use LLMs to help me write code","url":"https://simonwillison.net/2025/Mar/11/using-llms-for-code/","type":"article","source":"Simon Willison","free":true}]},{"title":"Safety: permissions, sandboxes, and git","desc":"Agents can run shell commands. Use permission settings, work on a branch, commit often, and be careful with untrusted repos or web content, which can contain prompt injection.","level":"deep","resources":[]},{"title":"Extending agents: MCP, subagents, and parallel work","desc":"MCP servers connect your agent to tools like databases, issue trackers, and docs. Subagents and parallel sessions split big tasks. Powerful, but only after the basics are solid.","level":"optional","resources":[{"title":"Model Context Protocol","url":"https://modelcontextprotocol.io/","type":"docs","source":"MCP","free":true}]}]},{"id":"ml-algorithms","title":"Classic ML Algorithms","tier":2,"lane":"ml","prereqs":["ml-concepts","python-data","probability-stats"],"roles":{"aie":"a","mle":"c","ds":"c","rs":"c"},"summary":"Classic machine learning algorithms are the workhorses that came before deep learning: linear and logistic regression, decision trees, random forests, gradient boosting, k-nearest neighbors, clustering, and dimensionality reduction.","why":"On tabular business data (customers, transactions, sensors) these models are often more accurate, cheaper, and easier to explain than neural networks. They are also the fastest way to build a strong baseline before trying anything fancier.","depth":"Implement from scratch and understand deeply: linear regression and logistic regression (with gradient descent), and how a decision tree chooses splits. Understand the ideas and use fluently in scikit-learn: regularization (L1/L2), random forests, gradient boosting (XGBoost/LightGBM), k-means, and PCA. Just know what they are and when they fit: SVMs, naive Bayes, k-nearest neighbors, DBSCAN, hierarchical clustering, and t-SNE/UMAP.","hours":50,"outcomes":["You can implement linear and logistic regression from scratch in NumPy and match scikit-learn's results.","You can explain how a decision tree splits, and why random forests and boosting beat a single tree.","You can train, tune, and compare several models on a tabular dataset with scikit-learn pipelines.","You can choose a sensible first model for a new problem and justify the choice.","You can use k-means and PCA to explore unlabeled data and explain what they found."],"project":"Implement logistic regression from scratch in NumPy and check it against scikit-learn on a binary classification dataset. Then compare it with a decision tree, random forest, and LightGBM in proper pipelines with cross-validation, and write a short note on which won and why.","resources":[{"title":"An Introduction to Statistical Learning (Python edition)","url":"https://www.statlearning.com/","type":"book","source":"James, Witten, Hastie, Tibshirani, Taylor","free":true},{"title":"StatQuest: Machine Learning playlist","url":"https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF","type":"video","source":"StatQuest","free":true},{"title":"scikit-learn User Guide","url":"https://scikit-learn.org/stable/user_guide.html","type":"docs","source":"scikit-learn","free":true},{"title":"scikit-learn MOOC","url":"https://inria.github.io/scikit-learn-mooc/","type":"course","source":"Inria","free":true},{"title":"Machine Learning Specialization","url":"https://www.coursera.org/specializations/machine-learning-introduction","type":"course","source":"DeepLearning.AI / Stanford","free":false},{"title":"Stanford CS229: Machine Learning","url":"https://cs229.stanford.edu/","type":"course","source":"Stanford","free":true},{"title":"The Elements of Statistical Learning","url":"https://hastie.su.domains/ElemStatLearn/","type":"book","source":"Hastie, Tibshirani, Friedman","free":true}],"subtopics":[{"title":"Linear and logistic regression (implement from scratch)","desc":"Linear regression fits a weighted sum to predict a number; logistic regression squashes it through a sigmoid to predict a probability. Build both in NumPy with gradient descent. Nearly every later model, including neural networks, extends these ideas.","level":"core","resources":[{"title":"Linear Regression (visual essay)","url":"https://mlu-explain.github.io/linear-regression/","type":"interactive","source":"Amazon MLU","free":true},{"title":"StatQuest: Logistic Regression","url":"https://www.youtube.com/watch?v=yIYKR4sgzI8","type":"video","source":"StatQuest","free":true}]},{"title":"Regularization: L1, L2 (understand deeply)","desc":"Regularization adds a penalty for large weights so the model doesn't overfit. Ridge (L2) shrinks weights, Lasso (L1) can zero them out. Know what the penalty does to the model; one scikit-learn parameter turns it on.","level":"core","resources":[{"title":"Regularization Part 1: Ridge (L2) Regression","url":"https://www.youtube.com/watch?v=Q81RR3yKn30","type":"video","source":"StatQuest","free":true}]},{"title":"Decision trees (implement a simple one)","desc":"A tree asks yes/no questions about features to split the data into purer groups. Writing a small one yourself (Gini or entropy splits, max depth) makes ensembles easy to understand.","level":"core","resources":[{"title":"Decision Trees (visual essay)","url":"https://mlu-explain.github.io/decision-tree/","type":"interactive","source":"Amazon MLU","free":true},{"title":"Decision and Classification Trees, Clearly Explained","url":"https://www.youtube.com/watch?v=_L39rN6gz7Y","type":"video","source":"StatQuest","free":true}]},{"title":"Random forests and gradient boosting (understand and use)","desc":"Random forests average many trees trained on random subsets. Gradient boosting adds trees one at a time, each fixing the last one's errors. XGBoost and LightGBM are still the best default for tabular data. Understand the idea and the key hyperparameters; don't implement them.","level":"core","resources":[{"title":"Gradient Boost Part 1: Regression Main Ideas","url":"https://www.youtube.com/watch?v=3CC4N4z3GJc","type":"video","source":"StatQuest","free":true},{"title":"XGBoost: Introduction to Boosted Trees","url":"https://xgboost.readthedocs.io/en/stable/tutorials/model.html","type":"docs","source":"XGBoost","free":true}]},{"title":"Unsupervised: k-means and PCA (understand and use)","desc":"k-means groups points into k clusters around centers. PCA compresses many features into a few directions that keep the most variance. Both are everyday tools for exploring data and embeddings.","level":"deep","resources":[{"title":"StatQuest: K-means clustering","url":"https://www.youtube.com/watch?v=4b5d3muPQmA","type":"video","source":"StatQuest","free":true},{"title":"StatQuest: PCA Step-by-Step","url":"https://www.youtube.com/watch?v=FgakZw6K1QQ","type":"video","source":"StatQuest","free":true}]},{"title":"The wider toolbox (know they exist)","desc":"SVMs find the widest margin between classes, naive Bayes is a fast probabilistic text classifier, k-nearest neighbors predicts from the closest examples, DBSCAN finds clusters of any shape, and t-SNE/UMAP make 2D maps of high-dimensional data. Know when each fits; reach for docs when you need one.","level":"optional","resources":[{"title":"scikit-learn: Choosing the right estimator","url":"https://scikit-learn.org/stable/machine_learning_map.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"scikit-learn fluency","desc":"The fit/predict/transform API, Pipelines, and hyperparameter search. Once you know the pattern, every model works the same way.","level":"core","resources":[{"title":"scikit-learn MOOC","url":"https://inria.github.io/scikit-learn-mooc/","type":"course","source":"Inria","free":true}]}]},{"id":"model-eval-ml","title":"Model Evaluation & Validation","tier":2,"lane":"ml","prereqs":["ml-concepts","probability-stats"],"roles":{"aie":"r","mle":"c","ds":"c","rs":"c","pm":"a"},"summary":"Model evaluation is measuring how well a model will work on data it has never seen, using the right metrics and the right data splits. Validation is the process that keeps those numbers honest.","why":"A model with 99% accuracy can be useless or harmful if the metric or split is wrong. Good evaluation is what lets you trust a result, compare models fairly, and catch problems before users do. The same discipline carries straight into LLM evals.","depth":"Master train/validation/test splits, cross-validation, the confusion matrix, precision/recall/F1, ROC-AUC, and regression metrics like MAE and RMSE, plus how to spot data leakage. Calibration, statistical tests between models, and fairness metrics need a working understanding. Advanced resampling theory is optional.","hours":20,"outcomes":["You can set up splits and cross-validation that match how the model will be used, including time-based splits.","You can choose a metric that matches the business cost of each kind of error.","You can read a confusion matrix and explain the precision-recall trade-off to a non-expert.","You can detect data leakage and explain why a suspiciously good score is suspicious.","You can compare two models and say whether the difference is real or noise."],"project":"On an imbalanced dataset (like credit card fraud), compare accuracy, F1, ROC-AUC, and PR-AUC for two models. Then deliberately introduce a leak, show how much it inflates the score, fix it with a proper pipeline, and pick a decision threshold based on an assumed cost for false positives and false negatives.","resources":[{"title":"Google ML Crash Course: Classification","url":"https://developers.google.com/machine-learning/crash-course/classification","type":"course","source":"Google","free":true},{"title":"scikit-learn: Cross-validation","url":"https://scikit-learn.org/stable/modules/cross_validation.html","type":"docs","source":"scikit-learn","free":true},{"title":"MLU-Explain: visual essays on ML concepts","url":"https://mlu-explain.github.io/","type":"interactive","source":"Amazon MLU","free":true},{"title":"Machine Learning Fundamentals: The Confusion Matrix","url":"https://www.youtube.com/watch?v=Kdsp6soqA7o","type":"video","source":"StatQuest","free":true},{"title":"Model Evaluation, Model Selection, and Algorithm Selection in Machine Learning","url":"https://arxiv.org/abs/1811.12808","type":"paper","source":"Sebastian Raschka (arXiv)","free":true},{"title":"Kaggle Learn: Intermediate Machine Learning","url":"https://www.kaggle.com/learn/intermediate-machine-learning","type":"interactive","source":"Kaggle","free":true}],"subtopics":[{"title":"Splits and cross-validation","desc":"Train on one part, tune on validation, report on a test set you touch once. Cross-validation rotates the held-out fold to get a more stable estimate. Use time-based splits for time-ordered data and grouped splits when rows from one user must stay together.","level":"core","resources":[{"title":"Train, Test, and Validation Sets","url":"https://mlu-explain.github.io/train-test-validation/","type":"interactive","source":"Amazon MLU","free":true},{"title":"StatQuest: Cross Validation","url":"https://www.youtube.com/watch?v=fSytzGwwBVw","type":"video","source":"StatQuest","free":true}]},{"title":"Classification metrics","desc":"Accuracy, precision (how many flagged items were right), recall (how many true items you caught), F1, and the confusion matrix. Accuracy misleads on imbalanced data like fraud.","level":"core","resources":[{"title":"Google ML Crash Course: Accuracy, recall, precision","url":"https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall","type":"course","source":"Google","free":true},{"title":"Precision and Recall","url":"https://mlu-explain.github.io/precision-recall/","type":"interactive","source":"Amazon MLU","free":true}]},{"title":"Thresholds, ROC, and PR curves","desc":"A classifier outputs a score; the threshold turns it into a decision. ROC-AUC and precision-recall curves show performance across all thresholds so you can pick one that fits your costs.","level":"core","resources":[{"title":"ROC and AUC, Clearly Explained","url":"https://www.youtube.com/watch?v=4jRBRDbJemM","type":"video","source":"StatQuest","free":true},{"title":"ROC and AUC (visual essay)","url":"https://mlu-explain.github.io/roc-auc/","type":"interactive","source":"Amazon MLU","free":true}]},{"title":"Regression metrics","desc":"MAE (average error size), RMSE (punishes big errors more), and R-squared. Pick the one whose errors match what hurts in practice.","level":"core","resources":[{"title":"scikit-learn: Metrics and scoring","url":"https://scikit-learn.org/stable/modules/model_evaluation.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Data leakage and common pitfalls","desc":"Leakage is when information from the test set or the future sneaks into training, giving great scores that collapse in production. Fitting preprocessing on all data before splitting is the classic mistake.","level":"core","resources":[{"title":"scikit-learn: Common pitfalls and recommended practices","url":"https://scikit-learn.org/stable/common_pitfalls.html","type":"docs","source":"scikit-learn","free":true},{"title":"Kaggle: Data Leakage","url":"https://www.kaggle.com/code/alexisbcook/data-leakage","type":"interactive","source":"Kaggle","free":true}]},{"title":"Tuning, learning curves, and calibration","desc":"Hyperparameter search with cross-validation, learning curves that show whether more data would help, and calibration, which checks that a predicted 70% really happens about 70% of the time.","level":"deep","resources":[{"title":"scikit-learn: Tuning the hyper-parameters of an estimator","url":"https://scikit-learn.org/stable/modules/grid_search.html","type":"docs","source":"scikit-learn","free":true},{"title":"scikit-learn: Probability calibration","url":"https://scikit-learn.org/stable/modules/calibration.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Comparing models and statistical significance","desc":"Small score differences are often noise. Confidence intervals, repeated cross-validation, and paired tests tell you whether a model is really better.","level":"optional","resources":[{"title":"Model Evaluation, Model Selection, and Algorithm Selection in Machine Learning","url":"https://arxiv.org/abs/1811.12808","type":"paper","source":"Sebastian Raschka (arXiv)","free":true}]}]},{"id":"feature-engineering","title":"Feature Engineering","tier":2,"lane":"ml","prereqs":["ml-concepts","python-data"],"roles":{"mle":"c","ds":"c"},"summary":"Feature engineering is turning raw data into the inputs a model learns from: cleaning, encoding categories, scaling numbers, building new columns from domain knowledge, and choosing which features to keep.","why":"On tabular data, good features usually matter more than the choice of algorithm. A thoughtful ratio, time-since, or aggregate feature can beat weeks of model tuning, and doing it carelessly is the main source of data leakage.","depth":"Master handling missing values, encoding categorical variables, scaling, date and aggregate features, and doing all of it inside a scikit-learn Pipeline so it never leaks. Feature selection and importance methods need a working understanding. Automated feature tools and feature stores are good to know about but rarely needed early.","hours":20,"outcomes":["You can build a preprocessing pipeline with imputation, encoding, and scaling that fits only on training data.","You can create useful features from dates, text, and grouped aggregates.","You can choose an encoding for a categorical column based on its cardinality and the model.","You can use permutation importance or SHAP to check which features a model really relies on.","You can show with cross-validation that a new feature actually helped."],"project":"Take a tabular dataset with dates, categories, and missing values (for example house prices). Build a baseline pipeline with minimal features, then add five engineered features one at a time, measuring each with cross-validation. Keep only those that help, and explain the final model with permutation importance.","resources":[{"title":"Kaggle Learn: Feature Engineering","url":"https://www.kaggle.com/learn/feature-engineering","type":"interactive","source":"Kaggle","free":true},{"title":"Feature Engineering and Selection: A Practical Approach for Predictive Models","url":"https://feat.engineering/","type":"book","source":"Max Kuhn and Kjell Johnson","free":true},{"title":"scikit-learn: Pipelines and composite estimators","url":"https://scikit-learn.org/stable/modules/compose.html","type":"docs","source":"scikit-learn","free":true},{"title":"Google ML Crash Course: Working with numerical data","url":"https://developers.google.com/machine-learning/crash-course/numerical-data","type":"course","source":"Google","free":true},{"title":"Interpretable Machine Learning","url":"https://christophm.github.io/interpretable-ml-book/","type":"book","source":"Christoph Molnar","free":true},{"title":"Kaggle Learn: Intermediate Machine Learning","url":"https://www.kaggle.com/learn/intermediate-machine-learning","type":"interactive","source":"Kaggle","free":true}],"subtopics":[{"title":"Missing values and imputation","desc":"Fill gaps with a median, a constant, or a model, and often add a 'was missing' flag, because missingness itself can be a signal.","level":"core","resources":[{"title":"scikit-learn: Imputation of missing values","url":"https://scikit-learn.org/stable/modules/impute.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Encoding categorical data","desc":"One-hot encoding for few categories, ordinal or target encoding for many. Tree models and linear models want different things. Watch for categories that appear only in test data.","level":"core","resources":[{"title":"Google ML Crash Course: Working with categorical data","url":"https://developers.google.com/machine-learning/crash-course/categorical-data","type":"course","source":"Google","free":true}]},{"title":"Scaling and transforming numbers","desc":"Standardizing, min-max scaling, log transforms for skewed values, and binning. Linear models, k-NN, and neural nets need scaling; tree models mostly don't.","level":"core","resources":[{"title":"Google ML Crash Course: Working with numerical data","url":"https://developers.google.com/machine-learning/crash-course/numerical-data","type":"course","source":"Google","free":true},{"title":"scikit-learn: Preprocessing data","url":"https://scikit-learn.org/stable/modules/preprocessing.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Pipelines and ColumnTransformer","desc":"Bundle every preprocessing step with the model so cross-validation and production apply exactly the same transformations, fitted only on training data. This is the main defense against leakage.","level":"core","resources":[{"title":"scikit-learn: Pipelines and composite estimators","url":"https://scikit-learn.org/stable/modules/compose.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Domain features: dates, aggregates, ratios, text","desc":"Day of week, time since last purchase, a customer's average order value, price per square meter. Text can become counts, TF-IDF, or LLM embeddings. This is where domain knowledge pays off most.","level":"deep","resources":[{"title":"Kaggle Learn: Feature Engineering","url":"https://www.kaggle.com/learn/feature-engineering","type":"interactive","source":"Kaggle","free":true},{"title":"scikit-learn: Feature extraction","url":"https://scikit-learn.org/stable/modules/feature_extraction.html","type":"docs","source":"scikit-learn","free":true}]},{"title":"Feature selection and importance","desc":"Drop features that add noise or leak the target. Permutation importance and SHAP show what the model actually uses, which also helps explain it to stakeholders.","level":"deep","resources":[{"title":"scikit-learn: Permutation feature importance","url":"https://scikit-learn.org/stable/modules/permutation_importance.html","type":"docs","source":"scikit-learn","free":true},{"title":"SHAP documentation","url":"https://shap.readthedocs.io/en/latest/","type":"docs","source":"SHAP","free":true}]},{"title":"Feature stores and automated tools","desc":"Feature stores share and serve features consistently across teams in production. Libraries like skrub automate parts of preprocessing for messy DataFrames. Know they exist.","level":"optional","resources":[{"title":"skrub: Machine learning with dataframes","url":"https://skrub-data.org/stable/","type":"tool","source":"skrub","free":true}]}]},{"id":"neural-networks","title":"Neural Networks","tier":2,"lane":"dl","prereqs":["ml-concepts","linear-algebra","calculus"],"roles":{"aie":"r","mle":"c","ds":"r","rs":"c"},"summary":"A neural network is a function built from layers of simple units. Each layer multiplies its input by a matrix of weights, adds a bias, and applies a nonlinearity, and training adjusts those weights so the output gets closer to what you want.","why":"Every modern AI system, from image classifiers to LLMs, is a neural network underneath. Once you understand forward passes, loss, and backpropagation, the rest of deep learning becomes variations on one idea.","depth":"Must master: what a layer computes, why nonlinearities matter, what a loss and a gradient tell you, and how gradient descent uses them. You don't need to derive backprop for exotic layers by hand, but you should be able to do it once for a tiny network.","hours":30,"outcomes":["You can explain what a neuron, a layer, an activation function, and a loss function are in plain words.","You can trace how backpropagation uses the chain rule to compute gradients for every weight.","You can build and train a small multilayer perceptron from scratch in NumPy or plain Python.","You can spot underfitting and overfitting from training and validation curves."],"project":"Build a two-layer neural network from scratch in NumPy (forward pass, cross-entropy loss, manual backprop, gradient descent) and train it to classify MNIST digits above 95% accuracy. Then check your gradients against a numerical estimate.","resources":[{"title":"Neural networks (video series)","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi","type":"video","source":"3Blue1Brown","free":true},{"title":"Neural Networks: Zero to Hero","url":"https://karpathy.ai/zero-to-hero.html","type":"course","source":"Andrej Karpathy","free":true},{"title":"Dive into Deep Learning: Multilayer Perceptrons","url":"https://d2l.ai/chapter_multilayer-perceptrons/index.html","type":"book","source":"d2l.ai","free":true},{"title":"TensorFlow Playground","url":"https://playground.tensorflow.org/","type":"interactive","source":"Google","free":true},{"title":"Neural Networks and Deep Learning","url":"http://neuralnetworksanddeeplearning.com/","type":"book","source":"Michael Nielsen","free":true},{"title":"Understanding Deep Learning","url":"https://udlbook.github.io/udlbook/","type":"book","source":"Simon J.D. Prince","free":true},{"title":"Deep Learning Specialization","url":"https://www.coursera.org/specializations/deep-learning","type":"course","source":"DeepLearning.AI","free":false}],"subtopics":[{"title":"Neurons, layers, and activations","desc":"A layer is a matrix multiply plus a bias, followed by a nonlinearity such as ReLU or GELU. Without the nonlinearity, stacking layers would collapse into a single linear function.","level":"core","resources":[{"title":"But what is a neural network?","url":"https://www.youtube.com/watch?v=aircAruvnKk","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Loss functions","desc":"The loss is a single number that measures how wrong the network is. Mean squared error is common for regression and cross-entropy for classification, and training means pushing this number down.","level":"core","resources":[]},{"title":"Backpropagation and gradient descent","desc":"Backprop applies the chain rule backwards through the network to find how each weight affects the loss. Gradient descent then nudges every weight a small step in the direction that lowers the loss.","level":"core","resources":[{"title":"Backpropagation, intuitively","url":"https://www.youtube.com/watch?v=Ilg3gGewQ5U","type":"video","source":"3Blue1Brown","free":true},{"title":"The spelled-out intro to neural networks and backpropagation: building micrograd","url":"https://www.youtube.com/watch?v=VMj-3S1tku0","type":"video","source":"Andrej Karpathy","free":true}]},{"title":"Computational graphs and autograd","desc":"Frameworks record every operation as a graph so they can compute gradients automatically. Building a tiny autograd engine yourself makes PyTorch feel much less magical.","level":"deep","resources":[{"title":"micrograd","url":"https://github.com/karpathy/micrograd","type":"tool","source":"Andrej Karpathy","free":true},{"title":"Calculus on Computational Graphs: Backpropagation","url":"https://colah.github.io/posts/2015-08-Backprop/","type":"article","source":"Chris Olah","free":true}]},{"title":"Generalization, overfitting, and regularization","desc":"A network can memorize its training data instead of learning the pattern. Validation sets, weight decay, dropout, and more data are the standard defenses.","level":"core","resources":[]},{"title":"Universal approximation and why depth helps","desc":"In theory a wide enough network can approximate almost any function. In practice, deeper networks learn reusable features more efficiently than very wide shallow ones.","level":"optional","resources":[{"title":"Neural Networks and Deep Learning, chapter 4","url":"http://neuralnetworksanddeeplearning.com/","type":"book","source":"Michael Nielsen","free":true}]}]},{"id":"pytorch","title":"PyTorch","tier":2,"lane":"dl","prereqs":["neural-networks","python-data"],"roles":{"aie":"a","mle":"c","ds":"r","rs":"c"},"summary":"PyTorch is the most widely used Python library for building and training neural networks. It gives you GPU-accelerated tensors, automatic differentiation, and building blocks for models, data loading, and optimization.","why":"Almost all research code and most open models (on Hugging Face and elsewhere) are written in PyTorch. If you want to train, fine-tune, or read the code behind a model, you need to be fluent in it.","depth":"Must master: tensors and shapes, autograd, nn.Module, DataLoader, and writing a clean training loop by hand. Just know that torch.compile, mixed precision, and distributed training exist until you need speed or scale.","hours":35,"outcomes":["You can create and manipulate tensors, reason about shapes and broadcasting, and move work to a GPU.","You can define a model as an nn.Module and write a complete training and evaluation loop.","You can load data efficiently with Dataset and DataLoader.","You can save, load, and debug a model, including fixing common shape and device errors."],"project":"Port your from-scratch MNIST network to PyTorch, then extend it: add a proper Dataset/DataLoader, train on a GPU (Colab is fine), log train and validation loss each epoch, save the best checkpoint, and reload it to evaluate on the test set.","resources":[{"title":"Learn the Basics","url":"https://docs.pytorch.org/tutorials/beginner/basics/intro.html","type":"docs","source":"PyTorch","free":true},{"title":"Zero to Mastery Learn PyTorch for Deep Learning","url":"https://www.learnpytorch.io/","type":"course","source":"Daniel Bourke","free":true},{"title":"Building makemore Part 2: MLP","url":"https://www.youtube.com/watch?v=TCH_1BHY58I","type":"video","source":"Andrej Karpathy","free":true},{"title":"PyTorch documentation","url":"https://docs.pytorch.org/docs/stable/index.html","type":"docs","source":"PyTorch","free":true},{"title":"Dive into Deep Learning (PyTorch edition)","url":"https://d2l.ai/","type":"book","source":"d2l.ai","free":true},{"title":"Tensor Puzzles","url":"https://github.com/srush/Tensor-Puzzles","type":"interactive","source":"Sasha Rush","free":true}],"subtopics":[{"title":"Tensors, shapes, and broadcasting","desc":"Tensors are n-dimensional arrays that can live on a CPU or GPU. Most bugs in deep learning code are shape bugs, so get comfortable with view, reshape, permute, and broadcasting rules.","level":"core","resources":[{"title":"Tensor Puzzles","url":"https://github.com/srush/Tensor-Puzzles","type":"interactive","source":"Sasha Rush","free":true}]},{"title":"Autograd","desc":"PyTorch records operations on tensors with requires_grad=True and computes gradients when you call backward(). Knowing when gradients accumulate and when to call zero_grad() avoids silent bugs.","level":"core","resources":[{"title":"Automatic Differentiation with torch.autograd","url":"https://docs.pytorch.org/tutorials/beginner/basics/autogradqs_tutorial.html","type":"docs","source":"PyTorch","free":true}]},{"title":"nn.Module and building models","desc":"Models are classes that hold layers as attributes and define a forward method. Composing modules is how everything from an MLP to a transformer is built.","level":"core","resources":[{"title":"Build the Neural Network","url":"https://docs.pytorch.org/tutorials/beginner/basics/buildmodel_tutorial.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Datasets and DataLoaders","desc":"A Dataset returns one example; a DataLoader batches, shuffles, and loads examples in parallel worker processes. A slow data pipeline is a common reason GPUs sit idle.","level":"core","resources":[{"title":"Datasets & DataLoaders","url":"https://docs.pytorch.org/tutorials/beginner/basics/data_tutorial.html","type":"docs","source":"PyTorch","free":true}]},{"title":"The training loop","desc":"Forward pass, compute loss, backward pass, optimizer step, zero the gradients, repeat. Writing this by hand a few times teaches you what higher-level trainers are hiding.","level":"core","resources":[{"title":"Optimizing Model Parameters","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Saving, loading, and checkpoints","desc":"Save a model's state_dict and the optimizer state so you can resume training or ship weights. Formats like safetensors are now standard for sharing weights safely.","level":"deep","resources":[{"title":"Saving and Loading Models","url":"https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html","type":"docs","source":"PyTorch","free":true}]},{"title":"torch.compile and performance","desc":"torch.compile turns your model into optimized kernels with a one-line change, often giving large speedups. Learn it once your models are correct and you care about throughput.","level":"optional","resources":[{"title":"Introduction to torch.compile","url":"https://docs.pytorch.org/tutorials/intermediate/torch_compile_tutorial.html","type":"docs","source":"PyTorch","free":true}]}]},{"id":"tokens-embeddings","title":"Tokens & Embeddings","tier":2,"lane":"llm","prereqs":["llm-basics"],"roles":{"aie":"c","mle":"c","ds":"r","rs":"c","pm":"a"},"summary":"Tokens are the chunks of text a model actually reads, produced by a tokenizer such as byte-pair encoding. Embeddings are vectors that represent tokens, sentences, or documents so that similar meanings sit close together.","why":"Tokens determine cost, context limits, and odd failures like miscounting letters or weak handling of some languages. Embeddings power semantic search, RAG, clustering, recommendations, and deduplication.","depth":"Must master: how BPE tokenization works at a high level, counting tokens, what an embedding is, cosine similarity, and how to pick an embedding model. Just know Matryoshka embeddings, multi-vector retrieval, and tokenizer training details exist until a project needs them.","hours":15,"outcomes":["You can explain how text becomes tokens and estimate token counts and costs.","You can explain why tokenization causes quirks like trouble with spelling, arithmetic, or some languages.","You can generate embeddings with an API or open model and compare them with cosine similarity.","You can choose an embedding model using benchmarks plus a test on your own data."],"project":"Embed 200 to 1,000 short texts you care about (notes, product reviews, FAQs) with two different embedding models. Build a tiny semantic search script, compare top results for ten test queries, and plot a 2D projection (UMAP or PCA) of the vectors colored by topic.","resources":[{"title":"Let's build the GPT Tokenizer","url":"https://www.youtube.com/watch?v=zduSFxRajkE","type":"video","source":"Andrej Karpathy","free":true},{"title":"Embeddings: What they are and why they matter","url":"https://simonwillison.net/2023/Oct/23/embeddings/","type":"article","source":"Simon Willison","free":true},{"title":"The Illustrated Word2vec","url":"https://jalammar.github.io/illustrated-word2vec/","type":"article","source":"Jay Alammar","free":true},{"title":"Hugging Face LLM Course: The Tokenizers library","url":"https://huggingface.co/learn/llm-course/chapter6/1","type":"course","source":"Hugging Face","free":true},{"title":"Tiktokenizer","url":"https://tiktokenizer.vercel.app/","type":"interactive","source":"Tiktokenizer","free":true},{"title":"Vector embeddings guide","url":"https://developers.openai.com/api/docs/guides/embeddings","type":"docs","source":"OpenAI","free":true},{"title":"Neural Machine Translation of Rare Words with Subword Units (BPE)","url":"https://arxiv.org/abs/1508.07909","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"Tokenization and BPE","desc":"Byte-pair encoding starts from bytes and repeatedly merges the most common pairs into new tokens. Common words become one token while rare words split into several pieces.","level":"core","resources":[{"title":"Let's build the GPT Tokenizer","url":"https://www.youtube.com/watch?v=zduSFxRajkE","type":"video","source":"Andrej Karpathy","free":true},{"title":"Tiktokenizer","url":"https://tiktokenizer.vercel.app/","type":"interactive","source":"Tiktokenizer","free":true}]},{"title":"Counting tokens, cost, and limits","desc":"APIs price and limit by tokens, and different models use different tokenizers. Count tokens before you send big documents so you can budget and avoid truncation.","level":"core","resources":[{"title":"Token counting","url":"https://platform.claude.com/docs/en/build-with-claude/token-counting","type":"docs","source":"Anthropic","free":true},{"title":"tiktoken","url":"https://github.com/openai/tiktoken","type":"tool","source":"OpenAI","free":true}]},{"title":"Word embeddings and vector space","desc":"word2vec showed that training to predict nearby words yields vectors where directions carry meaning. It is the intuition behind every modern embedding.","level":"core","resources":[{"title":"The Illustrated Word2vec","url":"https://jalammar.github.io/illustrated-word2vec/","type":"article","source":"Jay Alammar","free":true}]},{"title":"Sentence and document embeddings","desc":"Embedding models turn whole passages into one vector for semantic search and RAG. Similarity is usually measured with cosine similarity or dot product.","level":"core","resources":[{"title":"Embeddings: What they are and why they matter","url":"https://simonwillison.net/2023/Oct/23/embeddings/","type":"article","source":"Simon Willison","free":true},{"title":"Sentence Transformers","url":"https://sbert.net/","type":"docs","source":"Sentence Transformers","free":true}]},{"title":"Choosing an embedding model","desc":"Leaderboards compare models on retrieval, clustering, and more, but your own data is the real test. Weigh quality against dimension size, speed, languages, and price.","level":"deep","resources":[{"title":"MTEB Leaderboard","url":"https://huggingface.co/spaces/mteb/leaderboard","type":"tool","source":"Hugging Face","free":true}]},{"title":"Advanced embedding tricks","desc":"Matryoshka embeddings can be truncated to fewer dimensions with little quality loss, and quantized embeddings save storage. Useful at scale, safe to skip at first.","level":"optional","resources":[{"title":"Matryoshka Representation Learning","url":"https://arxiv.org/abs/2205.13147","type":"paper","source":"arXiv","free":true}]}]},{"id":"context-engineering","title":"Context Engineering","tier":2,"lane":"llm","prereqs":["prompt-engineering","llm-basics"],"roles":{"aie":"c","mle":"r","pm":"r","nc":"r","pu":"r"},"summary":"Context engineering is the practice of deciding exactly what goes into a model's context window at each step: instructions, examples, retrieved documents, tool definitions, tool results, memory, and conversation history. It extends prompt engineering from writing one good prompt to managing a whole information pipeline.","why":"Models can only use what they can see, and long, cluttered contexts degrade quality, raise cost, and slow responses. For agents that run many steps, good context management is often the difference between a system that works and one that drifts.","depth":"Must master: treating context as a limited budget, structuring system prompts, selecting and trimming retrieved content, summarizing or compacting history, and using prompt caching. Just know the research on long-context failure modes and advanced memory architectures at a conceptual level.","hours":15,"outcomes":["You can design the context layout for an LLM feature: system prompt, tools, examples, retrieved data, and history.","You can explain context rot and lost-in-the-middle effects and design around them.","You can apply compaction, summarization, structured notes, and sub-agents to keep long-running tasks on track.","You can use prompt caching and token budgets to reduce cost and latency."],"project":"Take a long task (for example, answering 20 questions about a 100-page document or a multi-step research job). Build two versions: one that stuffs everything into the context, and one that retrieves only relevant chunks, keeps a running notes file, and compacts history. Compare accuracy, token usage, and cost.","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true},{"title":"Context Engineering for Agents","url":"https://www.langchain.com/blog/context-engineering-for-agents","type":"article","source":"LangChain","free":true},{"title":"Context Rot","url":"https://www.trychroma.com/research/context-rot","type":"article","source":"Chroma","free":true},{"title":"Context engineering","url":"https://simonwillison.net/2025/Jun/27/context-engineering/","type":"article","source":"Simon Willison","free":true},{"title":"Context windows","url":"https://platform.claude.com/docs/en/build-with-claude/context-windows","type":"docs","source":"Anthropic","free":true},{"title":"Context Engineering for AI Agents: Lessons from Building Manus","url":"https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus","type":"article","source":"Manus","free":true}],"subtopics":[{"title":"Context as a finite budget","desc":"Every token competes for the model's attention, and more is not always better. The goal is the smallest set of high-signal tokens that gets the job done.","level":"core","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Long-context failure modes","desc":"Models often use information at the start and end of a long context better than the middle, and performance drops as inputs grow. Distracting or conflicting content can poison later steps.","level":"core","resources":[{"title":"Context Rot","url":"https://www.trychroma.com/research/context-rot","type":"article","source":"Chroma","free":true},{"title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://arxiv.org/abs/2307.03172","type":"paper","source":"arXiv","free":true}]},{"title":"Structuring system prompts and tools","desc":"Clear sections, the right level of specificity, and a small, well-described set of tools make model behavior more reliable. Put long documents first and the question last for long-context prompts.","level":"core","resources":[{"title":"Prompting best practices: long context prompting","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices#long-context-prompting","type":"docs","source":"Anthropic","free":true}]},{"title":"Write, select, compress, isolate","desc":"Common strategies are to write notes outside the context, select only relevant pieces, compress history with summaries, and isolate work in sub-agents with their own clean context.","level":"core","resources":[{"title":"Context Engineering for Agents","url":"https://www.langchain.com/blog/context-engineering-for-agents","type":"article","source":"LangChain","free":true},{"title":"How Long Contexts Fail","url":"https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html","type":"article","source":"Drew Breunig","free":true}]},{"title":"Prompt caching and cost","desc":"Keeping a stable prefix (system prompt, tools, large documents) lets providers cache it, which cuts cost and latency a lot. Design contexts so the stable part comes first and changes go at the end.","level":"deep","resources":[{"title":"Prompt caching","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching","type":"docs","source":"Anthropic","free":true}]},{"title":"Memory and long-running agents","desc":"Agents that run for hours need persistent memory such as files, to-do lists, and progress notes they can reload. Lessons from production agents show how to keep the context lean over hundreds of steps.","level":"deep","resources":[{"title":"Context Engineering for AI Agents: Lessons from Building Manus","url":"https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus","type":"article","source":"Manus","free":true}]}]},{"id":"llm-apis","title":"LLM APIs & SDKs","tier":2,"lane":"apps","prereqs":["apis-json","prompt-engineering"],"roles":{"aie":"c","mle":"r","ds":"r","nc":"r"},"summary":"LLM APIs let your code send messages to a model like Claude, GPT, or Gemini over HTTP and get text back. SDKs are the official libraries (Python, TypeScript, and more) that wrap those calls so you don't have to build raw requests.","why":"Every LLM app, from a chatbot to an agent, is built on these calls. Once you can call a model from code, you can put AI inside any product, script, or pipeline instead of copy-pasting into a chat window.","depth":"Master the message format (system prompt, user and assistant turns), key parameters, streaming, error handling, and how tokens turn into cost. Just know that batch APIs, provider routers, and prompt caching exist until you need to cut cost or latency.","hours":12,"outcomes":["You can call at least two providers' APIs from code using their official SDKs and manage API keys safely.","You can build a multi-turn conversation by managing the message history yourself.","You can stream responses to a user interface and handle rate limits, timeouts, and retries.","You can estimate the token cost of a request and reduce it with prompt caching or a cheaper model."],"project":"Build a command-line chat app that keeps conversation history, streams answers, retries on rate-limit errors, and prints the token count and cost of each turn. Then add a flag that switches between two providers.","resources":[{"title":"Get started with Claude","url":"https://platform.claude.com/docs/en/get-started","type":"docs","source":"Anthropic","free":true},{"title":"OpenAI developer quickstart","url":"https://developers.openai.com/api/docs/quickstart","type":"docs","source":"OpenAI","free":true},{"title":"Gemini API documentation","url":"https://ai.google.dev/gemini-api/docs","type":"docs","source":"Google","free":true},{"title":"Claude Cookbooks","url":"https://github.com/anthropics/claude-cookbooks","type":"tool","source":"Anthropic","free":true},{"title":"OpenAI Cookbook","url":"https://developers.openai.com/cookbook","type":"article","source":"OpenAI","free":true},{"title":"Reducing latency","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency","type":"docs","source":"Anthropic","free":true}],"subtopics":[{"title":"The Messages format","desc":"Most APIs take a list of messages with roles (system, user, assistant) and return the next assistant message. The API is stateless: you resend the whole conversation every turn.","level":"core","resources":[{"title":"Messages API reference","url":"https://platform.claude.com/docs/en/api/messages","type":"docs","source":"Anthropic","free":true}]},{"title":"Parameters, models, and tokens","desc":"Pick a model tier (small and fast versus large and smart), set max output tokens, and understand temperature. Pricing is per input and output token, so long prompts and long answers both cost money.","level":"core","resources":[{"title":"Models overview","url":"https://platform.claude.com/docs/en/models/overview","type":"docs","source":"Anthropic","free":true},{"title":"Token counting","url":"https://platform.claude.com/docs/en/build-with-claude/token-counting","type":"docs","source":"Anthropic","free":true}]},{"title":"Streaming responses","desc":"Streaming sends the answer token by token using server-sent events, so users see text appear immediately instead of waiting for the full response.","level":"core","resources":[{"title":"Streaming messages","url":"https://platform.claude.com/docs/en/build-with-claude/streaming","type":"docs","source":"Anthropic","free":true}]},{"title":"Errors, rate limits, and retries","desc":"APIs limit requests and tokens per minute and sometimes fail with overload errors. Production code retries with exponential backoff and sets timeouts.","level":"core","resources":[{"title":"Rate limits","url":"https://platform.claude.com/docs/en/api/rate-limits","type":"docs","source":"Anthropic","free":true}]},{"title":"Prompt caching and batch processing","desc":"Prompt caching reuses a long, repeated prefix (like a big system prompt or document) at a fraction of the cost and latency. Batch APIs process large jobs asynchronously at roughly half the price.","level":"deep","resources":[{"title":"Prompt caching","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching","type":"docs","source":"Anthropic","free":true},{"title":"Batch processing","url":"https://platform.claude.com/docs/en/build-with-claude/batch-processing","type":"docs","source":"Anthropic","free":true}]},{"title":"Multi-provider gateways","desc":"Libraries and services like LiteLLM, OpenRouter, and the Vercel AI SDK give you one interface over many providers, which makes switching or falling back between models easier.","level":"optional","resources":[{"title":"LiteLLM docs","url":"https://docs.litellm.ai/docs/","type":"docs","source":"LiteLLM","free":true},{"title":"AI SDK introduction","url":"https://ai-sdk.dev/docs/introduction","type":"docs","source":"Vercel","free":true}]}]},{"id":"structured-outputs","title":"Structured Outputs & Tool Calling","tier":2,"lane":"apps","prereqs":["llm-apis"],"roles":{"aie":"c","mle":"r","nc":"r"},"summary":"Structured outputs make a model return data in an exact shape, usually JSON matching a schema you define. Tool calling (also called function calling) lets the model ask your code to run a function, like a search or a database lookup, and then use the result.","why":"Real software needs predictable data, not free text. Structured outputs turn an LLM into a reliable extractor or classifier, and tool calling is the building block of every agent.","depth":"Master JSON Schema basics, defining tools with clear names and descriptions, and running the tool-call loop yourself. Just know how constrained decoding works under the hood; you rarely need to implement it.","hours":10,"outcomes":["You can define a schema (for example with Pydantic) and get validated, typed objects back from a model.","You can write tool definitions and run the full loop: model requests a tool, your code runs it, the result goes back to the model.","You can design tool names, descriptions, and parameters that a model uses correctly.","You can handle bad or missing outputs with validation and retries."],"project":"Build an email triage script: it extracts sender, intent, urgency, and requested action into a Pydantic model, then uses two tools (look up a customer by email, create a ticket) to act on the result. Log every tool call.","resources":[{"title":"Tool use overview","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview","type":"docs","source":"Anthropic","free":true},{"title":"Function-calling and Data Extraction with LLMs","url":"https://www.deeplearning.ai/courses/function-calling-and-data-extraction-with-llms","type":"course","source":"DeepLearning.AI","free":true},{"title":"Structured outputs guide","url":"https://developers.openai.com/api/docs/guides/structured-outputs","type":"docs","source":"OpenAI","free":true},{"title":"Writing effective tools for agents","url":"https://www.anthropic.com/engineering/writing-tools-for-agents","type":"article","source":"Anthropic","free":true},{"title":"Gemini function calling","url":"https://ai.google.dev/gemini-api/docs/function-calling","type":"docs","source":"Google","free":true},{"title":"Toolformer: Language Models Can Teach Themselves to Use Tools","url":"https://arxiv.org/abs/2302.04761","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"JSON Schema and Pydantic","desc":"A schema describes the fields, types, and required keys you expect. In Python, Pydantic models are the usual way to define a schema and validate what comes back.","level":"core","resources":[{"title":"Pydantic: get started","url":"https://pydantic.dev/docs/validation/latest/get-started/","type":"docs","source":"Pydantic","free":true}]},{"title":"Native structured outputs","desc":"Major APIs now accept a schema and guarantee the response matches it. This replaces fragile tricks like 'respond only in JSON' and regex parsing.","level":"core","resources":[{"title":"Structured outputs (Claude)","url":"https://platform.claude.com/docs/en/build-with-claude/structured-outputs","type":"docs","source":"Anthropic","free":true},{"title":"Structured outputs (OpenAI)","url":"https://developers.openai.com/api/docs/guides/structured-outputs","type":"docs","source":"OpenAI","free":true}]},{"title":"The tool-calling loop","desc":"You describe tools; the model replies with a tool call (name plus arguments); your code executes it and sends back a tool result; the model continues. Parallel tool calls and multi-step loops follow the same pattern.","level":"core","resources":[{"title":"Tool use overview","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview","type":"docs","source":"Anthropic","free":true},{"title":"Function calling","url":"https://developers.openai.com/api/docs/guides/function-calling","type":"docs","source":"OpenAI","free":true}]},{"title":"Designing good tools","desc":"Models pick and use tools based on names, descriptions, and parameter docs. Fewer, well-scoped tools with clear error messages and concise outputs work far better than many overlapping ones.","level":"deep","resources":[{"title":"Writing effective tools for agents","url":"https://www.anthropic.com/engineering/writing-tools-for-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Extraction and classification patterns","desc":"Common uses: pulling fields from invoices or emails, tagging support tickets, routing requests. Libraries like Instructor add validation-driven retries on top of any provider.","level":"deep","resources":[{"title":"Instructor","url":"https://python.useinstructor.com/","type":"tool","source":"Instructor","free":true}]},{"title":"Constrained decoding","desc":"Under the hood, structured output works by masking out tokens that would break the grammar at each step. Open-source tools like Outlines do this for local models.","level":"optional","resources":[{"title":"Outlines","url":"https://github.com/dottxt-ai/outlines","type":"tool","source":"dottxt","free":true}]}]},{"id":"rag-fundamentals","title":"RAG Fundamentals","tier":2,"lane":"apps","prereqs":["llm-apis","tokens-embeddings"],"roles":{"aie":"c","mle":"r","ds":"r","pm":"a","nc":"a"},"summary":"Retrieval-augmented generation (RAG) means finding relevant pieces of your own documents and putting them into the model's prompt so it can answer from them. The classic pipeline is: split documents into chunks, embed them, store them, retrieve the closest chunks for a question, and generate an answer that cites them.","why":"Models don't know your company docs, recent events, or private data, and they make things up when they guess. RAG grounds answers in real sources, keeps knowledge up to date without retraining, and lets you show citations.","depth":"Master the full pipeline end to end, how embeddings and similarity search work, and how to tell whether a bad answer came from retrieval or generation. Just know that fancier techniques (reranking, hybrid search, GraphRAG) exist; they come in the next nodes once your basic pipeline works and you can measure it.","hours":15,"outcomes":["You can explain the RAG pipeline and when RAG beats fine-tuning or just using a long context window.","You can build a working RAG app over your own documents with embeddings, a vector store, and an LLM.","You can write a grounded prompt that makes the model cite sources and say 'I don't know' when the context lacks the answer.","You can debug a wrong answer by checking what was retrieved before blaming the model.","You can build a small test set of questions and measure retrieval hit rate."],"project":"Build a 'chat with your docs' app over 20 to 50 real documents (your notes, a product manual, or a docs site). It must cite the chunks it used and refuse when the answer isn't present. Write 20 test questions with known source chunks and report how often the right chunk is in the top 5.","resources":[{"title":"Retrieval Augmented Generation (RAG) course","url":"https://www.deeplearning.ai/courses/retrieval-augmented-generation","type":"course","source":"DeepLearning.AI","free":true},{"title":"What is Retrieval-Augmented Generation (RAG)?","url":"https://www.youtube.com/watch?v=T-D1OfcDW1M","type":"video","source":"IBM Technology","free":true},{"title":"Learn RAG From Scratch","url":"https://www.youtube.com/watch?v=sVcwVQRHIc8","type":"video","source":"freeCodeCamp / LangChain","free":true},{"title":"Retrieval Augmented Generation series","url":"https://www.pinecone.io/learn/series/rag/","type":"article","source":"Pinecone","free":true},{"title":"Embeddings","url":"https://platform.claude.com/docs/en/build-with-claude/embeddings","type":"docs","source":"Anthropic","free":true},{"title":"Advanced RAG on Hugging Face documentation using LangChain","url":"https://huggingface.co/learn/cookbook/advanced_rag","type":"interactive","source":"Hugging Face","free":true},{"title":"Retrieval-Augmented Generation for Large Language Models: A Survey","url":"https://arxiv.org/abs/2312.10997","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"The RAG pipeline end to end","desc":"Indexing happens offline (load, chunk, embed, store). Querying happens live (embed the question, retrieve top-k chunks, build the prompt, generate). Knowing which stage broke is the core RAG skill.","level":"core","resources":[{"title":"Retrieval-Augmented Generation (RAG)","url":"https://www.pinecone.io/learn/retrieval-augmented-generation/","type":"article","source":"Pinecone","free":true},{"title":"Introduction to RAG","url":"https://developers.llamaindex.ai/python/framework/understanding/rag/","type":"docs","source":"LlamaIndex","free":true}]},{"title":"Embeddings for retrieval","desc":"An embedding model turns text into a vector so that similar meanings land close together. Choice of embedding model (quality, languages, dimensions, cost) has a big effect on retrieval quality; the MTEB leaderboard compares them.","level":"core","resources":[{"title":"Choosing an Embedding Model","url":"https://www.pinecone.io/learn/series/rag/embedding-models-rundown/","type":"article","source":"Pinecone","free":true},{"title":"MTEB leaderboard","url":"https://huggingface.co/spaces/mteb/leaderboard","type":"tool","source":"Hugging Face","free":true}]},{"title":"Similarity search basics","desc":"Retrieval compares the query vector to stored vectors with cosine similarity or dot product and returns the top-k nearest. For a few thousand chunks a simple in-memory search is fine.","level":"core","resources":[{"title":"What is Similarity Search?","url":"https://www.pinecone.io/learn/what-is-similarity-search/","type":"article","source":"Pinecone","free":true}]},{"title":"Basic chunking","desc":"Documents are split into chunks small enough to be specific but large enough to keep meaning, often a few hundred tokens with some overlap. Start with a recursive splitter that respects paragraphs and headings.","level":"core","resources":[{"title":"Chunking Strategies for LLM Applications","url":"https://www.pinecone.io/learn/chunking-strategies/","type":"article","source":"Pinecone","free":true}]},{"title":"Grounded prompting and citations","desc":"Put retrieved chunks in clearly labeled blocks, tell the model to answer only from them, cite chunk IDs, and admit when the answer isn't there. This is where hallucination control mostly happens.","level":"core","resources":[{"title":"Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","type":"article","source":"Anthropic","free":true}]},{"title":"RAG vs long context vs fine-tuning","desc":"If your knowledge fits in the context window, just include it (with prompt caching). Use RAG when the corpus is large or changes often. Fine-tuning changes style and behavior, not facts.","level":"deep","resources":[{"title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://arxiv.org/abs/2307.03172","type":"paper","source":"arXiv","free":true},{"title":"Context Rot","url":"https://www.trychroma.com/research/context-rot","type":"article","source":"Chroma","free":true}]},{"title":"The original RAG paper","desc":"The 2020 paper from Facebook AI that named the technique, combining a retriever with a generator. Useful history; modern RAG is simpler and uses off-the-shelf LLMs.","level":"optional","resources":[{"title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","url":"https://arxiv.org/abs/2005.11401","type":"paper","source":"arXiv","free":true}]}]},{"id":"no-code-automation","title":"No-code AI Automation","tier":2,"lane":"agents","prereqs":["ai-productivity"],"roles":{"aie":"a","pm":"r","biz":"r","nc":"c","pu":"r"},"summary":"No-code AI automation means wiring AI models into everyday workflows with visual tools like Zapier, Make, n8n, and Power Automate. A trigger (new email, form, or row) kicks off steps that call an AI model, then act on the result in other apps.","why":"Many of the highest-value AI wins are boring workflows: sorting inbound email, drafting replies, summarizing calls, enriching leads. No-code tools let non-engineers ship these in hours, and engineers use them to prototype fast.","depth":"Master triggers, actions, data mapping between steps, AI steps with structured outputs, branching, and error handling. Just know that these platfor
