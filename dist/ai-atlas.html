Scaling AI Use Cases","url":"https://cdn.openai.com/business-guides-and-resources/identifying-and-scaling-ai-use-cases.pdf","type":"article","source":"OpenAI","free":true}]},{"title":"Common use-case patterns","desc":"Most business uses fall into a few patterns: content creation, research and summarization, data extraction from documents, answering questions over your knowledge, coding, and analysis.","level":"core","resources":[]},{"title":"Process mapping","desc":"Draw the steps of a process and note inputs, outputs, time, and who checks the work. AI fits best on steps with clear inputs, repeatable patterns, and easy checking.","level":"core","resources":[]},{"title":"Scoring: value, feasibility, risk","desc":"Rate each idea on business value (hours saved, revenue impact), feasibility (data available, tool exists, simple integration), and risk (cost of a mistake). Plot them to find quick wins.","level":"core","resources":[]},{"title":"Small tests before big projects","desc":"Run a two to four week test with a few users, a clear success measure, and a before/after comparison. Kill or scale based on results, not enthusiasm.","level":"deep","resources":[]},{"title":"Learning from what people already do","desc":"Many employees already use AI quietly. Surveying and sharing these grassroots uses is often the fastest source of proven use cases.","level":"deep","resources":[{"title":"Making AI Work: Leadership, Lab, and Crowd","url":"https://www.oneusefulthing.org/p/making-ai-work-leadership-lab-and","type":"article","source":"Ethan Mollick","free":true}]}]},{"id":"ai-privacy","title":"Data Privacy & Safe Use","tier":1,"lane":"safety","prereqs":["ai-limitations"],"roles":{"aie":"c","mle":"r","ds":"r","rs":"a","pm":"c","biz":"c","nc":"c","pu":"c"},"summary":"Safe use means knowing where your data goes when you type it into an AI tool, who can see it, and whether it can be used to train future models.","why":"Pasting a customer list, contract, or health record into the wrong tool can break the law or your company's rules. If you build AI products, you also handle other people's data and need to protect it.","depth":"Everyone must master the basics: consumer vs business plans, training opt-outs, what never to paste, and your company's AI policy. Builders should also understand PII redaction, data retention, and GDPR basics. Training-data extraction and differential privacy are 'know it exists' unless you train models.","hours":6,"outcomes":["You can check whether a given AI tool and plan uses your data for training, and how to opt out.","You can sort data into \"fine to paste,\" \"only in approved tools,\" and \"never\" categories.","You can explain when to choose an enterprise plan, a zero-retention API, or a local model.","You can strip or mask personal data (PII) before it reaches a model in an app you build."],"project":"Audit the AI tools you or your team use. For each one, record the plan, whether data is used for training, retention period, and where the opt-out lives. Turn it into a one-page \"what you can paste where\" guide. Builders: add a Presidio redaction step in front of an LLM call and show that names and emails never reach the model.","resources":[{"title":"Is my data used for model training?","url":"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","type":"docs","source":"Anthropic","free":true},{"title":"Data Controls FAQ","url":"https://help.openai.com/en/articles/7730893-data-controls-faq","type":"docs","source":"OpenAI","free":true},{"title":"Gemini Apps Privacy Hub","url":"https://support.google.com/gemini/answer/13594961","type":"docs","source":"Google","free":true},{"title":"LLM02:2025 Sensitive Information Disclosure","url":"https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/","type":"docs","source":"OWASP","free":true},{"title":"Guidance on AI and data protection","url":"https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/","type":"docs","source":"UK ICO","free":true},{"title":"Presidio","url":"https://github.com/data-privacy-stack/presidio","type":"tool","source":"GitHub","free":true}],"subtopics":[{"title":"Consumer vs business plans","desc":"Free and consumer plans often have different training and retention terms from team, enterprise, and API plans. Read the data-use page for each tool you use and check the settings.","level":"core","resources":[{"title":"Is my data used for model training?","url":"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","type":"docs","source":"Anthropic","free":true},{"title":"Data Controls FAQ","url":"https://help.openai.com/en/articles/7730893-data-controls-faq","type":"docs","source":"OpenAI","free":true}]},{"title":"What not to paste","desc":"Passwords, API keys, customer personal data, health or financial records, and confidential business documents stay out of unapproved tools. When in doubt, anonymize or summarize first.","level":"core","resources":[]},{"title":"Sensitive data in AI apps","desc":"Apps can leak data through prompts, logs, retrieved documents, and model outputs. Limit what goes into context, redact PII, and control who can see conversation logs.","level":"core","resources":[{"title":"LLM02:2025 Sensitive Information Disclosure","url":"https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/","type":"docs","source":"OWASP","free":true},{"title":"Presidio (PII detection and anonymization)","url":"https://github.com/data-privacy-stack/presidio","type":"tool","source":"GitHub","free":true}]},{"title":"Data protection law basics","desc":"Laws like GDPR require a lawful basis for processing personal data, data minimization, and rights such as access and deletion. These apply to data you send to AI vendors too.","level":"deep","resources":[{"title":"Guidance on AI and data protection","url":"https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/","type":"docs","source":"UK ICO","free":true}]},{"title":"Local and private deployment","desc":"Running an open model on your own machine or servers keeps data in-house. It trades some quality and convenience for control.","level":"deep","resources":[{"title":"Ollama","url":"https://ollama.com/","type":"tool","source":"Ollama","free":true}]},{"title":"Memorization and training-data extraction","desc":"Models can memorize and repeat rare text from their training data, including personal details. This is why training on private data needs care.","level":"optional","resources":[{"title":"Extracting Training Data from Large Language Models","url":"https://arxiv.org/abs/2012.07805","type":"paper","source":"arXiv","free":true}]}]},{"id":"ai-ethics","title":"AI Ethics & Bias","tier":1,"lane":"safety","prereqs":["ai-limitations"],"roles":{"aie":"r","mle":"r","ds":"r","rs":"r","pm":"c","biz":"r","nc":"a","pu":"a"},"summary":"AI ethics asks whether an AI system is fair, honest, accountable, and good for the people it affects. Bias is when a system works worse for, or treats unfairly, certain groups of people.","why":"AI now helps decide who gets hired, approved for loans, or flagged for fraud. Biased or careless systems cause real harm, lose user trust, and create legal risk.","depth":"PMs and leaders must master the main harm types and how to ask the right questions before launch. Data scientists and ML engineers should also know how to measure group fairness metrics and document a model. The formal math of fairness trade-offs is for those who build high-stakes models.","hours":8,"outcomes":["You can name the main sources of bias: skewed data, proxy features, labels that encode past decisions, and feedback loops.","You can describe at least three real cases where AI caused harm and what went wrong.","You can compare outcomes across groups and explain why different fairness definitions can conflict.","You can write a short model card or impact note for an AI feature."],"project":"Take a public tabular dataset with a demographic column (for example, a credit or income dataset). Train a simple classifier, then use Fairlearn to compare accuracy and false-positive rates across groups. Write a one-page model card that states the gaps you found and where the model should not be used. Non-coders: write an impact note for an AI feature at your work covering who could be harmed and how you would check.","resources":[{"title":"Practical Data Ethics","url":"https://ethics.fast.ai/","type":"course","source":"fast.ai","free":true},{"title":"Fairness (Machine Learning Crash Course)","url":"https://developers.google.com/machine-learning/crash-course/fairness","type":"course","source":"Google","free":true},{"title":"Intro to AI Ethics","url":"https://www.kaggle.com/learn/intro-to-ai-ethics","type":"interactive","source":"Kaggle Learn","free":true},{"title":"Fairness and Machine Learning","url":"https://fairmlbook.org/","type":"book","source":"Barocas, Hardt, Narayanan","free":true},{"title":"AI Safety, Ethics, and Society","url":"https://www.aisafetybook.com/","type":"book","source":"Center for AI Safety","free":true},{"title":"Machine Bias","url":"https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing","type":"article","source":"ProPublica","free":true}],"subtopics":[{"title":"Where bias comes from","desc":"Bias enters through who is in the data, how labels were made, which features act as proxies for protected traits, and how the system is used after launch.","level":"core","resources":[{"title":"Fairness (Machine Learning Crash Course)","url":"https://developers.google.com/machine-learning/crash-course/fairness","type":"course","source":"Google","free":true}]},{"title":"Case studies of real harm","desc":"Learning from documented failures, like risk scores in criminal justice and face recognition that misses darker-skinned women, is the fastest way to build judgment.","level":"core","resources":[{"title":"Machine Bias","url":"https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing","type":"article","source":"ProPublica","free":true},{"title":"Gender Shades","url":"http://gendershades.org/","type":"article","source":"MIT Media Lab","free":true}]},{"title":"Measuring fairness","desc":"Compare error rates and outcomes across groups. Definitions like demographic parity and equalized odds often can't all hold at once, so you must choose based on the context.","level":"deep","resources":[{"title":"Fairlearn","url":"https://fairlearn.org/","type":"tool","source":"Fairlearn","free":true},{"title":"Fairness and Machine Learning","url":"https://fairmlbook.org/","type":"book","source":"Barocas, Hardt, Narayanan","free":true}]},{"title":"Transparency and documentation","desc":"Model cards and datasheets record what a model or dataset is for, how it was tested, and where it should not be used.","level":"core","resources":[{"title":"Model Cards for Model Reporting","url":"https://arxiv.org/abs/1810.03993","type":"paper","source":"arXiv","free":true},{"title":"Datasheets for Datasets","url":"https://arxiv.org/abs/1803.09010","type":"paper","source":"arXiv","free":true}]},{"title":"Generative AI harms","desc":"LLMs and image models add new issues: stereotypes in generated content, misinformation, deepfakes, copyright questions, and the labor behind training data.","level":"deep","resources":[]},{"title":"Accountability and human oversight","desc":"Someone must own each AI decision, people need a way to appeal, and humans in the loop need the time and information to actually catch errors.","level":"optional","resources":[]}]},{"id":"linear-algebra","title":"Linear Algebra","tier":1,"lane":"foundations","prereqs":["math-intuition"],"roles":{"aie":"a","mle":"c","ds":"r","rs":"c"},"summary":"Linear algebra is the math of vectors and matrices. Every neural network layer is a matrix multiplication, and embeddings, attention, and LoRA are all linear algebra.","why":"If you train, debug, or design models, tensor shapes and matrix operations are your daily language. It also explains why GPUs matter: they are machines for multiplying matrices fast.","depth":"AI engineers building apps need only vectors, dot products, and cosine similarity; the rest is 'know it exists.' ML engineers must master matrix multiplication, shapes, broadcasting, and the geometric view of transformations. Researchers should also be fluent with eigenvectors, SVD, low-rank structure, and norms. Almost nobody needs to compute decompositions by hand; libraries do that.","hours":30,"outcomes":["You can read a matrix multiplication as a transformation and predict the output shape of any layer.","You can explain dot products, norms, and cosine similarity, and implement them in NumPy.","You can explain eigenvectors and SVD and how low-rank approximation underlies PCA and LoRA.","You can debug shape mismatches and broadcasting errors in tensor code."],"project":"In NumPy, write a 2-layer neural network forward pass by hand and print every shape. Then take a grayscale image, compute its SVD, and rebuild it from the top 5, 20, and 50 singular values. Plot the results and explain how this connects to LoRA's low-rank updates.","resources":[{"title":"Essence of linear algebra","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab","type":"video","source":"3Blue1Brown","free":true},{"title":"Mathematics for Machine Learning (Part I, ch. 2-4)","url":"https://mml-book.github.io/","type":"book","source":"Deisenroth, Faisal, Ong","free":true},{"title":"Linear Algebra (18.06)","url":"https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/","type":"course","source":"MIT OCW (Gilbert Strang)","free":true},{"title":"Immersive Linear Algebra","url":"http://immersivemath.com/ila/index.html","type":"interactive","source":"immersivemath","free":true},{"title":"Linear Algebra (Dive into Deep Learning 2.3)","url":"https://d2l.ai/chapter_preliminaries/linear-algebra.html","type":"book","source":"d2l.ai","free":true},{"title":"Computational Linear Algebra","url":"https://github.com/fastai/numerical-linear-algebra","type":"course","source":"fast.ai","free":true}],"subtopics":[{"title":"Vectors, dot products, and norms","desc":"Vectors are points or directions. The dot product measures alignment, the norm measures length, and together they give cosine similarity, the core of embedding search.","level":"core","resources":[{"title":"Linear Algebra (Dive into Deep Learning 2.3)","url":"https://d2l.ai/chapter_preliminaries/linear-algebra.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Matrices as transformations","desc":"A matrix stretches, rotates, or projects space. Multiplying matrices chains these transformations. A neural network layer is a matrix followed by a nonlinearity.","level":"core","resources":[{"title":"Essence of linear algebra","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Tensors, shapes, and broadcasting","desc":"Real code works with batches: 3D and 4D arrays. Knowing how shapes combine and how broadcasting stretches dimensions prevents most bugs in model code.","level":"core","resources":[{"title":"NumPy linear algebra reference","url":"https://numpy.org/doc/stable/reference/routines.linalg.html","type":"docs","source":"NumPy","free":true}]},{"title":"Eigenvectors and SVD","desc":"Eigenvectors are directions a matrix only stretches. SVD breaks any matrix into rotate, scale, rotate, which reveals its most important directions.","level":"deep","resources":[{"title":"Matrix Methods in Data Analysis, Signal Processing, and Machine Learning (18.065)","url":"https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/","type":"course","source":"MIT OCW","free":true}]},{"title":"Low rank and why it matters","desc":"Many large matrices are well approximated by a product of two thin ones. This is the idea behind PCA, compression, and LoRA fine-tuning.","level":"deep","resources":[]},{"title":"Proof-based linear algebra","desc":"Vector spaces, linear maps, and proofs. Useful for theory research and reading dense papers, but not needed for applied work.","level":"optional","resources":[{"title":"Linear Algebra Done Right","url":"https://linear.axler.net/","type":"book","source":"Sheldon Axler","free":true}]}]},{"id":"calculus","title":"Calculus & Gradients","tier":1,"lane":"foundations","prereqs":["math-intuition"],"roles":{"aie":"a","mle":"c","ds":"r","rs":"c"},"summary":"Calculus studies how things change. For AI, the key idea is the gradient: it tells you how a small change in each parameter would change the loss, which is how every model learns.","why":"Backpropagation, learning rates, vanishing gradients, and exploding losses are all calculus. If you train models, you need this to understand why training works or fails.","depth":"AI engineers building apps only need the intuition: a gradient points uphill, and training steps downhill. ML engineers must master derivatives, the chain rule, partial derivatives, and how autograd applies them, since that's what backprop is. Researchers should be comfortable with matrix calculus and Jacobians. You don't need integration techniques or to derive backprop by hand for every layer; frameworks do that.","hours":25,"outcomes":["You can explain a derivative as a rate of change and a gradient as the direction of steepest increase.","You can apply the chain rule to a small computation graph by hand.","You can explain how backpropagation and autograd compute gradients for a network.","You can diagnose vanishing and exploding gradients and say why they happen."],"project":"Follow Karpathy's micrograd video and build your own tiny autograd engine. Use it to train a small neural network on a toy dataset. Then check your gradients against PyTorch's autograd on the same network and confirm they match to several decimal places.","resources":[{"title":"The spelled-out intro to neural networks and backpropagation: building micrograd","url":"https://www.youtube.com/watch?v=VMj-3S1tku0","type":"video","source":"Andrej Karpathy","free":true},{"title":"Essence of calculus","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr","type":"video","source":"3Blue1Brown","free":true},{"title":"The Matrix Calculus You Need For Deep Learning","url":"https://explained.ai/matrix-calculus/","type":"article","source":"Terence Parr & Jeremy Howard","free":true},{"title":"CS231n: Backpropagation, Intuitions","url":"https://cs231n.github.io/optimization-2/","type":"article","source":"Stanford","free":true},{"title":"Mathematics for Machine Learning (ch. 5)","url":"https://mml-book.github.io/","type":"book","source":"Deisenroth, Faisal, Ong","free":true},{"title":"Automatic Differentiation (Dive into Deep Learning 2.5)","url":"https://d2l.ai/chapter_preliminaries/autograd.html","type":"book","source":"d2l.ai","free":true}],"subtopics":[{"title":"Derivatives as rates of change","desc":"A derivative tells you how much the output moves when you nudge the input. That one idea drives all of gradient-based learning.","level":"core","resources":[{"title":"Essence of calculus","url":"https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr","type":"video","source":"3Blue1Brown","free":true}]},{"title":"The chain rule","desc":"When functions are stacked, their derivatives multiply. A neural network is a long stack of functions, so the chain rule is how gradients flow backward through it.","level":"core","resources":[{"title":"Backpropagation calculus","url":"https://www.3blue1brown.com/lessons/backpropagation-calculus","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Partial derivatives and gradients","desc":"With many inputs, a partial derivative measures change along one input. The gradient collects them all into a vector that points uphill on the loss surface.","level":"core","resources":[{"title":"Multivariable calculus","url":"https://www.khanacademy.org/math/multivariable-calculus","type":"course","source":"Khan Academy","free":true}]},{"title":"Backpropagation and autograd","desc":"Backprop applies the chain rule efficiently from the output back to every parameter. PyTorch's autograd does this automatically by recording a computation graph.","level":"core","resources":[{"title":"The spelled-out intro to neural networks and backpropagation: building micrograd","url":"https://www.youtube.com/watch?v=VMj-3S1tku0","type":"video","source":"Andrej Karpathy","free":true},{"title":"A Gentle Introduction to torch.autograd","url":"https://docs.pytorch.org/tutorials/beginner/blitz/autograd_tutorial.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Matrix calculus and Jacobians","desc":"Gradients of vector and matrix functions, written compactly. Needed to derive gradients for new layers or to follow derivations in papers.","level":"deep","resources":[{"title":"The Matrix Calculus You Need For Deep Learning","url":"https://explained.ai/matrix-calculus/","type":"article","source":"Terence Parr & Jeremy Howard","free":true}]},{"title":"Integrals and the rest of calculus","desc":"Integrals show up in probability (areas under density curves) and in diffusion model theory. Applied engineers can mostly skip them.","level":"optional","resources":[{"title":"Single Variable Calculus (18.01SC)","url":"https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/","type":"course","source":"MIT OCW","free":true}]}]},{"id":"probability-stats","title":"Probability & Statistics","tier":1,"lane":"foundations","prereqs":["math-intuition"],"roles":{"aie":"r","mle":"c","ds":"c","rs":"c","pm":"a"},"summary":"Probability describes uncertainty, and statistics turns data into conclusions you can trust. Together they explain how models make predictions and how you know whether a result is real.","why":"LLMs literally output probability distributions, and every eval, A/B test, and metric is a statistical claim. Without this, it's easy to ship a change that only looked better because of noise.","depth":"AI engineers must master the practical parts: distributions, sampling, expected value, confidence intervals, and enough to tell if an eval improvement is real. Data scientists must master hypothesis testing, regression, experiment design, and Bayesian thinking. ML engineers and researchers also need likelihood, maximum likelihood estimation, and conditional probability fluency. Measure theory is 'know it exists' for nearly everyone.","hours":35,"outcomes":["You can explain random variables, common distributions, expectation, and variance.","You can apply Bayes' theorem and conditional probability to a real problem.","You can put a confidence interval on an eval score and decide whether two model versions really differ.","You can explain maximum likelihood and why cross-entropy loss is used to train classifiers and LLMs.","You can design a simple A/B test with an adequate sample size."],"project":"Run the same 100-question eval on two prompt versions (or two models) at least three times each. Compute the mean score, standard error, and 95% confidence interval for each, plus a paired test on the difference. Write a short verdict on whether the \"better\" version is actually better, and how many questions you'd need to detect a 2-point difference.","resources":[{"title":"StatQuest","url":"https://www.youtube.com/@statquest","type":"video","source":"StatQuest","free":true},{"title":"Seeing Theory","url":"https://seeing-theory.brown.edu/","type":"interactive","source":"Brown University","free":true},{"title":"Statistics 110: Probability","url":"https://www.youtube.com/playlist?list=PL2SOU6wwxB0uwwH80KTQ6ht66KWxbzTIo","type":"course","source":"Harvard (Joe Blitzstein)","free":true},{"title":"OpenIntro Statistics","url":"https://www.openintro.org/book/os/","type":"book","source":"OpenIntro","free":true},{"title":"Think Stats","url":"https://greenteapress.com/wp/think-stats-3e/","type":"book","source":"Allen Downey","free":true},{"title":"Adding Error Bars to Evals","url":"https://arxiv.org/abs/2411.00640","type":"paper","source":"arXiv (Anthropic)","free":true},{"title":"Statistics and probability","url":"https://www.khanacademy.org/math/statistics-probability","type":"course","source":"Khan Academy","free":true}],"subtopics":[{"title":"Probability basics and distributions","desc":"Random variables, Bernoulli, binomial, normal, and categorical distributions. An LLM's next-token output is a categorical distribution over its vocabulary.","level":"core","resources":[{"title":"Seeing Theory","url":"https://seeing-theory.brown.edu/","type":"interactive","source":"Brown University","free":true}]},{"title":"Conditional probability and Bayes","desc":"How beliefs should update with evidence. It underpins classifiers, explains base-rate errors, and is the core of Bayesian methods.","level":"core","resources":[{"title":"Bayes' theorem","url":"https://www.3blue1brown.com/lessons/bayes-theorem","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Descriptive stats and sampling","desc":"Mean, median, variance, and the central limit theorem. Why averages of many samples behave predictably, and how sample size controls noise.","level":"core","resources":[{"title":"StatQuest","url":"https://www.youtube.com/@statquest","type":"video","source":"StatQuest","free":true}]},{"title":"Uncertainty in evals and experiments","desc":"Confidence intervals, standard errors, and significance tests tell you whether a score change is real. This applies directly to LLM evals and product A/B tests.","level":"core","resources":[{"title":"A statistical approach to model evaluations","url":"https://www.anthropic.com/research/statistical-approach-to-model-evals","type":"article","source":"Anthropic","free":true},{"title":"Evan's Awesome A/B Tools","url":"https://www.evanmiller.org/ab-testing/","type":"tool","source":"Evan Miller","free":true}]},{"title":"Likelihood and estimation","desc":"Maximum likelihood picks parameters that make the observed data most probable. Minimizing cross-entropy loss is exactly this, which is how LLMs are pretrained.","level":"deep","resources":[{"title":"Probability and Statistics (Dive into Deep Learning 2.6)","url":"https://d2l.ai/chapter_preliminaries/probability.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Bayesian methods","desc":"Treat parameters as uncertain and update a full distribution over them. Useful for small data, uncertainty estimates, and decision-making.","level":"optional","resources":[{"title":"Think Bayes 2","url":"https://allendowney.github.io/ThinkBayes2/","type":"book","source":"Allen Downey","free":true}]}]},{"id":"python-data","title":"Python for Data (NumPy, pandas)","tier":1,"lane":"code","prereqs":["python-basics"],"roles":{"aie":"r","mle":"c","ds":"c","rs":"c"},"summary":"NumPy and pandas are the Python libraries for working with numbers and tables. NumPy gives you fast arrays; pandas gives you DataFrames, which are spreadsheets you control with code.","why":"Every ML workflow starts with loading, cleaning, and reshaping data, and model inputs are NumPy arrays or tensors that behave the same way. If you can't move data around fluently, you spend your time fighting the tools instead of learning from the data.","depth":"Master pandas loading, filtering, groupby, merge, and handling missing values, plus NumPy array shapes, indexing, and broadcasting. These come up daily. Polars, DuckDB, and memory tuning are worth knowing about for large data but are not required to start.","hours":35,"outcomes":["You can load a CSV or Parquet file, inspect it, and clean obvious problems like missing values and wrong types.","You can answer questions with groupby, aggregation, and joins instead of loops.","You can predict the shape of a NumPy operation, including broadcasting, before running it.","You can work in a Jupyter notebook and keep it tidy enough for someone else to rerun."],"project":"Take a public dataset with at least 50,000 rows (for example a city's open data on 311 calls or bike trips). Clean it, then answer five concrete questions using only vectorized pandas (no Python loops), such as busiest hour by neighborhood or month-over-month change.","resources":[{"title":"Python for Data Analysis, 3rd Edition (open access)","url":"https://wesmckinney.com/book/","type":"book","source":"Wes McKinney","free":true},{"title":"Kaggle Learn: Pandas","url":"https://www.kaggle.com/learn/pandas","type":"interactive","source":"Kaggle","free":true},{"title":"Python Data Science Handbook","url":"https://jakevdp.github.io/PythonDataScienceHandbook/","type":"book","source":"Jake VanderPlas","free":true},{"title":"pandas getting started tutorials","url":"https://pandas.pydata.org/docs/getting_started/intro_tutorials/index.html","type":"docs","source":"pandas","free":true},{"title":"NumPy: Learn","url":"https://numpy.org/learn/","type":"docs","source":"NumPy","free":true},{"title":"Project Jupyter","url":"https://jupyter.org/","type":"tool","source":"Jupyter","free":true}],"subtopics":[{"title":"NumPy arrays, shapes, and indexing","desc":"An ndarray is a grid of numbers with a shape like (rows, columns). Slicing, boolean masks, and reshaping are the moves you will use constantly, and they carry over directly to PyTorch tensors.","level":"core","resources":[{"title":"NumPy: the absolute basics for beginners","url":"https://numpy.org/doc/stable/user/absolute_beginners.html","type":"docs","source":"NumPy","free":true},{"title":"Indexing on ndarrays","url":"https://numpy.org/doc/stable/user/basics.indexing.html","type":"docs","source":"NumPy","free":true}]},{"title":"Vectorization and broadcasting","desc":"Vectorization means operating on whole arrays at once instead of looping, which is often 100x faster. Broadcasting is the rule for combining arrays of different shapes. Shape bugs are the most common bug in ML code.","level":"core","resources":[{"title":"Broadcasting","url":"https://numpy.org/doc/stable/user/basics.broadcasting.html","type":"docs","source":"NumPy","free":true}]},{"title":"pandas DataFrames: load, select, filter","desc":"Reading CSV, JSON, and Parquet, selecting columns, filtering rows with conditions, and using .loc and .iloc correctly.","level":"core","resources":[{"title":"10 minutes to pandas","url":"https://pandas.pydata.org/docs/user_guide/10min.html","type":"docs","source":"pandas","free":true}]},{"title":"Cleaning: missing values, types, duplicates","desc":"Real data has gaps, wrong types, and duplicate rows. Learn to find them, decide what to do about them, and document the choice.","level":"core","resources":[{"title":"Working with missing data","url":"https://pandas.pydata.org/docs/user_guide/missing_data.html","type":"docs","source":"pandas","free":true}]},{"title":"Groupby, merge, and reshape","desc":"Split-apply-combine with groupby, SQL-style joins with merge, and pivot/melt to switch between wide and long tables. This is where pandas starts to save you hours.","level":"core","resources":[{"title":"Group by: split-apply-combine","url":"https://pandas.pydata.org/docs/user_guide/groupby.html","type":"docs","source":"pandas","free":true},{"title":"Merge, join, concatenate and compare","url":"https://pandas.pydata.org/docs/user_guide/merging.html","type":"docs","source":"pandas","free":true}]},{"title":"Dates and time series","desc":"Parsing dates, resampling to daily or monthly, and rolling windows. Needed for any data with a time dimension, such as sales, logs, or sensor readings.","level":"deep","resources":[{"title":"Time series / date functionality","url":"https://pandas.pydata.org/docs/user_guide/timeseries.html","type":"docs","source":"pandas","free":true}]},{"title":"Bigger data: Polars and DuckDB","desc":"When pandas gets slow or runs out of memory, Polars (a fast DataFrame library) and DuckDB (SQL on local files) handle millions of rows on a laptop. Good to know they exist.","level":"optional","resources":[{"title":"Polars user guide","url":"https://docs.pola.rs/","type":"docs","source":"Polars","free":true},{"title":"DuckDB documentation","url":"https://duckdb.org/docs/stable/","type":"docs","source":"DuckDB","free":true}]}]},{"id":"git-cli","title":"Git, CLI & Dev Environment","tier":1,"lane":"code","prereqs":["python-basics"],"roles":{"aie":"c","mle":"c","ds":"r","rs":"r"},"summary":"The command line, Git, and a good editor are the everyday environment of anyone who writes code. Git tracks every change to your code so you can undo mistakes and collaborate.","why":"You can't deploy, collaborate, run a remote GPU box, or safely let an AI agent edit your code without these. Git is also your safety net when an AI coding tool makes a large change you want to roll back.","depth":"Master the daily loop: navigate the terminal, edit files, git add/commit/push/pull, branches, and pull requests. Know how to recover from a bad commit. Rebasing, SSH config, and Docker are useful to understand but you can learn them as needed.","hours":20,"outcomes":["You can move around, search, and run programs from a terminal without a GUI.","You can commit work in small logical steps, push to GitHub, and open a pull request.","You can create a branch, merge it, and resolve a simple merge conflict.","You can undo a mistake with git restore, revert, or reset without losing work.","You can set up a project with an editor, a virtual environment, and a .gitignore that keeps secrets out of the repo."],"project":"Put your Python projects on GitHub. Use a feature branch for one new feature, open a pull request against your own repo, add a GitHub Actions workflow that runs Ruff on every push, and merge it once the check passes.","resources":[{"title":"The Missing Semester of Your CS Education","url":"https://missing.csail.mit.edu/","type":"course","source":"MIT","free":true},{"title":"Learn Git Branching","url":"https://learngitbranching.js.org/","type":"interactive","source":"Learn Git Branching","free":true},{"title":"Git and GitHub for Beginners - Crash Course","url":"https://www.youtube.com/watch?v=RGOj5yH7evk","type":"video","source":"freeCodeCamp","free":true},{"title":"Pro Git book","url":"https://git-scm.com/book/en/v2","type":"book","source":"git-scm.com","free":true},{"title":"Atlassian Git Tutorials","url":"https://www.atlassian.com/git/tutorials","type":"article","source":"Atlassian","free":true},{"title":"The Linux Command Line (free book)","url":"https://linuxcommand.org/tlcl.php","type":"book","source":"William Shotts","free":true}],"subtopics":[{"title":"Shell basics","desc":"Paths, cd, ls, pipes, redirects, environment variables, and running scripts. The terminal is where AI tools, servers, and GPUs are controlled.","level":"core","resources":[{"title":"Missing Semester: Course overview + the shell","url":"https://missing.csail.mit.edu/2020/course-shell/","type":"course","source":"MIT","free":true}]},{"title":"Git fundamentals","desc":"The working directory, staging area, and commits. A commit is a saved snapshot with a message; history is a chain of those snapshots.","level":"core","resources":[{"title":"Missing Semester: Version Control (Git)","url":"https://missing.csail.mit.edu/2020/version-control/","type":"course","source":"MIT","free":true},{"title":"Pro Git book","url":"https://git-scm.com/book/en/v2","type":"book","source":"git-scm.com","free":true}]},{"title":"Branches, merging, and pull requests","desc":"Branches let you try changes without touching main. Pull requests on GitHub are where changes get reviewed, tested, and merged.","level":"core","resources":[{"title":"Learn Git Branching","url":"https://learngitbranching.js.org/","type":"interactive","source":"Learn Git Branching","free":true},{"title":"GitHub Hello World","url":"https://docs.github.com/en/get-started/using-github/hello-world","type":"docs","source":"GitHub","free":true}]},{"title":"Editor and project setup","desc":"A code editor like VS Code or Cursor with Python support, a linter/formatter like Ruff, and a .gitignore and .env file for secrets. API keys should never be committed.","level":"core","resources":[{"title":"Getting Started with Python in VS Code","url":"https://code.visualstudio.com/docs/python/python-tutorial","type":"docs","source":"Microsoft","free":true},{"title":"Ruff","url":"https://docs.astral.sh/ruff/","type":"tool","source":"Astral","free":true}]},{"title":"Remote machines and SSH","desc":"Training and serving often happen on a remote Linux box with a GPU. SSH lets you log in, and your editor can work on remote files as if they were local.","level":"deep","resources":[{"title":"Remote Development using SSH","url":"https://code.visualstudio.com/docs/remote/ssh","type":"docs","source":"Microsoft","free":true}]},{"title":"Automation: CI and containers","desc":"GitHub Actions runs tests on every push. Docker packages your code with its dependencies so it runs the same everywhere. Both become core when you start shipping.","level":"optional","resources":[{"title":"GitHub Actions documentation","url":"https://docs.github.com/en/actions","type":"docs","source":"GitHub","free":true},{"title":"Docker: Get started","url":"https://docs.docker.com/get-started/","type":"docs","source":"Docker","free":true}]}]},{"id":"apis-json","title":"APIs, HTTP & JSON","tier":1,"lane":"code","prereqs":["python-basics"],"roles":{"aie":"c","mle":"r","ds":"r","pm":"a","nc":"c"},"summary":"An API is a way for programs to talk to each other over the internet, usually by sending HTTP requests and getting back JSON. Every LLM, vector database, and SaaS tool is used through one.","why":"Calling Claude, OpenAI, or Gemini is an HTTP request with a JSON body. Tool calling, MCP, webhooks, and no-code automations are all built on the same ideas. Understanding them makes SDK errors and integration bugs easy to debug.","depth":"Master the request/response cycle: methods, URLs, headers, auth with API keys, status codes, and reading and writing JSON in Python. Learn to handle errors, timeouts, and rate limits. Building your own API with FastAPI and writing JSON Schema are the next step, not a requirement on day one.","hours":15,"outcomes":["You can call a REST API from Python and from curl, with headers and an API key.","You can read an API's docs and turn them into working code.","You can explain what a 401, 404, 429, and 500 mean and how your code should react to each.","You can parse nested JSON into Python objects and validate it.","You can build a tiny API endpoint of your own that returns JSON."],"project":"Build a small FastAPI service with one endpoint that takes a city name, calls a free public weather API, validates the response with Pydantic, handles errors and timeouts cleanly, and returns a simplified JSON summary. Test it with curl.","resources":[{"title":"Python and REST APIs: Interacting With Web Services","url":"https://realpython.com/api-integration-in-python/","type":"article","source":"Real Python","free":true},{"title":"Overview of HTTP","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","type":"docs","source":"MDN","free":true},{"title":"FastAPI Tutorial - User Guide","url":"https://fastapi.tiangolo.com/tutorial/","type":"docs","source":"FastAPI","free":true},{"title":"Working with JSON","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/JSON","type":"docs","source":"MDN","free":true},{"title":"curl tutorial","url":"https://curl.se/docs/tutorial.html","type":"docs","source":"curl","free":true},{"title":"JSONPlaceholder (free fake API for practice)","url":"https://jsonplaceholder.typicode.com/","type":"tool","source":"JSONPlaceholder","free":true}],"subtopics":[{"title":"How HTTP works","desc":"A client sends a request (method, URL, headers, optional body) and the server sends back a status code, headers, and a body. GET reads, POST creates or triggers, and so on.","level":"core","resources":[{"title":"Overview of HTTP","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","type":"docs","source":"MDN","free":true},{"title":"HTTP response status codes","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","type":"docs","source":"MDN","free":true}]},{"title":"JSON in and out","desc":"JSON is text made of objects, arrays, strings, numbers, booleans, and null. In Python it maps to dicts and lists via the json module. LLM structured outputs and tool calls are all JSON.","level":"core","resources":[{"title":"Introducing JSON","url":"https://www.json.org/json-en.html","type":"docs","source":"json.org","free":true},{"title":"json: JSON encoder and decoder","url":"https://docs.python.org/3/library/json.html","type":"docs","source":"Python.org","free":true}]},{"title":"Calling APIs from Python","desc":"Using requests or httpx to send calls, pass API keys in headers, and read responses. Keep keys in environment variables, never in code.","level":"core","resources":[{"title":"Requests Quickstart","url":"https://requests.readthedocs.io/en/latest/user/quickstart/","type":"docs","source":"Requests","free":true},{"title":"HTTPX","url":"https://www.python-httpx.org/","type":"docs","source":"HTTPX","free":true}]},{"title":"Errors, retries, and rate limits","desc":"Real APIs time out, return 429 when you send too much, and fail now and then. Retry with exponential backoff, set timeouts, and log failures. This matters a lot with LLM APIs.","level":"core","resources":[]},{"title":"Validating data with Pydantic and JSON Schema","desc":"JSON Schema describes the shape JSON must have. Pydantic turns Python classes into validators and schemas. LLM SDKs use both for structured outputs and tool definitions.","level":"deep","resources":[{"title":"Pydantic documentation","url":"https://pydantic.dev/docs/validation/latest/get-started/","type":"docs","source":"Pydantic","free":true},{"title":"JSON Schema: Creating your first schema","url":"https://json-schema.org/learn/getting-started-step-by-step","type":"docs","source":"JSON Schema","free":true}]},{"title":"Building your own API","desc":"FastAPI lets you expose a Python function as an HTTP endpoint in a few lines, with automatic docs. It is the usual way to wrap a model or an LLM workflow as a service.","level":"deep","resources":[{"title":"FastAPI Tutorial - User Guide","url":"https://fastapi.tiangolo.com/tutorial/","type":"docs","source":"FastAPI","free":true}]},{"title":"Webhooks, streaming, and auth flows","desc":"Webhooks are APIs calling you when something happens. Streaming (server-sent events) is how LLM responses arrive token by token. OAuth is how apps get permission to act for a user. Know what they are.","level":"optional","resources":[]}]},{"id":"sql","title":"SQL & Databases","tier":1,"lane":"code","prereqs":[],"roles":{"aie":"r","mle":"r","ds":"c","pm":"r","biz":"a","nc":"a"},"summary":"SQL is the language for asking questions of databases. Most company data lives in relational databases and warehouses, and SQL is how you get it out.","why":"Data scientists spend a large share of their time writing SQL. AI engineers need it for app data, logs, and Postgres with pgvector. PMs and analysts use it to answer their own questions instead of waiting on someone else.","depth":"Master SELECT, WHERE, GROUP BY, JOINs, subqueries, CTEs, and window functions until you can answer a business question in one query. Schema design and indexes need a working understanding. Query planners, transactions, and database internals are only for people who run databases.","hours":25,"outcomes":["You can write queries that filter, aggregate, and join several tables correctly.","You can use CTEs and window functions for running totals, rankings, and period-over-period changes.","You can spot when a join is silently duplicating or dropping rows.","You can design a simple schema with primary and foreign keys for a small app.","You can query a local file or database from Python."],"project":"Load a public multi-table dataset (for example an e-commerce orders, customers, and products dataset) into SQLite or DuckDB. Write queries for monthly revenue, each customer's first and latest order, the top 3 products per category by revenue, and 30-day repeat purchase rate.","resources":[{"title":"SQLBolt","url":"https://sqlbolt.com/","type":"interactive","source":"SQLBolt","free":true},{"title":"Kaggle Learn: Intro to SQL","url":"https://www.kaggle.com/learn/intro-to-sql","type":"interactive","source":"Kaggle","free":true},{"title":"Kaggle Learn: Advanced SQL","url":"https://www.kaggle.com/learn/advanced-sql","type":"interactive","source":"Kaggle","free":true},{"title":"ThoughtSpot (formerly Mode) SQL Tutorial","url":"https://www.thoughtspot.com/sql-tutorial","type":"course","source":"ThoughtSpot","free":true},{"title":"SQL Tutorial - Full Database Course for Beginners","url":"https://www.youtube.com/watch?v=HXV3zeQKqGY","type":"video","source":"freeCodeCamp","free":true},{"title":"CS 186: Introduction to Database Systems","url":"https://cs186berkeley.net/","type":"course","source":"UC Berkeley","free":true}],"subtopics":[{"title":"Querying a single table","desc":"SELECT, WHERE, ORDER BY, LIMIT, and aggregate functions like COUNT, SUM, and AVG with GROUP BY and HAVING.","level":"core","resources":[{"title":"SQLBolt interactive lessons","url":"https://sqlbolt.com/","type":"interactive","source":"SQLBolt","free":true}]},{"title":"Joins and relationships","desc":"INNER, LEFT, and FULL joins combine tables by keys. Getting joins wrong is the most common way SQL gives confidently wrong answers.","level":"core","resources":[{"title":"Select Star SQL","url":"https://selectstarsql.com/","type":"interactive","source":"Select Star SQL","free":true}]},{"title":"CTEs and window functions","desc":"CTEs (WITH clauses) break a big query into readable steps. Window functions compute things like rank, running total, or previous value without collapsing rows. They are what separates basic from fluent SQL.","level":"core","resources":[{"title":"PostgreSQL Tutorial: Window Functions","url":"https://www.postgresql.org/docs/current/tutorial-window.html","type":"docs","source":"PostgreSQL","free":true}]},{"title":"Schema design and data modeling","desc":"Tables, primary keys, foreign keys, and normalization. Knowing how data is shaped tells you how to query it and where it can go wrong.","level":"deep","resources":[{"title":"PostgreSQL Tutorial","url":"https://www.postgresql.org/docs/current/tutorial.html","type":"docs","source":"PostgreSQL","free":true}]},{"title":"Indexes and performance","desc":"An index is a lookup structure that makes queries fast. Learn why some queries take milliseconds and others take minutes, and how to read an EXPLAIN plan.","level":"deep","resources":[{"title":"Use The Index, Luke","url":"https://use-the-index-luke.com/","type":"book","source":"Markus Winand","free":true}]},{"title":"SQL for AI apps: Postgres, pgvector, DuckDB","desc":"Postgres with the pgvector extension stores embeddings next to normal data, a common choice for RAG. DuckDB runs fast SQL directly on CSV and Parquet files on your laptop.","level":"optional","resources":[{"title":"pgvector","url":"https://github.com/pgvector/pgvector","type":"tool","source":"GitHub","free":true},{"title":"DuckDB documentation","url":"https://duckdb.org/docs/stable/","type":"docs","source":"DuckDB","free":true}]}]},{"id":"algorithms-ds","title":"Data Structures & Algorithms","tier":1,"lane":"code","prereqs":["python-basics"],"roles":{"aie":"r","mle":"r","ds":"a","rs":"r"},"summary":"Data structures are ways to organize data in memory (arrays, hash maps, trees, graphs). Algorithms are step-by-step methods to solve problems with them. Big-O notation describes how their cost grows as inputs grow.","why":"It helps you write code that stays fast when data grows from 1,000 rows to 100 million, and it is the vocabulary of technical interviews. Many AI ideas are built on these basics: vector search is nearest-neighbor search, beam search is a search algorithm, and tokenizers use tries and merges.","depth":"Implement yourself and understand deeply: arrays vs linked lists, hash maps, stacks and queues, binary search, sorting (know how merge sort works), recursion, BFS and DFS on trees and graphs, and Big-O analysis. Know how to use but not implement: heaps and priority queues, balanced trees, Dijkstra, tries, and dynamic programming patterns (practice these if you are interviewing). Just know they exist: red-black trees, B-trees, union-find, advanced graph algorithms, and approximate nearest-neighbor indexes like HNSW (covered later under vector databases).","hours":40,"outcomes":["You can state the Big-O time and memory of common operations and spot an accidental O(n^2) loop.","You can pick a list, dict, set, heap, or deque for a task and justify it.","You can implement binary search, BFS, and DFS from scratch without bugs.","You can solve typical easy and medium coding interview problems in Python.","You can explain in plain words why approximate nearest-neighbor search exists."],"project":"Build a tiny search engine over a folder of text files: an inverted index using dicts, top-k results with heapq, and a brute-force nearest-neighbor search over word-count vectors. Time each part as the corpus grows 10x and explain the results in Big-O terms.","resources":[{"title":"MIT 6.006 Introduction to Algorithms (Spring 2020)","url":"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/","type":"course","source":"MIT OCW","free":true},{"title":"Algorithms and Data Structures Tutorial - Full Course for Beginners","url":"https://www.youtube.com/watch?v=8hly31xKli0","type":"video","source":"freeCodeCamp","free":true},{"title":"Grokking Algorithms, Second Edition","url":"https://www.manning.com/books/grokking-algorithms-second-edition","type":"book","source":"Manning","free":false},{"title":"Problem Solving with Algorithms and Data Structures using Python","url":"https://runestone.academy/ns/books/published/pythonds/index.html","type":"book","source":"Runestone Academy","free":true},{"title":"VisuAlgo","url":"https://visualgo.net/en","type":"interactive","source":"NUS","free":true},{"title":"NeetCode Roadmap","url":"https://neetcode.io/roadmap","type":"interactive","source":"NeetCode","free":true},{"title":"Algorithms by Jeff Erickson","url":"https://jeffe.cs.illinois.edu/teaching/algorithms/","type":"book","source":"UIUC","free":true}],"subtopics":[{"title":"Big-O and complexity (implement and master)","desc":"How time and memory grow with input size: O(1), O(log n), O(n), O(n log n), O(n^2). You should be able to analyze any code you write this way.","level":"core","resources":[{"title":"Big-O Cheat Sheet","url":"https://www.bigocheatsheet.com/","type":"article","source":"Eric Rowell","free":true}]},{"title":"Core structures: arrays, hash maps, sets, stacks, queues (implement and master)","desc":"Know what Python's list, dict, set, and collections.deque do under the hood and what each operation costs. Build a stack and a queue yourself once. Hash maps are the single most useful structure in practice.","level":"core","resources":[{"title":"collections: Container datatypes","url":"https://docs.python.org/3/library/collections.html","type":"docs","source":"Python.org","free":true}]},{"title":"Searching, sorting, and recursion (implement and master)","desc":"Write binary search and merge sort by hand and understand why sorting is O(n log n). Learn recursion well enough to trace it on paper. In real work you call sorted(), but you should know what it costs.","level":"core","resources":[{"title":"Problem Solving with Algorithms and Data Structures using Python","url":"https://runestone.academy/ns/books/published/pythonds/index.html","type":"book","source":"Runestone Academy","free":true}]},{"title":"Trees and graphs: BFS and DFS (implement and master)","desc":"Trees and graphs model hierarchies, networks, and dependencies. Implement breadth-first and depth-first search yourself. Agent workflows, knowledge graphs, and computation graphs in deep learning all use these ideas.","level":"core","resources":[{"title":"VisuAlgo","url":"https://visualgo.net/en","type":"interactive","source":"NUS","free":true}]},{"title":"Heaps, tries, Dijkstra, and dynamic programming (use and understand)","desc":"Use heapq for top-k and priority queues, know what a trie is (prefix trees used in autocomplete and tokenizers), know Dijkstra finds shortest paths, and recognize dynamic programming (solving big problems by caching subproblems). Practice implementing these only if you are preparing for interviews.","level":"deep","resources":[{"title":"heapq: Heap queue algorithm","url":"https://docs.python.org/3/library/heapq.html","type":"docs","source":"Python.org","free":true}]},{"title":"Interview practice patterns","desc":"Two pointers, sliding window, hashing, BFS/DFS, and DP cover most interview problems. A structured problem list beats random grinding.","level":"optional","resources":[{"title":"NeetCode Roadmap","url":"https://neetcode.io/roadmap","type":"interactive","source":"NeetCode","free":true},{"title":"LeetCode","url":"https://leetcode.com/","type":"interactive","source":"LeetCode","free":true}]},{"title":"Advanced structures (just know they exist)","desc":"B-trees power database indexes, union-find groups connected items, and graph-based approximate nearest-neighbor indexes (like HNSW) power vector search. Know the names and what problem each solves; you will almost never implement them.","level":"optional","resources":[]}]},{"id":"ml-concepts","title":"How Machine Learning Works","tier":1,"lane":"ml","prereqs":["what-is-ai","math-intuition"],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"r","biz":"a"},"summary":"Machine learning is getting a computer to learn patterns from examples instead of following hand-written rules. This node covers the core ideas: data, features, labels, models, loss, training, and generalization.","why":"These concepts are the shared language of all AI work, from a spreadsheet-sized regression to training an LLM. Once they click, you can read any ML docs or paper intro and judge whether a model's results can be trusted.","depth":"Master the vocabulary and intuitions: supervised vs unsupervised, training vs inference, loss functions, gradient descent as 'adjust weights to reduce error', overfitting, and why we hold out test data. You don't need the math in detail yet. You should be able to explain each idea in plain words and sketch it on a whiteboard.","hours":20,"outcomes":["You can explain the difference between supervised, unsupervised, and reinforcement learning with an example of each.","You can describe what happens during training, from loss to gradient to weight update, in plain words.","You can explain overfitting and underfitting and why train, validation, and test splits exist.","You can frame a real problem as an ML task: inputs, target, success metric, and data needed.","You can tell when a problem does not need ML at all."],"project":"Pick three problems from your work or life. For each, write a one-page ML framing: input features, label, type of task, success metric, where the data would come from, a simple non-ML baseline, and the biggest risk of overfitting or bad data.","resources":[{"title":"Google Machine Learning Crash Course","url":"https://developers.google.com/machine-learning/crash-course","type":"course","source":"Google","free":true},{"title":"Machine Learning Specialization","url":"https://www.coursera.org/specializations/machine-learning-introduction","type":"course","source":"DeepLearning.AI / Stanford","free":false},{"title":"StatQuest: Machine Learning playlist","url":"https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF","type":"video","source":"StatQuest","free":true},{"title":"MLU-Explain: visual essays on ML concepts","url":"https://mlu-explain.github.io/","type":"interactive","source":"Amazon MLU","free":true},{"title":"Kaggle Learn: Intro to Machine Learning","url":"https://www.kaggle.com/learn/intro-to-machine-learning","type":"interactive","source":"Kaggle","free":true},{"title":"An Introduction to Statistical Learning (Python edition)","url":"https://www.statlearning.com/","type":"book","source":"James, Witten, Hastie, Tibshirani, Taylor","free":true}],"subtopics":[{"title":"Types of learning","desc":"Supervised learning learns from labeled examples (spam or not). Unsupervised learning finds structure without labels (clusters). Reinforcement learning learns from rewards. Self-supervised learning, which trains LLMs, makes labels from the data itself.","level":"core","resources":[{"title":"Google: Introduction to Machine Learning","url":"https://developers.google.com/machine-learning/intro-to-ml","type":"course","source":"Google","free":true}]},{"title":"Features, labels, and models","desc":"Features are the inputs, the label is what you want to predict, and a model is a function with adjustable parameters that maps one to the other. Regression predicts numbers; classification predicts categories.","level":"core","resources":[{"title":"A Gentle Introduction to Machine Learning","url":"https://www.youtube.com/watch?v=Gv9_4yMHFhI","type":"video","source":"StatQuest","free":true}]},{"title":"Loss and gradient descent","desc":"A loss function scores how wrong the model is. Gradient descent nudges each parameter in the direction that lowers the loss, repeated many times. The same loop trains neural networks and LLMs.","level":"core","resources":[{"title":"Google ML Crash Course: Linear regression","url":"https://developers.google.com/machine-learning/crash-course/linear-regression","type":"course","source":"Google","free":true}]},{"title":"Generalization, overfitting, and the bias-variance trade-off","desc":"The goal is to do well on new data, not memorize the training set. Too simple a model underfits, too flexible a model overfits. Holding out data is how you find out which is happening.","level":"core","resources":[{"title":"The Bias Variance Tradeoff","url":"https://mlu-explain.github.io/bias-variance/","type":"interactive","source":"Amazon MLU","free":true},{"title":"Google ML Crash Course: Datasets, generalization, and overfitting","url":"https://developers.google.com/machine-learning/crash-course/overfitting","type":"course","source":"Google","free":true}]},{"title":"The ML workflow end to end","desc":"Frame the problem, get and clean data, pick a baseline, train, evaluate, iterate, deploy, and monitor. Most of the effort goes into data and evaluation, not the model.","level":"deep","resources":[{"title":"Rules of Machine Learning","url":"https://developers.google.com/machine-learning/guides/rules-of-ml","type":"article","source":"Google","free":true}]},{"title":"Classic ML vs deep learning vs foundation models","desc":"Tabular data often works best with classic models like gradient boosting. Images, audio, and text favor deep learning. For many language tasks today, prompting a pre-trained LLM beats training anything. Knowing which to reach for saves weeks.","level":"deep","resources":[]}]},{"id":"llm-basics","title":"How LLMs Work (Intuition)","tier":1,"lane":"llm","prereqs":["what-is-ai"],"roles":{"aie":"c","mle":"c","ds":"c","rs":"c","pm":"c","biz":"r","nc":"r","pu":"r"},"summary":"A large language model (LLM) is a neural network trained on huge amounts of text to predict the next token. Scaled up and then tuned to follow instructions, that simple objective produces assistants that can write, reason, code, and use tools.","why":"Having a correct mental model of LLMs helps you use them well and judge them fairly. It explains why they hallucinate, why prompts and context matter so much, why they have knowledge cutoffs, and why outputs vary between runs.","depth":"Must master: next-token prediction, tokens, the context window, pretraining versus post-training, and sampling with temperature. You don't need the math of attention yet; you do need to know the model only sees what is in its context.","hours":8,"outcomes":["You can explain in plain words how an LLM generates text one token at a time.","You can describe the stages that turn a raw pretrained model into a helpful assistant.","You can explain context windows, knowledge cutoffs, and why models hallucinate.","You can predict how settings like temperature change a model's output."],"project":"Run the same three prompts (a fact question, a creative task, and a question about a recent event) through two different assistants at low and high temperature if you can. Write a one-page explainer for a non-technical friend that uses what you saw to explain tokens, next-token prediction, knowledge cutoffs, and hallucination.","resources":[{"title":"Large Language Models explained briefly","url":"https://www.youtube.com/watch?v=LPZh9BOjkQs","type":"video","source":"3Blue1Brown","free":true},{"title":"Intro to Large Language Models","url":"https://www.youtube.com/watch?v=zjkBMFhNj_g","type":"video","source":"Andrej Karpathy","free":true},{"title":"Generative AI exists because of the transformer","url":"https://ig.ft.com/generative-ai/","type":"interactive","source":"Financial Times","free":true},{"title":"Large language models, explained with a minimum of math and jargon","url":"https://www.understandingai.org/p/large-language-models-explained-with","type":"article","source":"Understanding AI","free":true},{"title":"Deep Dive into LLMs like ChatGPT","url":"https://www.youtube.com/watch?v=7xTGNNLPyMI","type":"video","source":"Andrej Karpathy","free":true},{"title":"Hugging Face LLM Course, Chapter 1","url":"https://huggingface.co/learn/llm-course/chapter1/1","type":"course","source":"Hugging Face","free":true}],"subtopics":[{"title":"Next-token prediction","desc":"The model reads the text so far and outputs a probability for every possible next token. Generation is just picking a token, appending it, and repeating.","level":"core","resources":[{"title":"Large Language Models explained briefly","url":"https://www.youtube.com/watch?v=LPZh9BOjkQs","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Pretraining and post-training","desc":"Pretraining on web-scale text gives the model broad knowledge and skill at continuing documents. Post-training (instruction tuning, RLHF, and reinforcement learning on tasks) shapes it into a helpful, safer assistant that can reason and use tools.","level":"core","resources":[{"title":"Deep Dive into LLMs like ChatGPT","url":"https://www.youtube.com/watch?v=7xTGNNLPyMI","type":"video","source":"Andrej Karpathy","free":true}]},{"title":"Tokens and the context window","desc":"Models read tokens (word pieces), not letters or words. The context window is the maximum number of tokens the model can consider at once, and it is all the model knows about your conversation.","level":"core","resources":[]},{"title":"Sampling and temperature","desc":"Temperature and top-p control how adventurous the token choices are. Low temperature gives more predictable output; higher gives more variety and more risk of errors.","level":"core","resources":[]},{"title":"Why LLMs hallucinate","desc":"The model produces plausible continuations, not looked-up facts. Without grounding in retrieved sources or tools, fluent but false answers are a natural failure mode.","level":"core","resources":[{"title":"What Is ChatGPT Doing and Why Does It Work?","url":"https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/","type":"article","source":"Stephen Wolfram","free":true}]},{"title":"What happens inside (a first look)","desc":"Words become vectors, attention lets tokens share information, and stacked layers refine meaning. Interpretability research is starting to show the internal steps models take.","level":"optional","resources":[{"title":"Large language models, explained with a minimum of math and jargon","url":"https://www.understandingai.org/p/large-language-models-explained-with","type":"article","source":"Understanding AI","free":true},{"title":"Tracing the thoughts of a large language model","url":"https://www.anthropic.com/research/tracing-thoughts-language-model","type":"article","source":"Anthropic","free":true}]}]},{"id":"custom-assistants","title":"Custom GPTs, Projects & Assistants","tier":2,"lane":"tools","prereqs":["prompt-engineering"],"roles":{"pm":"r","biz":"r","nc":"c","pu":"c"},"summary":"Custom assistants are saved, reusable setups of an AI with your own instructions, files, and tools. Examples include Claude Projects and Skills, ChatGPT Projects and custom GPTs, Gemini Gems, and Microsoft Copilot agents.","why":"Instead of re-explaining your business, style, and rules in every chat, you set it up once. Teams can share one assistant for support replies, proposals, onboarding, or policy questions, so everyone gets consistent results.","depth":"Master writing solid instructions, choosing the right knowledge files, and testing before you share. Know that features and plan availability change often (for example, which plans can build GPTs), so check the current help pages. Connecting tools and actions is a deeper step.","hours":10,"outcomes":["You can build a custom assistant with clear instructions and a curated knowledge base.","You can choose between a project, a custom assistant, a skill, and a full automation for a given job.","You can test an assistant on realistic questions and fix where it goes wrong.","You can share an assistant with a team safely, knowing what data it can access."],"project":"Build a custom assistant for one real job, such as answering customer FAQs or drafting proposals in your company style. Write the instructions, upload 3 to 5 knowledge files, and test it on 20 real questions. Track the failures, fix the instructions or files, and share it with one colleague for feedback.","resources":[{"title":"What are projects?","url":"https://support.claude.com/en/articles/9517075-what-are-projects","type":"docs","source":"Anthropic","free":true},{"title":"Use Gems in Gemini Apps","url":"https://support.google.com/gemini/answer/15146780","type":"docs","source":"Google","free":true},{"title":"Introducing Agent Skills","url":"https://claude.com/resources/articles/skills","type":"article","source":"Anthropic","free":true},{"title":"Microsoft Copilot Studio documentation","url":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/","type":"docs","source":"Microsoft","free":true},{"title":"On-boarding your AI Intern","url":"https://www.oneusefulthing.org/p/on-boarding-your-ai-intern","type":"article","source":"Ethan Mollick","free":true},{"title":"OpenAI Academy","url":"https://academy.openai.com/","type":"course","source":"OpenAI","free":true}],"subtopics":[{"title":"The main options","desc":"Projects (Claude, ChatGPT) group chats with shared files and instructions. Custom GPTs and Gemini Gems are shareable assistants with a fixed purpose. Copilot Studio builds assistants inside Microsoft 365. Pick based on where your team already works.","level":"core","resources":[{"title":"What are projects?","url":"https://support.claude.com/en/articles/9517075-what-are-projects","type":"docs","source":"Anthropic","free":true},{"title":"Use Gems in Gemini Apps","url":"https://support.google.com/gemini/answer/15146780","type":"docs","source":"Google","free":true}]},{"title":"Writing system instructions","desc":"Instructions tell the assistant its job, audience, tone, what to do when unsure, and what never to do. Write them like an onboarding doc for a new hire, with examples of good answers.","level":"core","resources":[{"title":"On-boarding your AI Intern","url":"https://www.oneusefulthing.org/p/on-boarding-your-ai-intern","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Knowledge files","desc":"Upload the documents the assistant should rely on: FAQs, price lists, style guides, policies. Keep them current, well organized, and free of anything users shouldn't see.","level":"core","resources":[]},{"title":"Skills and reusable procedures","desc":"Skills package instructions, examples, and scripts for a specific procedure (like 'make a branded report') that the assistant loads only when needed. They keep long, detailed know-how out of every conversation.","level":"deep","resources":[{"title":"What are skills?","url":"https://support.claude.com/en/articles/12512176-what-are-skills","type":"docs","source":"Anthropic","free":true}]},{"title":"Connecting tools and actions","desc":"Assistants can connect to calendars, CRMs, drives, and other apps through built-in connectors, actions, or MCP servers. This turns an assistant from 'answers questions' into 'does tasks'.","level":"deep","resources":[{"title":"Model Context Protocol","url":"https://modelcontextprotocol.io/","type":"docs","source":"MCP","free":true}]},{"title":"Testing and sharing safely","desc":"Try 15 to 20 real questions, including off-topic and adversarial ones, before sharing. Remember that users can sometimes extract instructions and files, so don't put secrets in them.","level":"core","resources":[]}]},{"id":"ai-strategy","title":"AI Strategy & ROI","tier":2,"lane":"biz","prereqs":["ai-use-cases"],"roles":{"pm":"c","biz":"c","ds":"a"},"summary":"AI strategy is deciding where AI fits in your business goals, what to invest in, in what order, and how you'll measure return on investment (ROI). It ties individual use cases into a plan with budget, owners, and milestones.","why":"Without a strategy, AI efforts become scattered pilots that never scale. A clear plan focuses money and attention on the few bets that matter, and gives you a way to prove results to leadership, investors, or yourself.","depth":"Master building a simple portfolio of use cases, estimating ROI honestly, and setting metrics. Know the bigger strategic questions (does AI change our competitive position or business model?) even if you act on them later.","hours":12,"outcomes":["You can write a one-page AI strategy linked to specific business goals.","You can estimate ROI for a use case, including hidden costs like checking time and change management.","You can define metrics that show whether an AI initiative is working.","You can balance quick wins with longer-term bets in a portfolio.","You can explain how AI might change your competitive position."],"project":"Write a one-page AI strategy for a real or sample business: three business goals, the five use cases that serve them, a rough ROI estimate for the top two (with all costs listed), the baseline metric you'll track for each, and a 90-day plan with owners.","resources":[{"title":"AI For Everyone","url":"https://www.deeplearning.ai/courses/ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true},{"title":"AI in the Enterprise","url":"https://cdn.openai.com/business-guides-and-resources/ai-in-the-enterprise.pdf","type":"article","source":"OpenAI","free":true},{"title":"Prediction Machines","url":"https://www.predictionmachines.ai/","type":"book","source":"Agrawal, Gans & Goldfarb","free":false},{"title":"AI For Business Specialization","url":"https://www.coursera.org/specializations/ai-for-business-wharton","type":"course","source":"Wharton (Coursera)","free":false},{"title":"How to Capitalize on Generative AI","url":"https://hbr.org/2023/11/how-to-capitalize-on-generative-ai","type":"article","source":"Harvard Business Review","free":false},{"title":"AI Playbook for the UK Government","url":"https://www.gov.uk/government/publications/ai-playbook-for-the-uk-government","type":"docs","source":"UK Government","free":true}],"subtopics":[{"title":"Start from business goals","desc":"Begin with what the business needs (grow revenue, cut cycle time, improve service) and work back to where AI helps. Strategies that start from the technology tend to drift.","level":"core","resources":[{"title":"AI For Everyone","url":"https://www.deeplearning.ai/courses/ai-for-everyone","type":"course","source":"DeepLearning.AI (Andrew Ng)","free":true}]},{"title":"Estimating ROI honestly","desc":"ROI = (value gained minus total cost) divided by total cost. Count tool fees, setup, training, and the time spent reviewing outputs. Time saved only becomes value if it's redirected to something useful.","level":"core","resources":[]},{"title":"Metrics and baselines","desc":"Measure the 'before' first: time per task, error rate, cost per ticket, conversion rate. Then track the same numbers after rollout, plus adoption and user satisfaction.","level":"core","resources":[]},{"title":"Portfolio thinking","desc":"Mix quick wins (off-the-shelf tools for individual productivity) with process redesigns and a few longer-term bets. Review the portfolio every quarter because AI capability moves fast.","level":"core","resources":[]},{"title":"Prediction and competitive advantage","desc":"AI makes prediction and content cheap. Ask what becomes more valuable when that happens: your data, relationships, judgment, distribution. That is where durable advantage lives.","level":"deep","resources":[{"title":"Prediction Machines","url":"https://www.predictionmachines.ai/","type":"book","source":"Agrawal, Gans & Goldfarb","free":false}]},{"title":"Risk and governance in the plan","desc":"Build risk management in from the start with an owner, an acceptable-use policy, and a review process for higher-risk uses. Frameworks like the NIST AI RMF give a ready checklist.","level":"deep","resources":[{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true}]},{"title":"Watching market economics","desc":"Investor and analyst reports show where money is flowing and where it may be overheated. Useful context, but don't let market hype set your priorities.","level":"optional","resources":[{"title":"AI's $600B Question","url":"https://sequoiacap.com/article/ais-600b-question","type":"article","source":"Sequoia Capital","free":true}]}]},{"id":"ai-product-design","title":"Designing AI Products (UX)","tier":2,"lane":"biz","prereqs":["ai-use-cases","llm-basics"],"roles":{"aie":"r","pm":"c","biz":"r"},"summary":"Designing AI products is about creating experiences where users understand what the AI can do, trust it the right amount, and can easily correct it when it's wrong. It covers interface patterns, setting expectations, feedback loops, and measuring quality.","why":"AI output is probabilistic: it varies and is sometimes wrong. Products that hide this lose user trust; products that design for it feel reliable. Good AI UX is often the difference between a demo and a product people keep using.","depth":"Master the core patterns: setting expectations, showing sources, human review of important actions, easy correction, and basic evals. You don't need to build models; you do need to understand enough about how LLMs fail to design around it.","hours":15,"outcomes":["You can choose the right interaction pattern (chat, inline suggestion, background agent) for a product problem.","You can design for errors with sources, confidence cues, undo, and human review.","You can write a product spec that includes AI-specific requirements and failure cases.","You can set up a simple evaluation process to judge AI output quality before and after launch.","You can design feedback mechanisms that help the product improve over time."],"project":"Pick an AI feature for a product you know (for example, 'draft a reply' in a support tool). Write a two-page spec covering the user problem, interaction pattern, how errors are shown and corrected, what needs human approval, and 15 eval examples with expected outputs. Mock up the key screen on paper or in a design tool.","resources":[{"title":"People + AI Guidebook","url":"https://pair.withgoogle.com/guidebook/","type":"docs","source":"Google PAIR","free":true},{"title":"Guidelines for Human-AI Interaction","url":"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/","type":"docs","source":"Microsoft HAX Toolkit","free":true},{"title":"The Shape of AI: UX patterns","url":"https://www.shapeof.ai/","type":"article","source":"Shape of AI","free":true},{"title":"Your AI Product Needs Evals","url":"https://hamel.dev/blog/posts/evals/","type":"article","source":"Hamel Husain","free":true},{"title":"What We've Learned From A Year of Building with LLMs","url":"https://applied-llms.org/","type":"article","source":"Yan, Bischof, Frye, Husain, Liu & Shankar","free":true},{"title":"Artificial Intelligence articles and research","url":"https://www.nngroup.com/topic/ai/","type":"article","source":"Nielsen Norman Group","free":true}],"subtopics":[{"title":"Human-AI interaction guidelines","desc":"Well-tested principles: make clear what the system can do and how well, show why it did something, support efficient correction, and adapt carefully over time.","level":"core","resources":[{"title":"Guidelines for Human-AI Interaction","url":"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/","type":"docs","source":"Microsoft HAX Toolkit","free":true},{"title":"People + AI Guidebook","url":"https://pair.withgoogle.com/guidebook/","type":"docs","source":"Google PAIR","free":true}]},{"title":"Interaction patterns","desc":"Chat is only one option. Inline suggestions, one-click actions, side panels, and background agents that report back each fit different jobs. Pick the one that fits the user's workflow.","level":"core","resources":[{"title":"The Shape of AI: UX patterns","url":"https://www.shapeof.ai/","type":"article","source":"Shape of AI","free":true}]},{"title":"Designing for errors and trust","desc":"Show sources, make outputs easy to edit, ask for confirmation before irreversible actions, and offer an easy way out to a human. Aim for 'calibrated trust': users rely on AI where it's good and check it where it isn't.","level":"core","resources":[]},{"title":"Evals: measuring quality","desc":"Evals are tests that check AI output against what good looks like, using examples, rubrics, and sometimes another model as a judge. They let PMs know whether a change made the product better or worse.","level":"core","resources":[{"title":"Your AI Product Needs Evals","url":"https://hamel.dev/blog/posts/evals/","type":"article","source":"Hamel Husain","free":true}]},{"title":"Agentic UX","desc":"When AI takes actions over many steps, users need to see progress, approve risky steps, interrupt, and review what happened. Design for supervision, not just conversation.","level":"deep","resources":[{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true}]},{"title":"Cost, latency, and model choice","desc":"Bigger models are smarter but slower and pricier. Product decisions like streaming responses, caching, and using smaller models for simple steps shape both experience and margins.","level":"deep","resources":[]},{"title":"Feedback loops and data","desc":"Thumbs up/down, edits, and abandoned outputs are signals. Collect them with consent and use them to find failure patterns and improve prompts or retrieval.","level":"optional","resources":[]}]},{"id":"ai-regulation","title":"AI Regulation & Compliance","tier":2,"lane":"safety","prereqs":["ai-ethics","ai-privacy"],"roles":{"aie":"r","mle":"a","ds":"a","pm":"r","biz":"c","nc":"a"},"summary":"AI regulation covers the laws and standards that govern how AI is built and used, such as the EU AI Act, data protection law, and sector rules for hiring, lending, and health.","why":"If you ship AI to customers in the EU or in regulated industries, compliance decides
