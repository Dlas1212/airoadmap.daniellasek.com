ms now offer AI agents and MCP connections; use them once your plain workflows are reliable.","hours":10,"outcomes":["You can build a multi-step workflow with a trigger, an AI step, branching, and actions in other apps.","You can make an AI step return structured fields that later steps can use reliably.","You can add error handling, human approval steps, and logging so automations fail safely.","You can decide when a task needs a deterministic workflow, an AI agent, or custom code."],"project":"Build an inbox triage automation: when a new email or form submission arrives, an AI step extracts category, urgency, and a one-line summary; a router sends urgent items to Slack, logs everything to a spreadsheet, and drafts (but does not send) a reply for human review. Add an error alert path.","resources":[{"title":"n8n: Integrate AI","url":"https://docs.n8n.io/build/integrate-ai","type":"docs","source":"n8n","free":true},{"title":"Make Academy","url":"https://academy.make.com/","type":"course","source":"Make","free":true},{"title":"Zapier's AI tools guide","url":"https://zapier.com/blog/zapier-ai-guide/","type":"article","source":"Zapier","free":true},{"title":"n8n workflow templates","url":"https://n8n.io/workflows/","type":"tool","source":"n8n","free":true},{"title":"AI examples (n8n)","url":"https://docs.n8n.io/build/integrate-ai/ai-examples","type":"docs","source":"n8n","free":true},{"title":"Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","type":"article","source":"Anthropic","free":true}],"subtopics":[{"title":"Triggers, actions, and data mapping","desc":"Every automation starts with a trigger and passes data through actions. Learning to map fields between steps, and to test with real sample data, is most of the skill.","level":"core","resources":[{"title":"Get started with Zapier","url":"https://zapier.com/blog/get-started-with-zapier/","type":"article","source":"Zapier","free":true},{"title":"Build your first workflow","url":"https://docs.n8n.io/build-your-first-workflow","type":"docs","source":"n8n","free":true}]},{"title":"AI steps that return structured data","desc":"Use AI steps to classify, extract, summarize, or draft. Ask for specific fields (category, priority, summary) instead of free text so routers and filters downstream can act on them.","level":"core","resources":[{"title":"What is AI automation? A complete guide","url":"https://zapier.com/blog/ai-automation/","type":"article","source":"Zapier","free":true}]},{"title":"Branching, loops, and error handling","desc":"Routers and filters send items down different paths. Error handlers, retries, and alerts stop silent failures. Add a human approval step before anything that sends email to customers or moves money.","level":"core","resources":[{"title":"Make Help Center","url":"https://help.make.com/","type":"docs","source":"Make","free":true}]},{"title":"Choosing a platform","desc":"Zapier is the easiest with the most app integrations. Make gives visual control over complex flows. n8n is open source, self-hostable, and strongest for AI and developer-style work. Power Automate fits Microsoft 365 shops.","level":"core","resources":[{"title":"Power Automate documentation","url":"https://learn.microsoft.com/en-us/power-automate/","type":"docs","source":"Microsoft","free":true}]},{"title":"AI agents inside automation tools","desc":"Zapier Agents, Make AI Agents, and n8n's AI Agent node let a model choose which actions to take toward a goal. More flexible than fixed workflows, but less predictable, so start narrow.","level":"deep","resources":[{"title":"Make AI Agents","url":"https://help.make.com/make-ai-agents","type":"docs","source":"Make","free":true},{"title":"Integrate AI (n8n)","url":"https://docs.n8n.io/build/integrate-ai","type":"docs","source":"n8n","free":true}]},{"title":"MCP connections","desc":"Automation platforms can expose their app integrations to AI assistants over MCP, so Claude or ChatGPT can trigger actions across thousands of apps.","level":"optional","resources":[{"title":"Zapier MCP","url":"https://zapier.com/mcp","type":"tool","source":"Zapier","free":true}]}]},{"id":"deployment-basics","title":"Shipping AI: Deployment Basics","tier":2,"lane":"ops","prereqs":["apis-json","git-cli"],"roles":{"aie":"c","mle":"c","ds":"r"},"summary":"Deployment means taking code that works on your laptop and running it somewhere other people can reach it, reliably. For AI apps that usually means wrapping a model or LLM call in a small web API, packaging it in a container, and shipping it to a cloud host with an automated pipeline.","why":"A model or prompt nobody can use has no value. The first time you ship, you discover the real problems: secrets, timeouts, cold starts, cost, and what happens when two users hit it at once.","depth":"Master one simple path end to end: a FastAPI service, a Dockerfile, environment variables for secrets, and a CI job that deploys on push. Just know that Kubernetes, service meshes, and autoscaling policies exist; you can learn them when a real workload needs them.","hours":20,"outcomes":["You can wrap a model or LLM call in a FastAPI endpoint with input validation and sensible timeouts.","You can write a Dockerfile, build an image, and run it locally the same way it runs in the cloud.","You can deploy a service to a managed host and keep API keys out of your code.","You can set up a GitHub Actions workflow that runs tests and deploys on every merge.","You can explain the trade-offs between batch, real-time, and streaming inference."],"project":"Build a small FastAPI service that calls an LLM API (or a scikit-learn model) and returns a structured answer. Containerize it, add a /health endpoint, store the API key as a secret, and deploy it to Render, Fly.io, or Modal with a GitHub Actions workflow that runs a test and redeploys on every push to main.","resources":[{"title":"Made With ML: MLOps course","url":"https://madewithml.com/","type":"course","source":"Made With ML","free":true},{"title":"Lecture 5: Deployment","url":"https://fullstackdeeplearning.com/course/2022/lecture-5-deployment/","type":"video","source":"Full Stack Deep Learning","free":true},{"title":"FastAPI: Deployment concepts","url":"https://fastapi.tiangolo.com/deployment/","type":"docs","source":"FastAPI","free":true},{"title":"Docker: Get started","url":"https://docs.docker.com/get-started/","type":"docs","source":"Docker","free":true},{"title":"Designing Machine Learning Systems (Ch. 7: Model Deployment)","url":"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/","type":"book","source":"Chip Huyen / O'Reilly","free":false},{"title":"The Twelve-Factor App","url":"https://12factor.net/","type":"article","source":"12factor.net","free":true}],"subtopics":[{"title":"Serving a model behind an API","desc":"Expose your model or LLM chain as an HTTP endpoint. Learn request and response schemas, input validation with Pydantic, async handlers, streaming responses, and health-check endpoints.","level":"core","resources":[{"title":"FastAPI documentation","url":"https://fastapi.tiangolo.com/","type":"docs","source":"FastAPI","free":true},{"title":"Model Serving","url":"https://madewithml.com/courses/mlops/serving/","type":"course","source":"Made With ML","free":true}]},{"title":"Containers with Docker","desc":"A container bundles your code, dependencies, and runtime so it behaves the same everywhere. Learn Dockerfiles, images, layers, and how to keep images small and builds fast.","level":"core","resources":[{"title":"Docker: Get started","url":"https://docs.docker.com/get-started/","type":"docs","source":"Docker","free":true},{"title":"Python language-specific guide","url":"https://docs.docker.com/guides/python/","type":"docs","source":"Docker","free":true}]},{"title":"Config, secrets, and the twelve-factor app","desc":"Keep configuration in environment variables, never commit API keys, and use your host's secret manager. The twelve-factor rules are a short checklist for apps that deploy cleanly.","level":"core","resources":[{"title":"The Twelve-Factor App","url":"https://12factor.net/","type":"article","source":"12factor.net","free":true},{"title":"Secrets Management Cheat Sheet","url":"https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html","type":"docs","source":"OWASP","free":true}]},{"title":"CI/CD with GitHub Actions","desc":"Continuous integration runs your tests on every change. Continuous deployment ships the change automatically once tests pass. This is what makes deploying boring, which is the goal.","level":"core","resources":[{"title":"GitHub Actions quickstart","url":"https://docs.github.com/en/actions/get-started/quickstart","type":"docs","source":"GitHub","free":true}]},{"title":"Choosing where to host","desc":"Options range from demo hosts (Hugging Face Spaces, Streamlit, Gradio) to app platforms (Render, Fly.io), serverless GPU platforms (Modal), and the big clouds. Pick based on whether you need a GPU, how spiky traffic is, and how much ops work you want.","level":"core","resources":[{"title":"Modal documentation","url":"https://modal.com/docs","type":"docs","source":"Modal","free":true},{"title":"Gradio quickstart","url":"https://gradio.app/guides/quickstart","type":"docs","source":"Gradio","free":true}]},{"title":"Batch vs real-time vs streaming inference","desc":"Batch jobs score many inputs on a schedule and are cheap. Real-time APIs answer one request at a time with low latency. Streaming sends tokens as they are generated, which matters for LLM chat UX.","level":"deep","resources":[{"title":"Lecture 5: Deployment","url":"https://fullstackdeeplearning.com/course/2022/lecture-5-deployment/","type":"video","source":"Full Stack Deep Learning","free":true}]},{"title":"Safe rollouts: canaries and rollbacks","desc":"Release a new version to a small slice of traffic first, watch the metrics, then expand or roll back. This matters even more with AI, where a new prompt or model can quietly change behavior.","level":"optional","resources":[{"title":"Canary Release","url":"https://martinfowler.com/bliki/CanaryRelease.html","type":"article","source":"Martin Fowler","free":true},{"title":"Kubernetes basics","url":"https://kubernetes.io/docs/tutorials/kubernetes-basics/","type":"interactive","source":"Kubernetes","free":true}]}]},{"id":"ai-adoption","title":"Leading AI Adoption & Change","tier":3,"lane":"biz","prereqs":["ai-strategy"],"roles":{"pm":"r","biz":"c"},"summary":"Leading AI adoption means getting people to actually change how they work with AI: building skills, setting policy, finding champions, redesigning processes, and handling fears about jobs and quality.","why":"Buying licenses is easy; getting real use is hard. Many organizations see low adoption and little value because they treat AI as an IT rollout instead of a change in how people work.","depth":"Master the practical levers: clear policy, training by role, champions, shared wins, and measuring usage and outcomes. Know classic change-management models so you can use their language, but adapt them because AI changes fast and spreads bottom-up.","hours":12,"outcomes":["You can write a clear, permission-giving AI acceptable-use policy.","You can design a training and champions program for different roles.","You can address employee concerns about job security and quality honestly.","You can measure adoption and impact and report it to leadership.","You can redesign a team process around AI, not just add AI on top."],"project":"Create a 90-day adoption plan for one team: a one-page acceptable-use policy, two role-specific training sessions built on the team's real tasks, a champions group with a channel for sharing wins, and a simple dashboard of three metrics (active usage, time saved, one quality measure). Run the first 30 days and write up what you learned.","resources":[{"title":"Making AI Work: Leadership, Lab, and Crowd","url":"https://www.oneusefulthing.org/p/making-ai-work-leadership-lab-and","type":"article","source":"Ethan Mollick","free":true},{"title":"AI in the Enterprise","url":"https://cdn.openai.com/business-guides-and-resources/ai-in-the-enterprise.pdf","type":"article","source":"OpenAI","free":true},{"title":"Work Trend Index","url":"https://www.microsoft.com/en-us/worklab/work-trend-index","type":"article","source":"Microsoft","free":true},{"title":"The 8-Step Process for Leading Change","url":"https://www.kotterinc.com/methodology/8-steps/","type":"article","source":"Kotter","free":true},{"title":"The Prosci ADKAR Model","url":"https://www.prosci.com/methodology/adkar","type":"article","source":"Prosci","free":true},{"title":"Co-Intelligence: Living and Working with AI","url":"https://www.penguinrandomhouse.com/books/741805/co-intelligence-by-ethan-mollick/","type":"book","source":"Ethan Mollick","free":false}],"subtopics":[{"title":"Leadership, lab, and crowd","desc":"Successful adoption needs leaders who set direction and incentives, a small team that experiments and builds, and the whole workforce sharing what works. Each part fails without the others.","level":"core","resources":[{"title":"Making AI Work: Leadership, Lab, and Crowd","url":"https://www.oneusefulthing.org/p/making-ai-work-leadership-lab-and","type":"article","source":"Ethan Mollick","free":true}]},{"title":"Acceptable-use policy","desc":"Say which tools are approved, what data can and can't go in, when to disclose AI use, and who checks outputs. Policies that only say 'no' push people to hidden, riskier use.","level":"core","resources":[]},{"title":"Training by role","desc":"Generic 'intro to AI' sessions rarely change behavior. Hands-on training built around each team's real tasks, followed by practice and office hours, does.","level":"core","resources":[{"title":"AI Fluency: Framework & Foundations","url":"https://anthropic.skilljar.com/ai-fluency-framework-foundations","type":"course","source":"Anthropic","free":true}]},{"title":"Change management basics","desc":"Models like Kotter's 8 steps and Prosci's ADKAR (Awareness, Desire, Knowledge, Ability, Reinforcement) give a checklist for leading change. Use them to make sure you've covered motivation and reinforcement, not just tools.","level":"deep","resources":[{"title":"The Prosci ADKAR Model","url":"https://www.prosci.com/methodology/adkar","type":"article","source":"Prosci","free":true}]},{"title":"Jobs, fears, and incentives","desc":"People hide AI use if they fear being replaced or judged. Be honest about plans, reward people who share time-saving discoveries, and decide in advance what happens to freed-up time.","level":"core","resources":[]},{"title":"Measuring adoption and impact","desc":"Track active users and usage depth, but also business outcomes like cycle time and quality. High usage with no outcome change is a signal to redesign workflows.","level":"deep","resources":[{"title":"Work Trend Index","url":"https://www.microsoft.com/en-us/worklab/work-trend-index","type":"article","source":"Microsoft","free":true}]},{"title":"AI as a teammate","desc":"Research shows people working with AI can match the output of small teams. That raises bigger questions about team structure and roles worth exploring once basics are in place.","level":"optional","resources":[{"title":"The Cybernetic Teammate","url":"https://www.oneusefulthing.org/p/the-cybernetic-teammate","type":"article","source":"Ethan Mollick","free":true}]}]},{"id":"build-vs-buy","title":"Build vs Buy & Vendor Selection","tier":3,"lane":"biz","prereqs":["ai-strategy"],"roles":{"aie":"a","pm":"c","biz":"c"},"summary":"Build vs. buy is the decision between buying an off-the-shelf AI product, configuring a platform, or building your own solution on model APIs. Vendor selection is how you compare and choose the right provider safely.","why":"Building what you could buy wastes months; buying what should be core to your business can leave you dependent and undifferentiated. Picking the wrong vendor can expose your data or lock you in.","depth":"Master a decision framework and a vendor checklist covering data handling, security, pricing, and exit options. You don't need to be able to build AI systems; you do need to know roughly what building involves so you can judge quotes and claims.","hours":10,"outcomes":["You can decide whether to buy, configure, or build for a given use case and justify it.","You can run a structured vendor evaluation with a scorecard and a hands-on trial on your own data.","You can check a vendor's data use, security, and compliance claims.","You can estimate total cost of ownership, including usage-based pricing.","You can plan to avoid lock-in."],"project":"For one real use case, compare three options: an off-the-shelf product, a configured platform, and a custom build. Create a scorecard covering fit, quality on 10 of your own test cases, data handling, security, 12-month total cost, and exit plan. Run trials of the top two and write a one-page recommendation.","resources":[{"title":"How 100 Enterprise CIOs Are Building and Buying Gen AI in 2025","url":"https://a16z.com/ai-enterprise-2025/","type":"article","source":"Andreessen Horowitz","free":true},{"title":"2025: The State of Generative AI in the Enterprise","url":"https://menlovc.com/perspective/2025-the-state-of-generative-ai-in-the-enterprise/","type":"article","source":"Menlo Ventures","free":true},{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","type":"docs","source":"NIST","free":true},{"title":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/","type":"docs","source":"OWASP","free":true},{"title":"What We've Learned From A Year of Building with LLMs","url":"https://applied-llms.org/","type":"article","source":"Yan, Bischof, Frye, Husain, Liu & Shankar","free":true},{"title":"Building A Generative AI Platform","url":"https://huyenchip.com/2024/07/25/genai-platform.html","type":"article","source":"Chip Huyen","free":true}],"subtopics":[{"title":"The spectrum: buy, configure, build","desc":"Buy a finished product (an AI support desk). Configure a platform (custom assistants, no-code automations). Build on APIs (your own app using model APIs). Most companies use all three for different needs.","level":"core","resources":[{"title":"How 100 Enterprise CIOs Are Building and Buying Gen AI in 2025","url":"https://a16z.com/ai-enterprise-2025/","type":"article","source":"Andreessen Horowitz","free":true}]},{"title":"When to build","desc":"Build when the use case is core to your competitive advantage, uses proprietary data or processes, and no product fits. Buy when the need is common and speed matters more than differentiation.","level":"core","resources":[]},{"title":"Vendor evaluation and trials","desc":"Score vendors on fit, quality on your own test cases, integration, pricing, support, and viability. Always run a trial on real (safe) data; demos are tuned to look good.","level":"core","resources":[]},{"title":"Data, security, and compliance checks","desc":"Ask: is our data used for training? Where is it stored and for how long? What certifications (SOC 2, ISO 27001) and controls exist? Trust centers and privacy pages answer most of this.","level":"core","resources":[{"title":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/","type":"docs","source":"OWASP","free":true}]},{"title":"Pricing and total cost of ownership","desc":"Compare seat-based and usage-based pricing at realistic volumes. Include integration, maintenance, staff time, and the cost of switching later.","level":"deep","resources":[]},{"title":"Avoiding lock-in","desc":"Prefer vendors that let you export data, swap underlying models, and use open standards like MCP. Model quality and prices change fast, so flexibility has real value.","level":"deep","resources":[]},{"title":"What building really involves","desc":"A real AI app needs prompts, retrieval over your data, evals, monitoring, and security work, not just an API call. Knowing this helps you judge build estimates and agency quotes.","level":"optional","resources":[{"title":"Building A Generative AI Platform","url":"https://huyenchip.com/2024/07/25/genai-platform.html","type":"article","source":"Chip Huyen","free":true}]}]},{"id":"ai-security","title":"Prompt Injection & AI Security","tier":3,"lane":"safety","prereqs":["structured-outputs","ai-privacy"],"roles":{"aie":"c","mle":"r","pm":"r","biz":"a","nc":"r"},"summary":"AI security is about attacks that target AI systems. The biggest one is prompt injection: hidden instructions in a web page, email, or file that hijack a model into doing what the attacker wants.","why":"Once a model can read untrusted content and take actions (send email, call APIs, run code), a single poisoned document can leak data or cause damage. No model is immune, so the defense has to be in your system design.","depth":"AI engineers must master prompt injection, the \"lethal trifecta,\" and design patterns that limit damage, plus the OWASP LLM Top 10. PMs and no-code builders need to recognize risky setups and ask for guardrails. Adversarial ML attacks like data poisoning and model extraction are 'know it exists' unless you train models.","hours":12,"outcomes":["You can explain direct vs indirect prompt injection and why filtering alone can't fix it.","You can spot the lethal trifecta (private data + untrusted content + a way to send data out) in an agent design.","You can apply least privilege, human approval, and isolation patterns to an LLM app or agent.","You can walk through the OWASP Top 10 for LLM applications and map each risk to your own app.","You can review an MCP server or tool integration for security risks before installing it."],"project":"Build a small agent that reads a web page or email and can call one tool (for example, \"send a message\"). Plant a hidden instruction in the input that tries to exfiltrate data, and show that it works. Then fix it with design changes (remove the exfiltration path, add human approval, or split into a quarantined reader model) and show the attack fails. Write up which OWASP risks you addressed.","resources":[{"title":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/","type":"docs","source":"OWASP","free":true},{"title":"The lethal trifecta for AI agents","url":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","type":"article","source":"Simon Willison","free":true},{"title":"Design Patterns for Securing LLM Agents against Prompt Injections","url":"https://arxiv.org/abs/2506.08837","type":"paper","source":"arXiv","free":true},{"title":"Lakera prompt injection games (Gandalf, Agent Breaker)","url":"https://gandalf.lakera.ai/","type":"interactive","source":"Lakera","free":true},{"title":"Red Teaming LLM Applications","url":"https://www.deeplearning.ai/courses/red-teaming-llm-applications","type":"course","source":"DeepLearning.AI","free":true},{"title":"MCP Security Best Practices","url":"https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices","type":"docs","source":"Model Context Protocol","free":true},{"title":"MITRE ATLAS","url":"https://atlas.mitre.org/","type":"docs","source":"MITRE","free":true}],"subtopics":[{"title":"Prompt injection: direct and indirect","desc":"Direct injection is a user typing \"ignore your instructions.\" Indirect injection hides instructions in content the model reads, like a web page or email, and is far more dangerous for agents.","level":"core","resources":[{"title":"Simon Willison on prompt injection","url":"https://simonwillison.net/tags/prompt-injection/","type":"article","source":"Simon Willison","free":true},{"title":"Not what you've signed up for (indirect prompt injection)","url":"https://arxiv.org/abs/2302.12173","type":"paper","source":"arXiv","free":true}]},{"title":"The lethal trifecta","desc":"An agent with access to private data, exposure to untrusted content, and a way to communicate externally can be tricked into leaking that data. Remove one of the three to break the attack.","level":"core","resources":[{"title":"The lethal trifecta for AI agents","url":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","type":"article","source":"Simon Willison","free":true}]},{"title":"Secure design patterns","desc":"Since models can't reliably tell instructions from data, constrain what they can do: least-privilege tools, human approval for risky actions, plan-then-execute, and separating a privileged model from one that reads untrusted text.","level":"core","resources":[{"title":"Design Patterns for Securing LLM Agents against Prompt Injections","url":"https://arxiv.org/abs/2506.08837","type":"paper","source":"arXiv","free":true},{"title":"Defeating Prompt Injections by Design (CaMeL)","url":"https://arxiv.org/abs/2503.18813","type":"paper","source":"arXiv","free":true}]},{"title":"OWASP Top 10 for LLMs and agents","desc":"A shared checklist of the main risks: injection, sensitive data leaks, supply chain, excessive agency, improper output handling, and more. There is a separate list for agentic apps.","level":"core","resources":[{"title":"OWASP Top 10 for LLM Applications","url":"https://genai.owasp.org/llm-top-10/","type":"docs","source":"OWASP","free":true},{"title":"OWASP Top 10 for Agentic Applications for 2026","url":"https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/","type":"docs","source":"OWASP","free":true}]},{"title":"Tool, MCP, and output security","desc":"Treat model output as untrusted input: never pass it straight into SQL, shell commands, or HTML. Vet MCP servers and plugins like any third-party code, and watch for tool descriptions that carry hidden instructions.","level":"deep","resources":[{"title":"MCP Security Best Practices","url":"https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices","type":"docs","source":"Model Context Protocol","free":true}]},{"title":"Jailbreaks vs prompt injection","desc":"A jailbreak tricks the model into breaking its own safety rules. Prompt injection hijacks your app. They overlap in technique but the risks and fixes differ.","level":"deep","resources":[]},{"title":"Adversarial ML: poisoning, extraction, evasion","desc":"Attackers can poison training data, extract model weights or behavior through queries, or craft inputs that fool classifiers. These matter most if you train or host models.","level":"optional","resources":[{"title":"NIST AI 100-2: Adversarial Machine Learning taxonomy","url":"https://csrc.nist.gov/pubs/ai/100/2/e2025/final","type":"docs","source":"NIST","free":true},{"title":"MITRE ATLAS","url":"https://atlas.mitre.org/","type":"docs","source":"MITRE","free":true}]}]},{"id":"reading-papers","title":"Reading ML Papers","tier":3,"lane":"foundations","prereqs":["linear-algebra","probability-stats","neural-networks"],"roles":{"aie":"a","mle":"r","rs":"c"},"summary":"Reading ML papers is the skill of getting the key idea out of a research paper quickly, judging whether the evidence supports it, and knowing when a paper deserves a deeper read.","why":"AI moves faster than textbooks and courses. New methods appear on arXiv first, and being able to read them directly keeps you current and lets you judge hype for yourself.","depth":"Researchers must master full critical reading: method, math, experimental design, baselines, and reproducing results. ML engineers should be able to read the method and results sections well enough to implement or apply an idea. AI engineers just need to skim abstracts, figures, and conclusions and know which sources to trust; a good blog summary is often enough.","hours":20,"outcomes":["You can use a three-pass approach to read a paper in 15 minutes, 1 hour, or deeply.","You can find a paper's main claim, the evidence for it, and its weakest point.","You can spot common problems: weak baselines, cherry-picked examples, missing error bars, and test-set leakage.","You can find, track, and organize papers using arXiv, Hugging Face Papers, and citation tools.","You can reimplement a key result from a short paper."],"project":"Pick three papers: one classic (Attention Is All You Need), one from the past year, and one in your area. Do a first pass on each and write a five-line summary: claim, method, evidence, weakest point, and whether it's worth a deeper read. Then take the shortest one and reproduce one key figure or table at small scale, noting anything the paper left out.","resources":[{"title":"How to Read a Paper (S. Keshav)","url":"http://ccr.sigcomm.org/online/files/p83-keshavA.pdf","type":"paper","source":"ACM SIGCOMM","free":true},{"title":"The Annotated Transformer","url":"https://nlp.seas.harvard.edu/annotated-transformer/","type":"article","source":"Harvard NLP","free":true},{"title":"Hugging Face Papers","url":"https://huggingface.co/papers","type":"tool","source":"Hugging Face","free":true},{"title":"arXiv","url":"https://arxiv.org/","type":"tool","source":"arXiv","free":true},{"title":"Lil'Log","url":"https://lilianweng.github.io/","type":"article","source":"Lilian Weng","free":true},{"title":"Yannic Kilcher (paper walkthroughs)","url":"https://www.youtube.com/@YannicKilcher","type":"video","source":"Yannic Kilcher","free":true},{"title":"Semantic Scholar","url":"https://www.semanticscholar.org/","type":"tool","source":"Allen Institute for AI","free":true}],"subtopics":[{"title":"The three-pass method","desc":"First pass: title, abstract, figures, conclusion. Second pass: the method and results, skipping proofs. Third pass: rebuild the argument yourself. Most papers only deserve the first pass.","level":"core","resources":[{"title":"How to Read a Paper (S. Keshav)","url":"http://ccr.sigcomm.org/online/files/p83-keshavA.pdf","type":"paper","source":"ACM SIGCOMM","free":true}]},{"title":"Anatomy of an ML paper","desc":"Know what each section is for: related work places the idea, the method defines it, ablations show what matters, and the appendix often holds the details that make it work.","level":"core","resources":[{"title":"The Annotated Transformer","url":"https://nlp.seas.harvard.edu/annotated-transformer/","type":"article","source":"Harvard NLP","free":true}]},{"title":"Reading critically","desc":"Ask whether baselines are fair and tuned, whether results include variance, whether benchmarks might be contaminated, and whether the claim generalizes beyond the tested setting.","level":"core","resources":[{"title":"Adding Error Bars to Evals","url":"https://arxiv.org/abs/2411.00640","type":"paper","source":"arXiv (Anthropic)","free":true}]},{"title":"Finding and tracking papers","desc":"Use arXiv listings, Hugging Face daily papers, and lab blogs to stay current. Citation graph tools help you find the earlier work a paper builds on.","level":"core","resources":[{"title":"Hugging Face Papers","url":"https://huggingface.co/papers","type":"tool","source":"Hugging Face","free":true},{"title":"Connected Papers","url":"https://www.connectedpapers.com/","type":"tool","source":"Connected Papers","free":true}]},{"title":"Reading the math","desc":"Learn common notation and read equations by asking what goes in, what comes out, and what is being minimized. Map each equation to a few lines of code.","level":"deep","resources":[]},{"title":"Reproducing results","desc":"Reimplementing a paper is the deepest way to understand it and often reveals details the text leaves out.","level":"deep","resources":[{"title":"Let's build GPT: from scratch, in code, spelled out","url":"https://www.youtube.com/watch?v=kCc8FmEb1nY","type":"video","source":"Andrej Karpathy","free":true}]},{"title":"Using AI to read papers","desc":"Ask an LLM to explain a section, define terms, or quiz you, and use tools like alphaXiv to discuss a paper line by line. Always check claims against the paper itself.","level":"optional","resources":[{"title":"alphaXiv","url":"https://www.alphaxiv.org/","type":"tool","source":"alphaXiv","free":true}]}]},{"id":"cnn","title":"Computer Vision & CNNs","tier":3,"lane":"dl","prereqs":["pytorch"],"roles":{"mle":"r","ds":"a","rs":"c"},"summary":"Computer vision is about getting models to understand images and video. Convolutional neural networks (CNNs) slide small learned filters across an image to detect edges, textures, and eventually whole objects, and vision transformers (ViTs) now compete with them.","why":"Vision powers document processing, medical imaging, quality inspection, self-driving, and the image side of multimodal LLMs. CNNs also teach ideas like inductive bias, feature hierarchies, and transfer learning that apply across deep learning.","depth":"Must master: how a convolution works, what pooling and stride do, the ResNet idea of residual connections, and how to fine-tune a pretrained backbone. Just know the landscape of detection (YOLO), segmentation (U-Net, SAM), and ViTs unless you specialize in vision.","hours":40,"outcomes":["You can explain how convolution, padding, stride, and pooling change a tensor's shape and what each layer learns.","You can describe why residual connections let networks go much deeper.","You can fine-tune a pretrained image model on a small custom dataset with data augmentation.","You can choose between classification, detection, and segmentation for a given vision problem."],"project":"Collect or download a small image dataset (300 to 1,000 images across 3 to 5 classes). Train a small CNN from scratch, then fine-tune a pretrained ResNet or ViT from timm on the same data, and compare accuracy, training time, and a confusion matrix.","resources":[{"title":"CS231n: Deep Learning for Computer Vision","url":"https://cs231n.stanford.edu/","type":"course","source":"Stanford","free":true},{"title":"CNN Explainer","url":"https://poloclub.github.io/cnn-explainer/","type":"interactive","source":"Georgia Tech Polo Club","free":true},{"title":"Practical Deep Learning for Coders","url":"https://course.fast.ai/","type":"course","source":"fast.ai","free":true},{"title":"d2l.ai: Convolutional Neural Networks","url":"https://d2l.ai/chapter_convolutional-neural-networks/index.html","type":"book","source":"d2l.ai","free":true},{"title":"Hugging Face Computer Vision Course","url":"https://huggingface.co/learn/computer-vision-course/unit0/welcome/welcome","type":"course","source":"Hugging Face","free":true},{"title":"Deep Residual Learning for Image Recognition","url":"https://arxiv.org/abs/1512.03385","type":"paper","source":"arXiv","free":true}],"subtopics":[{"title":"Convolutions and feature maps","desc":"A convolution layer applies the same small filter at every position, so it detects a pattern wherever it appears. Stacking layers builds from edges to textures to parts to objects.","level":"core","resources":[{"title":"CNN Explainer","url":"https://poloclub.github.io/cnn-explainer/","type":"interactive","source":"Georgia Tech Polo Club","free":true},{"title":"CS231n: Convolutional Neural Networks","url":"https://cs231n.github.io/convolutional-networks/","type":"article","source":"Stanford","free":true}]},{"title":"Classic architectures and ResNets","desc":"LeNet, AlexNet, VGG, and ResNet show how the field learned to build deeper, better networks. ResNet's skip connections are now used in nearly every deep architecture, including transformers.","level":"core","resources":[{"title":"Deep Residual Learning for Image Recognition","url":"https://arxiv.org/abs/1512.03385","type":"paper","source":"arXiv","free":true},{"title":"d2l.ai: Modern Convolutional Neural Networks","url":"https://d2l.ai/chapter_convolutional-modern/index.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Transfer learning and augmentation","desc":"Start from a model pretrained on a large dataset and fine-tune it on yours. Augmentations like flips, crops, and color jitter stretch a small dataset much further.","level":"core","resources":[{"title":"Transfer Learning for Computer Vision Tutorial","url":"https://docs.pytorch.org/tutorials/beginner/transfer_learning_tutorial.html","type":"docs","source":"PyTorch","free":true},{"title":"timm documentation","url":"https://huggingface.co/docs/timm/index","type":"docs","source":"Hugging Face","free":true}]},{"title":"Detection and segmentation","desc":"Detection draws boxes around objects; segmentation labels every pixel. U-Net, the YOLO family, and promptable models like Segment Anything are the common starting points.","level":"deep","resources":[{"title":"Ultralytics YOLO docs","url":"https://docs.ultralytics.com/","type":"docs","source":"Ultralytics","free":true},{"title":"Segment Anything","url":"https://arxiv.org/abs/2304.02643","type":"paper","source":"arXiv","free":true}]},{"title":"Vision transformers","desc":"ViTs cut an image into patches and treat them like tokens in a transformer. With enough data they match or beat CNNs, and they are the usual image encoder inside multimodal models.","level":"deep","resources":[{"title":"An Image is Worth 16x16 Words","url":"https://arxiv.org/abs/2010.11929","type":"paper","source":"arXiv","free":true}]},{"title":"What CNNs see: feature visualization","desc":"Visualizing what neurons respond to shows the feature hierarchy directly. It is also an early form of interpretability research.","level":"optional","resources":[{"title":"Feature Visualization","url":"https://distill.pub/2017/feature-visualization/","type":"article","source":"Distill","free":true}]}]},{"id":"sequence-models","title":"Sequence Models: RNNs to Attention","tier":3,"lane":"dl","prereqs":["pytorch"],"roles":{"mle":"r","rs":"c"},"summary":"Sequence models process ordered data like text, audio, and time series. This node follows the path from recurrent networks (RNNs, LSTMs) through encoder-decoder models to the attention mechanism that made transformers possible.","why":"Understanding why RNNs struggled (slow sequential processing, vanishing gradients, a fixed-size memory) explains why attention won. The history also matters again, since state space models like Mamba bring recurrence back for long contexts.","depth":"Must master: how an RNN carries a hidden state, why gradients vanish over long sequences, the idea of seq2seq, and what attention computes. Just know LSTM gate equations and state space models at a conceptual level unless you research architectures.","hours":30,"outcomes":["You can explain how an RNN processes a sequence step by step and why that is hard to parallelize.","You can describe the vanishing gradient problem and how LSTMs and GRUs ease it.","You can explain encoder-decoder models and how attention removes the fixed-size bottleneck.","You can train a small character-level language model in PyTorch."],"project":"Train a character-level language model on a text corpus you like (song lyrics, a book, your own notes) three ways: a bigram model, an LSTM, and a small single-layer attention model. Compare validation loss and the quality of generated samples.","resources":[{"title":"Neural Networks: Zero to Hero (makemore lectures)","url":"https://karpathy.ai/zero-to-hero.html","type":"course","source":"Andrej Karpathy","free":true},{"title":"Understanding LSTM Networks","url":"https://colah.github.io/posts/2015-08-Understanding-LSTMs/","type":"article","source":"Chris Olah","free":true},{"title":"d2l.ai: Recurrent Neural Networks","url":"https://d2l.ai/chapter_recurrent-neural-networks/index.html","type":"book","source":"d2l.ai","free":true},{"title":"d2l.ai: Attention Mechanisms and Transformers","url":"https://d2l.ai/chapter_attention-mechanisms-and-transformers/index.html","type":"book","source":"d2l.ai","free":true},{"title":"CS224N: Natural Language Processing with Deep Learning","url":"https://web.stanford.edu/class/cs224n/","type":"course","source":"Stanford","free":true},{"title":"The Unreasonable Effectiveness of Recurrent Neural Networks","url":"https://karpathy.github.io/2015/05/21/rnn-effectiveness/","type":"article","source":"Andrej Karpathy","free":true}],"subtopics":[{"title":"Language modeling as next-token prediction","desc":"A language model predicts the next character or token given the ones before it. Starting with simple bigram and MLP models makes the later jump to RNNs and transformers easy to follow.","level":"core","resources":[{"title":"The spelled-out intro to language modeling: building makemore","url":"https://www.youtube.com/watch?v=PaCmpygFfXo","type":"video","source":"Andrej Karpathy","free":true}]},{"title":"Recurrent neural networks","desc":"An RNN reads one step at a time and updates a hidden state that summarizes everything so far. It is simple and elegant, but training is slow because each step waits for the last.","level":"core","resources":[{"title":"The Unreasonable Effectiveness of Recurrent Neural Networks","url":"https://karpathy.github.io/2015/05/21/rnn-effectiveness/","type":"article","source":"Andrej Karpathy","free":true}]},{"title":"LSTMs, GRUs, and vanishing gradients","desc":"Gradients shrink as they flow back through many steps, so plain RNNs forget long-range information. LSTMs and GRUs add gates that decide what to keep, which helped a lot but did not fully fix it.","level":"core","resources":[{"title":"Understanding LSTM Networks","url":"https://colah.github.io/posts/2015-08-Understanding-LSTMs/","type":"article","source":"Chris Olah","free":true}]},{"title":"Seq2seq and encoder-decoder models","desc":"One network encodes the input sequence and another decodes the output, as in translation. Squeezing a whole sentence into one vector was the bottleneck that attention was invented to fix.","level":"deep","resources":[{"title":"Sequence to Sequence Learning with Neural Networks","url":"https://arxiv.org/abs/1409.3215","type":"paper","source":"arXiv","free":true}]},{"title":"The attention mechanism","desc":"Attention lets the decoder look back at every encoder state and weight the relevant ones. Transformers keep attention and drop recurrence entirely.","level":"core","resources":[{"title":"Visualizing A Neural Machine Translation Model (Mechanics of Seq2seq Models With Attention)","url":"https://jalammar.github.io/visualizing-neural-machine-translation-mechanics-of-seq2seq-models-with-attention/","type":"article","source":"Jay Alammar","free":true},{"title":"Neural Machine Translation by Jointly Learning to Align and Translate","url":"https://arxiv.org/abs/1409.0473","type":"paper","source":"arXiv","free":true}]},{"title":"State space models and modern recurrence","desc":"Models like Mamba process sequences in linear time with a learned recurrent state, which helps for very long inputs. Several 2025 and 2026 models mix these layers with attention in hybrid designs.","level":"optional","resources":[{"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","url":"https://arxiv.org/abs/2312.00752","type":"paper","source":"arXiv","free":true}]}]},{"id":"dl-training","title":"Training Deep Nets Well","tier":3,"lane":"dl","prereqs":["pytorch"],"roles":{"mle":"c","rs":"c"},"summary":"Training deep networks well is the practical craft of getting a model to actually learn: choosing optimizers and learning rates, normalizing, initializing, regularizing, and debugging when the loss misbehaves.","why":"A correct architecture can still fail to train, train slowly, or overfit. These skills separate a model that works from one that silently underperforms, and they carry over directly to fine-tuning and pretraining LLMs.","depth":"Must master: AdamW, learning rate schedules with warmup, normalization layers, a systematic debugging routine, and reading loss curves. Just know newer optimizers like Muon and the details of mixed precision until you need the extra speed.","hours":40,"outcomes":["You can pick an optimizer, learning rate, and schedule and justify the choice.","You can diagnose common failures (exploding or stuck loss, dead activations, overfitting) from metrics and activation statistics.","You can apply normalization, initialization, dropout, and weight decay correctly.","You can run a disciplined experiment loop with tracking, baselines, and one change at a time."],"project":"Take a small image or text model and run a controlled study: a learning rate sweep, with and without warmup, with and without normalization, and SGD versus AdamW. Log every run, plot the curves side by side, and write a one-page summary of what mattered most.","resources":[{"title":"A Recipe for Training Neural Networks","url":"https://karpathy.github.io/2019/04/25/recipe/","type":"article","source":"Andrej Karpathy","free":true},{"title":"Deep Learning Tuning Playbook","url":"https://github.com/google-research/tuning_playbook","type":"article","source":"Google Research","free":true},{"title":"Building makemore Part 3: Activations & Gradients, BatchNorm","url":"https://www.youtube.com/watch?v=P6sfmUTpUmc","type":"video","source":"Andrej Karpathy","free":true},{"title":"CS231n: Neural Networks Part 3 (learning and evaluation)","url":"https://cs231n.github.io/neural-networks-3/","type":"article","source":"Stanford","free":true},{"title":"d2l.ai: Optimization Algorithms","url":"https://d2l.ai/chapter_optimization/index.html","type":"book","source":"d2l.ai","free":true},{"title":"Machine Learning Engineering Open Book","url":"https://github.com/stas00/ml-engineering","type":"book","source":"Stas Bekman","free":true}],"subtopics":[{"title":"Optimizers and learning rate schedules","desc":"AdamW is the default for most deep learning today. The learning rate is the most important hyperparameter, and warmup followed by cosine or linear decay is a common schedule.","level":"core","resources":[{"title":"Decoupled Weight Decay Regularization (AdamW)","url":"https://arxiv.org/abs/1711.05101","type":"paper","source":"arXiv","free":true},{"title":"d2l.ai: Optimization Algorithms","url":"https://d2l.ai/chapter_optimization/index.html","type":"book","source":"d2l.ai","free":true}]},{"title":"Initialization and normalization","desc":"Good initialization keeps activations and gradients at a sensible scale. BatchNorm, LayerNorm, and RMSNorm keep them there during training, which makes deep networks far easier to train.","level":"core","resources":[{"title":"Building makemore Part 3: Activations & Gradients, BatchNorm","url":"https://www.youtube.com/watch?v=P6sfmUTpUmc","type":"video","source":"Andrej Karpathy","free":true},{"title":"Layer Normalization","url":"https://arxiv.org/abs/1607.06450","type":"paper","source":"arXiv","free":true}]},{"title":"Regularization","desc":"Weight decay, dropout, data augmentation, and early stopping all fight overfitting. Large models trained on huge datasets often need less of it than small models on small data.","level":"core","resources":[{"title":"Dropout: A Simple Way to Prevent Neural Networks from Overfitting","url":"https://jmlr.org/papers/v15/srivastava14a.html","type":"paper","source":"JMLR","free":true}]},{"title":"Debugging training runs","desc":"Overfit a single batch first, check the loss at initialization, and watch gradient norms. Most failures come from data bugs, wrong learning rates, or shape mistakes, not the architecture.","level":"core","resources":[{"title":"A Recipe for Training Neural Networks","url":"https://karpathy.github.io/2019/04/25/recipe/","type":"article","source":"Andrej Karpathy","free":true}]},{"title":"Hyperparameter tuning and experiment tracking","desc":"Tune the learning rate first, use a fixed budget per trial, and log every run with its config. Tools like Weights & Biases, MLflow, or TensorBoard make comparisons honest.","level":"deep","resources":[{"title":"Deep Learning Tuning Playbook","url":"https://github.com/google-research/tuning_playbook","type":"article","source":"Google Research","free":true}]},{"title":"Mixed precision and speed","desc":"Training in bf16 or fp16 roughly halves memory and speeds up modern GPUs. Gradient accumulation and checkpointing let you fit bigger effective batches and models.","level":"deep","resources":[{"title":"Automatic Mixed Precision package","url":"https://docs.pytorch.org/docs/stable/amp.html","type":"docs","source":"PyTorch","free":true}]},{"title":"Newer optimizers","desc":"Optimizers like Muon, which orthogonalizes updates for weight matrices, have shown faster training in speedrun benchmarks and some production LLMs. Worth knowing about, safe to skip at first.","level":"optional","resources":[{"title":"Muon: An optimizer for hidden layers in neural networks","url":"https://kellerjordan.github.io/posts/muon/","type":"article","source":"Keller Jordan","free":true}]}]},{"id":"transformers","title":"Transformer Architecture","tier":3,"lane":"llm","prereqs":["tokens-embeddings","neural-networks"],"roles":{"aie":"r","mle":"c","ds":"r","rs":"c"},"summary":"The transformer is the neural network architecture behind modern LLMs. It processes all tokens in parallel and uses self-attention so every token can pull in information from every other token, stacked with feed-forward layers, residual connections, and normalization.","why":"Knowing the transformer lets you read model cards and papers, reason about context length, memory, and speed, and understand fine-tuning, inference optimization, and interpretability. It is the single most important architecture in current AI.","depth":"Must master: queries, keys, and values; multi-head attention; causal masking; positional information; the residual stream; and the decoder-only block. You should be able to implement a small GPT. Just know the zoo of modern variants (RoPE, GQA, MoE, FlashAttention) well enough to read a model card.","hours":40,"outcomes":["You can explain self-attention with queries, keys, and values and compute it by hand for a tiny example.","You can draw a decoder-only transformer block and explain what each part does.","You can implement and train a small GPT-style model from scratch in PyTorch.","You can read a modern model's architecture description and explain choices like RoPE, grouped-query attention, and mixture of experts."],"project":"Implement a small GPT (about 10M parameters) from scratch in PyTorch, train it on a text dataset such as TinyShakespeare or TinyStories, and generate samples. Then add one modern change (RoPE or grouped-query attention) and compare validation loss and speed.","resources":[{"title":"The Illustrated Transformer","url":"https://jalammar.github.io/illustrated-transformer/","type":"article","source":"Jay Alammar","free":true},{"title":"Let's build GPT: from scratch, in code, spelled out","url":"https://www.youtube.com/watch?v=kCc8FmEb1nY","type":"video","source":"Andrej Karpathy","free":true},{"title":"Attention in transformers, step-by-step","url":"https://www.youtube.com/watch?v=eMlx5fFNoYc","type":"video","source":"3Blue1Brown","free":true},{"title":"Transformer Explainer","url":"https://poloclub.github.io/transformer-explainer/","type":"interactive","source":"Georgia Tech Polo Club","free":true},{"title":"Attention Is All You Need","url":"https://arxiv.org/abs/1706.03762","type":"paper","source":"arXiv","free":true},{"title":"Build a Large Language Model (From Scratch) code repository","url":"https://github.com/rasbt/LLMs-from-scratch","type":"book","source":"Sebastian Raschka","free":true},{"title":"LLM Visualization","url":"https://bbycroft.net/llm","type":"interactive","source":"Brendan Bycroft","free":true}],"subtopics":[{"title":"Self-attention: queries, keys, and values","desc":"Each token makes a query, compares it with every other token's key, and uses the resulting weights to mix their values. This lets meaning flow between tokens regardless of distance.","level":"core","resources":[{"title":"Attention in transformers, step-by-step","url":"https://www.youtube.com/watch?v=eMlx5fFNoYc","type":"video","source":"3Blue1Brown","free":true},{"title":"The Illustrated Transformer","url":"https://jalammar.github.io/illustrated-transformer/","type":"article","source":"Jay Alammar","free":true}]},{"title":"Multi-head attention and masking","desc":"Several attention heads run in parallel, each free to track a different kind of relationship. A causal mask stops tokens from seeing the future, which is what makes next-token training work.","level":"core","resources":[]},{"title":"The block: MLPs, residuals, and normalization","desc":"Each block pairs attention with a feed-forward network, wrapped in residual connections and normalization. The residual stream is a running sum that every layer reads from and writes to.","level":"core","resources":[{"title":"Transformers, the tech behind LLMs","url":"https://www.youtube.com/watch?v=wjZofJX0v4M","type":"video","source":"3Blue1Brown","free":true}]},{"title":"Building a GPT from scratch","desc":"Writing a small decoder-only model end to end is the best way to make every piece concrete. Karpathy's walkthrough and nanoGPT are the standard path.","level":"core","resources":[{"title":"Let's build GPT: from scratch, in code, spelled out","url":"https://www.youtube.com/watch?v=kCc8FmEb1nY","type":"video","source":"Andrej Karpathy","free":true},{"title":"nanoGPT","url":"https://github.com/karpathy/nanoGPT","type":"tool","source":"Andrej Karpathy","free":true}]},{"title":"Encoder, decoder, and encoder-decoder","desc":"The original transformer had both an encoder and a decoder. BERT-style encoders are still used for classification and embeddings, while generative LLMs are almost all decoder-only.","level":"deep","resources":[{"title":"Hugging Face LLM Course: How do Transformers work?","url":"https://huggingface.co/learn/llm-course/chapter1/4","type":"course","source":"Hugging Face","free":true}]},{"title":"Modern variants","desc":"Today's models use rotary position embeddings (RoPE), grouped-query attention to shrink the KV cache, RMSNorm, SwiGLU activations, and often mixture-of-experts layers. FlashAttention computes attention faster without changing the math.","level":"deep","resources":[{"title":"The Big LLM Architecture Comparison","url":"https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison","type":"article","source":"Sebastian Raschka","free":true},{"title":"FlashAttention","url":"https://arxiv.org/abs/2205.14135","type":"paper","source":"arXiv","free":true}]},{"title":"Transformers as circuits","desc":"Viewing attention heads and MLPs as components that read and write the residual stream is the foundation of mechanistic interpretability.","level":"optional","resources":[{"title":"A Mathematical Framework for Transformer Circuits","url":"https://transformer-circuits.pub/2021/framework/index.html","type":"paper","source":"Anthropic","free":true}]}]},{"id":"fine-tuning","title":"Fine-tuning LLMs (LoRA, PEFT)","tier":3,"lane":"llm","prereqs":["transformers","pytorch"],"roles":{"aie":"r","mle":"c","rs":"c"},"summary":"Fine-tuning continues training a pretrained model on your own examples so it adopts a format, style, or skill. Parameter-efficient fine-tuning (PEFT) methods like LoRA train only small adapter weights, which makes this affordable on a single GPU.","why":"Fine-tuning is the right tool when prompting and retrieval are not enough: enforcing a strict output format, teaching a narrow task cheaply with a small model, matching a voice, or distilling a big model's behavior into a smaller one. It is often the wrong tool for adding fresh facts, where RAG is better.","depth":"Must master: when to fine-tune versus prompt or use RAG, preparing chat-formatted data, supervised fine-tuning with LoRA or QLoRA, and evaluating against a baseline. Just know full fine-tuning, distillation pipelines, and the details of adapter variants until you need them.","hours":30,"outcomes":["You can decide whether a problem needs prompting, RAG, or fine-tuning, and justify it.","You can build a clean instruction dataset in the right chat template.","You can fine-tune an open model with LoRA or QLoRA using TRL, PEFT, or Unsloth.","You can evaluate the tuned model against the base model and catch overfitting or lost general skills."],"project":"Pick a narrow task (for example, turning messy support emails into a fixed JSON schema). Build 500 or more examples, QLoRA-fine-tune a small open model (1B to 8B) on a free or rented GPU, and compare it to the base model with a good prompt on 50 held-out examples for accuracy, format validity, and latency.","resources":[{"title":"Hugging Face LLM Course: Fine-tuning LLMs","url":"https://huggingface.co/learn/llm-course/chapter11/1","type":"course","source":"Hugging Face","free":true},{"title":"LoRA: Low-Rank Adaptation of Large Language Models","url":"https://arxiv.org/abs/2106.09685","type":"paper","source":"arXiv","free":true},{"title":"Practical Tips for Finetuning LLMs Using LoRA","url":"https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms","type":"article","source":"Sebastian Raschka","free":true},{"title":"Unsloth documentation","url":"https://unsloth.ai/docs","type":"docs","source":"Unsloth","free":true},{"title":"PEFT documentation","url":"https://huggingface.co/docs/peft/index","type":"docs","source":"Hugging Face","free":true},{"title":"Finetuning Large Language Models","url":"https://www.deeplearning.ai/courses/finetuning-large-language-models","type":"course","source":"DeepLearning.AI","free":true},{"title":"LoRA Without Regret","url":"https://thinkingmachines.ai/blog/lora/","type":"article","source":"Thinking Machines Lab","free":true}],"subtopics":[{"title":"When to fine-tune (and when not to)","desc":"Fine-tuning changes behavior and format well but is a poor way to inject knowledge that changes. Try strong prompts and retrieval first, and fine-tune when you have a clear, repeated task and good examples.","level":"core","resources":[{"title":"Practical Tips for Finetuning LLMs Using LoRA","url":"https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms","type":"article","source":"Sebastian Raschka","free":true}]},{"title":"Data preparation and chat templates","desc":"A few hundred to a few thousand high-quality examples often beat a large noisy set. Format them with the model's exact chat template, and hold out a test set.","level":"core","resources":[{"title":"LIMA: Less Is More for Alignment","url":"https://arxiv.org/abs/2305.11206","type":"paper","source":"arXiv","free":true}]},{"title":"LoRA and QLoRA","desc":"LoRA freezes the original weights and learns small low-rank update matrices. QLoRA does the same on a 4-bit quantized base model, letting you tune larger models on a single consumer GPU.","level":"core","resources":[{"title":"LoRA: Low-Rank Adaptation of Large Language Models","url":"https://arxiv.org/abs/2106.09685","type":"paper","source":"arXiv","free":true},{"title":"QLoRA: Efficient Finetuning of Quantized LLMs","url":"https://arxiv.org/abs/2305.14314","type":"paper","source":"arXiv","free":true}]},{"title":"Supervised fine-tuning tooling","desc":"Hugging Face TRL and PEFT are the standard libraries; Unsloth and Axolotl wrap them for speed and convenience. Hosted fine-tuning APIs are an option when you do not want to manage GPUs.","level":"core","resources":[{"title":"TRL: SFT Trainer","url":"https://huggingface.co/docs/trl/sft_trainer","type":"docs","source":"Hugging Face","free":true},{"title":"Unsloth documentation","url":"https://unsloth.ai/docs","type":"docs","source":"Unsloth","free":true}]},{"title":"Hyperparameters and evaluation","desc":"Rank, learning rate, and number of epochs matter most. Always compare to the base model on a held-out set and spot-check general abilities to catch forgetting.","level":"deep","resources":[{"title":"LoRA Without Regret","url":"https://thinkingmachines.ai/blog/lora/","type":"article","source":"Thinking Machines Lab","free":true}]},{"title":"Distillation","desc":"Use a large model to generate outputs, then fine-tune a small model to imitate them. It is how many fast, cheap production models are made.","level":"deep","resources":[{"title":"Distilling the Knowledge in a Neural Network","url":"https://arxiv.org/abs/1503.02531","type":"paper","source":"arXiv","free":true}]},{"title":"Merging and serving adapters","desc":"LoRA adapters can be merged into the base weights or swapped at serving time, so one base model can host many fine-tunes.","level":"optional","resources":[{"title":"PEFT documentation","url":"https://huggingface.co/docs/peft/index","type":"docs","source":"Hugging Face","free":true}]}]},{"id":"open-models","title":"Running Open Models Locally","tier":3,"lane":"llm","prereqs":["tokens-embeddings","llm-apis"],"roles":{"aie":"r","mle":"c","rs":"r","pu":"a"},"summary":"Open-weight models are LLMs whose weights you can download and run yourself, such as the Llama, Qwen, Mistral, Gemma, DeepSeek, and gpt-oss families. Tools like Ollama, LM Studio, llama.cpp, and vLLM make it practical to run them on a laptop or your own server.","why":"Running models yourself gives you privacy, offline use, no per-token bills, full control over versions, and the ability to fine-tune. It is also the best way to understand quantization, memory limits, and inference speed firsthand.","depth":"Must master: estimating memory from parameter count and quantization, running a model with Ollama or llama.cpp, using an OpenAI-compatible local endpoint, and reading model cards and licenses. Just know serving engines like vLLM and SGLang and the details of quantization formats until you deploy at scale.","hours":15,"outcomes":["You can estimate whether a given model and quantization will fit on your hardware.","You can run open models locally with Ollama, LM Studio, or llama.cpp and call them from code.","You can explain quantization formats like GGUF and their quality and speed trade-offs.","You can compare open models using benchmarks, licenses, and your own test prompts."],"project":"Run three open models of different sizes locally (for example 1B to 4B, 7B to 8B, and the largest that fits) at two quantization levels each. Measure memory use and tokens per second, score them on ten of your own prompts, and point a small script at the local OpenAI-compatible endpoint to answer the same questions.","resources":[{"title":"Ollama","url":"https://ollama.com/","type":"tool","source":"Ollama","free":true},{"title":"LM Studio","url":"https://lmstudio.ai/","type":"tool","source":"LM Studio","free":true},{"title":"llama.cpp","url":"https://github.com/ggml-org/llama.cpp","type":"tool","source":"ggml-org","free":true},{"title":"A Visual Guide to Quantization","url":"https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization","type":"article","source":"Maarten Grootendorst","free":true},{"title":"Hugging Face Transformers documentation","url":"https://huggingface.co/docs/transformers/index","type":"docs","source":"Hugging Face","free":true},{"title":"LLM command-line tool","url":"https://llm.datasette.io/en/stable/","type":"tool","source":"Simon Willison","free":true},{"title":"vLLM documentation","url":"https://docs.vllm.ai/en/latest/","type":"docs","source":"vLLM","free":true}],"subtopics":[{"title":"The open model landscape","desc":"Open-weight families are released in many sizes, from under 1B to hundreds of billions of parameters, often as mixture-of-experts. 'Open weights' is not the same as open source, so read the license and what data and code were released.","level":"core","resources":[{"title":"Hugging Face model hub","url":"https://huggingface.co/models","type":"tool","source":"Hugging Face","free":true},{"title":"The Open Source AI Definition","url":"https://opensource.org/ai/open-source-ai-definition","type":"article","source":"Open Source Initiative","free":true}]},{"title":"Memory math and hardware","desc":"A rough rule: weight memory is parameters times bytes per parameter, so an 8B model needs about 16 GB at 16-bit and about 5 GB at 4-bit, plus room for the KV cache. Apple Silicon unified memory and consumer GPUs set the practical limits.","level":"core","resources":[]},{"title":"Quantization","desc":"Quantization stores weights in fewer bits (8, 6, 4, or lower) to save memory and speed things up, with some quality loss. GGUF is the common format for llama.cpp and Ollama.","level":"core","resources":[{"title":"A Visual Guide to Quantization","url":"https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization","type":"article","source":"Maarten Grootendorst","free":true},{"title":"GGUF","url":"https://huggingface.co/docs/hub/gguf","type":"docs","source":"Hugging Face","free":true}]},{"title":"Desktop runners","desc":"Ollama and LM Studio download and run models with one command or click, and expose an OpenAI-compatible API so existing code just works. llama.cpp is the engine underneath many of them.","level":"core","resources":[{"title":"Ollama documentation","url":"https://docs.ollama.com/","type":"docs","source":"Ollama","free":true},{"title":"llama.cpp","url":"https://github.com/ggml-org/llama.cpp","type":"tool","source":"ggml-org","free":true}]},{"title":"Server-grade inference","desc":"vLLM and SGLang serve many users at once using techniques like paged attention and continuous batching. Use them when a local runner is too slow for real traffic.","level":"deep","resources":[{"title":"vLLM documentation","url":"https://docs.vllm.ai/en/latest/","type":"docs","source":"vLLM","free":true}]},{"title":"Evaluating and choosing a model","desc":"Public leaderboards are a starting point, but test on your own prompts for quality, speed (tokens per second), and tool-use reliability. Check context length and license before committing.","level":"deep","resources":[{"title":"Artificial Analysis","url":"https://artificialanalysis.ai/","type":"tool","source":"Artificial Analysis","free":true}]},{"title":"Apple Silicon and MLX","desc":"MLX is Apple's array framework, and mlx-lm runs and fine-tunes LLMs efficiently on Macs.","level":"optional","resources":[{"title":"mlx-lm","url":"https://github.com/ml-explore/mlx-lm","type":"tool","source":"Apple","free":true}]}]},{"id":"vector-databases","title":"Vector Databases","tier":3,"lane":"apps","prereqs":["rag-fundamentals"],"roles":{"aie":"c","mle":"r"},"summary":"A vector database stores embeddings and finds the nearest ones to a query vector quickly, even across millions of items. It adds the things real apps need on top: metadata filters, updates, persistence, and scaling.","why":"Once your corpus grows past what fits in memory, or you need filtering by user, date, or permissions, a plain list of vectors stops working. Picking and tuning the right store affects speed, cost, and retrieval quality.","depth":"Master how approximate nearest neighbor (ANN) indexes trade recall for speed, metadata filtering, and the practical choice between pgvector, a dedicated vector DB, or a managed service. Just know how quantization and index internals (HNSW graphs, IVF, product quantization) work at a high level unless you operate at very large scale.","hours":10,"outcomes":["You can explain exact versus approximate nearest neighbor search and the recall/latency trade-off.","You can store, filter, update, and delete vectors with metadata in at least one vector database.","You can choose between pgvector, an open-source vector DB, and a managed service for a given project.","You can tune index parameters and measure their effect on recall and latency."],"project":"Load the same 100k-chunk dataset into pgvector and one dedicated vector DB. Compare query latency, recall against exact search, and memory use at two HNSW settings, then add a metadata filter and see how results and speed change. Write up which you'd pick and why.","resources":[{"title":"Vector Databases in Production for Busy Engineers","url":"https://www.pinecone.io/learn/series/vector-databases-in-production-for-busy-engineers/","type":"article","source":"Pinecone","free":true},{"title":"Faiss: The Missing Manual","url":"https://www.pinecone.io/learn/series/faiss/","type":"article","source":"Pinecone","free":true},{"title":"Retrieval Optimization: Tokenization to Vector Quantization","url":"https://www.deeplearning.ai/courses/retrieval-optimization-from-tokenization-to-vector-quantization","type":"course","source":"DeepLearning.AI","free":true},{"title":"Qdrant documentation","url":"https://qdrant.tech/documentation/","type":"docs","source":"Qdrant","free":true},{"title":"pgvector","url":"https://github.com/pgvector/pgvector","type":"tool","source":"GitHub","free":true},{"title":"Nearest Neighbor Indexes for Similarity Search","url":"https://www.pinecone.io/learn/series/faiss/vector-indexes/","type":"article","source":"Pinecone","free":true}],"subtopics":[{"title":"What a vector database does","desc":"It stores vectors plus metadata, builds an index for fast similarity search, and supports create, update, delete, and filtered queries. A vector library like FAISS gives you only the index.","level":"core","resources":[{"title":"What is a Vector Database & How Does it Work?","url":"https://www.pinecone.io/learn/vector-database/","type":"article","source":"Pinecone","free":true},{"title":"What is a Vector Database?","url":"https://qdrant.tech/articles/what-is-a-vector-database/","type":"article","source":"Qdrant","free":true}]},{"title":"ANN indexes: HNSW and friends","desc":"HNSW is a layered graph that lets search hop quickly toward the nearest neighbors; it is the default in most databases. IVF clusters vectors and searches only nearby clusters. Both trade a little recall for big speed gains.","level":"core","resources":[{"title":"Hierarchical Navigable Small Worlds (HNSW)","url":"https://www.pinecone.io/learn/series/faiss/hnsw/","type":"article","source":"Pinecone","free":true},{"title":"Vector indexing concepts","url":"https://docs.weaviate.io/weaviate/concepts/vector-index","type":"docs","source":"Weaviate","free":true}]},{"title":"Metadata filtering and multi-tenancy","desc":"Real queries look like 'nearest chunks, but only from this customer's documents after 2025'. Filtering by metadata, and separating tenants, is often what decides which database fits.","level":"core","resources":[]},{"title":"Choosing a store","desc":"pgvector adds vector search to Postgres, which is often enough and keeps one database. Dedicated options include Qdrant, Weaviate, Chroma, LanceDB, Milvus, and managed Pinecone. Decide on scale, filtering needs, hybrid search support, and operations effort.","level":"core","resources":[{"title":"pgvector","url":"https://github.com/pgvector/pgvector","type":"tool","source":"GitHub","free":true},{"title":"Chroma docs","url":"https://docs.trychroma.com/docs/overview/introduction","type":"docs","source":"Chroma","free":true}]},{"title":"Quantization and embedding size","desc":"Storing vectors as int8 or binary, or truncating Matryoshka embeddings to fewer dimensions, cuts memory and cost by 4x to 32x with small quality loss. Rescoring with full vectors recovers most of it.","level":"deep","resources":[{"title":"Binary and Scalar Embedding Quantization","url":"https://huggingface.co/blog/embedding-quantization","type":"article","source":"Hugging Face","free":true},{"title":"Introduction to Matryoshka Embedding Models","url":"https://huggingface.co/blog/matryoshka","type":"article","source":"Hugging Face","free":true}]},{"title":"Benchmarks and index internals","desc":"ANN-Benchmarks compares algorithms on recall versus queries per second. The HNSW paper and the FAISS library are the reference points if you want to go deep.","level":"optional","resources":[{"title":"ANN-Benchmarks","url":"https://ann-benchmarks.com/index.html","type":"tool","source":"ANN-Benchmarks","free":true},{"title":"HNSW paper","url":"https://arxiv.org/abs/1603.09320","type":"paper","source":"arXiv","free":true}]}]},{"id":"chunking-retrieval","title":"Chunking, Hybrid Search & Reranking","tier":3,"lane":"apps","prereqs":["rag-fundamentals"],"roles":{"aie":"c","mle":"r"},"summary":"This node is about getting the right chunks in front of the model. It covers how you split documents, how you combine keyword search (BM25) with vector search, and how a reranker re-scores the candidates so the best ones end up on top.","why":"Most RAG failures are retrieval failures: the answer was in the docs, but the right chunk never made it into the prompt. Better chunking, hybrid search, and reranking are the cheapest, biggest quality wins in most RAG systems.","depth":"Master chunking trade-offs, BM25 basics, hybrid search with rank fusion, two-stage retrieve-then-rerank, and measuring retrieval with recall@k and MRR. Just know that late-interaction models like ColBERT and late chunking exist; reach for them when the basics plateau.","hours":15,"outcomes":["You can choose and justify a chunking strategy for a given document type (prose, code, tables, PDFs).","You can explain how BM25 scores documents and why it catches exact terms that embeddings miss.","You can implement hybrid search with reciprocal rank fusion and add a cross-encoder reranker.","You can measure retrieval quality with recall@k, MRR, and nDCG on a labeled test set.","You can apply contextual retrieval to reduce failed retrievals."],"project":"Take your RAG app from the previous node and a 50-question labeled test set. Measure recall@5 and MRR for: vector only, BM25 only, hybrid with RRF, hybrid plus reranker, and hybrid plus reranker with contextual chunks. Chart the results and keep the best configuration.","resources":[{"title":"Introducing Contextual Retrieval","url":"https://www.anthropic.com/engineering/contextual-retrieval","type":"article","source":"Anthropic","free":true},{"title":"Rerankers and Two-Stage Retrieval","url":"https://www.pinecone.io/learn/series/rag/rerankers/","type":"article","source":"Pinecone","free":true},{"title":"Chunking Strategies to Improve LLM RAG Pipeline Performance","url":"https://weaviate.io/blog/chunking-strategies-for-rag","type":"article","source":"Weaviate","free":true},{"title":"What is hybrid search?","url":"https://www.elastic.co/what-is/hybrid-search","type":"article","source":"Elastic","free":true},{"title":"Systematically Improving Your RAG","url":"https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/","type":"article","source":"Jason Liu","free":true},{"title":"Cohere Rerank overview","url":"https://docs.cohere.com/docs/rerank-overview","type":"docs","source":"Cohere","free":true},{"title":"Claude Cookbooks (includes contextual retrieval notebook)","url":"https://github.com/anthropics/claude-cookbooks","type":"tool","source":"Anthropic","free":true}],"subtopics":[{"title":"Chunking strategies","desc":"Fixed-size chunks with overlap are the baseline. Recursive and structure-aware splitting follows headings, paragraphs, and code blocks. Semantic chunking splits where the topic changes. Chunk size is a real trade-off: small chunks are precise, large chunks keep context.","level":"core","resources":[{"title":"Chunking Strategies for LLM Applications","url":"https://www.pinecone.io/learn/chunking-strategies/","type":"article","source":"Pinecone","free":true},{"title":"Evaluating Chunking Strategies for Retrieval","url":"https://www.trychroma.com/research/evaluating-chunking","type":"article","source":"Chroma","free":true}]},{"title":"Keyword search and BM25","desc":"BM25 ranks documents by how often query terms appear, weighted by how rare those terms are, with a penalty for long documents. It is fast, needs no training, and excels at names, IDs, error codes, and jargon.","level":"core","resources":[{"title":"Practical BM25: The BM25 Algorithm and its Variables","url":"https://www.elastic.co/blog/practical-bm25-part-2-the-bm25-algorithm-and-its-variables","type":"article","source":"Elastic","free":true}]},{"title":"Hybrid search and rank fusion","desc":"Run BM25 (sparse) and vector (dense) search in parallel and merge the results, usually with reciprocal rank fusion (RRF) or a weighted score. Hybrid almost always beats either method alone.","level":"core","resources":[{"title":"Hybrid Search Explained","url":"https://weaviate.io/blog/hybrid-search-explained","type":"article","source":"Weaviate","free":true},{"title":"Hybrid Search in Qdrant","url":"https://qdrant.tech/documentation/search-tuning/hybrid-search/","type":"docs","source":"Qdrant","free":true}]},{"title":"Reranking","desc":"Retrieve a wide set (say top 50) cheaply, then score each candidate against the query with a cross-encoder or rerank API and keep the top 5. Cross-encoders read query and document together, so they judge relevance far better than embedding distance.","level":"core","resources":[{"title":"Rerankers and Two-Stage Retrieval","url":"https://www.pinecone.io/learn/series/rag/rerankers/","type":"article","source":"Pinecone","free":true},{"title":"Retrieve & Re-Rank","url":"https://www.sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html","type":"docs","source":"Sentence Transformers","free":true}]},{"title":"Contextual retrieval","desc":"Before embedding, prepend a short LLM-written note to each chunk explaining where it sits in the document. Combined with contextual BM25 and reranking, Anthropic measured a 67% drop in failed retrievals.","level":"core","resources":[{"title":"Introducing Contextual Retrieval","url":"https://www.anthropic.com/engineering/contextual-retrieval","type":"article","source":"Anthropic","free":true}]},{"title":"Measuring retrieval","desc":"Build a set of questions with known relevant chunks and measure recall@k (was it found), MRR (how high), and nDCG (ranking quality). Tune chunking and search against these numbers, not vibes.","level":"deep","resources":[{"title":"Evaluation Measures in Information Retrieval","url":"https://www.pinecone.io/learn/offline-evaluation/","type":"article","source":"Pinecone","free":true},{"title":"BEIR benchmark","url":"https://arxiv.org/abs/2104.08663","type":"paper","source":"arXiv","free":true}]},{"title":"Late interaction and late chunking","desc":"ColBERT keeps one vector per token and matches token by token for high-quality retrieval. Late chunking embeds the whole document first, then pools per chunk, so each chunk keeps document context.","level":"optional","resources":[{"title":"ColBERT paper","url":"https://arxiv.org/abs/2004.12832","type":"paper","source":"arXiv","free":true},{"title":"Late Chunking in Long-Context Embedding Models","url":"https://jina.ai/news/late-chunking-in-long-context-embedding-models/","type":"article","source":"Jina AI","free":true}]}]},{"id":"agents-fundamentals","title":"AI Agents: Core Concepts","tier":3,"lane":"agents","prereqs":["structured-outputs","context-engineering"],"roles":{"aie":"c","mle":"r","pm":"r","biz":"a","nc":"r"},"summary":"An AI agent is an LLM that runs tools in a loop to reach a goal: it decides what to do, calls a tool, looks at the result, and repeats until done. Workflows, by contrast, follow code paths you define, with LLM calls at fixed steps.","why":"Agents handle open-ended tasks where you can't script every step in advance, like coding, research, or customer support with many systems. Knowing when not to use an agent matters just as much, since they cost more and fail in less predictable ways.","depth":"Master the agent loop, the difference between workflows and agents, the common workflow patterns, tool design, context management, guardrails, and how to evaluate an agent. Just know the research lineage (ReAct, Reflexion, Voyager) at a summary level.","hours":20,"outcomes":["You can explain the agent loop and decide whether a problem needs a simple prompt, a workflow, or an agent.","You can build a minimal agent from scratch with tool calling and a stopping condition, without a framework.","You can apply workflow patterns: prompt chaining, routing, parallelization, orchestrator-workers, and evaluator-optimizer.","You can manage an agent's context (what goes in, what gets summarized or dropped)
